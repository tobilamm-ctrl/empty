<title>Leon vor Gericht</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Zilla+Slab:wght@600;700&display=swap">
<style>
/* Layout: Bühne (Gerichtssaal-Bild) oben, Steuerleiste und Mitleseband darunter; für Beamer und Tafel gedacht */
:root {
  --bg: #F3EFE6;          /* Papier der Arbeitsblätter */
  --surface: #FFFFFF;
  --fg: #1B2A41;
  --muted: #5E6B7D;
  --navy: #1F3A5F;        /* Akten-Blau aus M1 */
  --red: #C0392B;         /* Stempelrot */
  --line: #D8CDB8;
  --chip: #E7DECC;
  --bubble-bg: #FFFFFF;
  --bubble-fg: #1B2A41;
  --font-ui: "Atkinson Hyperlegible", Arial, Helvetica, sans-serif;
  --font-display: "Zilla Slab", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141B26; --surface: #1C2533; --fg: #E8ECF2; --muted: #A3AEBE; --navy: #8FB3E0;
    --red: #E8705F; --line: #2E3A4D; --chip: #263247; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141B26; --surface: #1C2533; --fg: #E8ECF2; --muted: #A3AEBE; --navy: #8FB3E0;
  --red: #E8705F; --line: #2E3A4D; --chip: #263247; color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
  box-sizing: border-box;
}
.wrap { max-width: 1280px; margin: 0 auto; display: grid; gap: 12px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
.eyebrow { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
h1 { font-family: var(--font-display); font-size: clamp(22px, 3vw, 32px); margin: 2px 0 0; color: var(--fg); text-wrap: balance; }
.modes { display: inline-flex; background: var(--chip); border-radius: 999px; padding: 3px; gap: 2px; }
.modes button { border: 0; background: transparent; color: var(--fg); font: 700 14px var(--font-ui); padding: 8px 14px; border-radius: 999px; cursor: pointer; }
.modes button[aria-pressed="true"] { background: var(--navy); color: var(--bg); }
.tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.toggle { display: inline-flex; align-items: center; gap: 8px; border: 2px solid var(--navy); background: var(--surface); color: var(--navy); font: 700 14px var(--font-ui); padding: 7px 12px; border-radius: 999px; cursor: pointer; }
.toggle .dot { width: 30px; height: 18px; border-radius: 99px; background: var(--chip); position: relative; transition: background .2s; }
.toggle .dot::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--muted); transition: transform .2s, background .2s; }
.toggle[aria-pressed="true"] .dot { background: var(--navy); }
.toggle[aria-pressed="true"] .dot::after { transform: translateX(12px); background: var(--surface); }
.toggle:disabled { opacity: .45; cursor: default; }
.toggle.speaking { border-color: var(--red); }
.toggle:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }

.stage { position: relative; width: 100%; aspect-ratio: 2000 / 1125; max-width: 100%; border-radius: 10px; overflow: hidden; container-type: inline-size; background: #E9DFCB; box-shadow: 0 1px 0 var(--line); }
.stage svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.stage svg.scene .color { transition: opacity .35s ease; }
.stage svg.scene .pale { transition: opacity .35s ease; }
.stage svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.bubble {
  position: absolute; background: var(--bubble-bg); color: var(--bubble-fg);
  border: .2cqw solid #1F3A5F; border-radius: 1.4cqw; padding: .8cqw 1.1cqw;
  font-size: 1.45cqw; line-height: 1.3; font-weight: 700; box-sizing: border-box;
  box-shadow: .2cqw .25cqw 0 rgba(31,58,95,.25);
  animation: pop .28s ease-out both;
}
.bubble .who { display: block; font-size: .78em; letter-spacing: .06em; text-transform: uppercase; color: #C0392B; margin-bottom: .2em; }
.bubble.long { font-weight: 400; font-size: 1.32cqw; }
.bubble.old { opacity: .92; }
.regie {
  position: absolute; left: 50%; bottom: 14%; transform: translateX(-50%); max-width: 70%;
  background: rgba(27,42,65,.88); color: #FFFFFF; font-style: italic; font-size: 1.5cqw;
  padding: .7cqw 1.4cqw; border-radius: 99px; text-align: center; animation: pop .28s ease-out both;
}
.scene-chip {
  position: absolute; left: 1.2%; top: 2%; background: #C0392B; color: #FFFFFF; font-weight: 700;
  font-size: 1.3cqw; padding: .45cqw 1cqw; border-radius: .5cqw; letter-spacing: .03em;
}
.start-hint {
  position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
}
.start-hint span { background: rgba(27,42,65,.9); color: #fff; font-size: 2cqw; font-weight: 700; padding: 1.2cqw 2.4cqw; border-radius: 99px; }
@keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.97); } to { opacity: 1; transform: none; } }
.regie { animation-name: popc; }
@keyframes popc { from { opacity: 0; transform: translate(-50%, 6px); } to { opacity: 1; transform: translateX(-50%); } }

/* Vollbild: Bild füllt den Bildschirm, Steuerleiste schwebt unten und blendet sich aus */
#player { display: grid; gap: 12px; }
#player:fullscreen, #player.fs-fallback { background: #0E141D; display: flex; align-items: center; justify-content: center; gap: 0; }
#player.fs-fallback { position: fixed; inset: 0; z-index: 50; }
#player:fullscreen .stage, #player.fs-fallback .stage { width: min(100vw, calc(100vh * 2000 / 1125)); border-radius: 0; box-shadow: none; }
#player:fullscreen .controls, #player.fs-fallback .controls {
  position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  width: min(1180px, calc(100vw - 32px)); flex-wrap: nowrap; gap: 8px; background: rgba(14,20,29,.82); padding: 8px 10px; border-radius: 14px;
  transition: opacity .3s ease; --navy: #8FB3E0; --surface: #1C2533; --bg: #0E141D; --chip: #2E3A4D; --muted: #A3AEBE;
}
#player:fullscreen .controls .btn, #player.fs-fallback .controls .btn { padding: 7px 12px; font-size: 14px; white-space: nowrap; }
#player:fullscreen .controls .toggle, #player.fs-fallback .controls .toggle { padding: 6px 10px; font-size: 13px; white-space: nowrap; }
#player:fullscreen .progress, #player.fs-fallback .progress { flex: 1 1 60px; }
#player.idle .controls { opacity: 0; pointer-events: none; }
#player.idle { cursor: none; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.btn { border: 2px solid var(--navy); background: var(--surface); color: var(--navy); font: 700 16px var(--font-ui); padding: 10px 18px; border-radius: 10px; cursor: pointer; }
.btn.primary { background: var(--navy); color: var(--bg); }
.btn:disabled { opacity: .4; cursor: default; }
.btn:focus-visible, .modes button:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
.progress { flex: 1 1 160px; min-width: 0; display: grid; gap: 4px; }
.bar { height: 8px; background: var(--chip); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--red); transition: width .25s; }
.count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.readout { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; min-height: 64px; display: grid; gap: 4px; }
.readout .who { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--red); }
.readout .txt { font-size: 18px; line-height: 1.45; max-width: 75ch; }
.readout .txt.regie-txt { font-style: italic; color: var(--muted); }
@media (min-width: 761px) { .readout { display: none; } }
.keys { font-size: 13px; color: var(--muted); }
kbd { font-family: var(--font-ui); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--surface); }

/* Schmale Bildschirme: Blasen zeigen nur den Namen, der Text steht im Mitleseband */
@container (max-width: 640px) {
  .bubble .t { display: none; }
  .bubble .who { margin: 0; font-size: 1em; }
  .bubble { font-size: 2.6cqw; padding: .8cqw 1.4cqw; }
  .regie { font-size: 2.6cqw; }
  .scene-chip { font-size: 2.4cqw; }
}
@media (prefers-reduced-motion: reduce) { .bubble, .regie { animation: none; } .bar i { transition: none; } }
</style>

<script>
const STEPS = [{"scene": 1, "title": "Aufruf und Eröffnung", "who": "Protokollführerin", "text": "Aufgerufen wird die Jugendstrafsache gegen Leon M. Alle Beteiligten bitte in Sitzungssaal 12."}, {"scene": 1, "title": "Aufruf und Eröffnung", "who": "", "text": "Alle nehmen ihre Plätze ein. Zuschauer sind nicht im Saal."}, {"scene": 1, "title": "Aufruf und Eröffnung", "who": "Richter", "text": "Guten Morgen. Ich eröffne die Sitzung des Jugendschöffengerichts. Die Verhandlung ist nicht öffentlich, weil der Angeklagte erst 15 Jahre alt ist. Neben mir sitzen die Schöffin Frau Bauer und der Schöffe Herr Kaya. Sie sind ehrenamtliche Richter und entscheiden heute mit."}, {"scene": 1, "title": "Aufruf und Eröffnung", "who": "Richter", "text": "Anwesend sind der Angeklagte mit seinem Verteidiger, Herrn Mensah, und seine Mutter. Für die Staatsanwaltschaft ist Frau Vogel hier, für die Jugendgerichtshilfe Frau Roth. Frau Weiß, ist die Zeugin erschienen?"}, {"scene": 1, "title": "Aufruf und Eröffnung", "who": "Protokollführerin", "text": "Ja, Frau Hofmann wartet vor dem Saal."}, {"scene": 1, "title": "Aufruf und Eröffnung", "who": "Richter", "text": "Leon, du heißt Leon M., bist 15 Jahre alt und gehst noch zur Schule?"}, {"scene": 1, "title": "Aufruf und Eröffnung", "who": "Angeklagter", "text": "Ja."}, {"scene": 2, "title": "Die Anklage", "who": "Richter", "text": "Frau Staatsanwältin, bitte verlesen Sie die Anklage."}, {"scene": 2, "title": "Die Anklage", "who": "Staatsanwältin", "text": "Leon M. wird vorgeworfen, am Freitag, dem 9. Oktober, gegen 21:30 Uhr gemeinsam mit drei anderen Jugendlichen das Wartehäuschen der Bushaltestelle „Am Stadtpark“ mit Spraydosen besprüht zu haben. Für die Reinigung entstand ein Schaden von etwa 1.200 Euro. Das ist eine gemeinschaftliche Sachbeschädigung nach Paragraf 303 des Strafgesetzbuchs."}, {"scene": 2, "title": "Die Anklage", "who": "Richter", "text": "Leon, du hast gehört, was dir vorgeworfen wird. Du musst dazu nichts sagen. Wenn du möchtest, kannst du aber erzählen, wie es aus deiner Sicht war."}, {"scene": 2, "title": "Die Anklage", "who": "Verteidiger", "text": "Mein Mandant möchte aussagen."}, {"scene": 3, "title": "Leon sagt aus", "who": "Angeklagter", "text": "Ja, das stimmt. Ich war dabei. Wir sind im Frühjahr hierhergezogen, und ich kannte fast niemanden. Die drei anderen waren älter. Bei ihnen hatte ich das Gefühl, dass ich dazugehöre."}, {"scene": 3, "title": "Leon sagt aus", "who": "Richter", "text": "Was ist an dem Abend passiert?"}, {"scene": 3, "title": "Leon sagt aus", "who": "Angeklagter", "text": "Sie hatten Spraydosen dabei und haben angefangen, das Häuschen anzusprühen. Sie haben gesagt, ich soll auch mal, sonst bin ich ein Feigling. Da habe ich mitgemacht."}, {"scene": 3, "title": "Leon sagt aus", "who": "Richter", "text": "Bei der Polizei hast du gesagt, du hättest nur einen kleinen Strich gesprüht."}, {"scene": 3, "title": "Leon sagt aus", "who": "", "text": "Leon schaut auf den Tisch."}, {"scene": 3, "title": "Leon sagt aus", "who": "Angeklagter", "text": "Das war nicht die ganze Wahrheit. Ich habe auch ein Bild auf die Scheibe gesprüht. Ich hatte Angst vor dem Ärger."}, {"scene": 3, "title": "Leon sagt aus", "who": "Schöffin", "text": "Leon, wusstest du, dass Graffiti verboten ist?"}, {"scene": 3, "title": "Leon sagt aus", "who": "Angeklagter", "text": "Nein, ehrlich nicht. Ich dachte, Spraydose ist so ähnlich wie Kreide. Das kann man doch wieder abwaschen. Dass das eine richtige Straftat ist, wusste ich nicht."}, {"scene": 3, "title": "Leon sagt aus", "who": "Schöffe", "text": "Leon, warum bist du nicht weggelaufen, als die Polizei kam?"}, {"scene": 3, "title": "Leon sagt aus", "who": "Angeklagter", "text": "Ich war wie erstarrt. Und ich wollte nicht noch mehr Ärger."}, {"scene": 3, "title": "Leon sagt aus", "who": "Staatsanwältin", "text": "Wie heißen die anderen drei?"}, {"scene": 3, "title": "Leon sagt aus", "who": "Angeklagter", "text": "Das möchte ich nicht sagen."}, {"scene": 3, "title": "Leon sagt aus", "who": "Richter", "text": "Das musst du auch nicht."}, {"scene": 4, "title": "Die Zeugin", "who": "Richter", "text": "Frau Weiß, bitte rufen Sie die Zeugin herein."}, {"scene": 4, "title": "Die Zeugin", "who": "Protokollführerin", "text": "Frau Hofmann, bitte kommen Sie in den Saal."}, {"scene": 4, "title": "Die Zeugin", "who": "Richter", "text": "Frau Hofmann, Sie sind als Zeugin hier. Sie müssen die Wahrheit sagen. Eine falsche Aussage vor Gericht ist strafbar. Was haben Sie am 9. Oktober beobachtet?"}, {"scene": 4, "title": "Die Zeugin", "who": "Zeugin", "text": "Ich saß abends im Wohnzimmer. Gegen halb zehn habe ich ein Zischen gehört. Als ich aus dem Fenster geschaut habe, standen vier Jungen am Wartehäuschen und haben gesprüht. Um 21:32 Uhr habe ich die Polizei angerufen."}, {"scene": 4, "title": "Die Zeugin", "who": "Verteidiger", "text": "Frau Hofmann, konnten Sie erkennen, wer von den vieren gesprüht hat?"}, {"scene": 4, "title": "Die Zeugin", "who": "Zeugin", "text": "Nein, nicht genau. Es war dunkel. Ich habe nur gesehen, dass alle vier dort standen."}, {"scene": 4, "title": "Die Zeugin", "who": "Richter", "text": "Danke, Frau Hofmann. Laut Einsatzbericht der Polizei traf die Streife um 21:40 Uhr ein. Drei Jugendliche flüchteten in Richtung Stadtpark. Leon blieb mit einer Spraydose in der Hand stehen und leistete keinen Widerstand."}, {"scene": 4, "title": "Die Zeugin", "who": "Staatsanwältin", "text": "Die drei anderen Jugendlichen wurden inzwischen ermittelt. Gegen sie läuft ein eigenes Verfahren."}, {"scene": 5, "title": "Die Jugendgerichtshilfe", "who": "Richter", "text": "Frau Roth, Sie haben ausführlich mit Leon und seiner Mutter gesprochen. Was können Sie uns sagen?"}, {"scene": 5, "title": "Die Jugendgerichtshilfe", "who": "Jugendgerichtshilfe", "text": "Leon war vorher nie auffällig. Nach dem Umzug war er sehr einsam. Die älteren Jugendlichen waren die Ersten, die sich für ihn interessiert haben."}, {"scene": 5, "title": "Die Jugendgerichtshilfe", "who": "Jugendgerichtshilfe", "text": "In unserem Gespräch hat Leon mir außerdem etwas erzählt, das bisher niemand wusste: Sein Stiefvater schlägt ihn manchmal, wenn er schlechte Laune hat. Deshalb ist Leon abends lieber draußen als zu Hause. Das Jugendamt ist eingeschaltet und kümmert sich darum, dass Leon geschützt ist."}, {"scene": 5, "title": "Die Jugendgerichtshilfe", "who": "Jugendgerichtshilfe", "text": "Ich schlage vor, dass Leon den Schaden wiedergutmacht, indem er beim Reinigen hilft. Außerdem sollte er einen Betreuungshelfer bekommen, der sich jede Woche mit ihm trifft. So hat er jemanden, mit dem er reden kann."}, {"scene": 6, "title": "Die Schlussvorträge", "who": "Richter", "text": "Damit ist die Beweisaufnahme geschlossen. Frau Staatsanwältin, bitte."}, {"scene": 6, "title": "Die Schlussvorträge", "who": "Staatsanwältin", "text": "Die Tat ist bewiesen, und Leon hat sie zugegeben. Es ist ein hoher Schaden entstanden, den am Ende die Allgemeinheit bezahlt. Für Leon spricht, dass er zum ersten Mal aufgefallen ist und heute ehrlich war. Ich beantrage, dass Leon die Bushaltestelle zusammen mit dem Bauhof reinigt und 60 Sozialstunden leistet."}, {"scene": 6, "title": "Die Schlussvorträge", "who": "Verteidiger", "text": "Mein Mandant hat einen Fehler gemacht, das weiß er. Aber er war neu in der Stadt und einsam, und er wurde von Älteren unter Druck gesetzt. Er wusste nicht einmal, dass Graffiti eine Straftat ist. Und er hat heute von sich aus die ganze Wahrheit gesagt. Ich halte 20 Sozialstunden für ausreichend. Wichtiger ist, dass Leon Hilfe bekommt, zum Beispiel durch einen Betreuungshelfer."}, {"scene": 7, "title": "Das letzte Wort", "who": "Richter", "text": "Leon, du hast das letzte Wort."}, {"scene": 7, "title": "Das letzte Wort", "who": "Angeklagter", "text": "Es tut mir leid. Ich wollte einfach dazugehören. Jetzt weiß ich, dass das eine Straftat war. Ich mache so etwas nie wieder."}, {"scene": 8, "title": "Beratung und Urteil", "who": "Richter", "text": "Das Gericht zieht sich zur Beratung zurück."}, {"scene": 8, "title": "Beratung und Urteil", "who": "", "text": "Der Richter und die beiden Schöffen verlassen den Saal. Nach zwanzig Minuten kommen sie zurück."}, {"scene": 8, "title": "Beratung und Urteil", "who": "Protokollführerin", "text": "Bitte erheben Sie sich."}, {"scene": 8, "title": "Beratung und Urteil", "who": "Richter", "text": "Im Namen des Volkes ergeht folgendes Urteil: Der Angeklagte Leon M. ist schuldig der gemeinschaftlichen Sachbeschädigung. Er muss die Bushaltestelle zusammen mit dem Bauhof sauber machen und 40 Sozialstunden leisten. Außerdem bekommt er für ein Jahr einen Betreuungshelfer vom Jugendamt, der sich jede Woche mit ihm trifft. Bitte setzen Sie sich."}, {"scene": 8, "title": "Beratung und Urteil", "who": "Richter", "text": "Leon, im Jugendstrafrecht gilt: Erziehung geht vor Strafe. Du sollst aus deinem Fehler lernen und den Schaden wiedergutmachen. Wir haben berücksichtigt, dass du heute ehrlich warst und dass es dir zu Hause gerade nicht gut geht. Das Jugendamt kümmert sich auch um die Situation bei dir zu Hause. Hol dir Hilfe, wenn du sie brauchst."}, {"scene": 8, "title": "Beratung und Urteil", "who": "Richter", "text": "Gegen dieses Urteil kann innerhalb einer Woche Rechtsmittel eingelegt werden. Die Sitzung ist geschlossen."}];

// Position der Blasen im Bild (Koordinaten 2000 × 1125). a = Ansatzpunkt der Sprechblase bei der Person.
// core: Platz der kurzen Blase; full: Platz für den ganzen Redebeitrag (top- oder bottom-verankert)
const SP = {
  'Protokollführerin':   { a: [462, 430],  core: { l: 20,   t: 335, w: 300 }, full: { l: 20,   t: 330, w: 420 } },
  'Schöffe':             { a: [722, 360],  core: { l: 385,  t: 92,  w: 290 }, full: { l: 300,  t: 40,  w: 420 } },
  'Richter':             { a: [1038, 338], core: { l: 1105, t: 14,  w: 360 }, full: { l: 1100, t: 20,  w: 640 } },
  'Schöffin':            { a: [1284, 350], core: { l: 1390, t: 165, w: 300 }, full: { l: 1380, t: 120, w: 520 } },
  'Jugendgerichtshilfe': { a: [1500, 565], core: { l: 1120, t: 535, w: 330 }, full: { l: 630,  b: 600, w: 700 } },
  'Staatsanwältin':      { a: [1765, 705], core: { l: 1440, t: 800, w: 340 }, full: { l: 1250, b: 130, w: 720 } },
  'Verteidiger':         { a: [150, 705],  core: { l: 20,   t: 790, w: 340 }, full: { l: 20,   b: 130, w: 720 } },
  'Angeklagter':         { a: [440, 695],  core: { l: 592,  t: 760, w: 245 }, full: { l: 560,  b: 130, w: 600 } },
  'Zeugin':              { a: [1055, 770], core: { l: 1165, t: 790, w: 250 }, full: { l: 1120, b: 130, w: 640 } },
};
const SPOT = {
  'Protokollführerin':   { e: [522, 405, 100, 125], r: [320, 265, 322, 60] },
  'Schöffe':             { e: [757, 405, 100, 125], r: [690, 220, 158, 60] },
  'Richter':             { e: [1000, 395, 105, 135], r: [920, 230, 160, 60] },
  'Schöffin':            { e: [1245, 405, 100, 125], r: [1155, 245, 177, 60] },
  'Jugendgerichtshilfe': { e: [1545, 605, 90, 115], r: [1342, 458, 353, 60] },
  'Staatsanwältin':      { e: [1800, 690, 120, 150], r: [1663, 533, 272, 62] },
  'Verteidiger':         { e: [150, 690, 120, 150], r: [37, 533, 225, 62] },
  'Angeklagter':         { e: [375, 655, 115, 150], r: [263, 489, 224, 62] },
  'Zeugin':              { e: [1000, 850, 130, 200], r: [928, 1040, 144, 60] },
};
let spotOn = true;
function setSpot(who) {
  const hole = document.getElementById('hole');
  const color = document.getElementById('colorImg');
  const s = spotOn && who && SPOT[who];
  if (!s) { color.removeAttribute('mask'); hole.innerHTML = ''; color.style.opacity = 1; return; }
  const [cx, cy, rx, ry] = s.e, [x, y, w, h] = s.r;
  hole.innerHTML = `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}"/><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12"/>`;
  color.setAttribute('mask', 'url(#spotM)');
}
const LABEL = { 'Angeklagter': 'Leon (Angeklagter)', 'Zeugin': 'Zeugin Frau Hofmann' };

// Kernsätze in der Reihenfolge, in der sie in der Verhandlung fallen
const CORE = [
  { who: 'Protokollführerin', text: '„Aufgerufen wird die Jugendstrafsache gegen Leon M.“', scene: 1, title: 'Aufruf und Eröffnung' },
  { who: 'Schöffin', text: '„Wusstest du, dass Graffiti verboten ist?“', scene: 3, title: 'Leon sagt aus' },
  { who: 'Schöffe', text: '„Leon, warum bist du nicht weggelaufen?“', scene: 3, title: 'Leon sagt aus' },
  { who: 'Zeugin', text: '„Ich habe ein Zischen gehört.“', scene: 4, title: 'Die Zeugin' },
  { who: 'Jugendgerichtshilfe', text: '„Leon war vorher nie auffällig.“', scene: 5, title: 'Die Jugendgerichtshilfe' },
  { who: 'Staatsanwältin', text: '„Ich beantrage 60 Sozialstunden.“', scene: 6, title: 'Die Schlussvorträge' },
  { who: 'Verteidiger', text: '„Mein Mandant wurde unter Druck gesetzt.“', scene: 6, title: 'Die Schlussvorträge' },
  { who: 'Angeklagter', text: '„Es tut mir leid. Ich wollte dazugehören.“', scene: 7, title: 'Das letzte Wort' },
  { who: 'Richter', text: '„Im Namen des Volkes ergeht folgendes Urteil …“', scene: 8, title: 'Beratung und Urteil' },
];

const $ = id => document.getElementById(id);

// ---------- Vorlesen (Sprachausgabe des Browsers) ----------
const synth = window.speechSynthesis;
const FEMALE = ['Protokollführerin', 'Schöffin', 'Staatsanwältin', 'Jugendgerichtshilfe', 'Zeugin'];
// Tonhöhe und Tempo je Person, damit man die Stimmen auseinanderhält
const VOICE = {
  'Richter': [0.8, 0.95], 'Schöffe': [1.0, 1.0], 'Verteidiger': [0.9, 1.02], 'Angeklagter': [1.3, 1.0],
  'Protokollführerin': [1.05, 1.0], 'Schöffin': [1.1, 1.0], 'Staatsanwältin': [0.95, 1.0],
  'Jugendgerichtshilfe': [1.0, 0.95], 'Zeugin': [1.15, 1.0], '': [1.0, 0.9],
};
const MALE_RX = /(conrad|stefan|markus|yannick|martin|viktor|florian|killian|hans|jonas|bernd|ralf|christoph|kasper|male|mann)/i;
const FEMALE_RX = /(katja|hedda|anna|petra|helena|marlene|vicki|amala|seraphina|louisa|elke|klara|gisela|ingrid|maja|tanja|female|frau)/i;
let deVoices = [], ttsOn = false, autoOn = false, speakToken = 0;
function loadVoices() {
  if (!synth) return;
  deVoices = synth.getVoices().filter(v => /^de(-|_|$)/i.test(v.lang));
}
function pickVoice(who) {
  if (!deVoices.length) return null;
  const female = FEMALE.includes(who);
  const pool = deVoices.filter(v => female ? FEMALE_RX.test(v.name) : MALE_RX.test(v.name));
  const list = pool.length ? pool : deVoices;
  // gleiche Person, gleiche Stimme
  const idx = Object.keys(VOICE).indexOf(who);
  return list[Math.max(0, idx) % list.length];
}
function stopSpeech() { speakToken++; if (synth) synth.cancel(); $('tts').classList.remove('speaking'); }
function speakStep(step, sceneIntro) {
  if (!synth || !ttsOn) return;
  stopSpeech();
  const token = speakToken;
  const parts = [];
  if (sceneIntro) parts.push({ who: '', text: `Szene ${step.scene}: ${step.title}.` });
  // in Sätze teilen: manche Browser brechen lange Äußerungen sonst ab
  step.text.replace(/[„“]/g, '').match(/[^.!?…]+[.!?…]*/g).forEach(s => s.trim() && parts.push({ who: step.who, text: s.trim() }));
  $('tts').classList.add('speaking');
  parts.forEach((pt, k) => {
    const u = new SpeechSynthesisUtterance(pt.text);
    u.lang = 'de-DE';
    const v = pickVoice(pt.who); if (v) u.voice = v;
    const [pitch, rate] = VOICE[pt.who] || [1, 1];
    u.pitch = pitch; u.rate = rate * 0.95;
    if (k === parts.length - 1) u.onend = () => {
      if (token !== speakToken) return;
      $('tts').classList.remove('speaking');
      if (autoOn && i < list().length) setTimeout(() => { if (token === speakToken) go(1, true); }, 700);
    };
    synth.speak(u);
  });
}

const layer = $('layer'), tails = $('tails'), stage = $('stage');
let mode = 'core', i = 0;
const list = () => mode === 'core' ? CORE : STEPS;

function esc(s) { return s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

function bubbleEl(step, place, cls) {
  const d = document.createElement('div');
  d.className = 'bubble ' + cls;
  const pct = v => (v / 20) + '%', pctY = v => (v / 11.25) + '%';
  d.style.left = pct(place.l); d.style.width = pct(place.w);
  if (place.t !== undefined) d.style.top = pctY(place.t); else d.style.bottom = pctY(place.b);
  d.innerHTML = `<span class="who">${esc(LABEL[step.who] || step.who)}</span><span class="t">${esc(step.text)}</span>`;
  d.dataset.who = step.who;
  return d;
}

function drawTails() {
  const r = stage.getBoundingClientRect();
  const sx = 2000 / r.width, sy = 1125 / r.height;
  let html = '';
  layer.querySelectorAll('.bubble').forEach(b => {
    const sp = SP[b.dataset.who]; if (!sp) return;
    const br = b.getBoundingClientRect();
    const cx = (br.left - r.left + br.width / 2) * sx, cy = (br.top - r.top + br.height / 2) * sy;
    const [tx, ty] = sp.a, ang = Math.atan2(ty - cy, tx - cx), off = 17;
    const p1 = [cx + Math.cos(ang + Math.PI / 2) * off, cy + Math.sin(ang + Math.PI / 2) * off];
    const p2 = [cx + Math.cos(ang - Math.PI / 2) * off, cy + Math.sin(ang - Math.PI / 2) * off];
    html += `<path d="M${p1} L${tx},${ty} L${p2} Z" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="3" stroke-linejoin="round"/>`;
  });
  tails.innerHTML = html;
}

function render() {
  const L = list();
  layer.innerHTML = '';
  if (i === 0) {
    layer.innerHTML = '<div class="start-hint"><span>Klick auf „Weiter“, um die Verhandlung zu starten</span></div>';
    $('r-who').textContent = ''; $('r-txt').textContent = mode === 'core'
      ? 'Neun Personen, neun Sätze: Sie erscheinen nacheinander in der Reihenfolge, in der sie in der Verhandlung fallen.'
      : 'Die ganze Verhandlung in acht Szenen, Redebeitrag für Redebeitrag.';
    $('r-txt').className = 'txt';
  } else {
    const cur = L[i - 1];
    layer.insertAdjacentHTML('beforeend', `<div class="scene-chip">Szene ${cur.scene} · ${esc(cur.title)}</div>`);
    if (mode === 'core') {
      layer.appendChild(bubbleEl(cur, SP[cur.who].core, ''));
    } else if (cur.who) {
      layer.appendChild(bubbleEl(cur, SP[cur.who].full, cur.text.length > 120 ? 'long' : ''));
    } else {
      layer.insertAdjacentHTML('beforeend', `<div class="regie">${esc(cur.text)}</div>`);
    }
    $('r-who').textContent = cur.who ? (LABEL[cur.who] || cur.who) : 'Regieanweisung';
    $('r-txt').textContent = cur.text;
    $('r-txt').className = 'txt' + (cur.who ? '' : ' regie-txt');
  }
  setSpot(i === 0 ? null : L[i - 1].who);
  drawTails();
  $('prev').disabled = i === 0;
  $('next').disabled = i === L.length;
  $('next').textContent = i === L.length ? 'Ende' : 'Weiter →';
  $('bar').style.width = (i / L.length * 100) + '%';
  $('count').textContent = `${i} von ${L.length}`;
}

function go(d, fromAuto) {
  const L = list(), before = i;
  i = Math.max(0, Math.min(L.length, i + d)); render();
  if (!fromAuto) stopSpeech();
  if (ttsOn && i > 0 && i !== before) {
    const cur = L[i - 1], prev = L[i - 2];
    speakStep(cur, !prev || prev.scene !== cur.scene);
  }
}
function setMode(m) {
  stopSpeech();
  mode = m; i = 0;
  $('mode-core').setAttribute('aria-pressed', m === 'core');
  $('mode-full').setAttribute('aria-pressed', m === 'full');
  try { localStorage.setItem('leon-mode', m); } catch (e) {}
  render();
}

$('next').addEventListener('click', () => go(1));
$('prev').addEventListener('click', () => go(-1));
$('reset').addEventListener('click', () => { stopSpeech(); i = 0; render(); });
$('mode-core').addEventListener('click', () => setMode('core'));
$('mode-full').addEventListener('click', () => setMode('full'));
stage.addEventListener('click', () => go(1));
const player = $('player');
function fsActive() { return !!document.fullscreenElement || player.classList.contains('fs-fallback'); }
function fsLabel() { $('fs').textContent = fsActive() ? 'Vollbild beenden' : 'Vollbild'; requestAnimationFrame(drawTails); }
$('fs').addEventListener('click', () => {
  if (player.classList.contains('fs-fallback')) { player.classList.remove('fs-fallback'); fsLabel(); return; }
  if (document.fullscreenElement) { document.exitFullscreen().catch(() => {}); return; }
  const fallback = () => { player.classList.add('fs-fallback'); fsLabel(); };
  try {
    if (player.requestFullscreen) player.requestFullscreen().then(fsLabel).catch(fallback);
    else fallback();
  } catch (e) { fallback(); }
});
document.addEventListener('fullscreenchange', fsLabel);
// Steuerleiste im Vollbild nach 2,5 s ohne Mausbewegung ausblenden
let idleT;
function wake() {
  player.classList.remove('idle'); clearTimeout(idleT);
  if (fsActive()) idleT = setTimeout(() => { if (fsActive()) player.classList.add('idle'); }, 2500);
}
['mousemove', 'touchstart', 'keydown'].forEach(ev => document.addEventListener(ev, wake, { passive: true }));
document.addEventListener('fullscreenchange', wake);
if (!synth) {
  $('tts').disabled = true; $('tts').title = 'Dieser Browser kann nicht vorlesen.';
} else {
  loadVoices(); synth.addEventListener && synth.addEventListener('voiceschanged', loadVoices);
}
$('tts').addEventListener('click', () => {
  ttsOn = !ttsOn; $('tts').setAttribute('aria-pressed', ttsOn);
  $('auto').disabled = !ttsOn;
  if (!ttsOn) { stopSpeech(); autoOn = false; $('auto').setAttribute('aria-pressed', 'false'); }
  else if (i > 0) speakStep(list()[i - 1], false);
});
$('auto').addEventListener('click', () => {
  autoOn = !autoOn; $('auto').setAttribute('aria-pressed', autoOn);
  if (autoOn && ttsOn && synth && !synth.speaking) go(1, true);
});
$('spot').addEventListener('click', () => {
  spotOn = !spotOn; $('spot').setAttribute('aria-pressed', spotOn);
  try { localStorage.setItem('leon-spot', spotOn ? '1' : '0'); } catch (e) {}
  render();
});
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('button') && (e.key === ' ' || e.key === 'Enter')) return;
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); go(1); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(-1); }
  if (e.key === 'Escape' && player.classList.contains('fs-fallback')) { player.classList.remove('fs-fallback'); fsLabel(); }
  if (e.key === 'f' || e.key === 'F') $('fs').click();
  if ((e.key === 'v' || e.key === 'V') && !$('tts').disabled) $('tts').click();
});
new ResizeObserver(drawTails).observe(stage);

try { if (localStorage.getItem('leon-spot') === '0') { spotOn = false; $('spot').setAttribute('aria-pressed', 'false'); } } catch (e) {}
let saved = null;
try { saved = localStorage.getItem('leon-mode'); } catch (e) {}
setMode(saved === 'full' ? 'full' : 'core');
</script>
