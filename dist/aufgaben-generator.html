/* Layout: links der Bauplan (feste Spalte), rechts der Schreibtisch aus Karopapier mit dem A4-Blatt und Registerreitern A–D */
:root {
  --desk: #eef2f8;
  --grid: #dde4f0;
  --panel: #ffffff;
  --panel-2: #f6f8fc;
  --line: #d8dfeb;
  --text: #1b2130;
  --muted: #5a6275;
  --ink: #1f3f9e;
  --ink-soft: #e6ecfa;
  --red: #c8102e;
  --part-0: #1f3f9e;
  --part-1: #2e7d5b;
  --part-2: #b5541b;
  --part-3: #6b3fa0;
  --ui: "Familjen Grotesk", "Segoe UI", system-ui, sans-serif;
  --sheet-font: Arial, "Liberation Sans", Helvetica, sans-serif;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --desk: #141a26; --grid: #1d2536; --panel: #1b2232; --panel-2: #222a3c; --line: #2f3a51;
    --text: #e6eaf3; --muted: #9aa4bb; --ink: #8ea8ff; --ink-soft: #26314f; --red: #ff7a8a;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; font-family: var(--ui); font-size: 15px; color: var(--text); background: var(--desk); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 384px 1fr; height: 100%; }

/* ---------- Bauplan ---------- */
.plan { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.plan-scroll { overflow-y: auto; padding: 22px 22px 12px; display: grid; gap: 22px; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.brand h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -0.01em; }
.brand h1 span { color: var(--ink); }
.brand small { color: var(--muted); font-size: 12px; }

.group { display: grid; gap: 10px; }
.group > h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--muted); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
label.field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
input[type=text], input[type=number], select {
  width: 100%; border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 8px 10px; font-size: 14px;
}
input[type=number] { font-variant-numeric: tabular-nums; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; padding: 2px; background: var(--panel-2); gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 11px; border-radius: 7px; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--text); box-shadow: 0 1px 2px rgba(20, 30, 60, .14); }
.seg button:disabled { opacity: .38; cursor: not-allowed; }

/* Teile A–D als Karteikarten mit farbigem Reiter */
.parts { display: grid; gap: 10px; }
.part { display: grid; grid-template-columns: 34px 1fr; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--panel); }
.part.flash { animation: flash .9s ease-out; }
@keyframes flash { from { box-shadow: 0 0 0 3px var(--pc); } to { box-shadow: 0 0 0 0 transparent; } }
.part-tab { background: var(--pc); color: #fff; font-weight: 700; font-size: 17px; display: grid; place-items: start center; padding-top: 10px; }
.part-body { padding: 10px 12px; display: grid; gap: 8px; min-width: 0; }
.part-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.part select { padding: 6px 8px; }
.stars { display: inline-flex; gap: 1px; }
.stars button { border: 0; background: none; padding: 0 1px; font-size: 20px; line-height: 1; cursor: pointer; color: var(--pc); }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.stepper button { border: 0; background: var(--panel-2); width: 28px; height: 28px; cursor: pointer; font-size: 16px; }
.stepper output { min-width: 28px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; }
.mini { font-size: 12px; color: var(--muted); }
.icon-btn { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 4px; border-radius: 6px; margin-left: auto; }
.icon-btn:hover { color: var(--red); background: var(--panel-2); }
.add-part { border: 1px dashed var(--line); background: none; border-radius: var(--radius); padding: 9px; color: var(--ink); font-weight: 600; cursor: pointer; }
.add-part:hover { background: var(--ink-soft); }

.check { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
.check input { width: 17px; height: 17px; accent-color: var(--ink); }

.code-box { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
.code-box input { font-size: 12.5px; font-variant-numeric: tabular-nums; }
.btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 8px 12px; cursor: pointer; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--ink); }
.btn svg { flex: none; }
.msg { font-size: 13px; min-height: 1em; }
.msg.err { color: var(--red); }
.msg.ok { color: var(--part-1); }

.plan-foot { border-top: 1px solid var(--line); padding: 14px 22px 18px; display: grid; gap: 10px; background: var(--panel); }
.download { border: 0; background: var(--ink); color: #fff; border-radius: 10px; padding: 12px 14px; font-weight: 700; font-size: 15px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; }
.download:hover { filter: brightness(1.08); }
@media (prefers-color-scheme: dark) { .download { color: #0f1424; } }

/* ---------- Schreibtisch ---------- */
.desk {
  min-width: 0; overflow: auto; position: relative;
  background-color: var(--desk);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 20px 20px;
}
.desk-bar { position: sticky; top: 0; z-index: 3; display: flex; justify-content: center; padding: 14px 16px; pointer-events: none; }
.desk-bar .seg { pointer-events: auto; background: var(--panel); box-shadow: 0 2px 10px rgba(20, 30, 60, .12); }
.desk-bar .seg button[data-view="steps"][aria-pressed="true"], .desk-bar .seg button[data-view="answers"][aria-pressed="true"] { color: var(--red); }
.stage { display: flex; justify-content: center; padding: 6px 70px 60px 24px; }
.sheet-wrap { position: relative; }

/* Registerreiter rechts am Blatt */
.tabs { position: absolute; top: 120px; right: -38px; display: grid; gap: 6px; }
.tabs button { width: 38px; height: 54px; border: 0; border-radius: 0 9px 9px 0; background: var(--pc); color: #fff; font-weight: 700; font-size: 16px; cursor: pointer; box-shadow: 2px 2px 6px rgba(20, 30, 60, .18); transition: transform .15s; }
.tabs button:hover { transform: translateX(3px); }

/* ---------- A4-Blatt (Vorschau, entspricht der Word-Datei) ---------- */
.sheet {
  width: 210mm; min-height: 297mm; background: #fff; color: #1b2130; padding: 16mm 18mm 14mm;
  font-family: var(--sheet-font); font-size: 11pt; line-height: 1.32;
  box-shadow: 0 1px 2px rgba(20, 30, 60, .1), 0 12px 32px rgba(20, 30, 60, .14);
  display: flex; flex-direction: column;

// ---- src/core/rng.js ----
// Zufallszahlen mit Startwert: gleicher Startwert -> gleiche Aufgaben.
(function (AG) {
  // Zeichenkette -> 32-Bit-Zahl (FNV-1a)
  function hash(str) {
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 0x01000193);
    }
    return h >>> 0;
  }

  // mulberry32
  function makeRng(seed) {
    let a = (typeof seed === "string" ? hash(seed) : seed) >>> 0;
    function next() {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }
    const rng = {
      next,
      // ganze Zahl in [min, max]
      int(min, max) { return min + Math.floor(next() * (max - min + 1)); },
      // ganze Zahl in [min, max] ohne die Werte in exclude
      intExcept(min, max, exclude) {
        for (let i = 0; i < 1000; i++) {
          const v = rng.int(min, max);
          if (!exclude.includes(v)) return v;
        }
        throw new Error("intExcept: kein Wert gefunden");
      },
      // ganze Zahl ungleich 0 in [-max, -min] ∪ [min, max]
      signedInt(min, max) { return rng.int(min, max) * (next() < 0.5 ? -1 : 1); },
      pick(arr) { return arr[Math.floor(next() * arr.length)]; },
      chance(p) { return next() < p; },
      shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(next() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      },
    };
    return rng;
  }

  AG.hash = hash;
  AG.makeRng = makeRng;

<script>
// ---- src/core/content.js ----
// Zahlen, Brüche und das Inhaltsmodell ("Rich") für Aufgaben und Lösungen.
//
// Rich = Array von Segmenten. Ein Segment ist
//   "Text"                          normaler Text
//   { f: [z, n], w: g, s: -1 }      Bruch z/n, optional ganze Zahl g davor (gemischte Zahl), s = -1 für Minus
//   { b: "Text" }                   fett
//   { sup: "2" }                    hochgestellt
//   { blank: 4 }                    Lücke zum Ausfüllen (Breite in Zeichen, ungefähr)
//   { br: true }                    Zeilenumbruch
(function (AG) {
  const MINUS = "−";

  function gcd(a, b) {
    a = Math.abs(a); b = Math.abs(b);
    while (b) [a, b] = [b, a % b];
    return a;
  }
  function lcm(a, b) { return Math.abs(a * b) / gcd(a, b); }

  // Exakte Bruchrechnung. Nenner immer positiv, immer gekürzt.
  class Frac {
    constructor(n, d = 1) {
      if (!Number.isInteger(n) || !Number.isInteger(d)) throw new Error("Frac: nur ganze Zahlen " + n + "/" + d);
      if (d === 0) throw new Error("Frac: Nenner 0");
      if (d < 0) { n = -n; d = -d; }
      const g = gcd(n, d) || 1;
      this.n = n / g; this.d = d / g;
      if (Object.is(this.n, -0)) this.n = 0;
    }
    static of(x) {
      if (x instanceof Frac) return x;
      if (Number.isInteger(x)) return new Frac(x, 1);
      // Dezimalzahl -> Bruch (bis 6 Nachkommastellen)
      const s = x.toFixed(6).replace(/0+$/, "");
      const digits = (s.split(".")[1] || "").length;
      const p = 10 ** digits;
      return new Frac(Math.round(x * p), p);
    }
    add(o) { o = Frac.of(o); return new Frac(this.n * o.d + o.n * this.d, this.d * o.d); }
    sub(o) { o = Frac.of(o); return new Frac(this.n * o.d - o.n * this.d, this.d * o.d); }
    mul(o) { o = Frac.of(o); return new Frac(this.n * o.n, this.d * o.d); }
    div(o) { o = Frac.of(o); if (o.n === 0) throw new Error("Division durch 0"); return new Frac(this.n * o.d, this.d * o.n); }
    neg() { return new Frac(-this.n, this.d); }
    abs() { return new Frac(Math.abs(this.n), this.d); }
    inv() { return new Frac(this.d, this.n); }
    cmp(o) { o = Frac.of(o); return Math.sign(this.n * o.d - o.n * this.d); }
    eq(o) { return this.cmp(o) === 0; }
    isInt() { return this.d === 1; }
    sign() { return Math.sign(this.n); }
    valueOf() { return this.n / this.d; }
    // endet die Dezimaldarstellung? (Nenner nur 2er und 5er)
    isTerminating() { let d = this.d; while (d % 2 === 0) d /= 2; while (d % 5 === 0) d /= 5; return d === 1; }
    decimals() { // Anzahl Nachkommastellen bei endlicher Darstellung
      if (!this.isTerminating()) return Infinity;
      let k = 0; let d = this.d;
      while (d !== 1) { if (d % 10 === 0) d /= 10; else if (d % 2 === 0) d /= 2; else d /= 5; k++; }
      // k ist obere Schranke; genaue Stellen bestimmen
      for (let i = 0; i <= k; i++) if ((this.n * 10 ** i) % this.d === 0) return i;
      return k;
    }
    toString() { return this.d === 1 ? String(this.n) : this.n + "/" + this.d; }
  }

  // ---------- Formatierung ----------

  // ganze Zahl mit Tausenderpunkt ab 5 Stellen (1 000 -> "1000", 12 345 -> "12 345")
  function fmtInt(n) {
    const s = String(Math.abs(n));
    const body = s.length >= 5 ? s.replace(/\B(?=(\d{3})+(?!\d))/g, " ") : s;
    return (n < 0 ? MINUS : "") + body;
  }

  // Zahl/Frac als Dezimalzahl mit Komma. digits = feste Stellen, sonst so viele wie nötig.
  function fmtDec(x, digits) {
    const f = Frac.of(x);
    let k = digits;
    if (k === undefined) {
      k = f.decimals();
      if (k === Infinity) throw new Error("fmtDec: keine endliche Dezimalzahl: " + f);
    }
    const neg = f.n < 0;
    const scaled = Math.round(Math.abs(f.n) * 10 ** k / f.d);
    let s = String(scaled).padStart(k + 1, "0");
    const intPart = s.slice(0, s.length - k) || "0";
    const decPart = k > 0 ? s.slice(s.length - k) : "";
    let out = fmtInt(Number(intPart)) + (k > 0 ? "," + decPart : "");
    if (neg && scaled !== 0) out = MINUS + out;
    return out;
  }

  // Bruch als Segment. mixed: unechte Brüche als gemischte Zahl (Standard).
  function fracSeg(x, opts = {}) {
    const f = Frac.of(x);
    const mixed = opts.mixed !== false;
    if (f.isInt()) return fmtInt(f.n);
    const s = f.n < 0 ? -1 : 1;
    const an = Math.abs(f.n);
    if (mixed && an > f.d) {
      const w = Math.floor(an / f.d);
      return { f: [an % f.d, f.d], w, s };
    }
    return s < 0 ? { f: [an, f.d], s } : { f: [an, f.d] };
  }

  // Zahl als Rich (Array). as: "int" | "dec" | "frac" | "mixed" (Standard: frac, wenn kein Dezimalbruch passt)
  // paren: negative Zahlen in Klammern
  function num(x, opts = {}) {
    const f = Frac.of(x);
    let seg;
    const as = opts.as || (f.isInt() ? "int" : "frac");
    if (as === "dec" || (as === "int" && !f.isInt())) seg = fmtDec(f, opts.digits);
    else if (as === "int") seg = fmtInt(f.n);
    else seg = fracSeg(f, { mixed: as !== "improper" && opts.mixed !== false });
    const out = [seg];
    if (opts.paren && f.n < 0) return ["(", ...out, ")"];
    return out;
  }

  // Rich -> reiner Text (für Duplikat-Erkennung und Tests)
  function plain(rich) {
    if (typeof rich === "string") return rich;
    if (!Array.isArray(rich)) rich = [rich];
    return rich.map(seg => {
      if (typeof seg === "string") return seg;
      if (Array.isArray(seg)) return plain(seg);
      if (seg.f) return (seg.s < 0 ? MINUS : "") + (seg.w ? seg.w + " " : "") + seg.f[0] + "/" + seg.f[1];
      if (seg.b !== undefined) return seg.b;
      if (seg.sup !== undefined) return "^" + seg.sup;
      if (seg.blank !== undefined) return "___";
      if (seg.br) return "\n";
      return "";
    }).join("");
  }

  // flach machen: verschachtelte Arrays auflösen
  function rich(...parts) {
    const out = [];
    for (const p of parts) {
      if (Array.isArray(p)) out.push(...rich(...p));
      else if (p !== null && p !== undefined && p !== "") out.push(p);
    }
    return out;
  }

  // Kann die Lösung direkt mit „= …“ hinter die Aufgabe? Nur bei reinen Rechenausdrücken.
  function isExpression(task) {
    if (task.table || task.inline === false) return false;
    if (task.inline === true) return true;
    const t = plain(task.q).trim();
    return t.length <= 48 && !/[?.!:]$/.test(t) && !/\n/.test(t) && !/[a-zäöüß]{4,}/i.test(t.replace(/\b(von|und)\b/g, ""));
  }

  AG.isExpression = isExpression;
  AG.gcd = gcd;
  AG.lcm = lcm;
  AG.Frac = Frac;
  AG.fmtInt = fmtInt;
  AG.fmtDec = fmtDec;
  AG.fracSeg = fracSeg;
  AG.num = num;
  AG.plain = plain;
  AG.rich = rich;
})(typeof AG !== "undefined" ? AG : (globalThis.AG = {}));

<script>
// ---- src/core/engine.js ----
// Aufgabentypen registrieren und Arbeitsblätter erzeugen.
(function (AG) {
  const TYPES = [];
  const BY_ID = {};

  // Aufgabentyp anmelden. Pflichtfelder: id, klasse, zug, lb, lbTitle, title, instruction, generate.
  function registerType(t) {
    for (const k of ["id", "klasse", "zug", "lb", "lbTitle", "title", "instruction", "generate"]) {
      if (t[k] === undefined) throw new Error("registerType: Feld fehlt: " + k + " in " + (t.id || "?"));
    }
    if (BY_ID[t.id]) throw new Error("registerType: doppelte id " + t.id);
    t.levels = t.levels || [1, 2, 3];
    t.cols = t.cols || 2;
    TYPES.push(t);
    BY_ID[t.id] = t;
  }

  function instructionFor(type, level) {
    const ins = type.instruction;
    return typeof ins === "string" ? ins : (ins[level] || ins[1] || Object.values(ins)[0]);
  }

  function taskKey(task) {
    return task.key || AG.plain(task.q) + "|" + (task.table ? JSON.stringify(task.table.rows.map(r => r.map(AG.plain))) : "");
  }

  // Eine Aufgabe erzeugen (ohne Duplikatprüfung)
  function generateTask(type, level, seedStr) {
    const rng = AG.makeRng(seedStr);
    const task = type.generate(rng, level);
    if (!task || !task.q || !task.a) throw new Error(type.id + ": generate() muss {q, a} liefern");
    return task;
  }

  // Arbeitsblatt erzeugen. config siehe defaultConfig().
  function generateSheet(config, group) {
    const seen = new Set();
    const parts = config.parts.map((p, pi) => {
      const type = BY_ID[p.type];
      if (!type) throw new Error("Unbekannter Aufgabentyp: " + p.type);
      const tasks = [];
      for (let ti = 0; ti < p.count; ti++) {
        const reroll = (config.rerolls && config.rerolls[group + "." + pi + "." + ti]) || 0;
        let task = null;
        for (let attempt = 0; attempt < 60; attempt++) {
          const t = generateTask(type, p.level, [config.seed, group, pi, ti, reroll, attempt, p.type, p.level].join("|"));
          const key = taskKey(t);
          if (!seen.has(key)) { seen.add(key); task = t; break; }
        }
        if (!task) task = generateTask(type, p.level, [config.seed, group, pi, ti, reroll, "x"].join("|"));
        tasks.push(task);
      }
      return {
        label: String.fromCharCode(65 + pi),
        level: p.level,
        type,
        title: p.title || type.title,
        instruction: p.instruction || instructionFor(type, p.level),
        cols: p.cols || type.cols,
        tasks,
      };
    });
    return { group, parts };
  }

  // ---------- Blatt-Code: komplette Einstellung als kurze Zeichenkette ----------
  // Aufbau: 1-7M-4821-<teil>_<teil>..[-<neu gewürfelt>]
  //   teil = <typkürzel><niveau><anzahl als Buchstabe a=1..>[<spalten>]
  //   typkürzel = 4 Zeichen aus dem Hash der Typ-id
  function typeShort(id) { return AG.hash(id).toString(36).padStart(7, "0").slice(-4); }

  function encodeCode(config) {
    const parts = config.parts.map(p =>
      typeShort(p.type) + p.level + String.fromCharCode(96 + p.count) + (p.cols ? p.cols : ""));
    const rr = Object.entries(config.rerolls || {}).filter(([, n]) => n > 0)
      .map(([k, n]) => k.replace(/\./g, "") + (n > 1 ? "x" + n : ""));
    return ["1", config.klasse + config.zug, config.seed, parts.join("_")].concat(rr.length ? [rr.join("_")] : []).join("-");
  }
  function decodeCode(code) {
    const bits = code.trim().split("-");
    if (bits[0] !== "1" || bits.length < 4) throw new Error("Das ist kein gültiger Blatt-Code.");
    const klasse = bits[1].replace(/\D/g, ""), zug = bits[1].replace(/\d/g, "");
    const parts = bits[3].split("_").map(s => {
      const m = /^([0-9a-z]{4})(\d)([a-z])(\d?)$/.exec(s);
      if (!m) throw new Error("Blatt-Code beschädigt: " + s);
      const type = TYPES.find(t => typeShort(t.id) === m[1]);

// ---- src/core/docx.js ----
// Word-Datei (.docx) direkt im Browser erzeugen – ohne Bibliothek, funktioniert offline.
(function (AG) {
  const INK = "1F3F9E";      // Füllerblau
  const RED = "C8102E";      // Korrekturrot
  const GREY = "5A6275";
  const FILL = "EAF0FC";     // Merke-Kasten
  const FONT = "Arial";
  const PART_FILL = ["1F3F9E", "2E7D5B", "B5541B", "6B3FA0"]; // Teil A–D

  // ---------- ZIP (ohne Kompression) ----------
  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;

  function crc32(bytes) {
    let c = 0xffffffff;
    for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);

    const enc = new TextEncoder();

      const isPacked = content && content.packed;
      const raw = isPacked ? content.raw : (typeof content === "string" ? enc.encode(content) : content);
      const data = isPacked ? content.packed : raw;
      const method = isPacked ? 8 : 0;
      const crc = crc32(raw);
      const local = new DataView(new ArrayBuffer(30));
      local.setUint32(0, 0x04034b50, true); local.setUint16(4, 20, true); local.setUint16(6, 0x0800, true);
      local.setUint16(8, method, true); local.setUint16(10, 0, true); local.setUint16(12, 0x21, true);
      local.setUint32(14, crc, true); local.setUint32(18, data.length, true); local.setUint32(22, raw.length, true);
      local.setUint16(26, nameB.length, true); local.setUint16(28, 0, true);

      cen.setUint32(0, 0x02014b50, true); cen.setUint16(4, 20, true); cen.setUint16(6, 20, true); cen.setUint16(8, 0x0800, true);
      cen.setUint16(10, method, true); cen.setUint16(12, 0, true); cen.setUint16(14, 0x21, true);
      cen.setUint32(16, crc, true); cen.setUint32(20, data.length, true); cen.setUint32(24, raw.length, true);
      cen.setUint16(28, nameB.length, true); cen.setUint32(42, offset, true);

    }

    end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
    end.setUint32(12, cenSize, true); end.setUint32(16, offset, true);
    const all = [...chunks, ...central, new Uint8Array(end.buffer)];

  const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

  function rPr(o = {}) {
    let x = `<w:rFonts w:ascii="${FONT}" w:hAnsi="${FONT}" w:cs="${FONT}"/>`;
    if (o.b) x += "<w:b/>";
    if (o.i) x += "<w:i/>";
    if (o.color) x += `<w:color w:val="${o.color}"/>`;
    if (o.size) x += `<w:sz w:val="${o.size}"/><w:szCs w:val="${o.size}"/>`;
    if (o.sup) x += `<w:vertAlign w:val="superscript"/>`;
    if (o.spacing) x += `<w:spacing w:val="${o.spacing}"/>`;
    return `<w:rPr>${x}</w:rPr>`;
  }
  function run(text, o = {}) {
    if (text === "") return "";
    const parts = String(text).split("\t");
    return parts.map((t, i) => (i ? `<w:r>${rPr(o)}<w:tab/></w:r>` : "") +
      (t ? `<w:r>${rPr(o)}<w:t xml:space="preserve">${esc(t)}</w:t></w:r>` : "")).join("");
  }
  function mRun(text, o) {
    return `<m:r><m:rPr><m:sty m:val="p"/></m:rPr>${rPr(o).replace(`w:ascii="${FONT}" w:hAnsi="${FONT}" w:cs="${FONT}"`, 'w:ascii="Cambria Math" w:hAnsi="Cambria Math"')}<m:t>${esc(text)}</m:t></m:r>`;

  function richXml(r, o = {}) {

    return r.map(seg => {
      if (typeof seg === "string") return run(seg.replace(/ {2,}\|/g, "\t|"), o);
      if (seg.f) {

    let p = "";

    if (o.pageBreakBefore) p += "<w:pageBreakBefore/>";

    if (o.tabs) p += `<w:tabs>${o.tabs.map(t => `<w:tab w:val="${t.val || "left"}" w:pos="${t.pos}"/>`).join("")}</w:tabs>`;
    p += `<w:spacing w:before="${o.before || 0}" w:after="${o.after === undefined ? 60 : o.after}" w:line="${o.line || 264}" w:lineRule="auto"/>`;
    if (o.indent) p += `<w:ind w:left="${o.indent}"${o.hanging ? ` w:hanging="${o.hanging}"` : ""}/>`;
    if (o.align) p += `<w:jc w:val="${o.align}"/>`;
    if (o.size) p += `<w:rPr><w:sz w:val="${o.size}"/></w:rPr>`;
    return `<w:p><w:pPr>${p}</w:pPr>${inner}</w:p>`;
  }
  // Tabelle: rows = [[{xml, w, fill, borders, vAlign, margins}]]
  function table(rows, o = {}) {
    const widths = o.widths;
    const total = widths.reduce((a, b) => a + b, 0);
    const bd = o.borders || {};
    const b = side => bd[side] ? `<w:${side} w:val="${bd[side].val || "single"}" w:sz="${bd[side].sz || 4}" w:space="0" w:color="${bd[side].color || "auto"}"/>` : `<w:${side} w:val="nil"/>`;
    let x = `<w:tbl><w:tblPr><w:tblW w:w="${total}" w:type="dxa"/>${o.indent ? `<w:tblInd w:w="${o.indent}" w:type="dxa"/>` : ""}<w:tblLayout w:type="fixed"/>` +
      `<w:tblBorders>${["top", "left", "bottom", "right", "insideH", "insideV"].map(b).join("")}</w:tblBorders>` +
      `<w:tblCellMar><w:top w:w="${o.padT || 0}" w:type="dxa"/><w:left w:w="${o.padL === undefined ? 80 : o.padL}" w:type="dxa"/><w:bottom w:w="${o.padB || 0}" w:type="dxa"/><w:right w:w="${o.padR === undefined ? 80 : o.padR}" w:type="dxa"/></w:tblCellMar>` +
      `</w:tblPr><w:tblGrid>${widths.map(w => `<w:gridCol w:w="${w}"/>`).join("")}</w:tblGrid>`;

      x += `<w:tr>${o.cantSplit ? "<w:trPr><w:cantSplit/></w:trPr>" : ""}`;
      row.forEach((c, i) => {
        const cb = c.borders ? `<w:tcBorders>${Object.entries(c.borders).map(([s, v]) => `<w:${s} w:val="${v.val || "single"}" w:sz="${v.sz || 4}" w:space="0" w:color="${v.color || "auto"}"/>`).join("")}</w:tcBorders>` : "";
        const span = c.span ? `<w:gridSpan w:val="${c.span}"/>` : "";
        const w = c.span ? widths.slice(i, i + c.span).reduce((a, b) => a + b, 0) : widths[i];
        const mar = c.margins ? `<w:tcMar>${Object.entries(c.margins).map(([s, v]) => `<w:${s} w:w="${v}" w:type="dxa"/>`).join("")}</w:tcMar>` : "";

  const STAR_ON = "★", STAR_OFF = "☆";

  function stars(level) { return STAR_ON.repeat(level) + STAR_OFF.repeat(3 - level); }

  function headerXml(meta, solution) {
    const left = `Mathematik  Klasse ${meta.klasse}${meta.zug === "M" ? " M-Zug" : ""}${meta.subject ? "  |  " + meta.subject : ""}`;
    const right = `${solution ? "Lösungen  " : ""}Blatt ${meta.blattNr}  |  Gruppe ${meta.group}`;
    let x = para(run(left, { size: 17, color: GREY }) + run("\t" + right, { size: 17, color: solution ? RED : INK, b: true }),
      { tabs: [{ val: "right", pos: TEXT_W }], after: 80 });
    if (!solution) {
      const cell = label => ({ xml: para(run(label, { size: 18, color: GREY }), { after: 0, before: 160 }), borders: { bottom: { sz: 6, color: "9AA3B8" } } });
      x += table([[cell("Name"), { xml: para("") }, cell("Klasse"), { xml: para("") }, cell("Datum")]],
        { widths: [5200, 300, 1700, 300, TEXT_W - 7500], padL: 0, padR: 0 });
    }
    x += para(run(meta.title + (solution ? " – Lösungen" : ""), { size: 36, b: true, color: solution ? RED : INK }), { before: 260, after: 120, line: 240 });

  }

  function merkeXml(merke) {
    const inner = para(run("Merke", { b: true, color: INK, size: 20 }), { after: 40 }) + para(richXml(merke, { size: 21 }), { after: 0, line: 300 });
    return table([[{ xml: inner, fill: FILL, borders: { left: { sz: 36, color: INK } }, margins: { top: 120, bottom: 140, left: 220, right: 200 } }]],

  function partHeadXml(part, idx, solution) {
    const color = PART_FILL[idx % 4];
    const letter = { xml: para(run(part.label, { b: true, color: "FFFFFF", size: 26 }), { align: "center", after: 0, keepNext: true }), fill: color, vAlign: "center" };
    const title = { xml: para(run(part.title, { b: true, size: 24 }) + run("   " + stars(part.level), { color, size: 22 }), { after: 0, keepNext: true }), vAlign: "center", margins: { left: 180 } };
    let x = para("", { before: 140, after: 0, keepNext: true, size: 8 });
    x += table([[letter, title]], { widths: [460, TEXT_W - 460], padT: 50, padB: 50 });
    if (!solution) x += para(run(part.instruction, { i: true, color: GREY, size: 21 }), { before: 80, after: 100, keepNext: true });
    else x += para("", { after: 60, keepNext: true, size: 8 });
    return x;
  }

  function taskTableXml(tbl, o) {
    const cols = tbl.rows[0].length;
    const first = 1800;
    const w = Math.max(700, Math.min(1300, Math.floor((o.width - first - 200) / (cols - 1))));
    const widths = [first, ...Array(cols - 1).fill(w)];
    const rows = tbl.rows.map((r, ri) => r.map((c, ci) => ({
      xml: para(richXml(c, { size: 20, color: o.color && ci > 0 && ri > 0 ? o.color : undefined, b: ci === 0 }), { after: 0, align: ci ? "center" : "left" }),
      fill: ci === 0 ? "F1F3F8" : undefined, vAlign: "center",
    })));

    return table(rows, { widths, indent: o.indent, padT: 50, padB: 50, borders: { top: line, left: line, bottom: line, right: line, insideH: line, insideV: line } });
  }

  function tasksXml(part, mode, workLines) {
    const cols = Math.max(1, Math.min(3, part.cols));
    const colW = Math.floor(TEXT_W / cols);

      const sol = mode !== "worksheet";

        }

        for (const s of t.steps) x += para(richXml(s, { color, size: 20 }), { indent: inline ? 600 : 380, tabs: [{ pos: (inline ? 600 : 380) + 2600 }], after: 0, line: 300 });
      }

    });

    }

  // Ein Blatt (Arbeitsblatt oder Lösung) als Body-XML

      x += tasksXml(p, mode, opts.workLines || 0);

  function documentXml(body, code) {

      run("Blatt-Code: " + code, { size: 13, color: "8A91A3" }) + run("\tSeite ", { size: 15, color: GREY }) + fld("PAGE"),

  // Mit Kompression (kleinere Datei), falls der Browser CompressionStream kann
  async function packFiles(files) {
    if (typeof CompressionStream === "undefined") return files;
    const enc = new TextEncoder();
    const out = [];
    for (const [name, content] of files) {
      const raw = typeof content === "string" ? enc.encode(content) : content;
      const stream = new Blob([raw]).stream().pipeThrough(new CompressionStream("deflate-raw"));
      const packed = new Uint8Array(await new Response(stream).arrayBuffer());
      out.push([name, { raw, packed }]);
    }
    return out;
  }

  // pages: [{sheet, mode: "worksheet"|"answers"|"steps"}]
  async function buildDocxAsync(pages, meta, opts) {
    return zip(await packFiles(docxFiles(pages, meta, opts)));
  }
  function buildDocx(pages, meta, opts) { return zip(docxFiles(pages, meta, opts)); }

  function docxFiles(pages, meta, opts) {
    const body = pages.map((pg, i) => sheetXml(pg.sheet, meta, pg.mode, opts, i > 0)).join("");
    const files = [
      ["[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/word/footer1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/></Types>`],
      ["_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/></Relationships>`],
      ["docProps/core.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:title>${esc(meta.title)}</dc:title><dc:creator>Aufgaben-Generator</dc:creator></cp:coreProperties>`],
      ["word/_rels/document.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdStyles" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rIdFooter" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/footer" Target="footer1.xml"/></Relationships>`],
      ["word/styles.xml", STYLES],
      ["word/footer1.xml", footerXml(meta.code)],
      ["word/document.xml", documentXml(body, meta.code)],

    return files;
  }

  AG.buildDocx = buildDocx;
  AG.buildDocxAsync = buildDocxAsync;
  AG.DOCX_COLORS = { INK, RED, GREY, FILL, PART_FILL };

// Vorschau des Blatts als HTML – gleicher Aufbau wie die Word-Datei.
(function (AG) {
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function richHtml(r) {
    if (typeof r === "string") r = [r];
    return r.map(seg => {
      if (typeof seg === "string") return esc(seg).replace(/ {2,}\|(.*)$/, '<span class="op">|$1</span>');
      if (seg.f) {
        const pre = (seg.s < 0 ? AG.MINUS : "") + (seg.w ? seg.w : "");
        return `${esc(pre)}<span class="fr"><span>${seg.f[0]}</span><span>${seg.f[1]}</span></span>`;
      }
      if (seg.b !== undefined) return `<b>${esc(seg.b)}</b>`;
      if (seg.sup !== undefined) return `<sup>${esc(seg.sup)}</sup>`;
      if (seg.br) return "<br>";
      if (seg.blank !== undefined) return `<span class="blank" style="--w:${seg.blank}"></span>`;
      return "";
    }).join("");
  }

  function tableHtml(tbl, solution) {
    return `<table class="vt${solution ? " sol" : ""}">${tbl.rows.map((r, ri) =>
      `<tr>${r.map((c, ci) => `<${ci === 0 ? "th" : "td"}${solution && ri > 0 && ci > 0 ? ' class="red"' : ""}>${richHtml(c)}</${ci === 0 ? "th" : "td"}>`).join("")}</tr>`).join("")}</table>`;
  }

  // mode: "worksheet" | "answers" | "steps"
  function sheetHtml(sheet, meta, mode, opts) {
    const sol = mode !== "worksheet";
    const subj = `Mathematik&nbsp; Klasse ${esc(meta.klasse)}${meta.zug === "M" ? " M-Zug" : ""}${meta.subject ? "&nbsp; | &nbsp;" + esc(meta.subject) : ""}`;
    let h = `<header class="sh-head"><span>${subj}</span><span class="sh-nr${sol ? " red" : ""}">${sol ? "Lösungen&nbsp; " : ""}Blatt ${esc(meta.blattNr)}&nbsp; | &nbsp;Gruppe ${sheet.group}</span></header>`;
    if (!sol) h += `<div class="sh-fields"><span>Name</span><span>Klasse</span><span>Datum</span></div>`;
    h += `<h1 class="sh-title${sol ? " red" : ""}">${esc(meta.title)}${sol ? " – Lösungen" : ""}</h1>`;
    if (!sol && opts.merke && meta.merke && meta.merke.length) {
      h += `<aside class="sh-merke"><b>Merke</b><p>${richHtml(meta.merke)}</p></aside>`;
    }
    sheet.parts.forEach((p, pi) => {
      h += `<section class="sh-part" data-part="${pi}" style="--pc: var(--part-${pi})">
        <div class="sh-part-head"><span class="sh-letter">${p.label}</span><span class="sh-part-title">${esc(p.title)}</span><span class="sh-stars" aria-label="Niveau ${p.level} von 3">${AG.stars(p.level)}</span></div>`;
      if (!sol) h += `<p class="sh-ins">${esc(p.instruction)}</p>`;
      h += `<ol class="sh-tasks" style="--cols:${Math.max(1, Math.min(3, p.cols))}">`;
      p.tasks.forEach((t, ti) => {
        const lab = String.fromCharCode(97 + ti) + ")";
        let body;
        const inline = sol && AG.isExpression(t);
        if (inline) body = `<div class="q">${richHtml(t.q)} = <b class="red">${richHtml(t.a)}</b></div>`;
        else {
          body = `<div class="q">${richHtml(t.q)}</div>`;
          if (t.table) body += tableHtml(sol && t.aTable ? t.aTable : t.table, sol);
        }
        if (sol && mode === "steps" && t.steps && t.steps.length) {
          body += `<div class="steps red">${t.steps.map(s => `<div>${richHtml(s)}</div>`).join("")}</div>`;
        }

        if (!sol && opts.workLines) body += `<div class="work" style="--lines:${opts.workLines}"></div>`;
        h += `<li data-task="${pi}.${ti}"><span class="lab">${lab}</span><div class="tb">${body}</div>` +
          (opts.interactive ? `<button type="button" class="reroll" data-reroll="${pi}.${ti}" title="Diese Aufgabe neu würfeln" aria-label="Aufgabe ${p.label} ${lab} neu würfeln">${DICE}</button>` : "") + `</li>`;
      });
      h += `</ol></section>`;
    });

  const DICE = `<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8.5" cy="8.5" r="1.6" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg>`;

// ---- src/types/m7-bruchdivision.js ----
// M7 LB 2: Division durch einen Bruch (Bruch : Bruch). Referenz-Aufgabentyp.
(function (AG) {
  const { Frac, num, rich, MINUS } = AG;

  // zufälliger echter Bruch mit Nenner aus dens, nicht ganzzahlig
  function properFrac(rng, dens) {
    const d = rng.pick(dens);
    let n = rng.int(1, d - 1);
    return new Frac(n, d);
  }

  AG.registerType({
    id: "m7-bruchdivision",
    klasse: "7",
    zug: "M",
    lb: "2",
    lbTitle: "Rationale Zahlen – Rechenregeln",
    title: "Durch Brüche dividieren",
    instruction: {
      1: "Berechne. Kürze das Ergebnis vollständig.",
      2: "Berechne. Gib das Ergebnis als gemischte Zahl an.",
      3: "Berechne. Achte auf die Vorzeichen.",
    },
    merke: [
      "Man dividiert durch einen Bruch, indem man mit seinem ", { b: "Kehrwert" }, " multipliziert: ",
      { f: [3, 4] }, " : ", { f: [2, 5] }, " = ", { f: [3, 4] }, " · ", { f: [5, 2] }, " = ", { f: [15, 8] }, " = ", { f: [7, 8], w: 1 },
      ". Gemischte Zahlen vorher in unechte Brüche umwandeln.",
    ],
    cols: 3,
    generate(rng, level) {
      let a, b;
      for (let i = 0; i < 200; i++) {
        if (level === 1) {
          a = properFrac(rng, [2, 3, 4, 5, 6, 8, 9, 10]);
          b = properFrac(rng, [2, 3, 4, 5, 6, 8, 9, 10]);
        } else if (level === 2) {
          a = properFrac(rng, [2, 3, 4, 5, 6, 8]);
          b = properFrac(rng, [2, 3, 4, 5, 6, 8]);
          // eine der Zahlen gemischt oder ganz
          if (rng.chance(0.5)) a = a.add(rng.int(1, 3));
          else b = b.add(rng.int(1, 2));
          if (rng.chance(0.25)) a = new Frac(rng.int(2, 9));
        } else {
          a = properFrac(rng, [2, 3, 4, 5, 6, 8, 12]).add(rng.int(0, 3));
          b = properFrac(rng, [2, 3, 4, 5, 6, 8, 12]).add(rng.int(0, 2));
          if (rng.chance(0.6)) a = a.neg();
          if (rng.chance(0.6)) b = b.neg();
          if (a.sign() > 0 && b.sign() > 0) b = b.neg();
        }
        const res = a.div(b);
        // keine Trivialaufgaben: nicht gleich, Ergebnis nicht 1, Nenner nicht riesig
        if (a.eq(b) || res.abs().eq(1)) continue;
        if (res.d > (level === 1 ? 20 : 30) || Math.abs(res.n) > 120) continue;
        if (level === 1 && a.d === b.d) continue;
        break;
      }
      const res = a.div(b);
      const improper = x => num(x, { as: "improper", paren: true });
      const q = rich(num(a, { paren: false }), " : ", num(b, { paren: true }));
      const steps = [];
      const aImp = !a.isInt() && Math.abs(a.n) > a.d, bImp = !b.isInt() && Math.abs(b.n) > b.d;
      if (aImp || bImp) {
        steps.push(rich("= ", num(a, { as: "improper" }), " : ", improper(b)));
      }
      steps.push(rich("= ", num(a, { as: "improper" }), " · ", improper(b.inv())));
      const raw = new Frac(a.n * b.d, a.d * b.n); // vor dem Kürzen
      const rawN = a.n * b.d, rawD = a.d * b.n;
      if (Math.abs(rawN) !== Math.abs(raw.n) || Math.abs(rawD) !== raw.d) {
        const sign = Math.sign(rawN) * Math.sign(rawD) < 0 ? MINUS : "";
        steps.push(rich("= ", sign, { f: [Math.abs(rawN), Math.abs(rawD)] }));
      }
      steps.push(rich("= ", num(res, { as: "improper" })));
      if (!res.isInt() && Math.abs(res.n) > res.d) steps.push(rich("= ", num(res)));
      return { q, a: num(res), steps };
    },
  });
})(typeof AG !== "undefined" ? AG : (globalThis.AG = {}));

</script>

// ---- src/types/m7-geometrie-rechnen.js ----
// M7 LB 3: Winkelsumme im Dreieck und Maßstab (Karte – Wirklichkeit).
(function (AG) {
  const { Frac, num, rich, plain, fmtDec, fmtInt } = AG;

  const LB3 = "Geometrische Figuren, Körper und Lagebeziehungen";

  // ---------- 4. Winkelsumme im Dreieck ----------
  AG.registerType({
    id: "m7-winkelsumme",
    klasse: "7",
    zug: "M",
    lb: "3",
    lbTitle: LB3,
    title: "Winkelsumme im Dreieck",
    instruction: {
      1: "Berechne den fehlenden Winkel im Dreieck.",
      2: "Berechne den fehlenden Winkel. Achte auf die besondere Form des Dreiecks.",
      3: "Berechne die Winkel. Stelle zuerst eine Gleichung auf.",
    },
    merke: [
      "Im Dreieck beträgt die Winkelsumme 180°: α + β + γ = 180°. Beispiel: α = 52°, β = 67° → γ = 180° − 52° − 67° = 61°.",
    ],
    cols: 2,
    generate(rng, level) {
      let al, be, ga, q, a, steps, exp;

      if (level === 1) {
        for (;;) {
          al = rng.int(15, 120);
          be = rng.int(15, 120);
          if (al + be <= 165) break;
        }
        ga = 180 - al - be;
        q = rich(`Im Dreieck ABC gilt α = ${al}° und β = ${be}°. Berechne γ.`);
        steps = [rich(`γ = 180° − α − β = 180° − ${al}° − ${be}° = ${ga}°`)];
        a = rich(`γ = ${ga}°`);
        exp = [ga];
      } else if (level === 2) {
        const v = rng.int(0, 3);
        if (v === 0) {
          // rechtwinklig: γ = 90°, α gegeben
          al = rng.int(15, 80); ga = 90; be = 90 - al;
          q = rich(`Ein rechtwinkliges Dreieck hat einen rechten Winkel γ = 90°. Der Winkel α misst ${al}°. Berechne β.`);
          steps = [rich("α + β = 180° − 90° = 90°"), rich(`β = 90° − ${al}° = ${be}°`)];
          a = rich(`β = ${be}°`);
          exp = [be];
        } else if (v === 1) {
          // gleichschenklig, Basiswinkel gegeben -> Spitzenwinkel gesucht
          const b = rng.int(20, 80);
          al = b; be = b; ga = 180 - 2 * b;
          q = rich(`Ein gleichschenkliges Dreieck hat an der Basis zwei gleich große Winkel mit je ${b}°. Berechne den Winkel an der Spitze.`);
          steps = [rich(`2 · ${b}° = ${2 * b}°`), rich(`180° − ${2 * b}° = ${ga}°`)];
          a = rich(`Winkel an der Spitze = ${ga}°`);
          exp = [ga];
        } else if (v === 2) {
          // gleichschenklig, Spitzenwinkel gegeben -> Basiswinkel gesucht
          const s = 2 * rng.int(10, 70); // gerade Gradzahl, damit der Basiswinkel ganz ist
          ga = s; al = (180 - s) / 2; be = al;
          q = rich(`Ein gleichschenkliges Dreieck hat an der Spitze einen Winkel von ${s}°. Berechne einen Basiswinkel.`);
          steps = [rich(`180° − ${s}° = ${180 - s}°`), rich(`${180 - s}° : 2 = ${al}°`)];
          a = rich(`Basiswinkel = ${al}°`);
          exp = [al];
        } else {
          // gleichseitig: alle Winkel gleich groß
          al = 60; be = 60; ga = 60;
          q = rich("Ein gleichseitiges Dreieck hat drei gleich große Winkel. Berechne den Winkel α. Hinweis: Im gleichseitigen Dreieck sind alle Winkel gleich groß.");
          steps = [rich("α = β = γ, also 3 · α = 180°"), rich("α = 180° : 3 = 60°")];
          a = rich("α = 60°");
          exp = [60];
        }
      } else {
        // Winkel als Term; ein Winkel ist ein Vielfaches oder Summe eines anderen
        if (rng.chance(0.5)) {
          // α ist k-mal so groß wie β
          const k = rng.pick([2, 3]);
          for (;;) {
            be = rng.int(10, 50); al = k * be; ga = 180 - (k + 1) * be;
            if (ga >= 10) break;
          }
          const word = k === 2 ? "doppelt so groß" : "dreimal so groß";
          q = rich(`Im Dreieck ist α ${word} wie β. Außerdem ist γ = ${ga}°. Berechne α und β.`);
          steps = [
            rich(`α + β = 180° − ${ga}° = ${180 - ga}°`),
            rich(`${k} · β + β = ${k + 1} · β = ${180 - ga}°`),
            rich(`β = ${180 - ga}° : ${k + 1} = ${be}°`),
            rich(`α = ${k} · ${be}° = ${al}°`),
          ];
        } else {
          // α ist um d größer als β
          const d = rng.int(10, 40);
          for (;;) {
            be = rng.int(10, 60); al = be + d; ga = 180 - al - be;
            if (ga >= 10 && ga <= 150) break;
          }
          q = rich(`Im Dreieck ist α um ${d}° größer als β. Außerdem ist γ = ${ga}°. Berechne α und β.`);
          steps = [
            rich(`α + β = 180° − ${ga}° = ${180 - ga}°`),
            rich(`β + ${d}° + β = ${180 - ga}°, also 2 · β = ${180 - ga - d}°`),
            rich(`β = ${180 - ga - d}° : 2 = ${be}°`),
            rich(`α = ${be}° + ${d}° = ${al}°`),
          ];
        }
        a = rich(`α = ${al}°; β = ${be}°`);
        exp = [al, be];
      }

      return { q, a, steps, check: { al, be, ga, exp } };
    },
    verify(t) {
      const k = t.check;
      if (!k) return "kein Prüfdatensatz";
      if (k.al <= 0 || k.be <= 0 || k.ga <= 0) return "Winkel nicht positiv";
      if (k.al + k.be + k.ga !== 180) return "Winkelsumme ≠ 180°";
      const s = plain(t.a);
      for (const v of k.exp) {
        // „5°“ darf nicht in „15°“ gefunden werden
        if (!new RegExp("(^|[^\\d])" + v + "°").test(s)) return `Ergebnis ${v}° fehlt in „${s}“`;
      }
      return true;
    },
  });

  // ---------- 5. Maßstab ----------
  // Niveau 1: Grundriss, Lageplan, Stadtplan (Maßstab 1 : 100 bis 1 : 10 000), Umrechnung in m
  const ORT_L1 = [
    { N: 100, ort: "Auf dem Grundriss" },
    { N: 1000, ort: "Auf dem Lageplan" },
    { N: 10000, ort: "Auf dem Stadtplan" },
  ];
  // Niveau 2: Stadtplan, Wanderkarte, Straßenkarte; Längen mit einer Nachkommastelle (Zehntel-cm)
  const ints = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => (a + i) * 10);
  const halves = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => (a + i) * 10 + 5);
  const ORT_L2 = [
    { N: 20000, ort: "Auf dem Stadtplan", cs: [...ints(1, 15), ...halves(1, 12)] },
    { N: 25000, ort: "Auf der Wanderkarte", cs: ints(1, 15) },
    { N: 50000, ort: "Auf der Wanderkarte", cs: [...ints(1, 15), ...halves(1, 8)] },
    { N: 200000, ort: "Auf der Straßenkarte", cs: [...ints(1, 12), ...halves(1, 6)] },
  ];
  const FRAGE_KM = [
    "Wie lang ist die Strecke in Wirklichkeit (in km)?",
    "Wie lang ist die Strecke in Wirklichkeit? Gib das Ergebnis in km an.",
  ];
  // Niveau 3: Bauplan bis Straßenkarte
  const ORT_L3 = [
    { N: 50, ort: "Auf dem Bauplan" },
    { N: 100, ort: "Auf dem Grundriss" },
    { N: 1000, ort: "Auf dem Lageplan" },
    { N: 10000, ort: "Auf dem Stadtplan" },
    { N: 20000, ort: "Auf dem Stadtplan" },
    { N: 25000, ort: "Auf der Wanderkarte" },
    { N: 50000, ort: "Auf der Wanderkarte" },
    { N: 200000, ort: "Auf der Straßenkarte" },
  ];

  AG.registerType({
    id: "m7-masstab",
    klasse: "7",
    zug: "M",
    lb: "3",
    lbTitle: LB3,
    title: "Maßstab",
    instruction: {
      1: "Rechne zwischen Karte und Wirklichkeit um. Gib das Ergebnis in der angegebenen Einheit an.",
      2: "Rechne zwischen Karte und Wirklichkeit um. Achte auf die Einheiten (cm, m, km).",
      3: "Bestimme den Maßstab. Achte auf die Einheiten und kürze sinnvoll.",
    },
    merke: [
      "Der Maßstab 1 : N bedeutet: 1 cm auf der Karte entspricht N cm in der Wirklichkeit. ",
      "Beispiel: 1 : 25 000 → 4 cm auf der Karte sind 4 · 25 000 cm = 100 000 cm = 1 km.",
    ],
    cols: 2,
    generate(rng, level) {
      let q, a, steps, check;

      if (level === 1) {
        const { N, ort } = rng.pick(ORT_L1);
        const c = new Frac(rng.int(2, 12));
        const Rm = c.mul(N).div(100); // Wirklichkeit in m, ganzzahlig
        if (rng.chance(0.5)) {
          q = rich(`${ort} ist eine Strecke ${fmtDec(c)} cm lang. Der Maßstab ist 1 : ${fmtInt(N)}. Wie lang ist die Strecke in Wirklichkeit (in m)?`);
          steps = [rich(`${fmtDec(c)} cm · ${fmtInt(N)} = ${fmtInt(c.n * N)} cm`), rich(`${fmtInt(c.n * N)} cm : 100 = ${fmtInt(Rm.n)} m`)];
          a = rich(`${fmtInt(Rm.n)} m`);
          check = { kind: "karte", c, N, div: 100, unit: "m" };
        } else {
          q = rich(`Eine Strecke ist in Wirklichkeit ${fmtInt(Rm.n)} m lang. Wie lang ist sie auf der Karte mit dem Maßstab 1 : ${fmtInt(N)} (in cm)?`);
          steps = [rich(`${fmtInt(Rm.n)} m = ${fmtInt(Rm.n * 100)} cm`), rich(`${fmtInt(Rm.n * 100)} cm : ${fmtInt(N)} = ${fmtDec(c)} cm`)];
          a = rich(`${fmtDec(c)} cm`);
          check = { kind: "wirk", c, N, real: Rm, div: 100, unit: "m" };
        }
      } else if (level === 2) {
        const grp = rng.pick(ORT_L2);
        const N = grp.N;
        const c = new Frac(rng.pick(grp.cs), 10); // Karte in cm, eine Nachkommastelle möglich
        const cN = c.mul(N);                        // Wirklichkeit in cm
        const R = cN.div(100000);                   // Wirklichkeit in km
        if (rng.chance(0.5)) {
          q = rich(`${grp.ort} ist eine Strecke ${fmtDec(c)} cm lang. Der Maßstab ist 1 : ${fmtInt(N)}. ${rng.pick(FRAGE_KM)}`);
          steps = [rich(`${fmtDec(c)} cm · ${fmtInt(N)} = ${fmtDec(cN)} cm`), rich(`${fmtDec(cN)} cm : 100 000 = ${fmtDec(R)} km`)];
          a = rich(`${fmtDec(R)} km`);
          check = { kind: "karte", c, N, div: 100000, unit: "km" };
        } else {
          q = rich(`Eine Strecke ist in Wirklichkeit ${fmtDec(R)} km lang. Wie lang ist sie auf der Karte mit dem Maßstab 1 : ${fmtInt(N)} (in cm)?`);
          steps = [rich(`${fmtDec(R)} km = ${fmtDec(cN)} cm`), rich(`${fmtDec(cN)} cm : ${fmtInt(N)} = ${fmtDec(c)} cm`)];

          const big = N >= 20000; // große Maßstäbe: Wirklichkeit in km, sonst in m
          const unit = big ? "km" : "m";
          const div = big ? 100000 : 100;
          const R = c.mul(N).div(div);    // Wirklichkeit in der gewählten Einheit
          const Rcm = R.mul(div);         // ... und in cm
          q = rich(`${ort} misst die Strecke ${fmtDec(c)} cm. In Wirklichkeit ist sie ${fmtDec(R)} ${unit} lang. Bestimme den Maßstab.`);
          steps = [rich(`${fmtDec(R)} ${unit} = ${fmtDec(Rcm)} cm`), rich(`${fmtDec(Rcm)} cm : ${fmtDec(c)} cm = ${fmtInt(N)}`)];
          a = rich(`Maßstab 1 : ${fmtInt(N)}`);
          check = { kind: "best", c, Rcm };
        } else {
          // Vergrößerungsmaßstab, z. B. 20 : 1 bei Insekten
          let R, F, I;
          for (;;) {
            R = rng.pick([10, 20, 30, 40]); // mm
            F = rng.pick([2, 5, 10, 20, 25]);
            I = (F * R) / 10; // Bildlänge in cm
            if (I <= 40) break;
          }
          q = rich(`Ein Käfer ist in Wirklichkeit ${R} mm lang. Auf einem Bild ist er ${I} cm lang. Bestimme den Vergrößerungsmaßstab.`);
          steps = [rich(`${I} cm = ${I * 10} mm`), rich(`${I * 10} mm : ${R} mm = ${F}`)];
          a = rich(`Vergrößerungsmaßstab ${F} : 1`);
          check = { kind: "verg", R, F, I };
        }
      }
