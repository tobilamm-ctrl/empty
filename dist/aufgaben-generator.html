      1: "Schreibe als Prozentsatz.",
      2: "Schreibe als gekürzten Bruch und als Dezimalzahl.",
      3: "Wandle um zwischen Bruch, Dezimalzahl und Prozentsatz.",
    },
    merke: [
      "Ein Prozent ist ein Hundertstel: ", { b: "1 % = 1/100 = 0,01" },
      ".   Beispiel: ", { f: [3, 8] }, " = 0,375 = 37,5 %",
    ],
    cols: 3,
    generate(rng, level) {
      let val, pct, q, a, steps;
      if (level === 1) {
        const m = rng.int(0, 2);
        if (m < 2) {
          // Hundertstelbruch (ungekürzt) oder einfacher Bruch
          let bruch;
          if (m === 0) {
            const n = rng.int(1, 99);
            bruch = { f: [n, 100] };
            val = new Frac(n, 100);
          } else {
            const [n, d] = rng.pick(HUND_SIMPLE);
            bruch = { f: [n, d] };
            val = new Frac(n, d);
          }
          pct = val.mul(100);
          q = rich("Schreibe als Prozentsatz: ", bruch);
          a = rich(bruch, " = ", v(val), " = ", pc(pct));
        } else {
          // Dezimalzahl → Prozent, z. B. 0,35 → 35 %
          val = new Frac(rng.int(1, 99), 100);
          pct = val.mul(100);
          q = rich("Schreibe als Prozentsatz: ", v(val));
          a = rich(num(val), " = ", v(val), " = ", pc(pct));
        }
        steps = [rich(v(val), " · 100 = ", pc(pct))];
      } else if (level === 2) {
        pct = new Frac(rng.int(1, 99), 1);
        val = pct.div(100);
        q = rich("Schreibe als gekürzten Bruch und als Dezimalzahl: ", pc(pct));
        a = rich(num(val), " = ", v(val), " = ", pc(pct));
        steps = [rich(v(pct), "/100 = ", num(val), " = ", v(val))];
      } else if (rng.chance(0.5)) {
        const d = rng.pick([8, 16, 20, 25, 40]);
        val = new Frac(rng.int(1, d - 1), d);
        pct = val.mul(100);
        q = rich("Schreibe als Dezimalzahl und als Prozentsatz: ", num(val));
        a = rich(num(val), " = ", v(val), " = ", pc(pct));
        steps = [rich(v(val), " · 100 = ", pc(pct))];
      } else {
        pct = rng.chance(0.5) ? new Frac(2 * rng.int(1, 39) + 1, 2) : new Frac(rng.int(1, 99), 1);
        val = pct.div(100);
        q = rich("Schreibe als Bruch und als Dezimalzahl: ", pc(pct));
        a = rich(num(val), " = ", v(val), " = ", pc(pct));
        steps = [rich(v(pct), "/100 = ", num(val), " = ", v(val))];
      }
      return { q, a, steps, _val: val, _pct: pct };
    },
    verify(t) {
      return ok(t._val.mul(100).eq(t._pct), "Prozentsatz ist nicht Dezimalzahl · 100");
    },
  });

  // ---------- 5. Mischungsverhältnisse ----------
  // story: Einleitung; art/noun: Artikel und Name; parts: Bestandteile (2 oder 3);
  // range: realistische Gesamtmenge in unit; kstep: Schrittweite der Teilmenge k
  const MIX = [
    { story: "Für das Schulfest mischt die Klasse Saftschorle.", art: "Die", noun: "Saftschorle",
      parts: ["Saft", "Wasser", "Sirup"], unit: "ml", ulong: "Milliliter", vessel: "einen Krug", range: [200, 1500], kstep: 10 },
    { story: "Zum Streichen des Klassenzimmers wird Farbe gemischt.", art: "Die", noun: "Farbe",
      parts: ["Weiß", "Blau", "Grün"], unit: "l", ulong: "Liter", vessel: "einen Eimer", range: [1, 20], kstep: 1 },
    { story: "Für eine Gartenmauer wird Mörtel angerührt.", art: "Der", noun: "Mörtel",
      parts: ["Sand", "Kalk", "Zement"], unit: "kg", ulong: "Kilogramm", vessel: "einen Eimer", range: [5, 60], kstep: 1 },
    { story: "Für die Pfannkuchen beim Sommerfest wird Teig gerührt.", art: "Der", noun: "Teig",
      parts: ["Mehl", "Milch"], unit: "g", ulong: "Gramm", vessel: "eine Schüssel", range: [200, 1000], kstep: 10 },
    { story: "Für den Weihnachtsmarkt wird Fruchtpunsch gekocht.", art: "Der", noun: "Fruchtpunsch",
      parts: ["Fruchtsaft", "Tee"], unit: "l", ulong: "Liter", vessel: "einen Topf", range: [2, 10], kstep: 1 },
    { story: "Für das Bastelprojekt wird Kleister angerührt.", art: "Der", noun: "Kleister",
      parts: ["Mehl", "Wasser"], unit: "g", ulong: "Gramm", vessel: "eine Schale", range: [200, 1000], kstep: 10 },
  ];

  // Teile im Dativ („besteht aus 5 Teilen Saft und 2 Teilen Wasser“)
  function ratioTxt(r, names) {
    const out = [];
    r.forEach((x, i) => {
      if (i > 0) out.push(i === r.length - 1 ? " und " : ", ");
      out.push(String(x) + " Teilen " + names[i]);
    });
    return rich(out);
  }

  AG.registerType({
    id: "m7-mischung",
    klasse: "7",
    zug: "M",
    lb: "1",
    lbTitle: "Prozentrechnung",
    title: "Mischungsverhältnisse",
    instruction: {
      1: "Löse die Aufgaben zum Mischungsverhältnis.",
      2: "Löse die Aufgaben zum Mischungsverhältnis. Rechne mit den Teilen.",
      3: "Löse die Aufgaben zum Mischungsverhältnis. Die Teile zuerst zusammenzählen.",
    },
    merke: [
      "Die Teile werden zusammengezählt. Der Anteil einer Sorte ist ",
      { b: "Teile dieser Sorte : Teile insgesamt · 100 = Prozent" },
      ".   Beispiel: 3 Teile Saft und 2 Teile Wasser → 3 : 5 · 100 = 60 % Saft",
    ],
    cols: 1,
    generate(rng, level) {
      const ctx = rng.pick(MIX);
      const n = level === 3 && ctx.parts.length === 3 && rng.chance(0.5) ? 3 : 2;
      const names = ctx.parts.slice(0, n);
      const modes = level === 1 ? ["anteil", "menge"] : ["anteil", "menge", "gesamt"];
      const mode = rng.pick(modes);
      const unit = ctx.unit;
      let r, i, S;
      for (let k = 0; k < 500; k++) {
        r = names.map(() => rng.int(2, 5));
        S = r.reduce((x, y) => x + y, 0);
        i = rng.int(0, n - 1);
        if (mode !== "anteil" || new Frac(r[i] * 100, S).isInt()) break;
      }
      // Vielfaches k so, dass die Gesamtmenge S · k im realistischen Bereich liegt
      const pickK = () => {
        const st = ctx.kstep;
        const a = Math.max(1, Math.ceil(ctx.range[0] / (S * st)));
        const b = Math.max(a, Math.floor(ctx.range[1] / (S * st)));
        return st * rng.int(a, b);
      };
      const ratio = ratioTxt(r, names);
      const intro = rich(ctx.story, " ", ctx.art, " ", ctx.noun, " besteht aus ", ratio, ". ");
      let q, a, steps, val, ans;
      if (mode === "anteil") {
        ans = new Frac(r[i] * 100, S);
        val = ans;
        q = rich(intro, "Wie viel Prozent ist ", names[i], "?");
        a = pc(ans);
        steps = [
          rich("Teile insgesamt: ", r.join(" + "), " = ", String(S)),
          rich(String(r[i]), " : ", String(S), " · 100 = ", v(ans), " %"),
        ];
      } else if (mode === "menge") {
        const k = pickK();
        const V = new Frac(S * k, 1);
        val = V;
        ans = new Frac(r[i] * k, 1);
        q = rich(intro, "Wie viel ", unit, " ", names[i], " sind in ", v(V), " ", unit, " ", ctx.noun, "?");
        a = rich(v(ans), " ", unit);
        steps = [
          rich("1 Teil = ", v(V), " : ", String(S), " = ", String(k), " ", unit),
          rich(String(r[i]), " Teile = ", String(r[i]), " · ", String(k), " = ", v(ans), " ", unit),
        ];
      } else {
        const k = pickK();
        const amt = new Frac(r[i] * k, 1);
        val = amt;
        ans = new Frac(S * k, 1);
        q = rich(intro, "Für ", ctx.vessel, " ", ctx.noun, " nimmt Max ", v(amt), " ", unit, " ", names[i],
          ". Wie viel ", ctx.ulong, " ", ctx.noun, " erhält er insgesamt?");
        a = rich(v(ans), " ", unit);
        steps = [
          rich("1 Teil = ", v(amt), " : ", String(r[i]), " = ", String(k), " ", unit),
          rich("Insgesamt: ", String(S), " Teile = ", String(S), " · ", String(k), " = ", v(ans), " ", unit),
        ];
      }
      return { q, a, steps, _r: r, _i: i, _mode: mode, _val: val, _ans: ans };
    },
    verify(t) {
      const S = t._r.reduce((x, y) => x + y, 0);
      const ri = t._r[t._i];
      let e;
      if (t._mode === "anteil") e = new Frac(ri * 100, S);
      else if (t._mode === "menge") e = t._val.mul(ri).div(S);
      else e = t._val.mul(S).div(ri);
      return ok(e.eq(t._ans), "Mischungsergebnis falsch");
    },
  });

  // ---------- 6. Prozentsatz als Faktor ----------
  AG.registerType({
    id: "m7-prozentfaktor",
    klasse: "7",
    zug: "M",
    lb: "1",
    lbTitle: "Prozentrechnung",
    title: "Prozentsatz als Faktor",
    instruction: {
      1: "Schreibe den Prozentsatz als Faktor und berechne damit.",
      2: "Schreibe den Prozentsatz als Faktor und berechne damit.",
      3: "Schreibe den Prozentsatz als Faktor und berechne damit. Achte auf Faktoren über 1.",
    },
    merke: [
      "Ein Prozentsatz wird als Faktor geschrieben, indem man durch 100 teilt: ",
      { b: "p % = p : 100" },
      ".   Beispiel: 35 % = 0,35.  0,35 · 240 kg = 84 kg",
    ],
    cols: 2,
    generate(rng, level) {
      const list = level === 3 && rng.chance(0.3) ? CTX_ALL : CTX_PLAIN;
      const { c, p, G, P } = pickCase(rng, level, list);
      const fac = p.div(100);
      const q = rich("Schreibe ", pc(p), " als Faktor und berechne ", pc(p), " von ", D(c, G), ".");
      const a = rich(v(fac), " · ", Q(c, G), " = ", Q(c, P));
      const steps = [rich(v(p), " % = ", v(p), " : 100 = ", v(fac))];
      return { q, a, steps, _G: G, _p: p, _P: P, _fac: fac };
    },
    verify(t) {
      return ok(t._fac.eq(t._p.div(100)) && t._P.eq(t._G.mul(t._fac)), "Faktor oder Ergebnis falsch");
    },
  });
})(typeof AG !== "undefined" ? AG : (globalThis.AG = {}));

</script>
<script>
// ---- src/types/m7-rationale-zahlen.js ----
// M7 LB 2: Rationale Zahlen – Rechenregeln. Vier Aufgabentypen:
// Addieren/Subtrahieren, Multiplizieren/Dividieren, Punkt vor Strich und Klammern, Vorteilhaft rechnen.
(function (AG) {
  const { Frac, num, rich, MINUS } = AG;

  const LB = { klasse: "7", zug: "M", lb: "2", lbTitle: "Rationale Zahlen – Rechenregeln" };
  const OPTXT = { "+": " + ", "-": " " + MINUS + " ", "*": " · ", "/": " : " };
  const PREC = { "+": 1, "-": 1, "*": 2, "/": 2 };
  const APPLY = {
    "+": (a, b) => a.add(b),
    "-": (a, b) => a.sub(b),
    "*": (a, b) => a.mul(b),
    "/": (a, b) => a.div(b),
  };
  const DENS = [2, 3, 4, 5, 6, 8, 10, 12];
  const DENS6 = [2, 3, 4, 5, 6];
  const PAIRS_INT = [[4, 25], [5, 2], [2, 50], [20, 5], [8, 125], [25, 40], [50, 4]];
  const PAIRS_DEC = [
    [new Frac(5, 10), 2], [new Frac(2, 10), 5], [new Frac(25, 100), 4], [new Frac(25, 10), 4],
    [new Frac(125, 100), 8], [new Frac(4, 10), 25], [new Frac(5, 10), 20],
  ];

  // ---------- Zufallswerte ----------
  const sgn = rng => (rng.chance(0.5) ? -1 : 1);

  // Dezimalzahl mit k Nachkommastellen, nie ganzzahlig
  function decVal(rng, maxInt, k) {
    const ip = rng.int(0, maxInt);
    const fp = rng.int(1, 10 ** k - 1);
    const v = new Frac(ip * 10 ** k + fp, 10 ** k);
    return rng.chance(0.5) ? v.neg() : v;
  }

  // echter Bruch bzw. gemischte Zahl mit Vorzeichen; Nenner aus dens
  function mixedVal(rng, dens, whole) {
    const d = rng.pick(dens);
    const n = rng.int(1, d - 1);
    const v = new Frac(rng.int(0, whole) * d + n, d);
    return rng.chance(0.5) ? v.neg() : v;
  }

  // ---------- Ausdrucksbaum ----------
  // Blatt: { v: Frac }
  // Knoten: { op, l, r, br } – br: Klammer um den ganzen Knoten
  const leaf = v => ({ v: Frac.of(v) });
  const bin = (op, l, r, br = false) => ({ op, l, r, br });
  const evalTree = n => (n.v ? n.v : APPLY[n.op](evalTree(n.l), evalTree(n.r)));
  const leaves = (n, out = []) => {
    if (n.v) out.push(n.v);
    else { leaves(n.l, out); leaves(n.r, out); }
    return out;
  };
  const ser = n => (n.v ? { v: [n.v.n, n.v.d] } : { o: n.op, l: ser(n.l), r: ser(n.r) });

  // Kette von links: ((t0 op t1) op t2) ...
  function chainTree(terms) {
    let node = leaf(terms[0].v);
    for (let i = 1; i < terms.length; i++) node = bin(terms[i].op, node, leaf(terms[i].v));
    return node;
  }

  // ---------- Darstellung ----------
  // mode: "int" | "frac" (gemischt) | "dec" (Dezimalzahl) | "imp" (unechter Bruch)
  function valRich(v, mode, paren) {
    const as = mode === "dec" ? "dec" : mode === "imp" ? "improper" : undefined;
    return num(v, { paren: !!paren, as });
  }
  // Zahl am Anfang eines Ausdrucks bzw. direkt nach einer öffnenden Klammer: ohne Klammer
  const nb = (v, mode) => valRich(v, mode, false);
  // Zahl nach einem Rechenzeichen: negative Zahl in Klammern
  const nv = (v, mode) => valRich(v, mode, Frac.of(v).sign() < 0);

  function needsParens(c, p, right) {
    if (c.v || c.br) return false;
    if (PREC[c.op] < PREC[p.op]) return true;
    return PREC[c.op] === PREC[p.op] && right && (p.op === "-" || p.op === "/");
  }

  // lead: die Zahl steht am Anfang des Ausdrucks oder direkt nach "(" – dann ohne Klammer
  function rend(n, mode, lead = true) {
    if (n.v) return valRich(n.v, mode, !lead && n.v.sign() < 0);
    const part = (c, right) => {
      if (!c.v && !c.br && needsParens(c, n, right)) return rich("(", rend(c, mode, true), ")");
      return rend(c, mode, right ? false : lead || n.br);
    };
    const body = rich(part(n.l, false), OPTXT[n.op], part(n.r, true));
    return n.br ? rich("(", body, ")") : body;
  }

  // Ready-Knoten (beide Operanden Blätter): zuerst in Klammern, dann Punkt, dann Strich, sonst von links
  function pickNext(root) {
    const cand = [];
    (function walk(n, inBr) {
      if (n.v) return;
      const flag = inBr || n.br;
      walk(n.l, flag);
      walk(n.r, flag);
      if (n.l.v && n.r.v) cand.push({ n, flag });
    })(root, false);
    cand.sort((x, y) => Number(y.flag) - Number(x.flag) || PREC[y.n.op] - PREC[x.n.op]);
    return cand[0].n;
  }

  function replaceNode(n, target, repl) {
    if (n === target) return repl;
    if (n.v) return n;
    return { op: n.op, l: replaceNode(n.l, target, repl), r: replaceNode(n.r, target, repl), br: n.br };
  }

  // Schritt für Schritt: jede Zeile zeigt den ganzen Ausdruck nach einem Rechenschritt
  function reductionSteps(tree, mode) {
    const steps = [];
    let cur = tree;
    while (!cur.v) {
      const t = pickNext(cur);
      cur = replaceNode(cur, t, { v: APPLY[t.op](t.l.v, t.r.v) });
      steps.push(rich("= ", cur.v ? nb(cur.v, mode) : rend(cur, mode, true)));
    }
    return steps;
  }

  // ---------- Prüfungen ----------
  // Keine Trivialaufgaben, Zwischenwerte im passenden Zahlbereich, ganzzahlig bzw. endlich (höchstens 2 Nachkommastellen).
  function sane(tree, c) {
    const inMode = v =>
      v.n !== 0 && Math.abs(v.valueOf()) <= c.bound && v.d <= c.maxDen &&
      (c.mode !== "int" || v.isInt()) &&
      (c.mode !== "dec" || (v.isTerminating() && v.decimals() <= 2));
    const lv = leaves(tree);
    if (!lv.every(inMode)) return false;
    if (c.distinct) {
      const keys = lv.map(v => v.abs().toString());
      if (new Set(keys).size !== keys.length) return false;
    }
    let ok = true;
    (function walk(n) {
      if (!ok || n.v) return;
      walk(n.l);
      walk(n.r);
      if (!ok) return;
      const a = evalTree(n.l), b = evalTree(n.r);
      if (n.op === "/" && b.n === 0) { ok = false; return; } // Division durch 0
      const r = APPLY[n.op](a, b);
      if (a.abs().eq(b.abs())) ok = false; // identische Zahlen (auch a − a, a + (−a))
      if ((n.op === "*" || n.op === "/") && (a.abs().eq(1) || b.abs().eq(1))) ok = false; // ·1, :1, ·(−1)
      if (!inMode(r)) ok = false;
    })(tree);
    return ok;
  }

  // Verifikation: Ausdruck unabhängig in Gleitkommazahlen nachrechnen, Lösungsschritte prüfen
  function evalFloat(s) {
    if (s.v) return s.v[0] / s.v[1];
    const a = evalFloat(s.l), b = evalFloat(s.r);
    return s.o === "+" ? a + b : s.o === "-" ? a - b : s.o === "*" ? a * b : a / b;
  }
  function verify(task) {
    const [n, d] = task._res;
    const want = n / d;
    if (Math.abs(evalFloat(task._ops) - want) > 1e-9 * Math.max(1, Math.abs(want))) return "Rechnung weicht ab";
    if (AG.plain(task.a) !== AG.plain(valRich(new Frac(n, d), task._mode, false))) return "Ergebnis falsch dargestellt";
    const last = AG.plain(task.steps[task.steps.length - 1]);
    if (last !== "= " + AG.plain(task.a)) return "Lösungsschritte enden nicht beim Ergebnis";
    return true;
  }

  // Wrapper: Kandidat erzeugen, bis er die Prüfungen besteht
  function makeGenerate(cand) {
    return function generate(rng, level) {
      for (let i = 0; i < 500; i++) {
        const c = cand(rng, level);
        if (!c || !sane(c.tree, c)) continue;
        if (c.needNeg && !leaves(c.tree).some(v => v.sign() < 0)) continue; // mindestens eine negative Zahl
        const res = evalTree(c.tree);
        if (c.nice && !c.nice(res)) continue;
        return {
          q: rend(c.tree, c.mode, true),
          a: valRich(res, c.mode, false),
          steps: c.steps(),
          _ops: ser(c.tree),
          _res: [res.n, res.d],
          _mode: c.mode,
        };
      }
      throw new Error("Keine passende Aufgabe gefunden (Niveau " + level + ")");
    };
  }

  // ---------- Typ 1: Addieren und Subtrahieren ----------
  // Jede Zeile zeigt den ganzen restlichen Ausdruck; zwei benachbarte Glieder werden zusammengefasst.
  function addsubSteps(terms, mode) {
    const eff = terms.map((t, i) => (i === 0 ? t.v : t.op === "-" ? t.v.neg() : t.v));
    const line = list => rich("= ", list.map((v, i) =>
      (i === 0 ? nb(v, mode) : [v.sign() < 0 ? " " + MINUS + " " : " + ", nb(v.abs(), mode)])));
    const steps = [];
    // Vorzeichenregel: Klammern auflösen
    if (terms.some((t, i) => i > 0 && t.v.sign() < 0)) steps.push(line(eff));
    // Brüche: zuerst gleichnamig machen (Nenner des Hauptnenners, nicht gekürzt)
    if (mode === "frac") {
      const D = eff.reduce((acc, v) => AG.lcm(acc, v.d), 1);
      steps.push(rich("= ", eff.map((v, i) => {
        const k = v.n * (D / v.d);
        const mag = { f: [Math.abs(k), D] };
        if (i === 0) return k < 0 ? { f: [-k, D], s: -1 } : mag;
        return [k < 0 ? " " + MINUS + " " : " + ", mag];
      })));
    }
    let cur = eff.slice();
    while (cur.length > 1) {
      cur = [cur[0].add(cur[1]), ...cur.slice(2)];
      steps.push(line(cur));
    }
    return steps;
  }

  function addsubCand(rng, level) {
    const mode = level === 1 ? "int" : level === 2 ? "dec" : rng.pick(["frac", "frac", "int"]);
    let n;
    if (level === 1) n = 2;
    else if (level === 2) n = rng.pick([2, 3]);
    else n = mode === "int" ? 4 : rng.pick([2, 3]); // lange Kette mit 4 Zahlen oder Brüche
    const terms = [];
    for (let i = 0; i < n; i++) {
      const v = mode === "int" ? new Frac(rng.signedInt(1, level === 1 ? 50 : 40))
        : mode === "dec" ? decVal(rng, 19, rng.pick([1, 2]))
          : mixedVal(rng, DENS, 3);
      terms.push({ op: i === 0 ? null : rng.pick(["+", "-"]), v });
    }
    if ((level === 1 || level === 3) && !terms.some(t => t.v.sign() < 0)) return null; // mindestens eine negative Zahl
    if (mode === "frac" && new Set(terms.map(t => t.v.d)).size < 2) return null; // ungleichnamig
    return {
      tree: chainTree(terms), mode, bound: 200, maxDen: 400, distinct: true,
      steps: () => addsubSteps(terms, mode),
    };
  }

  // ---------- Typ 2: Multiplizieren und Dividieren ----------
  function muldivSteps(terms, mode) {
    const m2 = mode === "frac" ? "imp" : mode;
    let r = terms[0].v;
    const abs = [nb(terms[0].v.abs(), m2)];
    for (let i = 1; i < terms.length; i++) {
      r = APPLY[terms[i].op](r, terms[i].v);
      abs.push(OPTXT[terms[i].op], nb(terms[i].v.abs(), m2));
    }
    const negs = terms.filter(t => t.v.sign() < 0).length;
    const word = negs === 0 ? "kein negativer Faktor" : negs === 1 ? "1 negativer Faktor" : negs + " negative Faktoren";
    return [
      rich(`Vorzeichen: ${word} → ${r.sign() < 0 ? "negativ" : "positiv"}`),
      rich(abs, " = ", nb(r.abs(), mode)),
      rich("= ", nb(r, mode)),
    ];
  }

  function muldivCand(rng, level) {
    const mode = level === 1 ? "int" : level === 2 ? "dec" : "frac";
    let terms;
    if (level === 1) {
      // Einmaleins; Division geht auf
      const x = rng.signedInt(2, 10), y = rng.signedInt(2, 12);
      terms = rng.chance(0.5)
        ? [{ op: null, v: new Frac(x) }, { op: "*", v: new Frac(y) }]
        : [{ op: null, v: new Frac(x * y) }, { op: "/", v: new Frac(x) }];
    } else if (level === 2) {
      // ein Faktor mit einer Nachkommastelle, der andere einstellig oder mit einer Nachkommastelle
      terms = [
        { op: null, v: decVal(rng, 9, 1) },
        { op: rng.pick(["*", "/"]), v: rng.chance(0.5) ? new Frac(rng.signedInt(2, 9)) : decVal(rng, 9, 1) },
      ];
    } else {
      const n = rng.pick([2, 3]);
      terms = [];
      for (let i = 0; i < n; i++) {
        const v = mixedVal(rng, DENS, 2);
        terms.push({ op: i === 0 ? null : rng.pick(["*", "/"]), v });
      }
    }
    return {
      tree: chainTree(terms), mode, bound: 200, maxDen: 400, distinct: true,
      steps: () => muldivSteps(terms, mode),
    };
  }

  // ---------- Typ 3: Punkt vor Strich und Klammern ----------
  function verbCand(rng, level) {
    let tree, mode, maxDen = 400, nice = null;
    if (level === 1) {
      // 3 ganze Zahlen: ein Punkt- und ein Strichrechenzeichen
      mode = "int";
      const opP = rng.pick(["*", "/"]);
      let P;
      if (opP === "*") {
        P = bin("*", leaf(rng.signedInt(2, 12)), leaf(rng.signedInt(2, 12)));
      } else {
        const x = rng.signedInt(2, 12), y = rng.signedInt(2, 12);
        P = bin("/", leaf(x * y), leaf(x));
      }
      const S = leaf(rng.signedInt(2, 50));
      const opS = rng.pick(["+", "-"]);
      tree = rng.chance(0.5) ? bin(opS, P, S) : bin(opS, S, P);
    } else if (level === 2) {
      // 4 ganze Zahlen mit einer Klammer: x · (y − z) + w
      mode = "int";
      const B = bin(rng.pick(["+", "-"]), leaf(rng.signedInt(2, 12)), leaf(rng.signedInt(2, 12)), true);
      const x = leaf(rng.signedInt(2, 12));
      const M = bin(rng.pick(["*", "/"]), x, B);
      const Mn = rng.chance(0.5) ? M : bin(M.op, B, x);
      const w = leaf(rng.signedInt(2, 20));
      tree = rng.chance(0.5) ? bin(rng.pick(["+", "-"]), Mn, w) : bin(rng.pick(["+", "-"]), w, Mn);
    } else {
      // höchstens 5 Zahlen, eine Klammer in einer Klammer; Dezimalzahlen mit einer Stelle oder Brüche (Nenner bis 6)
      mode = rng.chance(0.5) ? "dec" : "frac";
      const val = () => (mode === "dec" ? decVal(rng, 9, 1) : mixedVal(rng, DENS6, 1));
      const B2 = bin(rng.pick(["+", "-", "*", "/"]), leaf(val()), leaf(val()), true);
      const B1 = bin(rng.pick(["+", "-", "*", "/"]), leaf(val()), B2, true);
      const opM = rng.pick(["*", "/"]);
      const Mn = rng.chance(0.5) ? bin(opM, leaf(val()), B1) : bin(opM, B1, leaf(val()));
      const opT = rng.pick(["+", "-"]);
      tree = rng.chance(0.5) ? bin(opT, Mn, leaf(val())) : bin(opT, leaf(val()), Mn);
      // schönes Ergebnis: ganzzahlig, eine Nachkommastelle oder einfacher Bruch
      nice = res => res.isInt() || (mode === "dec" && res.decimals() <= 1) || (mode === "frac" && res.d <= 6);
    }
    return {
      tree, mode, bound: 300, maxDen, distinct: true, nice,
      steps: () => reductionSteps(tree, mode),
    };
  }

  // ---------- Typ 4: Vorteilhaft rechnen ----------
  // (p op q) op c mit p und q zusammen als runde Zahl; Zeilen zeigen das Rechengesetz.
  function regroup3(rng, p, q, c, op, mode) {
    const order = rng.pick([[p, c, q], [c, p, q], [p, q, c]]);
    const tree = bin(op, bin(op, leaf(order[0]), leaf(order[1])), leaf(order[2]));
    const steps = [];
    if (order[0] !== p || order[1] !== q) {
      steps.push(rich("= ", nb(p, mode), OPTXT[op], nv(q, mode), OPTXT[op], nv(c, mode)));
    }
    steps.push(rich("= (", nb(p, mode), OPTXT[op], nv(q, mode), ")", OPTXT[op], nv(c, mode)));
    const mid = APPLY[op](p, q);
    steps.push(rich("= ", nb(mid, mode), OPTXT[op], nv(c, mode)));
    steps.push(rich("= ", nb(APPLY[op](mid, c), mode)));
    return { tree, mode, steps };
  }

  function vorKind(rng, level) {
    const kind = rng.pick(level === 1 ? ["mul3", "dist"] : level === 2 ? ["add3d", "mul3d"] : ["add3f", "mul3f", "decomp"]);
    if (kind === "mul3") {
      const [a, b] = rng.pick(PAIRS_INT);
      const p = new Frac(a * sgn(rng)), q = new Frac(b * sgn(rng));
      return regroup3(rng, p, q, new Frac(rng.signedInt(2, 15)), "*", "int");
    }
    if (kind === "mul3d") {
      const [a, b] = rng.pick(PAIRS_DEC);
      const p = rng.chance(0.5) ? a.neg() : a;
      return regroup3(rng, p, new Frac(b * sgn(rng)), decVal(rng, 9, 1), "*", "dec");
    }
    if (kind === "mul3f") {
      const d = rng.pick(DENS);
      const p = new Frac(rng.int(1, d - 1) * sgn(rng), d);
      return regroup3(rng, p, new Frac(d * sgn(rng)), mixedVal(rng, [2, 3, 4, 5, 6, 8], 2), "*", "frac");
    }
    if (kind === "add3d") {
      const N = rng.pick([1, 2, 5, 10]);
      const p = decVal(rng, 9, 1);
      return regroup3(rng, p, Frac.of(N).sub(p), decVal(rng, 9, rng.pick([1, 2])), "+", "dec");
    }
    if (kind === "add3f") {
      const N = rng.pick([1, 2]);
      const d = rng.pick(DENS);
      const p = mixedVal(rng, [d], 1);
      return regroup3(rng, p, Frac.of(N).sub(p), mixedVal(rng, DENS.filter(x => x !== d), 2), "+", "frac");
    }
    if (kind === "dist") {
      // a · b + a · c mit b + c = N  ->  a · (b + c) = a · N
      const av = new Frac(rng.signedInt(2, 19)), bv = new Frac(rng.signedInt(2, 30));
      const N = rng.pick([10, 20, 50, 100]);
      const cv = Frac.of(N).sub(bv);
      const tree = bin("+", bin("*", leaf(av), leaf(bv)), bin("*", leaf(av), leaf(cv)));
      const steps = [
        rich("= ", nb(av, "int"), OPTXT["*"], "(", nb(bv, "int"), OPTXT["+"], nv(cv, "int"), ")"),
        rich("= ", nb(av, "int"), OPTXT["*"], nb(N, "int")),
        rich("= ", nb(av.mul(N), "int")),
      ];
      return { tree, mode: "int", steps };
    }
    // decomp: a · y mit y = sy · (N ± dd) nahe an einem Zehner/Hunderter (19, 21, 49, 51, 98, 101, 199 …)
    // -> a · (sy·N ± dd) = a · sy·N ± a · dd. Mindestens eine Zahl ist negativ.
    const av = new Frac(rng.signedInt(11, 36));
    const N = rng.pick([20, 50, 100, 200]);
    const dd = rng.pick([1, 2]);
    const s = rng.pick([-1, 1]);
    const sy = av.sign() > 0 ? -1 : rng.pick([-1, 1]);
    const yv = new Frac(sy * (N + s * dd));
    const xN = new Frac(sy * N);
    const sg = sy * s;                       // Vorzeichen des Summanden dd
    const opk = sg > 0 ? "+" : "-";
    const tree = bin("*", leaf(av), leaf(yv));
    const top = av.mul(sg * dd);             // Vorzeichen des zweiten Teilprodukts
    // bei dd = 1 steht kein „· 1“ in den Schritten
    const tail = dd === 1 ? [nv(av, "int")] : [nv(av, "int"), OPTXT["*"], nb(dd, "int")];
    const steps = [
      rich("= ", nb(av, "int"), OPTXT["*"], "(", nb(xN, "int"), OPTXT[opk], nb(dd, "int"), ")"),
      rich("= ", nb(av, "int"), OPTXT["*"], nv(xN, "int"), OPTXT[opk], tail),
      rich("= ", nb(av.mul(xN), "int"), OPTXT[top.sign() < 0 ? "-" : "+"], nb(top.abs(), "int")),
      rich("= ", nb(av.mul(yv), "int")),
    ];
    return { tree, mode: "int", steps, needNeg: true };
  }

  function vorCand(rng, level) {
    const c = vorKind(rng, level);
    return {
      tree: c.tree, mode: c.mode, bound: 20000, maxDen: 1000,
      needNeg: level === 3 || c.needNeg, steps: () => c.steps,
    };
  }

  // ---------- Registrierung ----------
  AG.registerType({
    id: "m7-q-addsub",
    ...LB,
    title: "Addieren und Subtrahieren",
    instruction: {
      1: "Berechne. Achte auf die Vorzeichen.",
      2: "Berechne. Achte auf das Dezimalkomma.",
      3: "Berechne. Kürze Brüche vollständig.",
    },
    merke: [
      { b: "Vorzeichenregel: " },
      `Steht vor einer Klammer ein Minus, wird das Vorzeichen in der Klammer umgekehrt: 8 ${MINUS} (${MINUS}15) = 8 + 15. Beispiel: (${MINUS}12) + 7 = ${MINUS}5.`,
    ],
    cols: 3,
    generate: makeGenerate(addsubCand),
    verify,
  });

  AG.registerType({
    id: "m7-q-muldiv",
    ...LB,
    title: "Multiplizieren und Dividieren",
    instruction: {
      1: "Berechne. Achte auf die Vorzeichen.",
      2: "Berechne. Achte auf das Dezimalkomma.",
      3: "Berechne. Kürze Brüche vollständig.",
    },
    merke: [
      { b: "Vorzeichen zuerst: " },
      `Das Ergebnis ist positiv bei einer geraden, negativ bei einer ungeraden Anzahl negativer Zahlen. Danach die Beträge rechnen. Beispiel: (${MINUS}6) · (${MINUS}8) = 48, (${MINUS}63) : 7 = ${MINUS}9.`,
    ],
    cols: 3,
    generate: makeGenerate(muldivCand),
    verify,
  });

  AG.registerType({
    id: "m7-q-verbindung",
    ...LB,
    title: "Punkt vor Strich und Klammern",
    instruction: {
      1: "Berechne. Beachte Punkt vor Strich.",
      2: "Berechne. Rechne zuerst in der Klammer.",
      3: "Berechne Schritt für Schritt nach den Rechenregeln.",
    },
    merke: [
      { b: "Reihenfolge: " },
      `Zuerst Klammern, dann Punktrechnung (· und :), zuletzt Strichrechnung (+ und ${MINUS}). Beispiel: 2 + 3 · (${MINUS}4) = 2 + (${MINUS}12) = ${MINUS}10.`,
    ],
    cols: 2,
    generate: makeGenerate(verbCand),
    verify,
  });

  AG.registerType({
    id: "m7-q-vorteilhaft",
    ...LB,
    title: "Vorteilhaft rechnen",
    instruction: {
      1: "Berechne vorteilhaft. Nutze die Rechengesetze.",
      2: "Berechne vorteilhaft. Fasse passende Zahlen zusammen.",
      3: "Berechne vorteilhaft. Achte auf die Vorzeichen.",
    },
    merke: [
      { b: "Rechengesetze: " },
      "Kommutativgesetz: Zahlen dürfen umsortiert werden. Assoziativgesetz: Klammern dürfen anders gesetzt werden. Distributivgesetz: a · b + a · c = a · (b + c). Beispiel: 25 · 17 · 4 = 25 · 4 · 17 = 100 · 17 = 1700.",
    ],
    cols: 2,
    generate: makeGenerate(vorCand),
    verify,
  });
})(typeof AG !== "undefined" ? AG : (globalThis.AG = {}));

<script>
// ---- src/types/m7-statistik.js ----
// M7 LB 6: Diagramme und statistische Kennwerte – Mittelwert, Spannweite, Zentralwert.
(function (AG) {
  const { Frac, num, rich, plain, fmtDec, MINUS } = AG;

  // Datenkontexte. Werte sind ganze Zahlen in Einheiten von 1/den; mean in Zehnteln.
  // pool: gewichtete Auswahl (Noten 5 und 6 sind selten).
  const NOTEN_POOL = [1, 1, 2, 2, 2, 3, 3, 3, 4, 4, 5, 6];
  const CTX = [
    {
      intro: n => `Die Noten von ${n} Schülerinnen und Schülern im letzten Mathetest:`,
      unit: "", den: { 1: 1, 2: 1 }, dig: { 1: 0, 2: 0 },
      range: { 1: [1, 6], 2: [1, 6] }, mean: { 1: [20, 50], 2: [20, 50] },
      pool: NOTEN_POOL,
    },
    {
      intro: n => `Die erreichten Punkte von ${n} Schülerinnen und Schülern bei einem Quiz:`,
      unit: " Punkte", den: { 1: 1, 2: 1 }, dig: { 1: 0, 2: 0 },
      range: { 1: [6, 30], 2: [6, 30] }, mean: { 1: [120, 240], 2: [120, 240] },
    },
    {
      // Winter: −10 bis 8 °C, Ausreißer höchstens ca. 10 Grad daneben
      intro: n => `Die Tageshöchsttemperaturen im Januar an ${n} Tagen in °C:`,
      unit: " °C", den: { 1: 1, 2: 1, 3: 10 }, dig: { 1: 0, 2: 0, 3: 1 },
      range: { 1: [-10, 8], 2: [-10, 8], 3: [-100, 80] },
      mean: { 1: [-40, 40], 2: [-40, 40], 3: [-30, 30] },
      out: { 3: [[-200, -180], [120, 150]] },
    },
    {
      // Sommer: 18 bis 35 °C, Ausreißer höchstens ca. 10 Grad daneben
      intro: n => `Die Tageshöchsttemperaturen im Juli an ${n} Tagen in °C:`,
      unit: " °C", den: { 1: 1, 2: 1, 3: 10 }, dig: { 1: 0, 2: 0, 3: 1 },
      range: { 1: [18, 35], 2: [18, 35], 3: [180, 350] },
      mean: { 1: [200, 300], 2: [200, 300], 3: [220, 300] },
      out: { 3: [[90, 110]] },
    },
    {
      // Weitsprung Klasse 7: 2,80 bis 5,20 m; Ausreißer 1,90 m oder 5,90 m
      intro: n => `Die Weiten von ${n} Schülerinnen und Schülern im Weitsprung in m:`,
      unit: " m", den: { 1: 100, 2: 100, 3: 100 }, dig: { 1: 2, 2: 2, 3: 2 },
      range: { 1: [280, 520], 2: [280, 520], 3: [280, 520] },
      mean: { 1: [30, 45], 2: [30, 45], 3: [35, 45] },
      out: { 3: [[190, 190], [590, 590]] },
    },
  ];

  const ASK = {
    1: "Bestimme Mittelwert und Spannweite.",
    2: "Bestimme Mittelwert, Spannweite und Zentralwert.",
    3: "Bestimme Mittelwert, Spannweite und Zentralwert. Welcher Kennwert beschreibt die Daten hier besser? Begründe.",
  };

  // Datenreihe erzeugen. Der letzte Wert wird so gewählt, dass der Mittelwert genau M ist
  // (Niveau 1: ganzzahlig, Niveau 2/3: eine Nachkommastelle).
  function makeData(rng, c, n, level) {
    const den = c.den[level];
    const [lo, hi] = c.range[level];
    const [mlo, mhi] = c.mean[level];
    const low = new Frac(lo, den), high = new Frac(hi, den);
    const draw = () => (c.pool ? new Frac(rng.pick(c.pool), den) : new Frac(rng.int(lo, hi), den));
    for (let tries = 0; tries < 500; tries++) {
      let outlier = null;
      if (c.out && c.out[level]) {
        const [a, b] = rng.pick(c.out[level]);
        outlier = new Frac(rng.int(a, b), den);
      }
      const vals = [];
      const normal = n - 1 - (outlier ? 1 : 0);
      for (let i = 0; i < normal; i++) vals.push(draw());
      if (outlier) vals.push(outlier);
      const sum = vals.reduce((s, v) => s.add(v), new Frac(0));
      const cands = [];
      for (let t10 = mlo; t10 <= mhi; t10++) {
        if (level === 1 && t10 % 10 !== 0) continue;
        const last = new Frac(t10, 10).mul(n).sub(sum);
        if (last.cmp(low) < 0 || last.cmp(high) > 0) continue;
        if (!last.mul(den).isInt()) continue;
        cands.push(last);
      }
      if (!cands.length) continue;
      const data = [...vals, rng.pick(cands)];
      const mn = data.reduce((a, b) => (a.cmp(b) <= 0 ? a : b));
      const mx = data.reduce((a, b) => (a.cmp(b) >= 0 ? a : b));
      if (mx.sub(mn).sign() === 0) continue; // keine konstante Reihe
      return { data, outlier };
    }
    throw new Error("makeData: keine Datenreihe für Niveau " + level);
  }

  AG.registerType({
    id: "m7-kennwerte",
    klasse: "7",
    zug: "M",
    lb: "6",
    lbTitle: "Diagramme und statistische Kennwerte",
    title: "Mittelwert, Spannweite, Zentralwert",
    instruction: {
      1: "Berechne Mittelwert und Spannweite der Datenreihe.",
      2: "Berechne die Kennwerte der Datenreihe. Ordne die Werte zuerst der Größe nach.",
      3: "Berechne die Kennwerte und beurteile, welcher Kennwert hier aussagekräftiger ist.",
    },
    merke: [
      "Mittelwert = Summe : Anzahl. Spannweite = größter Wert ", MINUS, " kleinster Wert. ",
      { b: "Zentralwert" }, " = mittlerer Wert der geordneten Reihe; bei gerader Anzahl das Mittel der beiden mittleren Werte. ",
      "Beispiel: 2; 3; 3; 7 → Zentralwert (3 + 3) : 2 = 3.",
    ],
    cols: 1,
    generate(rng, level) {
      const pool = CTX.filter(x => x.range[level]);
      const c = rng.pick(pool);
      const n = level === 1 ? 5 : level === 2 ? rng.int(6, 8) : rng.int(8, 10);
      const { data, outlier } = makeData(rng, c, n, level);
      const dig = c.dig[level];
      const fx = x => fmtDec(x, dig);
      const px = x => (x.sign() < 0 ? "(" + fx(x) + ")" : fx(x)); // negative Werte in Klammern im Rechenschritt

      const sorted = [...data].sort((a, b) => a.cmp(b));
      const sum = data.reduce((s, v) => s.add(v), new Frac(0));
      const mean = sum.div(n);
      const range = sorted[n - 1].sub(sorted[0]);
      const med = n % 2 ? sorted[(n - 1) / 2] : sorted[n / 2 - 1].add(sorted[n / 2]).div(2);

      const list = rng.shuffle(data).map(fx).join("; ");
      const q = rich(c.intro(n), " ", list, ". ", ASK[level]);

      const steps = [rich("geordnet: ", sorted.map(fx).join("; "))];
      steps.push(rich("Summe: ", num(sum, { as: "dec" }), " : ", String(n), " = ", num(mean, { as: "dec" })));
      steps.push(rich("Spannweite: größter − kleinster Wert = ", px(sorted[n - 1]), " ", MINUS, " ", px(sorted[0]), " = ", num(range, { as: "dec" })));
      if (level >= 2) {
        if (n % 2) steps.push(rich("Zentralwert: der mittlere Wert ist ", fx(med)));
        else steps.push(rich("Zentralwert: (", px(sorted[n / 2 - 1]), " + ", px(sorted[n / 2]), ") : 2 = ", num(med, { as: "dec" })));
      }

      const U = c.unit;
      let a = rich(
        "Mittelwert ", num(mean, { as: "dec" }), U,
        "; Spannweite ", num(range, { as: "dec" }), U,
      );
      if (level >= 2) a = rich(a, "; Zentralwert ", num(med, { as: "dec" }), U);
      if (level === 3) {
        const up = outlier.cmp(mean) > 0;
        a = rich(
          a,
          `. Der Zentralwert ist aussagekräftiger, denn der Ausreißer ${fx(outlier)}${U} zieht den Mittelwert ${up ? "nach oben" : "nach unten"}.`,
        );
      }

      return { q, a, steps, check: { c, data, level, n, outlier } };
    },
    verify(t, level) {
      const k = t.check;
      if (!k) return "kein Prüfdatensatz";
      // alles noch einmal aus den Rohdaten berechnen
      const d = [...k.data].sort((x, y) => x.cmp(y));
      const n = d.length;
      const mean = d.reduce((s, v) => s.add(v), new Frac(0)).div(n);
      const range = d[n - 1].sub(d[0]);
      const med = n % 2 ? d[(n - 1) / 2] : d[n / 2 - 1].add(d[n / 2]).div(2);
      const U = k.c.unit;
      const f = x => plain(num(x, { as: "dec" }));
      let base = `Mittelwert ${f(mean)}${U}; Spannweite ${f(range)}${U}`;
      if (level >= 2) base += `; Zentralwert ${f(med)}${U}`;
      const s = plain(t.a);
      if (!s.startsWith(base)) return `erwartet „${base}…“, steht „${s}“`;
      if (level === 1 && !mean.isInt()) return "Mittelwert nicht ganzzahlig";
      if (level === 2 && !mean.mul(10).isInt()) return "Mittelwert mit mehr als einer Nachkommastelle";
      if (level === 3) {
        if (!s.includes("Zentralwert ist aussagekräftiger")) return "Antwort zur Aussagekraft fehlt";
        if (!s.includes(`Ausreißer ${plain(fmtDec(k.outlier, k.c.dig[3]))}${U}`)) return "Ausreißer wird nicht konkret genannt";
      }
      return true;
    },
  });
})(typeof AG !== "undefined" ? AG : (globalThis.AG = {}));

</script>
<script>
// ---- src/ui/app.js ----
// Bedienoberfläche: Bauplan links, Vorschau rechts, Word-Download.
(function (AG) {
  const $ = id => document.getElementById(id);
  const KLASSEN = ["5", "6", "7", "8", "9", "10"];
  const NIVEAU_LEVELS = { 1: [1, 1, 2, 2], 2: [1, 2, 3, 3], 3: [2, 3, 3, 3] };
  const STORE_KEY = "aufgaben-generator-v1";

  const state = {
    klasse: "7", zug: "M", thema: null, niveau: 2, parts: [],
    title: "", titleCustom: false, merke: true, work: 1, solmode: "steps",
    groupB: false, seed: randomSeed(), rerolls: {}, view: "A",
  };

  function randomSeed() { return 1000 + Math.floor(Math.random() * 9000); }
  function typesFor(k, z) { return AG.TYPES.filter(t => t.klasse === k && (t.zug === z || t.zug === "RM")); }
  function themesFor(k, z) {
    const map = new Map();
    for (const t of typesFor(k, z)) if (!map.has(t.lb)) map.set(t.lb, t.lbTitle);
    return [...map.entries()].sort((a, b) => Number(a[0]) - Number(b[0]));
  }
  function defaultCount(type) { return type.cols === 1 ? 3 : type.cols === 2 ? 6 : 9; }

  // Thema gewählt -> Teile A–C (bzw. so viele Typen wie vorhanden, höchstens 4) vorbelegen
  function applyTheme() {
    const types = typesFor(state.klasse, state.zug).filter(t => t.lb === state.thema);
    if (!types.length) { state.parts = []; return; }
    const levels = NIVEAU_LEVELS[state.niveau];
    const n = Math.min(4, Math.max(3, types.length));
    state.parts = [];
    for (let i = 0; i < n; i++) {
      const type = types.length >= n ? types[i] : types[i % types.length];
      const lv = clampLevel(type, levels[i]);
      state.parts.push({ type: type.id, level: lv, count: defaultCount(type) });
    }
    // gleiche Typen mit gleichem Niveau vermeiden
    state.rerolls = {};
    if (!state.titleCustom) state.title = types[0].lbTitle;
  }
  function clampLevel(type, lv) {
    if (type.levels.includes(lv)) return lv;
    return type.levels.reduce((best, l) => Math.abs(l - lv) < Math.abs(best - lv) ? l : best, type.levels[0]);
  }
  function applyNiveau() {
    const levels = NIVEAU_LEVELS[state.niveau];
    state.parts.forEach((p, i) => { p.level = clampLevel(AG.typeById(p.type), levels[i]); });
    state.rerolls = {};
  }

  function config() {
    return { klasse: state.klasse, zug: state.zug, seed: state.seed, parts: state.parts, rerolls: state.rerolls, title: state.title };
  }
  function meta(cfg) {
    const first = state.parts[0] && AG.typeById(state.parts[0].type);
    const lbs = [...new Set(state.parts.map(p => AG.typeById(p.type).lbTitle))];
    return {
      klasse: state.klasse, zug: state.zug, title: state.title || "Arbeitsblatt",
      subject: lbs.length === 1 ? lbs[0] : "Gemischte Aufgaben",
      blattNr: state.seed, code: AG.encodeCode(cfg), merke: first ? first.merke : null,
    };
  }

  // ---------- Speichern ----------
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* privat/gesperrt */ }
  }
  function restore() {
    try {
      const s = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
      if (!s) return false;
      Object.assign(state, s);
      state.parts = state.parts.filter(p => AG.typeById(p.type));
      return state.parts.length > 0;
    } catch (e) { return false; }
  }

  // ---------- Bauplan zeichnen ----------
  function segButtons(el, items, current, onPick, disabledFn) {
    el.innerHTML = "";
    for (const [val, label] of items) {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = label;
      b.setAttribute("aria-pressed", String(String(val) === String(current)));
      if (disabledFn && disabledFn(val)) { b.disabled = true; b.title = "Kommt in einem späteren Ausbauschritt"; }
      b.onclick = () => onPick(val);
      el.appendChild(b);
    }
  }
  function markSeg(el, attr, current) {
    el.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset[attr] === String(current))));
  }

  function renderPlan() {
    segButtons($("klasse"), KLASSEN.map(k => [k, k]), state.klasse, k => {
      state.klasse = k; if (k === "5" || k === "6") state.zug = "R";
      state.thema = (themesFor(state.klasse, state.zug)[0] || [])[0]; state.titleCustom = false; applyTheme(); update();
    }, k => !AG.TYPES.some(t => t.klasse === k));
    const zugItems = Number(state.klasse) >= 7 ? [["R", "Regelklasse"], ["M", "M-Zug"]] : [["R", "alle"]];
    segButtons($("zug"), zugItems, state.zug, z => {
      state.zug = z; state.thema = (themesFor(state.klasse, state.zug)[0] || [])[0]; state.titleCustom = false; applyTheme(); update();
    }, z => typesFor(state.klasse, z).length === 0);

    const sel = $("thema");
    const themes = themesFor(state.klasse, state.zug);
    sel.innerHTML = themes.map(([lb, t]) => `<option value="${lb}">LB ${lb}  ${t}</option>`).join("") +
      `<option value="mix">Eigene Zusammenstellung</option>`;
    sel.value = state.thema || "mix";

    markSeg($("niveau"), "n", state.niveau);
    markSeg($("work"), "w", state.work);
    markSeg($("solmode"), "s", state.solmode);
    if (document.activeElement !== $("title")) $("title").value = state.title;
    $("merke").checked = state.merke;
    $("groupB").checked = state.groupB;
    if (document.activeElement !== $("seed")) $("seed").value = state.seed;
    renderParts();
    renderView();
  }

  function typeOptions(current) {
    const byLb = new Map();
    for (const t of typesFor(state.klasse, state.zug)) {
      if (!byLb.has(t.lb)) byLb.set(t.lb, { title: t.lbTitle, types: [] });
      byLb.get(t.lb).types.push(t);
    }
    return [...byLb.entries()].sort((a, b) => a[0] - b[0]).map(([lb, g]) =>
      `<optgroup label="LB ${lb}  ${g.title}">${g.types.map(t => `<option value="${t.id}"${t.id === current ? " selected" : ""}>${t.title}</option>`).join("")}</optgroup>`).join("");
  }

  function renderParts() {
    const box = $("parts");
    box.innerHTML = "";
    state.parts.forEach((p, i) => {
      const type = AG.typeById(p.type);
      const el = document.createElement("div");
      el.className = "part"; el.id = "part-" + i;
      el.style.setProperty("--pc", `var(--part-${i})`);
      el.innerHTML = `<div class="part-tab">${String.fromCharCode(65 + i)}</div>
        <div class="part-body">
          <select aria-label="Aufgabentyp Teil ${String.fromCharCode(65 + i)}">${typeOptions(p.type)}</select>
          <div class="part-row">
            <span class="stars" role="group" aria-label="Niveau">${[1, 2, 3].map(l => `<button type="button" data-l="${l}" ${type.levels.includes(l) ? "" : "disabled"} aria-label="${l} Stern${l > 1 ? "e" : ""}" aria-pressed="${l === p.level}">${l <= p.level ? "★" : "☆"}</button>`).join("")}</span>
            <span class="stepper"><button type="button" data-d="-1" aria-label="Weniger Aufgaben">−</button><output aria-label="Anzahl">${p.count}</output><button type="button" data-d="1" aria-label="Mehr Aufgaben">+</button></span>
            <span class="mini">Aufgaben</span>
            ${state.parts.length > 1 ? `<button type="button" class="icon-btn" data-rm aria-label="Teil entfernen" title="Teil entfernen"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>` : ""}
          </div>
        </div>`;
      el.querySelector("select").onchange = e => {
        p.type = e.target.value; const t = AG.typeById(p.type);
        p.level = clampLevel(t, p.level); p.count = defaultCount(t); p.cols = undefined;
        state.thema = derivedTheme(); clearRerolls(i); update();
      };
      el.querySelectorAll(".stars button").forEach(b => b.onclick = () => { p.level = Number(b.dataset.l); clearRerolls(i); update(); });
      el.querySelectorAll(".stepper button").forEach(b => b.onclick = () => {
        p.count = Math.max(1, Math.min(type.cols === 1 ? 8 : 18, p.count + Number(b.dataset.d))); update();
      });
      const rm = el.querySelector("[data-rm]");
      if (rm) rm.onclick = () => { state.parts.splice(i, 1); state.rerolls = {}; state.thema = derivedTheme(); update(); };
      box.appendChild(el);
    });
    $("addPart").hidden = state.parts.length >= 4;
  }
  function derivedTheme() {
    const lbs = new Set(state.parts.map(p => AG.typeById(p.type).lb));
    return lbs.size === 1 ? [...lbs][0] : null;
  }
  function clearRerolls(pi) {
    for (const k of Object.keys(state.rerolls)) if (k.split(".")[1] === String(pi)) delete state.rerolls[k];
  }

  // ---------- Vorschau ----------
  let lastSheets = null;
  function renderView() {
    markSeg($("view"), "view", state.view);
    $("view").querySelector('[data-view="B"]').hidden = !state.groupB;
    if (!state.groupB && state.view === "B") state.view = "A";
    const sheetEl = $("sheet");
    if (!state.parts.length) { sheetEl.innerHTML = `<p>Wähle links ein Thema, um ein Blatt zu erzeugen.</p>`; return; }
    try {
      const cfg = config();
      const A = AG.generateSheet(cfg, "A");
      const B = state.groupB ? AG.generateSheet(cfg, "B") : null;
      lastSheets = { A, B, cfg };
      const m = meta(cfg);
      const showSheet = state.view === "B" ? B : A;
      const mode = state.view === "answers" ? state.solmode : "worksheet";
      sheetEl.innerHTML = AG.sheetHtml(showSheet, m, mode, { merke: state.merke, workLines: state.work, interactive: mode === "worksheet" });
      sheetEl.classList.toggle("sol", mode !== "worksheet");
      $("code").value = m.code;
      $("tabs").innerHTML = showSheet.parts.map((p, i) => `<button type="button" style="--pc: var(--part-${i})" data-jump="${i}" title="Teil ${p.label}: ${p.title}">${p.label}</button>`).join("");
      const n = (B ? 2 : 1);
      $("dlInfo").textContent = `Enthält ${n === 2 ? "Gruppe A und B" : "das Arbeitsblatt"} und ${n === 2 ? "beide Lösungsblätter" : "das Lösungsblatt"} (${state.solmode === "steps" ? "mit Zwischenschritten" : "nur Ergebnisse"}).`;
    } catch (e) {
      sheetEl.innerHTML = `<div class="error-box">Das Blatt ließ sich nicht erzeugen: ${e.message}</div>`;
      console.error(e);
    }
  }

  function update() { renderPlan(); save(); }

  // ---------- Ereignisse ----------
  function wire() {
    $("thema").onchange = e => {
      if (e.target.value === "mix") { state.thema = null; update(); return; }
      state.thema = e.target.value; state.titleCustom = false; applyTheme(); update();
    };
    $("niveau").onclick = e => { const b = e.target.closest("button"); if (!b) return; state.niveau = Number(b.dataset.n); applyNiveau(); update(); };
    $("work").onclick = e => { const b = e.target.closest("button"); if (!b) return; state.work = Number(b.dataset.w); update(); };
    $("solmode").onclick = e => { const b = e.target.closest("button"); if (!b) return; state.solmode = b.dataset.s; update(); };
    $("view").onclick = e => { const b = e.target.closest("button"); if (!b) return; state.view = b.dataset.view; update(); };
    $("title").oninput = e => { state.title = e.target.value; state.titleCustom = true; renderView(); save(); };
    $("merke").onchange = e => { state.merke = e.target.checked; update(); };
    $("groupB").onchange = e => { state.groupB = e.target.checked; if (state.groupB) state.view = "B"; update(); };
    $("seed").onchange = e => {
      const v = Math.max(1, Math.min(99999, Math.round(Number(e.target.value) || 1)));
      state.seed = v; state.rerolls = {}; update();
    };
    $("newSeed").onclick = () => { state.seed = randomSeed(); state.rerolls = {}; update(); };
    $("addPart").onclick = () => {
      const last = state.parts[state.parts.length - 1];
      const t = last ? AG.typeById(last.type) : typesFor(state.klasse, state.zug)[0];
      state.parts.push({ type: t.id, level: clampLevel(t, Math.min(3, (last ? last.level : 1) + 1)), count: defaultCount(t) });
      update();
      const el = $("part-" + (state.parts.length - 1)); if (el) el.scrollIntoView({ block: "nearest" });
    };
    $("loadCode").onclick = () => {
      const msg = $("codeMsg");
      try {
        const c = AG.decodeCode($("code").value);
        Object.assign(state, { klasse: c.klasse, zug: c.zug, seed: c.seed, parts: c.parts, rerolls: c.rerolls });
        state.thema = derivedTheme();
        msg.className = "msg ok"; msg.textContent = "Blatt wiederhergestellt.";
        update();
      } catch (e) { msg.className = "msg err"; msg.textContent = e.message; }
    };
    $("sheet").onclick = e => {
      const b = e.target.closest("[data-reroll]");
      if (!b) return;
      const g = state.view === "B" ? "B" : "A";
      const key = g + "." + b.dataset.reroll;
      state.rerolls[key] = (state.rerolls[key] || 0) + 1;
      update();
      const nb = $("sheet").querySelector(`[data-reroll="${b.dataset.reroll}"]`);
      if (nb) { nb.classList.add("spin"); nb.focus({ preventScroll: true }); }
    };
    $("tabs").onclick = e => {
      const b = e.target.closest("[data-jump]");
      if (!b) return;
      const sec = $("sheet").querySelector(`[data-part="${b.dataset.jump}"]`);
      if (sec) sec.scrollIntoView({ behavior: "smooth", block: "start" });
      const part = $("part-" + b.dataset.jump);
      if (part) { part.scrollIntoView({ block: "nearest" }); part.classList.remove("flash"); void part.offsetWidth; part.classList.add("flash"); }
    };
    $("download").onclick = download;
    // Teil im Blatt <-> Karte im Bauplan
    $("sheet").addEventListener("mouseover", e => {
      const sec = e.target.closest("[data-part]");
      document.querySelectorAll(".part.hot").forEach(p => p.classList.remove("hot"));
      if (sec) { const card = $("part-" + sec.dataset.part); if (card) card.classList.add("hot"); }
    });
    $("sheet").addEventListener("mouseleave", () => document.querySelectorAll(".part.hot").forEach(p => p.classList.remove("hot")));
  }

  async function download() {
    if (!lastSheets) return;
    const { A, B, cfg } = lastSheets;
    const pages = [{ sheet: A, mode: "worksheet" }];
    if (B) pages.push({ sheet: B, mode: "worksheet" });
    pages.push({ sheet: A, mode: state.solmode });
    if (B) pages.push({ sheet: B, mode: state.solmode });
    const bytes = await AG.buildDocxAsync(pages, meta(cfg), { merke: state.merke, workLines: state.work });
    const blob = new Blob([bytes], { type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
    const name = (state.title || "Arbeitsblatt").replace(/[^\wäöüÄÖÜß\- ]+/g, "").trim().replace(/\s+/g, "_") + `_Blatt-${state.seed}.docx`;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }

  // ---------- Start ----------
  if (!restore()) {
    state.thema = (themesFor(state.klasse, state.zug)[0] || [])[0];
    applyTheme();
  }
  wire();
  update();
})(AG);

</script>
</body>
</html>
