<title>Schweinchen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="assets/spielkit.css">
<script src="assets/spielkit.js"></script>
<!--
  VORLAGE für neue Spiele auf dem Spielkit.
  Spiel: „Schweinchen“ (das alte Würfelspiel „Pig“). Wer dran ist, würfelt so oft er will und
  sammelt die Augen. Eine 1 löscht die Punkte dieses Zugs. Mit „Behalten“ wandern sie aufs Konto.
  Wer zuerst 50 Punkte hat, gewinnt.

  Neues Spiel anlegen: Ordner kopieren, Regeln und Darstellung ersetzen, in games/games.json eintragen.
  Das Spielkit übernimmt Spielart, Spieler, Computer-Gegner, Online-Räume und das Weitergeben.
-->
<style>
:root {
  color-scheme: dark;
  --table: #121117; --sheet: #1e1d24; --sheet-2: #2a2932; --ink: #f6f5f8; --muted: #a3a1b0;
  --accent: #f39548; --tile-ink: #1e1d24; --red: #ec5f74; --green: #78b75e;
  --font-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--table); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px;
}
.wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 18px; }
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(28px, 5vw, 40px); margin: 0; color: var(--accent); }
.panel { background: var(--sheet); border-radius: 14px; padding: 18px; }
.panel h2 { font-family: var(--font-display); font-weight: 400; font-size: 20px; margin: 0 0 10px; }
.table { display: grid; gap: 8px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--sheet-2); border-radius: 10px; padding: 10px 12px; }
.row.active { box-shadow: 0 0 0 2px var(--accent); }
.bar { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: var(--sheet); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.pts { font-family: var(--font-display); font-size: 22px; font-variant-numeric: tabular-nums; }
.die { width: 72px; height: 72px; border-radius: 16px; background: #f4f4f7; color: var(--tile-ink); display: grid; place-items: center; font-family: var(--font-display); font-size: 40px; }
.die.one { background: var(--red); color: #fff; }
.turn { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.turn .sum { font-family: var(--font-display); font-size: 30px; color: var(--accent); }
.status { min-height: 1.5em; margin: 0 0 12px; }
.log { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; color: var(--muted); font-size: 13.5px; }
.log b { color: var(--ink); }
</style>

<div class="wrap">
  <header>
    <h1>Schweinchen</h1>
    <div class="sk-toolbar" data-sk-toolbar></div>
  </header>
  <p class="sk-banner" data-sk-banner hidden></p>
  <section class="panel sk-lobby" data-sk-lobby hidden></section>
  <section class="panel" id="play">
    <div class="turn">
      <div class="die" id="die">–</div>
      <div><div class="sk-label">Dieser Zug</div><div class="sum" id="turn-sum">0</div></div>
    </div>
    <p class="status" id="status" aria-live="polite"></p>
    <div class="sk-actions">
      <button class="btn primary big" id="btn-roll" type="button">Würfeln</button>
      <button class="btn big" id="btn-hold" type="button">Behalten</button>
      <button class="btn" id="btn-again" type="button" hidden>Noch eine Runde</button>
    </div>
  </section>
  <section class="panel"><h2>Punkte</h2><div class="table" id="table"></div></section>
  <section class="panel"><h2>Verlauf</h2><ul class="log" id="log"></ul></section>
</div>

<script>
(() => {
"use strict";
const GOAL = 50;
const $ = id => document.getElementById(id);
const { esc, rnd } = Spielkit;
let S, kit;

// ---------- Spielstand ----------
// Jeder Spieler braucht id, name, ai – alles Weitere gehört dem Spiel.
const newPlayer = r => ({ id: r.id, name: r.name, ai: r.ai, score: 0 });
// Wird für jedes neue Spiel aufgerufen. phase "lobby" (online) setzt das Spielkit selbst.
const newState = ({ roster }) => ({ players: roster.map(newPlayer), active: 0, turn: 0, die: null, phase: "play", log: [] });
// Online: der Gastgeber startet aus dem Wartebereich
const onStart = s => { s.active = rnd(s.players.length); s.phase = "play"; kit.addLog(`<b>${esc(s.players[s.active].name)}</b> beginnt.`); playBots(); };
// Wer darf jetzt handeln? Hier immer nur der aktive Spieler.
const whoActs = () => (S.phase === "play" ? [S.active] : []);

// ---------- Regeln (verändern nur S, werden über kit.act aufgerufen) ----------
function rollOnce() {
  const p = S.players[S.active];
  S.die = 1 + rnd(6);
  if (S.die === 1) { kit.addLog(`<b>${esc(p.name)}</b> würfelt eine 1 und verliert ${S.turn} Punkte.`); S.turn = 0; nextPlayer(); }
  else S.turn += S.die;
}
function hold() {
  const p = S.players[S.active];
  p.score += S.turn;
  kit.addLog(`<b>${esc(p.name)}</b> behält ${S.turn} Punkte (jetzt ${p.score}).`);
  S.turn = 0;
  if (p.score >= GOAL) { S.phase = "over"; kit.addLog(`<b>${esc(p.name)}</b> gewinnt!`); return; }
  nextPlayer();
}
function nextPlayer() {
  S.active = (S.active + 1) % S.players.length;
  playBots();
}
// Computer-Gegner: würfelt, bis 15 Punkte im Zug liegen oder das Ziel erreicht ist
function playBots() {
  let guard = 0;
  while (S.phase === "play" && S.players[S.active].ai && guard++ < 500) {
    const p = S.players[S.active], startActive = S.active;
    rollOnce();
    if (S.active === startActive && (S.turn >= 15 || p.score + S.turn >= GOAL)) hold();
  }
}

// ---------- Eingaben ----------
const mine = () => kit.me() === S.active && S.phase === "play";
$("btn-roll").addEventListener("click", () => kit.act(() => { if (!mine()) return false; rollOnce(); }));
$("btn-again").addEventListener("click", () => kit.rematch());
$("btn-hold").addEventListener("click", () => kit.act(() => { if (!mine() || S.turn === 0) return false; hold(); }));

// ---------- Darstellung ----------
function render() {
  const lobby = S.phase === "lobby", a = S.players[S.active];
  $("play").hidden = lobby;
  $("die").textContent = S.die || "–";
  $("die").className = "die" + (S.die === 1 ? " one" : "");
  $("turn-sum").textContent = S.turn;
  const st = S.phase === "over" ? `Spielende: <b>${esc(S.players.find(p => p.score >= GOAL).name)}</b> gewinnt.`
    : mine() ? `<b>${esc(a.name)}</b>, du bist dran. Würfeln oder Punkte behalten?`
    : `Warte auf <b>${esc(a.name)}</b>.`;
  $("status").innerHTML = st + (kit.error ? ` <span class="sk-err">${esc(kit.error)}</span>` : "");
  $("btn-roll").disabled = !mine();
  $("btn-hold").disabled = !mine() || S.turn === 0;
  $("btn-again").hidden = S.phase !== "over" || (kit.online() && !kit.isHost());
  $("table").innerHTML = S.players.map((p, i) => `<div class="row${i === S.active && S.phase === "play" ? " active" : ""}">
    <span>${esc(p.name)}${p.ai ? ' <span class="sk-muted">(Computer)</span>' : ""}</span><span class="pts">${p.score}</span>
    <div class="bar"><i style="width:${Math.min(100, p.score / GOAL * 100)}%"></i></div></div>`).join("");
  $("log").innerHTML = S.log.map(l => `<li>${l}</li>`).join("");
}

// ---------- Spielkit verbinden ----------
kit = Spielkit.create({
  id: "schweinchen", version: 1, minPlayers: 2, maxPlayers: 6, bots: true, defaultBots: 1,
  newPlayer, newState, onStart, whoActs, render,
  onState: s => { S = s; },
  roomStatus: s => `läuft · ${s.players.map(p => p.score).join(":")}`,
  handoverText: () => "Du bist dran.",
});
kit.start();
})();
</script>
