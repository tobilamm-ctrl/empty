<title>Punkteblock</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="assets/spielkit.css">
<script src="assets/spielkit.js"></script>
<script>
  // Auf der Plattform liegen die Schriften auf dem eigenen Server; ohne Plattform kommen sie von Google Fonts.
  if (!window.PLATFORM) {
    const l = document.createElement("link");
    l.rel = "stylesheet";
    l.href = "https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;800&family=Patrick+Hand&display=swap";
    document.head.appendChild(l);
  }
</script>
<style>
/* Punkteblock für Spiele auf dem Tisch und draußen (Qwirkle, Mölkky, Boule, Cornhole, Wizard, Phase 10, Kniffel,
   allgemein): oben der Stand, darunter die Eingabe des gewählten Blocks, dann die Tabelle. Ein Gerät für alle. */
:root {
  color-scheme: dark;
  --table: #10141a;
  --sheet: #1a212b;
  --sheet-2: #26303d;
  --ink: #f1f4f8;
  --muted: #9eabbb;
  --accent: #8fd0ff;
  --tile-ink: #10141a;
  --red: #ef6b6b;
  --green: #7fd18b;
  --gold: #ffd25a;
  --font-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --font-hand: "Patrick Hand", "Comic Sans MS", cursive;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--table); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px;
}
button { font: inherit; color: inherit; }
.wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 16px; }
header.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.brand h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(30px, 5vw, 44px); line-height: 1; margin: 0; letter-spacing: .5px; }
.brand h1 { color: var(--accent); }
.brand .sub b { color: var(--ink); }
.brand .sub { color: var(--muted); font-size: 13px; }
.panel { background: var(--sheet); border-radius: 14px; padding: 16px; min-width: 0; }
.panel h2 { font-family: var(--font-display); font-weight: 400; font-size: 20px; margin: 0 0 10px; letter-spacing: .4px; }
main.game { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { main.game { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; } }
.col { display: grid; gap: 16px; min-width: 0; }

/* Stand */
.standings { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.st { background: var(--sheet-2); border-radius: 12px; padding: 8px 10px; display: grid; gap: 2px; position: relative; }
.st.on { box-shadow: 0 0 0 3px var(--accent); }
.st .nm { font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st .tot { font-family: var(--font-display); font-size: 30px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.st .meta { font-size: 12px; color: var(--muted); }
.st .lead { position: absolute; top: 6px; right: 8px; color: var(--gold); font-size: 18px; }

/* Eingabe */
.entry { display: grid; gap: 12px; }
.who { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.who b { font-family: var(--font-display); font-weight: 400; font-size: 24px; color: var(--accent); }
.display { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: #0c1016; border-radius: 12px; padding: 8px 14px; min-height: 64px; }
.display .num { font-family: var(--font-display); font-size: 42px; font-variant-numeric: tabular-nums; }
.display .num.empty { color: #4a5666; }
.display .extra { color: var(--gold); font-weight: 800; font-size: 14px; text-align: right; }
.keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.key { border: 0; border-radius: 12px; background: var(--sheet-2); font-family: var(--font-display); font-size: 26px; min-height: 56px; cursor: pointer; }
.key:active { transform: scale(.97); }
.key.wide { grid-column: span 2; }
.key.qw { background: color-mix(in srgb, var(--gold) 26%, var(--sheet-2)); color: var(--gold); font-size: 18px; }
.key.ok { background: var(--accent); color: var(--tile-ink); font-size: 20px; }
.key.ok:disabled { opacity: .4; }
.key.soft { font-family: var(--font-body); font-weight: 800; font-size: 15px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { min-height: 44px; }
.editnote { background: color-mix(in srgb, var(--gold) 18%, var(--sheet-2)); border-radius: 10px; padding: 8px 12px; display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
.pickend { display: grid; gap: 8px; }
.pickend .opts { display: flex; gap: 8px; flex-wrap: wrap; }

/* Tabelle */
.tbl-wrap { overflow-x: auto; }
table.sheet { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-family: var(--font-hand); font-size: 20px; }
.sheet th, .sheet td { padding: 0; text-align: center; border-bottom: 1px solid var(--sheet-2); }
.sheet thead th { font-family: var(--font-body); font-size: 12px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); padding: 6px 4px; white-space: nowrap; max-width: 90px; overflow: hidden; text-overflow: ellipsis; }
.sheet th.rn { width: 34px; color: var(--muted); font-family: var(--font-body); font-size: 12px; font-weight: 600; }
.sheet td button { width: 100%; min-height: 40px; border: 0; background: none; font: inherit; cursor: pointer; border-radius: 6px; }
.sheet td button:hover { background: var(--sheet-2); }
.sheet td .q { color: var(--gold); font-size: 13px; font-family: var(--font-body); font-weight: 800; margin-left: 3px; }
.sheet td.bonus button { color: var(--gold); }
.sheet td.last button { box-shadow: inset 0 0 0 2px var(--accent); }
.sheet td.zero button { color: var(--muted); }
.sheet tfoot td { font-family: var(--font-display); font-size: 22px; padding: 8px 0; border-top: 2px solid var(--sheet-2); }
.empty-note { color: var(--muted); margin: 0; }
.result { border: 2px solid var(--gold); }
.result h2 { color: var(--gold); }
.rank { list-style: none; padding: 0; margin: 0 0 12px; display: grid; gap: 4px; font-variant-numeric: tabular-nums; }
.rank li { display: flex; justify-content: space-between; gap: 12px; background: var(--sheet-2); border-radius: 8px; padding: 6px 10px; }
.rank li:first-child { box-shadow: inset 0 0 0 2px var(--gold); }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-size: 13.5px; max-height: 260px; overflow-y: auto; }
.log li { color: var(--muted); }
.log li b { color: var(--ink); }
.rules { font-size: 14px; }
.rules summary { cursor: pointer; font-family: var(--font-display); font-size: 20px; letter-spacing: .4px; }
.rules ul { padding-left: 18px; margin: 10px 0 0; display: grid; gap: 6px; }
@media (max-width: 560px) {
  .panel { padding: 12px; }
  .st .tot { font-size: 26px; }
  .key { min-height: 52px; }
}
/* weitere Blöcke */
.grid-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.grid-btns .key { min-height: 54px; }
.key.miss { grid-column: 1 / -1; background: color-mix(in srgb, var(--red) 25%, var(--sheet-2)); font-size: 18px; }
.key.sel { box-shadow: inset 0 0 0 3px var(--accent); }
.teams { display: flex; gap: 8px; flex-wrap: wrap; }
.teams .btn { flex: 1 1 120px; }
.teams .btn.on { background: var(--accent); color: var(--tile-ink); }
.plist { display: grid; gap: 8px; }
.prow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; background: var(--sheet-2); border-radius: 10px; padding: 6px 10px; }
.prow .pn { font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow .pn small { display: block; font-weight: 600; color: var(--muted); font-size: 12px; }
.step { display: inline-flex; align-items: center; gap: 4px; }
.step button { width: 44px; height: 44px; border: 0; border-radius: 10px; background: var(--sheet); font-family: var(--font-display); font-size: 22px; cursor: pointer; }
.step b { min-width: 34px; text-align: center; font-family: var(--font-display); font-weight: 400; font-size: 24px; font-variant-numeric: tabular-nums; }
.prow input[type="number"] { width: 84px; min-height: 44px; border: 0; border-radius: 10px; background: var(--sheet); color: var(--ink); font: inherit; font-family: var(--font-display); font-size: 20px; text-align: center; }
.toggle { min-height: 44px; border: 0; border-radius: 10px; background: var(--sheet); padding: 0 12px; font-weight: 800; cursor: pointer; white-space: nowrap; }
.toggle.on { background: var(--green); color: #102016; }
.sumline { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; color: var(--muted); font-size: 14px; }
.sumline b { color: var(--ink); }
.sumline .bad { color: var(--red); font-weight: 800; }
.ch-team { display: grid; gap: 8px; background: var(--sheet-2); border-radius: 12px; padding: 10px; }
.ch-team h3 { margin: 0; font-size: 16px; }
.ch-team .prow { background: var(--sheet); }
.sheet td.out button, .sheet td.reset button { color: var(--red); }
.sheet td small, .sheet th small { display: block; font-family: var(--font-body); font-size: 11px; color: var(--muted); font-weight: 600; }
.sheet.kn th.cat { text-align: left; font-family: var(--font-body); font-size: 13px; font-weight: 800; padding: 4px 6px; white-space: nowrap; }
.sheet.kn th.cat small { font-weight: 600; }
.sheet.kn td button.open { color: var(--muted); font-size: 15px; }
.sheet.kn td.pick button { box-shadow: inset 0 0 0 3px var(--accent); }
.sheet.kn tr.sum td, .sheet.kn tr.sum th { background: rgba(255,255,255,.04); font-family: var(--font-display); font-size: 17px; }
.sheet.kn tr.sum th { font-family: var(--font-body); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); text-align: left; padding: 6px; }
.phases { font-size: 13px; color: var(--muted); margin: 0; padding-left: 20px; }
.st .sub2 { font-size: 12px; color: var(--accent); font-weight: 800; }
.st.out { opacity: .5; }
.teams .btn.on { background: var(--accent); color: var(--tile-ink); }
.prow.tt { grid-template-columns: 1fr; }
.ttrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.ttf { display: grid; gap: 2px; font-size: 12px; color: var(--muted); }
.ttf input { width: 100%; min-height: 44px; border: 0; border-radius: 10px; background: var(--sheet); color: var(--ink); font: inherit; font-family: var(--font-display); font-size: 20px; text-align: center; }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1 id="mode-title">Punkteblock</h1>
      <div class="sub"><b>Punkteblock</b> · <span id="mode-sub"></span></div>
    </div>
    <div class="sk-toolbar" data-sk-toolbar></div>
  </header>
  <p class="sk-banner" data-sk-banner hidden></p>
  <section class="panel result" id="result" hidden></section>
  <section class="panel sk-lobby" data-sk-lobby hidden></section>
  <section class="standings" id="standings" aria-label="Stand"></section>

  <main class="game" id="game">
    <div class="col">
      <section class="panel entry" id="entry" aria-label="Punkte eintragen"></section>
    </div>
    <div class="col">
      <section class="panel">
        <h2>Tabelle</h2>
        <div class="tbl-wrap" id="sheet"></div>
      </section>
      <section class="panel">
        <h2>Verlauf</h2>
        <ul class="log" id="log"></ul>
      </section>
      <section class="panel rules">
        <details>
          <summary>So geht's</summary>
          <ul id="rules-list"></ul>
        </details>
      </section>
    </div>
  </main>
</div>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const { esc } = Spielkit;

// ---------- Voreinstellungen ----------
// Jeder Block hat eigene Eingabe, Tabelle und Wertung. Der Spielstand hält nur die Einträge;
// Summen, Sieger und wer dran ist werden daraus jedes Mal neu berechnet (so sind Rückgängig und Ändern einfach).
const MODES = {
  qwirkle: { title: "Qwirkle", small: "Qwirkle +6, Schlussbonus" },
  frei: { title: "Allgemein", small: "für jedes Spiel, auch Minus" },
  moelkky: { title: "Mölkky", small: "genau 50, sonst zurück auf 25" },
  boule: { title: "Boule", small: "Aufnahmen bis 13", teams: true },
  cornhole: { title: "Cornhole", small: "Punkte heben sich auf, bis 21", teams: true },
  wizard: { title: "Wizard", small: "Ansagen und Stiche, 3–6 Spieler" },
  phase10: { title: "Phase 10", small: "Phasen und Minuspunkte" },
  kniffel: { title: "Kniffel", small: "Wertungsblock für echte Würfel" },
  uno: { title: "UNO", small: "Sieger sammelt die Kartenpunkte, bis 500" },
  unominus: { title: "UNO (Minuspunkte)", small: "jeder schreibt seine Karten, bei 500 Schluss" },
  scrabble: { title: "Scrabble", small: "Wortpunkte, Bingo +50, Restbuchstaben" },
  takethat: { title: "Take That", small: "Plus-, Minus- und Krötenkarten" },
};
const TURNS = ["qwirkle", "frei", "moelkky", "scrabble"];   // Blöcke mit einem Eintrag je Zug
const isTurns = a => TURNS.includes(a);
const bonusV = () => (art() === "scrabble" ? 50 : QW);      // Qwirkle +6, Scrabble-Bingo +50
const UNO = 500;
const QW = 6, MOELKKY = 50, BOULE = 13, CORNHOLE = 21;
const PHASES = ["2 Drillinge", "1 Drilling + 1 Viererfolge", "1 Vierling + 1 Viererfolge", "1 Siebenerfolge", "1 Achterfolge",
  "1 Neunerfolge", "2 Vierlinge", "7 Karten einer Farbe", "1 Fünfling + 1 Zwilling", "1 Fünfling + 1 Drilling"];
const KN = [
  ["c1", "Einser", 1], ["c2", "Zweier", 2], ["c3", "Dreier", 3], ["c4", "Vierer", 4], ["c5", "Fünfer", 5], ["c6", "Sechser", 6],
  ["drei", "Dreierpasch", "frei"], ["vier", "Viererpasch", "frei"], ["full", "Full House", 25], ["klein", "Kleine Straße", 30],
  ["gross", "Große Straße", 40], ["kniffel", "Kniffel", 50], ["chance", "Chance", "frei"]];
const KN_UP = KN.slice(0, 6).map(k => k[0]);

let S, kit;
// Eingaben auf diesem Gerät (gehen erst mit dem Bestätigen in den Spielstand)
const UI = { num: "", qw: 0, neg: false, edit: null, pickEnd: false, team: null, ch: null, wz: null, p10: null, kcell: null, uw: null, un: null, tt: null, rest: null, key: "" };
const art = () => (S.options && MODES[S.options.art] ? S.options.art : "qwirkle");
const D = () => S.d;   // Daten des Blocks
const log = html => { S.log.unshift(html); S.log = S.log.slice(0, 150); };
const pts = n => `${n} ${Math.abs(n) === 1 ? "Punkt" : "Punkte"}`;
const nm = i => `<b>${esc(S.players[i].name)}</b>`;
const N = () => S.players.length;

// ---------- Spielstand ----------
const newPlayer = r => ({ id: r.id, name: r.name, ai: false });
function emptyData(a, n) {
  if (isTurns(a)) return { turns: [], active: 0, ended: false, final: null };
  if (a === "uno" || a === "unominus" || a === "takethat") return { rounds: [], ended: false };
  if (a === "boule") return { ends: [] };
  if (a === "cornhole") return { rounds: [] };
  if (a === "wizard") return { rounds: [], bids: null };
  if (a === "phase10") return { rounds: [] };
  if (a === "kniffel") return { sheet: Array.from({ length: n }, () => ({})), hist: [], active: 0 };
  return {};
}
function newState({ roster, options }) {
  const o = Object.assign({ art: "qwirkle" }, options);
  return { players: roster.map(newPlayer), d: emptyData(o.art, roster.length), phase: "play", seq: 0, log: [], options: o };
}
const onStart = s => { s.d = emptyData(s.options.art, s.players.length); s.phase = "play"; s.seq++; };
const whoActs = () => [];
const canEdit = () => !kit.online() || kit.me() >= 0;

// ---------- Auswertung je Block ----------
// liefert { tot: [...], meta: [...], active, over, win: [...], low (wenig ist gut) }
function calc() {
  const a = art(), d = D(), n = N(), tot = Array(n).fill(0), meta = Array(n).fill("");
  let active = -1, over = false, win = [], low = false;
  if (a === "qwirkle" || a === "frei" || a === "scrabble") {
    d.turns.forEach(t => { tot[t.p] += t.pts; });
    if (d.final) finalAdj(d.final).forEach((x, i) => { tot[i] += x; });
    for (let i = 0; i < n; i++) {
      const z = d.turns.filter(t => t.p === i && !t.bonus).length, q = d.turns.filter(t => t.p === i).reduce((s, t) => s + (t.q || 0), 0);
      meta[i] = `${z} ${z === 1 ? "Zug" : "Züge"}${q && a !== "frei" ? ` · ${q}× ${a === "qwirkle" ? "Qwirkle" : "Bingo"}` : ""}`;
    }
    active = d.active; over = d.ended;
  } else if (a === "uno" || a === "unominus") {
    d.rounds.forEach(r => {
      if (a === "uno") { if (r.w >= 0) tot[r.w] += r.pts.reduce((s, x, i) => s + (i === r.w ? 0 : x), 0); }
      else r.pts.forEach((x, i) => { tot[i] += i === r.w ? 0 : x; });
    });
    for (let i = 0; i < n; i++) meta[i] = `${d.rounds.filter(r => r.w === i).length}× gewonnen${a === "uno" ? ` · noch ${Math.max(0, UNO - tot[i])}` : ""}`;
    over = tot.some(x => x >= UNO); low = a === "unominus";
  } else if (a === "takethat") {
    d.rounds.forEach(r => r.plus.forEach((x, i) => { tot[i] += x - r.minus[i] - 5 * r.kr[i]; }));
    for (let i = 0; i < n; i++) meta[i] = `${d.rounds.length} ${d.rounds.length === 1 ? "Runde" : "Runden"}`;
    over = d.ended;
  } else if (a === "moelkky") {
    const miss = Array(n).fill(0), out = Array(n).fill(false);
    let winner = -1, last = -1;
    d.turns.forEach(t => {
      last = t.p;
      if (winner >= 0) return;
      if (t.pts === 0) { if (++miss[t.p] >= 3) out[t.p] = true; }
      else { miss[t.p] = 0; tot[t.p] += t.pts; if (tot[t.p] > MOELKKY) { tot[t.p] = 25; t.reset = true; } else t.reset = false; if (tot[t.p] === MOELKKY) winner = t.p; }
    });
    const alive = [...Array(n).keys()].filter(i => !out[i]);
    if (winner < 0 && alive.length === 1 && n > 1) winner = alive[0];
    over = winner >= 0; win = over ? [winner] : [];
    for (let k = 1; k <= n && !over; k++) { const i = ((last < 0 ? -1 : last) + k + n) % n; if (!out[i]) { active = i; break; } }
    if (last < 0) active = alive[0];
    for (let i = 0; i < n; i++) meta[i] = out[i] ? "raus (3 Fehlwürfe)" : `noch ${MOELKKY - tot[i]}${miss[i] ? ` · ${miss[i]}× daneben` : ""}`;
    calc.out = out;
  } else if (a === "boule") {
    d.ends.forEach(e => { tot[e.t] += e.pts; });
    for (let i = 0; i < n; i++) meta[i] = `noch ${Math.max(0, BOULE - tot[i])} bis ${BOULE}`;
    over = tot.some(t => t >= BOULE);
  } else if (a === "cornhole") {
    d.rounds.forEach(r => {
      const pa = r.a.b + 3 * r.a.h, pb = r.b.b + 3 * r.b.h;
      r.res = pa > pb ? [pa - pb, 0] : [0, pb - pa];
      tot[0] += r.res[0]; tot[1] += r.res[1];
    });
    for (let i = 0; i < Math.min(2, n); i++) meta[i] = `noch ${Math.max(0, CORNHOLE - tot[i])} bis ${CORNHOLE}`;
    over = tot.some(t => t >= CORNHOLE);
  } else if (a === "wizard") {
    const R = wizRounds();
    d.rounds.forEach(r => r.bids.forEach((b, i) => { const t = r.tricks[i]; tot[i] += b === t ? 20 + 10 * t : -10 * Math.abs(b - t); }));
    for (let i = 0; i < n; i++) meta[i] = `${d.rounds.filter(r => r.bids[i] === r.tricks[i]).length}× getroffen`;
    over = R > 0 && d.rounds.length >= R;
  } else if (a === "phase10") {
    const ph = Array(n).fill(1);
    d.rounds.forEach(r => r.done.forEach((ok, i) => { if (ok && ph[i] <= 10) ph[i]++; }));
    d.rounds.forEach(r => r.pen.forEach((p, i) => { tot[i] += p; }));
    for (let i = 0; i < n; i++) meta[i] = ph[i] > 10 ? "alle 10 Phasen" : `Phase ${ph[i]}: ${PHASES[ph[i] - 1]}`;
    calc.ph = ph;
    const fin = [...Array(n).keys()].filter(i => ph[i] > 10);
    over = fin.length > 0; low = true;
    if (over) { const m = Math.min(...fin.map(i => tot[i])); win = fin.filter(i => tot[i] === m); }
  } else if (a === "kniffel") {
    for (let i = 0; i < n; i++) {
      const sh = d.sheet[i] || {}, up = KN_UP.reduce((s, k) => s + (sh[k] || 0), 0), bonus = up >= 63 ? 35 : 0;
      tot[i] = KN.reduce((s, k) => s + (sh[k[0]] || 0), 0) + bonus;
      const open = KN.filter(k => sh[k[0]] == null).length;
      meta[i] = `oben ${up}${bonus ? " + 35 Bonus" : ` (Bonus noch ${Math.max(0, 63 - up)})`} · ${open} offen`;
    }
    active = d.active;
    over = d.sheet.every(sh => KN.every(k => sh[k[0]] != null));

    uno: `<li>Nach jeder Runde: den Sieger antippen und für die anderen die Kartenpunkte auf der Hand eintragen (Zahlenkarten nach Wert, Aussetzen, Richtungswechsel und +2 je 20, schwarze Karten je 50; +20 und +50 zählen dazu).</li><li>Der Sieger bekommt die Summe. Gewonnen hat, wer zuerst <b>${UNO} Punkte</b> hat.</li>${undoTxt}`,

    scrabble: `<li>Nach jedem Zug die Punkte des Wortes eintippen (mit Buchstaben- und Wortfeldern) und <b>Eintragen</b>. Wer alle 7 Steine auf einmal legt: <b>Bingo +50</b>.</li><li><b>Passen</b> trägt 0 ein. <b>Spielende…</b>: Jeder verliert die Punkte seiner Restbuchstaben; wer alle Steine gelegt hat, bekommt die Summe der anderen dazu.</li>${undoTxt}<li>Jede Zahl in der Tabelle lässt sich antippen und ändern.</li>`,
    takethat: `<li>Nach jeder Runde für jeden zählen: <b>Plus</b>-Karten (verdreht gespielt) je +1, <b>Minus</b>-Karten aus genommenen Reihen je −1, <b>Kröten</b> (Schnapszahlen) je −5.</li><li>So viele Runden, wie ihr mögt; dann <b>Spielende</b>. Die meisten Punkte gewinnen.</li>${undoTxt}`,
    kniffel: `<li>Gewürfelt wird mit echten Würfeln. In der Tabelle das Feld des Spielers antippen und den Wert wählen oder eintippen.</li><li>Bonus: <b>+35</b>, wenn oben mindestens 63 Punkte stehen.</li>${undoTxt}`,
  }[a];
}

// ---------- Einstellung: welcher Block ----------
const setup = {
  html: `<div class="sk-field"><label class="sk-label" for="pb-art">Punkteblock für</label>
    <select id="pb-art">${Object.entries(MODES).map(([k, m]) => `<option value="${k}">${m.title} – ${m.small}</option>`).join("")}</select>
    <small class="sk-muted" id="pb-hint"></small></div>`,
  init(root) {
    const sel = root.querySelector("#pb-art"), hint = root.querySelector("#pb-hint");
    const show = () => { const m = sel.value; hint.textContent = MODES[m].teams ? "Trag unten die Teams als Spieler ein (z. B. „Tobi & Anna“)." : m === "wizard" ? "Wizard braucht 3 bis 6 Spieler." : m === "takethat" ? "Take That: 2 bis 4 Spieler." : ""; };
    sel.addEventListener("change", show); show();
  },
  read(root) { const s = root.querySelector("#pb-art"); return { art: s ? s.value : "qwirkle" }; },
};

// ---------- Spielkit verbinden ----------
kit = Spielkit.create({
  id: "punkteblock", version: 2, minPlayers: 2, maxPlayers: 8, bots: false, sharedDevice: true,
  setup, defaultOptions: () => ({ art: "qwirkle" }),
  newPlayer, newState, onStart, whoActs, render,
  turnInfo: s => { S = s; if (s.phase !== "play") return null; const c = calc(); return c.active >= 0 ? { active: c.active, next: -1, also: [] } : { active: -1, next: -1, also: [] }; },
  moveSound: "tile",
  onState: s => { S = s; if (!s.d) s.d = emptyData((s.options || {}).art || "qwirkle", s.players.length); },
  validState: s => !!s.d && Array.isArray(s.players),
  roomStatus: s => `${MODES[(s.options || {}).art] ? MODES[s.options.art].title : "Punkteblock"}`,
  // nur für automatische Tests
  test: { calc, undo, turnEnter, setKniffel, get S() { return S; } },
});
kit.start();
})();
</script>
