<style>
/* Layout: oben die Auswahl (aktuelle und nächste Reihe Dominos), darunter das eigene Reich groß;
   die Reiche der anderen klein; rechts bzw. darunter Wertung, Verlauf und Regeln */
:root {
  color-scheme: dark;
  --table: #12160f;
  --sheet: #1d2419;
  --sheet-2: #2a3324;
  --ink: #f3f1e6;
  --muted: #a9b19c;
  --accent: #ffcf4a;
  --tile-ink: #1d2419;
  --red: #e5604f;
  --green: #8cc94f;
  --font-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--table); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px;
}
button { font: inherit; color: inherit; }
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 18px; }
header.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.brand h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(30px, 5vw, 44px); line-height: 1; margin: 0; letter-spacing: .5px; }
.brand h1 span { color: var(--accent); }
.brand .sub { color: var(--muted); font-size: 13px; }
.panel { background: var(--sheet); border-radius: 14px; padding: 16px; min-width: 0; }
.panel h2 { font-family: var(--font-display); font-weight: 400; font-size: 20px; margin: 0 0 10px; letter-spacing: .4px; }
main.game { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 980px) { main.game { grid-template-columns: minmax(0, 1fr) 340px; align-items: start; } }
.col { display: grid; gap: 18px; min-width: 0; }

/* ---------- Auswahl ---------- */
.draft { display: grid; gap: 12px; }
.line { display: grid; gap: 6px; }
.line .lbl { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.doms { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.doms.n3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.dom {
  border: 0; background: var(--sheet-2); border-radius: 10px; padding: 6px 6px 5px; display: grid; gap: 4px; justify-items: center;
  position: relative; min-height: 64px; min-width: 0;
}
.dom svg.tile { width: 100%; max-width: 104px; display: block; border-radius: 4px; }
.dom .no { font-size: 11px; color: var(--muted); font-weight: 800; }
.dom .king { position: absolute; top: -7px; right: -5px; }
.dom.done { opacity: .45; }
.dom.now { box-shadow: 0 0 0 3px var(--accent); }
button.dom { cursor: pointer; }
button.dom.can { box-shadow: 0 0 0 3px var(--accent), 0 0 14px color-mix(in srgb, var(--accent) 50%, transparent); }
button.dom:disabled { cursor: default; }
.king { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; color: #fff; font-weight: 800; font-size: 12px; box-shadow: 0 0 0 2px #fff, 0 2px 4px rgba(0,0,0,.5); }
.king svg { width: 15px; height: 15px; }

/* ---------- eigenes Reich ---------- */
.realm { display: grid; gap: 10px; justify-items: center; }
.realm h2 { justify-self: stretch; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: baseline; margin: 0; }
.realm h2 small { font-family: var(--font-body); font-size: 13px; color: var(--muted); }
.board { width: 100%; max-width: 440px; }
.board svg { width: 100%; display: block; touch-action: manipulation; }
.slot { fill: rgba(255,255,255,.04); stroke: rgba(255,255,255,.12); stroke-width: .25; }
.slot.can { fill: color-mix(in srgb, var(--accent) 28%, transparent); stroke: var(--accent); stroke-width: .5; cursor: pointer; }
.slot.can:hover { fill: color-mix(in srgb, var(--accent) 45%, transparent); }
.prev { opacity: .9; }
.selA { fill: none; stroke: #fff; stroke-width: .8; stroke-dasharray: 1.5 1; }
.hand { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; }
.hand svg.tile { width: 120px; }
.status { text-align: center; min-height: 1.5em; margin: 0; font-size: 16px; }
.status strong { color: var(--accent); }
.status .sk-err { display: block; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.btn { min-height: 44px; }

/* ---------- Reiche der anderen ---------- */
.others { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.other { background: var(--sheet-2); border-radius: 12px; padding: 8px; display: grid; gap: 4px; justify-items: center; }
.other.on { box-shadow: 0 0 0 3px var(--accent); }
.other .nm { font-weight: 800; font-size: 13px; display: flex; gap: 6px; align-items: center; max-width: 150px; }
.other .nm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.other .nm .king { width: 18px; height: 18px; font-size: 10px; box-shadow: 0 0 0 1.5px #fff; }
.other svg { width: 112px; display: block; }
.other .meta { font-size: 12px; color: var(--muted); }

/* ---------- Seitenleiste ---------- */
.result { border: 2px solid var(--accent); }
.result h2 { color: var(--accent); }
.result p { margin: 0 0 10px; }
.rank { list-style: none; padding: 0; margin: 0 0 12px; display: grid; gap: 4px; font-variant-numeric: tabular-nums; }
.rank li { display: flex; justify-content: space-between; gap: 12px; background: var(--sheet-2); border-radius: 8px; padding: 6px 10px; }
.rank li:first-child { box-shadow: inset 0 0 0 2px var(--accent); }
table.score { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 14px; }
.score th, .score td { padding: 5px 6px; text-align: right; border-bottom: 1px solid var(--sheet-2); white-space: nowrap; }
.score th:first-child, .score td:first-child { text-align: left; max-width: 130px; overflow: hidden; text-overflow: ellipsis; }
.score thead th { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.score td.tot { font-family: var(--font-display); font-size: 18px; }
.score tr.on td:first-child { color: var(--accent); }
.props { font-size: 13px; color: var(--muted); margin: 8px 0 0; display: grid; gap: 3px; }
.props b { color: var(--ink); }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-size: 13.5px; max-height: 300px; overflow-y: auto; }
.log li { color: var(--muted); }
.log li b { color: var(--ink); }
.rules { font-size: 14px; }
.rules summary { cursor: pointer; font-family: var(--font-display); font-size: 20px; letter-spacing: .4px; }
.rules ul { padding-left: 18px; margin: 10px 0 0; display: grid; gap: 6px; }
.legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 6px; margin-top: 10px; }
.legend div { display: flex; gap: 8px; align-items: center; font-size: 13px; }
.legend svg { width: 26px; height: 26px; border-radius: 4px; flex: none; }

@media (max-width: 560px) {
  .panel { padding: 12px; }
  .doms { gap: 6px; }
  .other svg { width: 92px; }
  .hand svg.tile { width: 104px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const { esc, rnd } = Spielkit;

// ---------- Dominos ----------
// Landschaften: f Feld, w Wald, s See, g Wiese, m Moor, b Bergwerk. Jede Hälfte: Landschaft + Zahl der Kronen.
const TERR = { f: "Feld", w: "Wald", s: "See", g: "Wiese", m: "Moor", b: "Bergwerk" };
const TILES = [null,
  "f0f0", "f0f0", "w0w0", "w0w0", "w0w0", "w0w0", "s0s0", "s0s0", "s0s0", "g0g0", "g0g0", "m0m0",
  "f0w0", "f0s0", "f0g0", "f0m0", "w0s0", "w0g0", "f1w0", "f1s0", "f1g0", "f1m0", "f1b0", "w1f0",
  "w1f0", "w1f0", "w1f0", "w1s0", "w1g0", "s1f0", "s1f0", "s1w0", "s1w0", "s1w0", "s1w0", "f0g1",
  "s0g1", "f0m1", "g0m1", "b1f0", "f0g2", "s0g2", "f0m2", "g0m2", "b2f0", "m0b2", "m0b2", "f0b3"];
const half = (n, h) => ({ t: TILES[n][h * 2], c: +TILES[n][h * 2 + 1], d: n });
const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]];
const COLORS = ["#d9473f", "#3577d6", "#e3a020", "#8b55c9"];
const BOT_NAMES = ["Ada", "Kurt", "Mila", "Ole"];
const DEFAULTS = { gross: false, mitte: false, harmonie: false };

let S, kit;
const UI = { a: null, b: null, key: "" };
const O = () => Object.assign({}, DEFAULTS, S.options || {});
const vb = (name, du, er) => (name === "Du" ? du : er);
const log = html => { S.log.unshift(html); S.log = S.log.slice(0, 80); };
const pts = n => `${n} ${n === 1 ? "Punkt" : "Punkte"}`;
const pname = i => `<b>${esc(S.players[i].name)}</b>`;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const K = (x, y) => x + "," + y;
const cells = board => Object.keys(board).map(k => { const [x, y] = k.split(",").map(Number); return { x, y, ...board[k] }; });

// ---------- Reich: Grenzen, Anlegen, Wertung ----------
function bbox(board) {
  let x0 = 0, x1 = 0, y0 = 0, y1 = 0;
  for (const c of cells(board)) { x0 = Math.min(x0, c.x); x1 = Math.max(x1, c.x); y0 = Math.min(y0, c.y); y1 = Math.max(y1, c.y); }
  return { x0, x1, y0, y1 };
}
// Darf das Domino n mit Hälfte 0 auf (x, y) und Hälfte 1 auf (x2, y2) liegen?
function canPlace(board, L, n, x, y, x2, y2) {
  if (board[K(x, y)] || board[K(x2, y2)]) return false;
  const b = bbox(board);
  if (Math.max(b.x1, x, x2) - Math.min(b.x0, x, x2) >= L || Math.max(b.y1, y, y2) - Math.min(b.y0, y, y2) >= L) return false;
  const fits = (px, py, t) => DIRS.some(([dx, dy]) => { const c = board[K(px + dx, py + dy)]; return c && (c.t === "c" || c.t === t); });
  return fits(x, y, half(n, 0).t) || fits(x2, y2, half(n, 1).t);
}
function placements(board, L, n) {
  const b = bbox(board), out = [];
  for (let y = b.y0 - 2; y <= b.y1 + 2; y++) for (let x = b.x0 - 2; x <= b.x1 + 2; x++)
    for (let d = 0; d < 4; d++) { const x2 = x + DIRS[d][0], y2 = y + DIRS[d][1]; if (canPlace(board, L, n, x, y, x2, y2)) out.push({ x, y, x2, y2 }); }
  return out;
}
function put(board, n, p) { board[K(p.x, p.y)] = half(n, 0); board[K(p.x2, p.y2)] = half(n, 1); }
// Gebiete (zusammenhängende gleiche Landschaft), Punkte = Felder × Kronen
function areas(board) {
  const seen = new Set(), out = [];
  for (const c of cells(board)) {
    if (c.t === "c" || seen.has(K(c.x, c.y))) continue;
    let size = 0, crowns = 0; const st = [[c.x, c.y]]; seen.add(K(c.x, c.y));
    while (st.length) {
      const [x, y] = st.pop(), cc = board[K(x, y)]; size++; crowns += cc.c;
      for (const [dx, dy] of DIRS) { const k = K(x + dx, y + dy), nb = board[k]; if (nb && nb.t === c.t && !seen.has(k)) { seen.add(k); st.push([x + dx, y + dy]); } }
    }
    out.push({ t: c.t, size, crowns, pts: size * crowns });
  }
  return out;
}
function scoreOf(p, o, L) {
  const ar = areas(p.board), b = bbox(p.board);
  const base = ar.reduce((t, a) => t + a.pts, 0);
  const full = b.x1 - b.x0 === L - 1 && b.y1 - b.y0 === L - 1;
  const centered = full && -b.x0 === (L - 1) / 2 && -b.y0 === (L - 1) / 2;
  const filled = full && Object.keys(p.board).length === L * L;
  const mitte = o.mitte && centered ? 10 : 0, harmonie = o.harmonie && filled && !p.discards ? 5 : 0;
  return { total: base + mitte + harmonie, base, mitte, harmonie, areas: ar,
    largest: Math.max(0, ...ar.map(a => a.size)), crowns: ar.reduce((t, a) => t + a.crowns, 0) };
}

// ---------- Ablauf ----------
// Zu zweit hat jeder zwei Könige. Je Reihe 4 Dominos (zu dritt 3).
const perLine = () => (S.players.length === 3 ? 3 : 4);
function deal(s) {
  S = s;
  const n = s.players.length, o = O();
  s.L = n === 2 && o.gross ? 7 : 5;
  const count = n === 2 ? (o.gross ? 48 : 24) : n === 3 ? 36 : 48;
  s.deck = shuffle(Array.from({ length: 48 }, (_, i) => i + 1)).slice(0, count);
  s.players.forEach(p => { p.board = { "0,0": { t: "c", c: 0, d: 0 } }; p.discards = 0; p.score = 0; });
  const kings = n === 2 ? [0, 0, 1, 1] : s.players.map((p, i) => i);
  s.order = shuffle(kings);
  s.cur = []; s.next = drawLine();
  s.phase = "pick0"; s.k = 0; s.sub = "pick"; s.seq++;
  log(`Neues Reich ${s.L}×${s.L}${n === 2 ? (o.gross ? " mit allen 48 Dominos" : ", zu zweit mit zwei Königen je Spieler") : ""}. Die Reihenfolge der ersten Wahl ist ausgelost.`);
}
function drawLine() {
  const m = perLine();
  return S.deck.splice(0, m).sort((a, b) => a - b).map(n => ({ n, p: null, done: false }));
}
const actor = () => S.phase === "pick0" ? S.order[S.k] : S.phase === "play" ? S.cur[S.k].p : -1;
// wer nach dem aktuellen Spieler dran ist (für die Zugleiste)
function nextActor() {
  if (S.phase === "pick0") return S.k + 1 < S.order.length ? S.order[S.k + 1] : S.next[0] && S.next[0].p !== null ? S.next[0].p : -1;
  if (S.phase !== "play") return -1;
  if (S.cur[S.k + 1]) return S.cur[S.k + 1].p;
  return S.next[0] && S.next[0].p !== null ? S.next[0].p : -1;
}

function pickDomino(n) {
  const i = actor(), d = S.next.find(x => x.n === n && x.p === null);
  d.p = i; S.seq++;
  log(`${pname(i)} ${vb(S.players[i].name, "wählst", "wählt")} Domino ${n}.`);
  advance();
}
function placeDomino(p) {
  const i = actor(), d = S.cur[S.k], pl = S.players[i];
  put(pl.board, d.n, p);
  d.done = true; S.seq++; S.fresh = { p: i, at: [K(p.x, p.y), K(p.x2, p.y2)] };
  pl.score = scoreOf(pl, O(), S.L).total;
  log(`${pname(i)} ${vb(pl.name, "legst", "legt")} Domino ${d.n} an.`);
  afterPlace();
}
function discardDomino() {
  const i = actor(), d = S.cur[S.k];
  S.players[i].discards++; d.done = true; S.seq++;
  log(`${pname(i)} ${vb(S.players[i].name, "kannst", "kann")} Domino ${d.n} nicht anlegen und ${vb(S.players[i].name, "legst", "legt")} es weg.`);
  afterPlace();
}
function afterPlace() {
  if (S.next.length) S.sub = "pick";
  else advance();
}
function advance() {
  S.k++;
  if (S.phase === "pick0") {
    if (S.k < S.order.length) return;
    S.cur = S.next; S.next = drawLine(); S.phase = "play"; S.k = 0; S.sub = "place";
    log("Alle haben gewählt. Jetzt wird angelegt, in der Reihenfolge der Domino-Nummern.");
    return;
  }
  if (S.k < S.cur.length) { S.sub = "place"; return; }
  if (S.next.length) {
    S.cur = S.next; S.next = drawLine(); S.k = 0; S.sub = "place";
    return;
  }
  endGame();
}
function endGame() {
  const o = O();
  S.players.forEach(p => { const r = scoreOf(p, o, S.L); p.score = r.total; p.final = r; });
  S.phase = "over"; S.seq++;
  const rk = ranking();
  log(`<b>Spielende.</b> ${pname(S.players.indexOf(rk[0]))} ${vb(rk[0].name, "gewinnst", "gewinnt")} mit ${rk[0].score} ${rk[0].score === 1 ? "Punkt" : "Punkten"}.`);
}
const ranking = () => S.players.slice().sort((a, b) => b.score - a.score || b.final.largest - a.final.largest || b.final.crowns - a.final.crowns);

// ---------- Computer-Gegner ----------
// Wert einer Lage: Punktezuwachs, dazu etwas für passende Nachbarn und für ein kompaktes Reich
function placeValue(pl, n, p) {
  const o = O(), before = scoreOf(pl, o, S.L).total, b = Object.assign({}, pl.board);
  put(b, n, p);
  const after = scoreOf({ board: b, discards: pl.discards }, o, S.L).total;
  let v = after - before;
  for (const [x, y, h] of [[p.x, p.y, 0], [p.x2, p.y2, 1]]) {
    const t = half(n, h).t;
    for (const [dx, dy] of DIRS) { const c = pl.board[K(x + dx, y + dy)]; if (c && c.t === t) v += 0.6; }
  }
  // Löcher vermeiden: leere Felder, die rundum zu sind, kosten
  for (const [x, y] of [[p.x, p.y], [p.x2, p.y2]]) for (const [dx, dy] of DIRS) {
    const k = K(x + dx, y + dy); if (b[k]) continue;
    if (DIRS.every(([ex, ey]) => b[K(x + dx + ex, y + dy + ey)])) v -= 1.5;
  }
  if (o.mitte) { const bb = bbox(b); v -= 0.15 * (Math.abs(bb.x0 + bb.x1) + Math.abs(bb.y0 + bb.y1)); }
  return v + Math.random() * 0.2;
}
function bestPlace(pl, n) {
  let best = null, bv = -Infinity;
  for (const p of placements(pl.board, S.L, n)) { const v = placeValue(pl, n, p); if (v > bv) { bv = v; best = p; } }
  return { p: best, v: bv };
}
function botStep() {
  const i = actor(), pl = S.players[i];
  if (S.phase === "play" && S.sub === "place") {
    const { p } = bestPlace(pl, S.cur[S.k].n);
    if (p) placeDomino(p); else discardDomino();
    return;
  }
  // wählen: bester Zuwachs, Kronen zählen, kleine Nummern sind fürs nächste Mal etwas besser
  let best = null, bv = -Infinity;
  for (const d of S.next.filter(x => x.p === null)) {
    const { p, v } = bestPlace(pl, d.n);
    const crowns = half(d.n, 0).c + half(d.n, 1).c;
    const val = (p ? v : -6) + crowns * 0.8 + (48 - d.n) * 0.015;
    if (val > bv) { bv = val; best = d.n; }
  }
  pickDomino(best);
}
// Computer-Gegner: online und an einem Gerät zieht das Spielkit sie einzeln mit kurzer Pause (botPending/botStep);
// nur in Tests (ohne Pause) laufen alle Computerzüge sofort hintereinander
const botPending = () => (S.phase === "pick0" || S.phase === "play") && S.players[actor()].ai;
function playBots() {
  if (kit.paced()) return;
  let guard = 0;
  while (botPending() && guard++ < 500) botStep();
}

// ---------- Spielstand ----------
const newPlayer = r => ({ id: r.id, name: r.name, ai: r.ai, board: { "0,0": { t: "c", c: 0, d: 0 } }, discards: 0, score: 0 });
function newState({ roster, mode, options }) {
  const s = { players: roster.map(newPlayer), deck: [], cur: [], next: [], order: [], L: 5, phase: "pick0", k: 0, sub: "pick", seq: 0, log: [], fresh: null,
    options: Object.assign({}, DEFAULTS, options) };
  if (mode !== "online") { deal(s); playBots(); }
  return s;
}
function onStart(s) { deal(s); playBots(); }
const whoActs = () => (S.phase === "pick0" || S.phase === "play" ? [actor()] : []);

// ---------- Eingaben ----------
const mine = () => (S.phase === "pick0" || S.phase === "play") && kit.me() === actor();
function act(fn) {
  const seq = S.seq;
  UI.a = UI.b = null;
  kit.act(() => { if (!mine() || S.seq !== seq) return false; if (fn() === false) return false; playBots(); });
}
$("draft").addEventListener("click", e => {
  const b = e.target.closest("button.dom[data-n]");
  if (!b || b.disabled) return;
  const n = +b.dataset.n;
  act(() => { if (S.sub !== "pick" || !S.next.some(x => x.n === n && x.p === null)) return false; pickDomino(n); });
});
$("board").addEventListener("click", e => {
  const c = e.target.closest("[data-x]");
  if (!c || !c.classList.contains("can")) return;
  const x = +c.dataset.x, y = +c.dataset.y;
  if (!UI.a || UI.b) { UI.a = { x, y }; UI.b = null; }
  else UI.b = { x, y };
  render();
});
$("actions").addEventListener("click", e => {
  const b = e.target.closest("[data-a]");
  if (!b) return;
  const a = b.dataset.a;
  if (a === "back") { if (UI.b) UI.b = null; else UI.a = null; render(); return; }
  if (a === "place" && UI.a && UI.b) {
    const p = { x: UI.a.x, y: UI.a.y, x2: UI.b.x, y2: UI.b.y };
    act(() => { if (S.sub !== "place" || !canPlace(S.players[actor()].board, S.L, S.cur[S.k].n, p.x, p.y, p.x2, p.y2)) return false; placeDomino(p); });
  }
  if (a === "discard") act(() => { if (S.sub !== "place" || placements(S.players[actor()].board, S.L, S.cur[S.k].n).length) return false; discardDomino(); });
});
document.addEventListener("click", e => { if (e.target.closest("[data-again]")) kit.rematch(); });

// ---------- Grafik ----------
// Kürzel für die Könige: erster Buchstabe, bei Gleichheit zwei
function initials(i) {
  const nm = S.players[i].name, first = nm.slice(0, 1).toUpperCase();
  return S.players.some((p, j) => j !== i && p.name.slice(0, 1).toUpperCase() === first) ? first + nm.slice(1, 2).toLowerCase() : first;
}
const kingBadge = i => `<span class="king" style="background:${COLORS[i]}" title="${esc(S.players[i].name)}">${esc(initials(i))}</span>`;
function cellSvg(c, x, y, extra = "") {
  if (c.t === "c") return `<rect x="${x}" y="${y}" width="10" height="10" fill="#ddd5c2"${extra}/><use href="#castle" x="${x + 1}" y="${y + 1}" width="8" height="8" style="color:${c.color || "#7a6a52"}"/>`;
  let s = `<rect x="${x}" y="${y}" width="10" height="10" fill="url(#t-${c.t})"${extra}/>`;
  for (let k = 0; k < c.c; k++) s += `<use href="#crown" x="${x + 0.6 + k * 3.1}" y="${y + 0.5}" width="3" height="2.4"/>`;
  return s;
}
const tileSvg = (n, cls = "tile") => `<svg class="${cls}" viewBox="0 0 20.4 10" aria-label="Domino ${n}: ${TERR[half(n, 0).t]}${half(n, 0).c ? ` mit ${half(n, 0).c} Krone${half(n, 0).c > 1 ? "n" : ""}` : ""} und ${TERR[half(n, 1).t]}${half(n, 1).c ? ` mit ${half(n, 1).c} Krone${half(n, 1).c > 1 ? "n" : ""}` : ""}">
  ${cellSvg(half(n, 0), 0, 0)}${cellSvg(half(n, 1), 10.4, 0)}</svg>`;
// Reich zeichnen: Bereich = was noch erlaubt ist, höchstens zwei Felder um das Gelegte
function boardSvg(pl, pi, opt = {}) {
  const b = bbox(pl.board), L = S.L;
  const x0 = Math.max(b.x0 - (opt.region ? 2 : 0), b.x1 - L + 1), x1 = Math.min(b.x1 + (opt.region ? 2 : 0), b.x0 + L - 1);
  const y0 = Math.max(b.y0 - (opt.region ? 2 : 0), b.y1 - L + 1), y1 = Math.min(b.y1 + (opt.region ? 2 : 0), b.y0 + L - 1);
  const W = (opt.full ? L : x1 - x0 + 1), H = (opt.full ? L : y1 - y0 + 1);
  const ox = opt.full ? b.x0 - Math.floor((L - (b.x1 - b.x0 + 1)) / 2) : x0, oy = opt.full ? b.y0 - Math.floor((L - (b.y1 - b.y0 + 1)) / 2) : y0;
  let s = `<svg viewBox="-.5 -.5 ${W * 10 + 1} ${H * 10 + 1}" role="img" aria-label="Reich von ${esc(pl.name)}">`;
  s += `<rect x="-.5" y="-.5" width="${W * 10 + 1}" height="${H * 10 + 1}" rx="1.5" fill="rgba(0,0,0,.25)"/>`;
  const fresh = S.fresh && S.fresh.p === pi ? S.fresh.at : [];
  for (let y = oy; y < oy + H; y++) for (let x = ox; x < ox + W; x++) {
    const c = pl.board[K(x, y)], px = (x - ox) * 10, py = (y - oy) * 10;
    if (c) {
      s += cellSvg(c.t === "c" ? { ...c, color: COLORS[pi] } : c, px + .2, py + .2, ` width="9.6" height="9.6"`).replace(/width="10" height="10"/, "");
      if (fresh.includes(K(x, y))) s += `<rect x="${px + .6}" y="${py + .6}" width="8.8" height="8.8" fill="none" stroke="#fff" stroke-width=".5" opacity=".8"/>`;
    } else if (opt.region) {
      const cls = opt.can && opt.can.has(K(x, y)) ? "slot can" : "slot";
      s += `<rect class="${cls}" data-x="${x}" data-y="${y}" x="${px + .4}" y="${py + .4}" width="9.2" height="9.2" rx="1"/>`;
    }
  }
  if (opt.preview) for (const pv of opt.preview) {
    const px = (pv.x - ox) * 10, py = (pv.y - oy) * 10;
    s += `<g class="prev">${cellSvg(pv.c, px + .2, py + .2)}</g><rect x="${px + .5}" y="${py + .5}" width="9" height="9" fill="none" stroke="#fff" stroke-width=".45" stroke-dasharray="1.2 .8"/>`;
    if (pv.sel) s += `<rect class="selA" x="${px + .8}" y="${py + .8}" width="8.4" height="8.4"/>`;
  }
  return s + "</svg>";
}

// ---------- Darstellung ----------
function rulesHtml() {
  const o = O(), L = S.L;
  return `<li>Jeder baut ein Reich aus Dominos rund um seine Burg. Es darf höchstens <b>${L}×${L}</b> Felder groß werden.</li>
    <li>Ein Domino wird so angelegt, dass mindestens eine Hälfte an die Burg oder an <b>dieselbe Landschaft</b> grenzt (waagerecht oder senkrecht). Passt es nirgends, wird es weggelegt.</li>
    <li><b>Auswahl:</b> Oben liegen zwei Reihen, sortiert nach Nummer. Wessen König auf dem niedrigsten Domino der aktuellen Reihe steht, ist zuerst dran: Domino anlegen, dann ein neues aus der nächsten Reihe wählen. Hohe Nummern sind wertvoller, mit niedrigen ist man in der nächsten Runde früher dran.</li>
    <li>${S.players.length === 2 ? "Zu zweit hat jeder zwei Könige und wählt zwei Dominos je Runde." : "Jeder hat einen König."} Die erste Wahl ist ausgelost.</li>
    <li><b>Wertung am Ende:</b> Jedes Gebiet aus zusammenhängender gleicher Landschaft bringt <b>Felder × Kronen</b>. Ein Gebiet ohne Krone bringt nichts.</li>
    ${o.mitte ? "<li><b>Mitte:</b> +10 Punkte, wenn die Burg genau in der Mitte des vollen Reichs liegt.</li>" : ""}
    ${o.harmonie ? "<li><b>Lückenlos:</b> +5 Punkte, wenn das Reich ganz ausgefüllt ist und kein Domino weggelegt wurde.</li>" : ""}
    <li>Bei Gleichstand gewinnt das größte Gebiet, danach die meisten Kronen.</li>`;
}
const legendHtml = () => Object.keys(TERR).map(t => `<div><svg viewBox="0 0 10 10" aria-hidden="true">${cellSvg({ t, c: 0 }, 0, 0)}</svg>${TERR[t]}</div>`).join("")
  + `<div><svg viewBox="0 0 10 10" aria-hidden="true"><rect width="10" height="10" fill="#333"/><use href="#crown" x="1" y="2" width="8" height="6.4"/></svg>Krone</div>`;

function render() {
  const lobby = S.phase === "lobby", mi = kit.me(), me = mine(), o = O();
  $("draft").hidden = $("realm").hidden = $("others").hidden = lobby;
  $("log").innerHTML = S.log.map(l => `<li>${l}</li>`).join("");
  $("rules-list").innerHTML = rulesHtml();
  if (!$("legend").innerHTML) $("legend").innerHTML = legendHtml();
  if (lobby) { $("result").hidden = true; $("score").innerHTML = ""; $("props").innerHTML = ""; return; }
  const key = `${S.seq}:${mi}`;
  if (UI.key !== key) { UI.key = key; UI.a = UI.b = null; }
  const ai = actor(), playing = ai >= 0;

  // Auswahl
  const line = (arr, label, pickable) => `<div class="line"><span class="lbl">${label}</span>
    <div class="doms${perLine() === 3 ? " n3" : ""}">${arr.map((d, k) => {
      const now = S.phase === "play" && arr === S.cur && k === S.k;
      const can = pickable && me && S.sub === "pick" && d.p === null;
      const tag = can ? "button" : "div";
      return `<${tag} class="dom${d.done ? " done" : ""}${now ? " now" : ""}${can ? " can" : ""}"${can ? ` type="button" data-n="${d.n}" aria-label="Domino ${d.n} wählen"` : ""}>
        ${tileSvg(d.n)}<span class="no">Nr. ${d.n}</span>${d.p !== null ? `<span class="king" style="background:${COLORS[d.p]}">${esc(initials(d.p))}</span>` : ""}</${tag}>`;
    }).join("")}</div></div>`;
  let dr = "";
  if (S.cur.length) dr += line(S.cur, "Diese Runde anlegen", false);
  if (S.next.length) dr += line(S.next, S.phase === "pick0" ? "Erste Wahl" : "Nächste Reihe wählen", true);
  if (!S.next.length && S.phase === "play") dr += `<p class="sk-muted" style="margin:0">Letzte Runde: Es gibt keine neuen Dominos mehr.</p>`;
  dr += `<p class="sk-muted" style="margin:0;font-size:13px">Noch ${S.deck.length} Dominos im Beutel · Reich ${S.L}×${S.L}${kit.online() && kit.roomId() ? ` · Raum ${kit.roomId()}` : ""}</p>`;
  $("draft").innerHTML = dr;

  // eigenes Reich (bzw. das des Spielers am Gerät)
  const vi = mi >= 0 ? mi : 0, pl = S.players[vi];
  $("realm-title").textContent = mi < 0 ? `Reich von ${pl.name}` : (kit.hotSeat() || pl.name !== "Du") ? `Reich von ${pl.name}` : "Dein Reich";
  $("realm-sub").textContent = `${pts(scoreOf(pl, o, S.L).total)}${pl.discards ? ` · ${pl.discards} weggelegt` : ""}`;
  let st = "", acts = "", hand = "", can = null, preview = null;
  if (playing) {
    const an = S.players[ai].name;
    if (!me) st = mi < 0 ? `Du schaust zu. <strong>${esc(an)}</strong> ist dran.` : `Warte auf <strong>${esc(an)}</strong>${S.players[ai].ai ? " (Computer)" : ""}.`;
    else if (S.sub === "pick") st = `<strong>${esc(an)}</strong>, wähle ein Domino aus der ${S.phase === "pick0" ? "Reihe" : "nächsten Reihe"} oben.`;
    else {
      const n = S.cur[S.k].n, ps = placements(pl.board, S.L, n);
      hand = tileSvg(n);
      if (!ps.length) { st = `Domino ${n} passt nirgends in dein Reich.`; acts = `<button class="btn primary big" type="button" data-a="discard">Weglegen</button>`; }
      else if (!UI.a) {
        st = `Tippe ein Feld für die linke Hälfte (<strong>${TERR[half(n, 0).t]}</strong>).`;
        can = new Set(ps.map(p => K(p.x, p.y)));
      } else if (!UI.b) {
        st = `Tippe daneben ein Feld für die rechte Hälfte (<strong>${TERR[half(n, 1).t]}</strong>).`;
        can = new Set(ps.filter(p => p.x === UI.a.x && p.y === UI.a.y).map(p => K(p.x2, p.y2)));
        preview = [{ x: UI.a.x, y: UI.a.y, c: half(n, 0), sel: true }];
        acts = `<button class="btn" type="button" data-a="back">Anderes Feld</button>`;
        can.add(K(UI.a.x, UI.a.y)); // erneut antippen: neu wählen
      } else {
        st = `So anlegen?`;
        preview = [{ x: UI.a.x, y: UI.a.y, c: half(n, 0) }, { x: UI.b.x, y: UI.b.y, c: half(n, 1) }];
        acts = `<button class="btn" type="button" data-a="back">Zurück</button><button class="btn primary big" type="button" data-a="place">Hier anlegen</button>`;
        can = new Set();
      }
    }
  } else if (S.phase === "over") st = "Das Spiel ist vorbei.";
  if (kit.error) st += `<span class="sk-err">${esc(kit.error)}</span>`;
  $("status").innerHTML = st;
  $("hand").innerHTML = hand;
  $("actions").innerHTML = acts;
  $("board").innerHTML = boardSvg(pl, vi, { region: true, can, preview });

  // die anderen Reiche
  $("others").innerHTML = S.players.map((p, i) => i === vi ? "" : `<div class="other${i === ai ? " on" : ""}">
    <div class="nm">${kingBadge(i)}<span>${esc(p.name)}</span></div>${boardSvg(p, i, { full: true })}
    <div class="meta">${pts(scoreOf(p, o, S.L).total)}${p.discards ? ` · ${p.discards} weg` : ""}</div></div>`).join("");

  // Wertung
  $("score").innerHTML = `<thead><tr><th>Spieler</th><th>Gebiete</th><th>Kronen</th><th>Punkte</th></tr></thead><tbody>${S.players.map((p, i) => {
    const r = scoreOf(p, o, S.L);
    return `<tr class="${i === ai ? "on" : ""}"><td>${kingBadge(i)} ${esc(p.name)}</td><td>${r.areas.filter(a => a.crowns).length}</td><td>${r.crowns}</td><td class="tot">${r.total}</td></tr>`;
  }).join("")}</tbody>`;
  const r = scoreOf(pl, o, S.L);
  $("props").innerHTML = `<div><b>${esc(pl.name)}:</b></div>` + (r.areas.filter(a => a.crowns).sort((a, b) => b.pts - a.pts).map(a => `<div>${TERR[a.t]}: ${a.size} ${a.size === 1 ? "Feld" : "Felder"} × ${a.crowns} ${a.crowns === 1 ? "Krone" : "Kronen"} = <b>${a.pts}</b></div>`).join("") || "<div>Noch kein Gebiet mit Krone.</div>")
    + (r.mitte ? `<div>Mitte: <b>+10</b></div>` : "") + (r.harmonie ? `<div>Lückenlos: <b>+5</b></div>` : "");

  // Ergebnis
  const res = $("result");
  if (S.phase === "over") {
    const rk = ranking(), top = rk[0];
    const tie = rk.filter(p => p.score === top.score && p.final.largest === top.final.largest && p.final.crowns === top.final.crowns);
    const again = kit.online() && !kit.isHost()
      ? `<p class="sk-muted">Ein neues Spiel kann ${esc((S.players.find(p => p.id === S.host) || {}).name || "der Gastgeber")} starten.</p>`
      : `<button class="btn primary" type="button" data-again>${kit.online() ? "Neues Spiel im selben Raum" : "Noch ein Spiel"}</button>`;
    res.innerHTML = `<h2>${tie.length > 1 ? `Gleichstand: ${tie.map(p => esc(p.name)).join(" und ")}` : `${esc(top.name)} ${vb(top.name, "gewinnst", "gewinnt")}`}</h2>
      <ol class="rank">${rk.map((p, k) => `<li><span>${k + 1}. ${esc(p.name)}</span><span>${pts(p.score)} · größtes Gebiet ${p.final.largest} · ${p.final.crowns} Kronen${p.final.mitte ? " · Mitte +10" : ""}${p.final.harmonie ? " · lückenlos +5" : ""}</span></li>`).join("")}</ol>${again}`;
    res.hidden = false;
  } else res.hidden = true;
}

// ---------- Einstellungen ----------
const chk = (id, t, sm, on) => `<label><input type="checkbox" id="${id}"${on ? " checked" : ""}>${t}<small>${sm}</small></label>`;
const setup = {
  html: `<div class="sk-field"><div class="sk-label">Zusatzpunkte</div><div class="sk-seg">
      ${chk("kl-mitte", "Mitte", "+10 für die Burg in der Mitte", false)}${chk("kl-harmonie", "Lückenlos", "+5 für ein volles Reich", false)}</div></div>
    <div class="sk-field"><div class="sk-label">Nur zu zweit</div><div class="sk-seg">
      ${chk("kl-gross", "Großes Reich", "7×7 mit allen 48 Dominos", false)}</div></div>`,
  read(root) {
    const c = id => !!(root.querySelector("#" + id) || {}).checked;
    return { mitte: c("kl-mitte"), harmonie: c("kl-harmonie"), gross: c("kl-gross") };
  },
};

// ---------- Spielkit verbinden ----------
kit = Spielkit.create({
  id: "kronland", version: 1, minPlayers: 2, maxPlayers: 4, bots: true, defaultBots: 1, botNames: BOT_NAMES,
  setup,
  defaultOptions: () => Object.assign({}, DEFAULTS),
  newPlayer, newState, onStart, whoActs, render,
  botPending, botStep: () => botStep(), nextUp: () => nextActor(), moveSound: "tile",
  onState: s => { S = s; },
  validState: s => Array.isArray(s.cur) && Array.isArray(s.next) && s.players.every(p => p.board && typeof p.board === "object"),
  roomStatus: s => `läuft · noch ${s.deck.length} Dominos`,
  handoverText: s => s.phase === "pick0" || s.sub === "pick" ? "Du wählst ein Domino." : "Du legst dein Domino an.",
  // nur für automatische Tests der Regeln
  test: { canPlace, placements, areas, scoreOf, half, TILES, deal, pickDomino, placeDomino, discardDomino, playBots, botStep, actor, tileSvg, get S() { return S; } },
});
kit.start();
})();
</script>
