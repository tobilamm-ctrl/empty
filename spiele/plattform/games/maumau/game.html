<style>
/* Layout: grüner Kartentisch mit Holzrand (Mitspieler, Stapel, Statuszeile), darunter die eigene Hand;
   rechts bzw. schmal darunter Wertung, Verlauf und Regeln */
:root {
  color-scheme: dark;
  --table: #0d1410;
  --sheet: #17221b;
  --sheet-2: #223127;
  --ink: #f2f4ef;
  --muted: #a1b0a6;
  --accent: #f0c24b;
  --tile-ink: #1b1f1a;
  --red: #e0605e;
  --green: #6fbf73;
  --felt: #1f6442;
  --felt-dark: #123d28;
  --wood: #6b4226;
  --wood-dark: #3f2615;
  --card: #fdfcf6;
  --suit-red: #c62f3b;
  --suit-black: #1d1f26;
  --font-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --font-hand: "Patrick Hand", "Comic Sans MS", cursive;
  --cw: 78px;   /* Kartenbreite in der Hand */
  --ov: 30px;   /* Überlappung in der Hand */
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--table); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px;
}
button { font: inherit; color: inherit; }
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 18px; }
header.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.brand h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(30px, 5vw, 44px); line-height: 1; margin: 0; letter-spacing: .5px; }
.brand h1 span { color: var(--accent); }
.brand .sub { color: var(--muted); font-size: 13px; }
.panel { background: var(--sheet); border-radius: 14px; padding: 16px; min-width: 0; }
.panel h2 { font-family: var(--font-display); font-weight: 400; font-size: 20px; margin: 0 0 10px; letter-spacing: .4px; }
main.game { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 980px) { main.game { grid-template-columns: minmax(0, 1fr) 340px; align-items: start; } }
.col { display: grid; gap: 18px; min-width: 0; }

/* ---------- Kartentisch ---------- */
.felt {
  background: radial-gradient(ellipse at 50% 40%, var(--felt) 0%, var(--felt-dark) 100%);
  border: 10px solid var(--wood); border-radius: 26px; padding: 16px;
  box-shadow: inset 0 0 0 2px var(--wood-dark), inset 0 0 40px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.4);
  display: grid; gap: 16px; min-width: 0;
}
.seats { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.seat {
  background: rgba(0,0,0,.22); border-radius: 12px; padding: 8px 10px 8px; min-width: 120px; flex: 0 1 auto;
  display: grid; gap: 4px; justify-items: center; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
}
.seat.on { box-shadow: 0 0 0 3px var(--accent); }
.seat .nm { font-weight: 800; font-size: 14px; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seat .nm small { font-weight: 600; color: var(--muted); }
.seat .meta { font-size: 12px; color: color-mix(in srgb, var(--ink) 75%, var(--felt)); font-variant-numeric: tabular-nums; }
.mini { display: flex; height: 36px; padding-left: 14px; }
.mini svg { width: 26px; height: 36px; margin-left: -14px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.4)); }
.chip { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 1px 8px; border-radius: 999px; background: var(--accent); color: var(--tile-ink); }
.chip.out { background: rgba(0,0,0,.35); color: var(--muted); }

.center { display: flex; flex-wrap: wrap; gap: 22px; align-items: center; justify-content: center; padding: 6px 0; }
.piles { display: flex; gap: 26px; align-items: flex-end; }
.pile { display: grid; gap: 6px; justify-items: center; }
.pile .lbl { font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: color-mix(in srgb, var(--ink) 70%, var(--felt)); }
.stack { position: relative; width: 96px; height: 134px; }
.stack svg { position: absolute; inset: 0; width: 96px; height: 134px; filter: drop-shadow(0 3px 6px rgba(0,0,0,.45)); }
button.stack { border: 0; padding: 0; background: none; cursor: pointer; border-radius: 9px; }
button.stack:disabled { cursor: default; }
button.stack.can { box-shadow: 0 0 0 3px var(--accent), 0 0 18px color-mix(in srgb, var(--accent) 60%, transparent); }
.pile .lbl.by { color: var(--accent); }
.stack.from { box-shadow: 0 0 0 3px var(--accent), 0 0 16px color-mix(in srgb, var(--accent) 55%, transparent); border-radius: 9px; }
.stack .empty { position: absolute; inset: 0; border: 2px dashed rgba(255,255,255,.3); border-radius: 9px; display: grid; place-items: center; color: rgba(255,255,255,.5); font-size: 12px; }
.info { display: grid; gap: 8px; justify-items: center; min-width: 150px; }
.wish {
  display: flex; align-items: center; gap: 10px; background: var(--card); color: var(--tile-ink); border-radius: 14px; padding: 8px 14px 8px 10px;
  box-shadow: 0 0 0 3px var(--accent), 0 6px 16px rgba(0,0,0,.4); animation: pulse 1.6s ease-in-out infinite;
}
.wish svg { width: 38px; height: 38px; }
.wish b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 22px; line-height: 1; }
.wish small { display: block; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #5c6158; }
.pending { background: var(--red); color: #fff; border-radius: 12px; padding: 6px 14px; font-family: var(--font-display); font-size: 20px; box-shadow: 0 4px 12px rgba(0,0,0,.35); }
.hint { font-size: 12.5px; color: color-mix(in srgb, var(--ink) 75%, var(--felt)); text-align: center; max-width: 220px; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px var(--accent), 0 6px 16px rgba(0,0,0,.4); } }

.status { text-align: center; min-height: 1.5em; margin: 0; font-size: 16px; }
.status strong { color: var(--accent); }
.status .sk-err { display: block; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.btn { min-height: 42px; }
.btn.small { min-height: 34px; }

/* Wunschfarbe wählen */
.wishbox { background: rgba(0,0,0,.3); border-radius: 14px; padding: 12px; display: grid; gap: 10px; justify-items: center; }
.wishbox p { margin: 0; font-weight: 800; }
.suits { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.suitbtn { border: 0; border-radius: 12px; background: var(--card); color: var(--tile-ink); padding: 6px 12px 6px 8px; min-height: 48px; display: flex; align-items: center; gap: 6px; cursor: pointer; font-weight: 800; }
.suitbtn svg { width: 30px; height: 30px; }
.suitbtn:hover, .suitbtn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.suitbtn em { font-style: normal; font-size: 11px; color: #6a6f66; font-weight: 600; }

/* ---------- eigene Hand ---------- */
.handzone { background: linear-gradient(var(--felt-dark), #0f3220); border-radius: 18px; padding: 12px 12px 14px; box-shadow: inset 0 0 0 2px rgba(255,255,255,.05); min-width: 0; }
.handzone h2 { font-family: var(--font-display); font-weight: 400; font-size: 18px; margin: 0; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.handzone h2 small { font-family: var(--font-body); font-size: 13px; color: var(--muted); }
.hand { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; align-content: flex-start; row-gap: 18px; padding: 18px 0 4px var(--ov); min-height: 140px; }
.card {
  width: var(--cw); aspect-ratio: 100 / 140; border: 0; padding: 0; background: none; border-radius: 8px; margin-left: calc(-1 * var(--ov));
  position: relative; transition: transform .15s ease, filter .15s ease; filter: drop-shadow(-2px 2px 3px rgba(0,0,0,.35));
}
.card svg { width: 100%; height: 100%; display: block; }
.card.ok { cursor: pointer; transform: translateY(-12px); }
.card.ok svg { border-radius: 8px; box-shadow: 0 0 0 3px var(--accent); }
.card.ok:hover, .card.ok:focus-visible { transform: translateY(-20px); outline: none; z-index: 2; }
.card.dim svg { filter: brightness(.72) saturate(.6); }
.card.new::after { content: "neu"; position: absolute; top: -18px; left: 4px; font-size: 11px; font-weight: 800; color: var(--accent); }
.card:disabled { cursor: default; }
.handnote { text-align: center; color: var(--muted); margin: 18px 0; }

/* ---------- Karten in SVG ---------- */
svg text { font-family: var(--font-display); }

/* ---------- Seitenleiste ---------- */
.result { border: 2px solid var(--accent); }
.result h2 { color: var(--accent); }
.result p { margin: 0 0 10px; }
.rank { list-style: none; padding: 0; margin: 0 0 12px; display: grid; gap: 4px; font-variant-numeric: tabular-nums; }
.rank li { display: flex; justify-content: space-between; gap: 12px; background: var(--sheet-2); border-radius: 8px; padding: 6px 10px; }
.rank li:first-child { box-shadow: inset 0 0 0 2px var(--accent); }
.rest { display: grid; gap: 8px; margin: 0 0 12px; }
.rest .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--sheet-2); border-radius: 10px; padding: 6px 10px; }
.rest .who { min-width: 90px; font-weight: 800; }
.rest .pts { margin-left: auto; font-family: var(--font-display); font-size: 18px; font-variant-numeric: tabular-nums; }
.rest .cards { display: flex; padding-left: 16px; flex-wrap: wrap; }
.rest .cards svg { width: 34px; height: 48px; margin-left: -16px; filter: drop-shadow(-1px 1px 2px rgba(0,0,0,.4)); }
.score-wrap { overflow-x: auto; }
table.score { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 14px; }
.score th, .score td { padding: 5px 6px; text-align: center; border-bottom: 1px solid var(--sheet-2); white-space: nowrap; }
.score th:first-child, .score td:first-child { text-align: left; max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
.score thead th { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.score td.r { font-weight: 600; font-size: 14px; color: color-mix(in srgb, var(--ink) 85%, var(--muted)); }
.score td.r.win { color: var(--green); }
.score td.tot { font-family: var(--font-display); font-size: 18px; }
.score tr.on td:first-child { color: var(--accent); }
.score-note { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-size: 13.5px; max-height: 300px; overflow-y: auto; }
.log li { color: var(--muted); }
.log li b { color: var(--ink); }
.log .mau { color: var(--accent); font-weight: 800; }
.rules { font-size: 14px; }
.rules summary { cursor: pointer; font-family: var(--font-display); font-size: 20px; letter-spacing: .4px; }
.rules ul { padding-left: 18px; margin: 10px 0 0; display: grid; gap: 6px; }
.rules .off { color: var(--muted); }
.rules .off b { text-decoration: line-through; }

/* ---------- schmale Bildschirme ---------- */
@media (max-width: 560px) {
  :root { --cw: 64px; --ov: 24px; }
  .felt { border-width: 7px; padding: 12px 10px; border-radius: 20px; }
  .seat { min-width: 0; padding: 6px 8px; }
  .seat .nm { max-width: 110px; }
  .center { gap: 14px; }
  .piles { gap: 16px; }
  .stack, .stack svg { width: 78px; height: 109px; }
  .handzone { padding: 10px 8px 12px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const { esc, rnd } = Spielkit;

// ---------- Karten ----------
// Eine Karte ist ein Text: Farbe (kr, pi, he, ka) + Wert (7, 8, 9, 10, B, D, K, A), z. B. "he10" oder "piB".
const SUITS = ["kr", "pi", "he", "ka"];
const RANKS = ["7", "8", "9", "10", "B", "D", "K", "A"];
const SUIT_NAME = { kr: "Kreuz", pi: "Pik", he: "Herz", ka: "Karo" };
const RANK_NAME = { 7: "7", 8: "8", 9: "9", 10: "10", B: "Bube", D: "Dame", K: "König", A: "Ass" };
const WITH_ART = { 7: "eine 7", 8: "eine 8", 9: "eine 9", 10: "eine 10", B: "ein Bube", D: "eine Dame", K: "ein König", A: "ein Ass" };
const POINTS = { 7: 7, 8: 8, 9: 9, 10: 10, B: 2, D: 3, K: 4, A: 11 };
const suitOf = c => c.slice(0, 2);
const rankOf = c => c.slice(2);
const isRed = s => s === "he" || s === "ka";
const cardName = c => `${SUIT_NAME[suitOf(c)]} ${RANK_NAME[rankOf(c)]}`;
const points = c => POINTS[rankOf(c)];
const handPoints = h => h.reduce((a, c) => a + points(c), 0);
const fullDeck = () => SUITS.flatMap(s => RANKS.map(r => s + r));
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const sortHand = h => h.slice().sort((a, b) => SUITS.indexOf(suitOf(a)) - SUITS.indexOf(suitOf(b)) || RANKS.indexOf(rankOf(a)) - RANKS.indexOf(rankOf(b)));

const DEFAULTS = { hand: 5, ende: "r5", sieben: true, acht: true, bube: true, ass: false };
const ENDE = { r3: "3 Runden", r5: "5 Runden", r10: "10 Runden", p100: "bis 100 Strafpunkte" };

let S, kit;
const UI = { wishFor: null, key: "" };
const O = () => Object.assign({}, DEFAULTS, S.options || {});
const log = html => { S.log.unshift(html); S.log = S.log.slice(0, 80); };
const pname = i => `<b>${esc(S.players[i].name)}</b>`;
const top = () => S.discard[S.discard.length - 1];
const nextIdx = (i, k = 1) => (i + k) % S.players.length;
// Wie viele Karten es pro Spieler gibt: Einstellung, aber so, dass genug zum Ziehen übrig bleibt
const handSize = (n, want) => Math.min(want, Math.floor(30 / n));
const badStart = (c, o) => ["7", "8", "B"].includes(rankOf(c)) || (o.ass && rankOf(c) === "A");

// ---------- Regeln (verändern nur S, laufen über kit.act) ----------
// Darf diese Karte gerade gelegt werden?
function canPlay(c) {
  const o = O(), t = top(), r = rankOf(c);
  if (S.pending > 0) return o.sieben && r === "7";        // gegen eine 7 hilft nur eine 7
  if (S.drawn && c !== S.drawn) return false;              // nach dem Ziehen nur die gezogene Karte
  if (o.bube && r === "B") return rankOf(t) !== "B";       // Bube auf alles, nur nicht auf einen Buben
  if (S.wish) return suitOf(c) === S.wish;
  return suitOf(c) === suitOf(t) || r === rankOf(t);
}
const needsWish = c => O().bube && rankOf(c) === "B";
const legalCards = i => S.players[i].hand.filter(canPlay);

function reshuffle() {
  if (S.discard.length < 2) return false;
  const keep = S.discard.pop();
  S.deck = shuffle(S.discard);
  S.discard = [keep];
  log("Der Stapel ist leer. Die Ablage wird gemischt und als neuer Stapel hingelegt.");
  return true;
}
function drawCards(i, n) {
  const got = [];
  for (let k = 0; k < n; k++) {
    if (!S.deck.length && !reshuffle()) break;
    const c = S.deck.pop();
    S.players[i].hand.push(c);
    got.push(c);
  }
  return got;
}

function startRound() {
  const o = O(), n = S.players.length, size = handSize(n, o.hand);
  S.roundNo++;
  S.deck = shuffle(fullDeck());
  // Startkarte zuerst aus dem vollen Stapel: nie 7, 8, Bube oder (falls die Regel an ist) Ass
  const c = S.deck.splice(S.deck.findIndex(x => !badStart(x, o)), 1)[0];
  S.players.forEach(p => { p.hand = []; });
  for (let k = 0; k < size; k++) S.players.forEach(p => p.hand.push(S.deck.pop()));
  S.discard = [c]; S.by = null;
  S.wish = null; S.pending = 0; S.drawn = null; S.passStreak = 0; S.last = null;
  S.active = S.starter; S.phase = "play"; S.seq++;
  log(`<b>Runde ${S.roundNo}</b>: ${size} Karten für jeden${size < o.hand ? ` (bei ${n} Spielern nicht mehr, damit genug zum Ziehen bleibt)` : ""}, Startkarte ${cardName(c)}. ${pname(S.active)} beginnt.`);
}

function endRound(winner) {
  S.players.forEach((p, i) => {
    const pts = i === winner ? 0 : handPoints(p.hand);
    p.rounds.push(pts); p.total += pts;
    if (i === winner) p.wins++;
  });
  S.last = { winner, hands: S.players.map(p => p.hand.slice()) };
  S.drawn = null; S.pending = 0; S.seq++;
  const o = O();
  const done = o.ende === "p100" ? S.players.some(p => p.total >= 100) : S.roundNo >= +o.ende.slice(1);
  S.phase = done ? "over" : "roundover";
  if (done) {
    const best = Math.min(...S.players.map(p => p.total));
    const win = S.players.filter(p => p.total === best).map(p => `<b>${esc(p.name)}</b>`);
    log(`<b>Spielende.</b> Am wenigsten Strafpunkte (${best}): ${win.join(" und ")}.`);
  }
}

// Karte legen und Wirkung ausführen
function playCard(c, wish) {
  const i = S.active, p = S.players[i], o = O(), r = rankOf(c);
  p.hand.splice(p.hand.indexOf(c), 1);
  S.discard.push(c); S.by = i;
  S.wish = null; S.drawn = null; S.passStreak = 0; S.seq++;
  let txt = `${pname(i)} legt ${cardName(c)}`;
  if (needsWish(c)) { S.wish = wish; txt += ` und wünscht sich <b>${SUIT_NAME[wish]}</b>`; }
  log(txt + ".");
  if (!p.hand.length) { log(`<span class="mau">Mau-Mau!</span> ${pname(i)} gewinnt Runde ${S.roundNo}.`); endRound(i); return; }
  if (p.hand.length === 1) log(`<span class="mau">Mau!</span> ${pname(i)} hat nur noch eine Karte.`);
  if (r === "7" && o.sieben) { S.pending += 2; S.active = nextIdx(i); return; }
  if (r === "8" && o.acht) {
    log(`${pname(nextIdx(i))} setzt aus.`);
    S.active = nextIdx(i, 2); return;
  }
  if (r === "A" && o.ass) { log(`${pname(i)} darf noch einmal.`); return; }
  S.active = nextIdx(i);
}

// Ziehen: offene Siebener-Strafe oder eine Karte
function drawAction() {
  const i = S.active; S.seq++;
  if (S.pending > 0) {
    const want = S.pending, got = drawCards(i, want);
    log(`${pname(i)} zieht ${got.length} Karte${got.length === 1 ? "" : "n"}${got.length < want ? " (mehr sind nicht da)" : ""} und setzt aus.`);
    S.pending = 0; S.active = nextIdx(i);
    return;
  }
  const got = drawCards(i, 1);
  if (!got.length) {
    log(`${pname(i)} kann nicht legen, und es gibt keine Karte mehr zum Ziehen.`);
    S.passStreak++;
    if (S.passStreak >= 2 * S.players.length) { log("Keiner kann mehr legen. Die Runde endet ohne Sieger."); endRound(-1); return; }
    S.active = nextIdx(i); return;
  }
  log(`${pname(i)} zieht eine Karte.`);
  if (canPlay(got[0])) S.drawn = got[0];
  else S.active = nextIdx(i);
}
function passTurn() {
  S.drawn = null; S.seq++;
  log(`${pname(S.active)} behält die gezogene Karte.`);
  S.active = nextIdx(S.active);
}
function nextRound() {
  S.starter = nextIdx(S.starter);
  startRound();
  playBots();
}

// ---------- Computer-Gegner ----------
// Lieblingsfarbe: die häufigste Farbe auf der Hand (ohne Buben), bei Gleichstand die mit mehr Punkten
function favSuit(hand) {
  const o = O();
  const rest = hand.filter(c => !(o.bube && rankOf(c) === "B"));
  if (!rest.length) return SUITS[rnd(4)];
  let best = null, bv = -1;
  for (const s of SUITS) {
    const cs = rest.filter(c => suitOf(c) === s);
    const v = cs.length * 100 + handPoints(cs);
    if (cs.length && v > bv) { bv = v; best = s; }
  }
  return best;
}
function botChoose(i, legal) {
  const o = O(), p = S.players[i], n = S.players.length;
  const nextFew = S.players[nextIdx(i)].hand.length <= 2;
  let best = null, bv = -Infinity;
  for (const c of legal) {
    const r = rankOf(c), rest = p.hand.filter(x => x !== c);
    let v = points(c);                                              // hohe Werte früh loswerden
    v += 2 * rest.filter(x => suitOf(x) === suitOf(c)).length;      // Farbe, von der noch viel da ist
    if (o.bube && r === "B") v = rest.length <= 1 ? 40 : -30;       // Buben als Joker aufheben
    if (o.sieben && r === "7") v += nextFew ? 18 : 3;
    if (o.acht && r === "8") v += nextFew ? 14 : (n === 2 ? 6 : 3);
    if (o.ass && r === "A") v += rest.some(x => suitOf(x) === suitOf(c) || rankOf(x) === "A" || (o.bube && rankOf(x) === "B")) ? 6 : -6;
    v += Math.random() * 0.5;
    if (v > bv) { bv = v; best = c; }
  }
  return best;
}
function botStep() {
  const i = S.active, p = S.players[i];
  if (S.drawn) {
    const c = S.drawn;
    if (needsWish(c) && p.hand.length > 3) passTurn();             // gezogenen Buben lieber behalten
    else playCard(c, needsWish(c) ? favSuit(p.hand.filter(x => x !== c)) : null);
    return;
  }
  const legal = legalCards(i);
  if (!legal.length) { drawAction(); return; }
  const c = botChoose(i, legal);
  playCard(c, needsWish(c) ? favSuit(p.hand.filter(x => x !== c)) : null);
}
function playBots() {
  let guard = 0;
  while (S.phase === "play" && S.players[S.active].ai && guard++ < 3000) botStep();
}

// ---------- Spielstand ----------
const newPlayer = r => ({ id: r.id, name: r.name, ai: r.ai, hand: [], total: 0, rounds: [], wins: 0 });
function newState({ roster, mode, options }) {
  const s = { players: roster.map(newPlayer), deck: [], discard: [], active: 0, starter: 0, wish: null, pending: 0, drawn: null,
    passStreak: 0, roundNo: 0, last: null, phase: "play", seq: 0, log: [], options: Object.assign({}, DEFAULTS, options) };
  if (mode !== "online") {
    const nh = roster.filter(r => !r.ai).length;
    s.starter = nh > 1 ? rnd(nh) : 0;   // lokal beginnt ein Mensch (die Menschen stehen vorn)
    S = s; startRound();
  }
  return s;
}
function onStart(s) {
  S = s;
  S.starter = rnd(S.players.length);
  startRound();
  playBots();
}
const whoActs = () => (S.phase === "play" ? [S.active] : []);

// ---------- Eingaben ----------
const mine = () => S.phase === "play" && kit.me() === S.active;
function doPlay(c, wish) {
  const seq = S.seq;
  UI.wishFor = null;
  kit.act(() => {
    if (!mine() || S.seq !== seq) return false;
    if (!S.players[S.active].hand.includes(c) || !canPlay(c)) return false;
    if (needsWish(c) && !SUITS.includes(wish)) return false;
    playCard(c, needsWish(c) ? wish : null);
    playBots();
  });
}
function doDraw() {
  const seq = S.seq;
  UI.wishFor = null;
  kit.act(() => { if (!mine() || S.seq !== seq || S.drawn) return false; drawAction(); playBots(); });
}
$("hand").addEventListener("click", e => {
  const b = e.target.closest(".card[data-c]");
  if (!b || b.disabled) return;
  const c = b.dataset.c;
  if (needsWish(c)) { UI.wishFor = c; render(); const fb = $("suits").querySelector("button"); if (fb) fb.focus(); return; }
  doPlay(c, null);
});
$("suits").addEventListener("click", e => { const b = e.target.closest("[data-wish]"); if (b && UI.wishFor) doPlay(UI.wishFor, b.dataset.wish); });
$("btn-nowish").addEventListener("click", () => { UI.wishFor = null; render(); });
$("btn-draw").addEventListener("click", doDraw);
$("drawpile").addEventListener("click", doDraw);
$("btn-pass").addEventListener("click", () => {
  const seq = S.seq;
  kit.act(() => { if (!mine() || S.seq !== seq || !S.drawn) return false; passTurn(); playBots(); });
});
document.addEventListener("click", e => {
  if (e.target.closest("[data-next]")) {
    const seq = S.seq;
    kit.act(() => { if (S.phase !== "roundover" || S.seq !== seq || kit.me() < 0) return false; nextRound(); });
  }
  if (e.target.closest("[data-again]")) kit.rematch();
});

// ---------- Kartengrafik ----------
const use = (s, x, y, w, extra = "") => `<use href="#su-${s}" x="${x}" y="${y}" width="${w}" height="${w}"${extra}/>`;
// Positionen der Zeichen auf den Zahlkarten (Kartenfläche 100 × 140)
const L = 31, R = 69, M = 50;
const PIPS = {
  7: [[L, 30], [R, 30], [M, 50], [L, 70], [R, 70], [L, 110], [R, 110]],
  8: [[L, 30], [R, 30], [M, 50], [L, 70], [R, 70], [M, 90], [L, 110], [R, 110]],
  9: [[L, 30], [R, 30], [L, 57], [R, 57], [M, 70], [L, 83], [R, 83], [L, 110], [R, 110]],
  10: [[L, 30], [R, 30], [M, 44], [L, 57], [R, 57], [L, 83], [R, 83], [M, 96], [L, 110], [R, 110]],
};
function faceArt(r, s, col) {
  const tint = isRed(s) ? "#f9e2de" : "#e2e6ef", gold = "#e3aa32";
  let em = "";
  if (r === "K") em = `<path d="M31 62 35 38 43 50 50 32 57 50 65 38 69 62Z" fill="${gold}" stroke="${col}" stroke-width="2" stroke-linejoin="round"/><rect x="31" y="61" width="38" height="7" rx="2" fill="${col}"/><circle cx="50" cy="31" r="3" fill="${col}"/>`;
  else if (r === "D") em = [0, 1, 2, 3, 4, 5].map(k => { const a = k * Math.PI / 3; return `<circle cx="${(50 + 12 * Math.cos(a)).toFixed(1)}" cy="${(48 + 12 * Math.sin(a)).toFixed(1)}" r="6.5" fill="${col}"/>`; }).join("") + `<circle cx="50" cy="48" r="7" fill="${gold}"/>`;
  else em = `<path d="M30 62Q50 30 70 62Z" fill="${col}"/><path d="M58 46Q72 34 74 22 64 32 54 40Z" fill="${gold}" stroke="${col}" stroke-width="1.5"/><rect x="28" y="60" width="44" height="5" rx="2" fill="${gold}"/>`;
  return `<rect x="20" y="22" width="60" height="96" rx="6" fill="${tint}" stroke="${col}" stroke-width="1.6"/>${em}
    <g fill="${col}">${use(s, 42, 72, 16)}<text x="50" y="110" text-anchor="middle" font-size="22">${r}</text></g>`;
}
function cardSvg(c) {
  const s = suitOf(c), r = rankOf(c), col = isRed(s) ? "var(--suit-red)" : "var(--suit-black)";
  const corner = `<text x="11" y="19" text-anchor="middle" font-size="${r === "10" ? 14 : 17}">${r}</text>${use(s, 5, 23, 12)}`;
  let mid;
  if (PIPS[r]) mid = PIPS[r].map(([x, y]) => use(s, x - 9, y - 9, 18, y > 70 ? ` transform="rotate(180 ${x} ${y})"` : "")).join("");
  else if (r === "A") mid = `<circle cx="50" cy="70" r="30" fill="none" stroke="${col}" stroke-width="1.2" opacity=".35"/>${use(s, 28, 48, 44)}`;
  else mid = faceArt(r, s, col);
  return `<svg viewBox="0 0 100 140" aria-hidden="true"><rect x="1" y="1" width="98" height="138" rx="8" fill="var(--card)" stroke="#c7c1b0" stroke-width="1.5"/>
    <g fill="${col}">${corner}<g transform="rotate(180 50 70)">${corner}</g>${PIPS[r] || r === "A" ? mid : ""}</g>${PIPS[r] || r === "A" ? "" : mid}</svg>`;
}
const backSvg = () => `<svg viewBox="0 0 100 140" aria-hidden="true"><rect x="1" y="1" width="98" height="138" rx="8" fill="#f4efe2" stroke="#c7c1b0" stroke-width="1.5"/>
  <rect x="7" y="7" width="86" height="126" rx="5" fill="url(#mm-weave)"/><rect x="7" y="7" width="86" height="126" rx="5" fill="none" stroke="#e6c27a" stroke-width="1.5"/>
  <ellipse cx="50" cy="70" rx="20" ry="26" fill="#7d2130" stroke="#e6c27a" stroke-width="2"/><text x="50" y="79" text-anchor="middle" font-size="24" fill="#e6c27a">M</text></svg>`;
const suitSvg = s => `<svg viewBox="0 0 100 100" aria-hidden="true"><g fill="${isRed(s) ? "var(--suit-red)" : "var(--suit-black)"}">${use(s, 0, 0, 100)}</g></svg>`;

// ---------- Darstellung ----------
function rulesHtml() {
  const o = O(), off = on => (on ? "" : ' class="off"'), tag = on => (on ? "" : " <i>(in diesem Spiel aus)</i>");
  return `<li>Gespielt wird mit 32 Karten: Kreuz, Pik, Herz und Karo, jeweils 7, 8, 9, 10, Bube, Dame, König und Ass. Jeder bekommt ${o.hand} Karten, eine Karte liegt offen auf der Ablage.</li>
    <li>Wer dran ist, legt eine Karte, die in <b>Farbe oder Wert</b> zur obersten Karte der Ablage passt.</li>
    <li>Kannst oder willst du nicht legen, ziehst du eine Karte vom Stapel. Passt sie, darfst du sie sofort legen. Sonst ist der Nächste dran.</li>
    <li${off(o.sieben)}><b>7:</b> Der Nächste muss 2 Karten ziehen und setzt damit aus. Hat er selbst eine 7, legt er sie drauf, und der Übernächste muss 4 ziehen, und so weiter.${tag(o.sieben)}</li>
    <li${off(o.acht)}><b>8:</b> Der Nächste setzt aus. Zu zweit bist du also gleich noch einmal dran.${tag(o.acht)}</li>
    <li${off(o.bube)}><b>Bube:</b> passt auf jede Karte, nur nicht auf einen Buben. Wer ihn legt, wünscht sich eine Farbe. Der Nächste muss diese Farbe legen oder ziehen.${tag(o.bube)}</li>
    <li${off(o.ass)}><b>Ass:</b> Du legst gleich noch eine Karte hinterher oder ziehst eine.${tag(o.ass)}</li>
    <li>Wer die vorletzte Karte legt, sagt <b>„Mau“</b>. Wer die letzte Karte legt, ruft <b>„Mau-Mau“</b> und gewinnt die Runde. Das Ansagen übernimmt der Verlauf.</li>
    <li>Die anderen bekommen ihre Restkarten als <b>Strafpunkte</b>: 7 bis 10 nach Zahl, Bube 2, Dame 3, König 4, Ass 11.</li>
    <li>Das Spiel dauert ${o.ende === "p100" ? "so lange, bis jemand <b>100 Strafpunkte</b> erreicht" : `<b>${ENDE[o.ende]}</b>`}. Es gewinnt, wer am wenigsten Strafpunkte hat.</li>
    <li>Ist der Stapel leer, wird die Ablage bis auf die oberste Karte gemischt und wird zum neuen Stapel. Die Startkarte ist nie eine 7, 8 oder ein Bube${o.ass ? " und auch kein Ass" : ""}.</li>`;
}

function render() {
  const lobby = S.phase === "lobby", mi = kit.me(), me = mine(), o = O();
  const playing = S.phase === "play";
  $("felt").hidden = $("handzone").hidden = lobby;
  const key = `${S.seq}:${mi}`;
  if (UI.key !== key) { UI.key = key; UI.wishFor = null; }
  const a = S.players[S.active];

  // Mitspieler (alle außer dem, der das Gerät bedient)
  $("seats").innerHTML = S.players.map((p, i) => {
    if (i === mi) return "";
    const n = p.hand.length;
    const backs = Array.from({ length: Math.min(n, 9) }, backSvg).join("");
    return `<div class="seat${playing && i === S.active ? " on" : ""}">
      <div class="nm">${esc(p.name)}${p.ai ? " <small>Computer</small>" : ""}</div>
      <div class="mini" aria-hidden="true">${backs}</div>
      <div class="meta">${n} Karte${n === 1 ? "" : "n"} · ${p.total} Strafpunkte</div>
      ${playing && n === 1 ? '<span class="chip">Mau</span>' : ""}</div>`;
  }).join("");

  // Stapel und Ablage
  const canDraw = me && !S.drawn;
  $("drawpile").innerHTML = S.deck.length ? backSvg() : `<span class="empty">leer</span>`;
  $("drawpile").disabled = !canDraw;
  $("drawpile").classList.toggle("can", canDraw && !legalCards(S.active).length);
  $("drawcount").textContent = `Stapel · ${S.deck.length}`;
  const under = S.discard.slice(-3);
  $("discard").innerHTML = under.map((c, k) => {
    const rot = k === under.length - 1 ? 0 : ((c.charCodeAt(0) * 7 + c.charCodeAt(c.length - 1) * 13) % 17) - 8;
    return cardSvg(c).replace("<svg ", `<svg style="transform:rotate(${rot}deg)" `);
  }).join("");
  $("discard").setAttribute("aria-label", S.discard.length ? `Oben liegt ${cardName(top())}` : "Ablage leer");
  // wer die oberste Karte gelegt hat (andere hervorgehoben)
  const by = S.by != null && S.players[S.by] ? S.by : -1;
  $("discard-lbl").innerHTML = by >= 0 ? `von ${esc(S.players[by].name)}` : "Ablage";
  $("discard-lbl").classList.toggle("by", by >= 0 && by !== mi);
  $("discard").classList.toggle("from", by >= 0 && by !== mi && S.phase === "play");

  let info = "";
  if (playing && S.wish) info += `<div class="wish" role="status">${suitSvg(S.wish)}<div><small>Gewünscht</small><b>${SUIT_NAME[S.wish]}</b></div></div>`;
  if (playing && S.pending) info += `<div class="pending">+${S.pending} ziehen</div>`;
  if (playing && !info) info = `<div class="hint">Passend: ${SUIT_NAME[suitOf(top())]} oder ${WITH_ART[rankOf(top())]}${o.bube && rankOf(top()) !== "B" ? ", dazu jeder Bube" : ""}.</div>`;
  $("info").innerHTML = info;

  // Statuszeile
  let st = "";
  if (playing) {
    if (!me) st = mi < 0 ? `Du schaust zu. <strong>${esc(a.name)}</strong> ist dran.` : `Warte auf <strong>${esc(a.name)}</strong>.`;
    else if (S.pending) st = legalCards(S.active).length ? `Du musst <strong>${S.pending} Karten</strong> ziehen oder legst selbst eine 7.` : `Du musst <strong>${S.pending} Karten</strong> ziehen.`;
    else if (S.drawn) st = `Die gezogene Karte <strong>${cardName(S.drawn)}</strong> passt. Legen oder behalten?`;
    else if (UI.wishFor) st = `Du legst <strong>${cardName(UI.wishFor)}</strong>.`;
    else st = `<strong>Du bist dran.</strong> ${S.wish ? `Gewünscht ist ${SUIT_NAME[S.wish]}. ` : ""}` + (legalCards(S.active).length ? "Lege eine hervorgehobene Karte oder ziehe eine." : "Keine Karte passt, du musst ziehen.");
  } else if (S.phase === "roundover") st = `Runde ${S.roundNo} ist vorbei.`;
  else if (S.phase === "over") st = "Das Spiel ist vorbei.";
  if (kit.error) st += `<span class="sk-err">${esc(kit.error)}</span>`;
  $("status").innerHTML = st;

  // Knöpfe
  $("actions").hidden = !me || !!UI.wishFor;
  $("btn-draw").hidden = !!S.drawn;
  $("btn-draw").textContent = S.pending ? `${S.pending} Karten ziehen` : "Karte ziehen";
  $("btn-pass").hidden = !S.drawn;
  $("wishbox").hidden = !(me && UI.wishFor);
  if (me && UI.wishFor) {
    const rest = a.hand.filter(c => c !== UI.wishFor);
    $("suits").innerHTML = SUITS.map(s => {
      const k = rest.filter(c => suitOf(c) === s && !(o.bube && rankOf(c) === "B")).length;
      return `<button type="button" class="suitbtn" data-wish="${s}">${suitSvg(s)}<span>${SUIT_NAME[s]}<br><em>${k} auf der Hand</em></span></button>`;
    }).join("");
  }

  // eigene Hand: nur die Karten dessen, der das Gerät bedient
  const meP = S.players[mi];
  if (!meP) {
    $("hand-title").textContent = "Zuschauer";
    $("hand-sub").textContent = "";
    $("hand").innerHTML = `<p class="handnote">Du spielst in diesem Raum nicht mit.</p>`;
  } else {
    $("hand-title").textContent = kit.hotSeat() ? `Karten von ${meP.name}` : "Deine Karten";
    $("hand-sub").textContent = `${meP.hand.length} Karte${meP.hand.length === 1 ? "" : "n"} · ${handPoints(meP.hand)} Punkte auf der Hand · ${meP.total} Strafpunkte`;
    const hand = sortHand(meP.hand);
    $("hand").innerHTML = hand.length ? hand.map(c => {
      const ok = me && !UI.wishFor && canPlay(c);
      const cls = ok ? " ok" : me ? " dim" : "";
      return `<button type="button" class="card${cls}${c === S.drawn ? " new" : ""}" data-c="${c}" aria-label="${cardName(c)}${ok ? ", spielbar" : ""}"${ok ? "" : " disabled"}>${cardSvg(c)}</button>`;
    }).join("") : `<p class="handnote">Keine Karten mehr.</p>`;
  }

  // Runde vorbei
  const rp = $("round-panel");
  if ((S.phase === "roundover" || S.phase === "over") && S.last) {
    const w = S.last.winner;
    const head = w >= 0 ? `${esc(S.players[w].name)} macht Mau-Mau` : "Runde ohne Sieger";
    rp.innerHTML = `<h2>Runde ${S.roundNo}: ${head}</h2>
      <div class="rest">${S.players.map((p, i) => `<div class="row"><span class="who">${esc(p.name)}</span>
        <span class="cards">${sortHand(S.last.hands[i]).map(cardSvg).join("")}</span>
        <span class="pts">${i === w ? "0" : "+" + handPoints(S.last.hands[i])}</span></div>`).join("")}</div>
      ${S.phase === "roundover" ? (mi >= 0 ? `<button class="btn primary" type="button" data-next>Nächste Runde</button>` : `<p class="sk-muted">Gleich geht es weiter.</p>`) : ""}`;
    rp.hidden = false;
  } else rp.hidden = true;

  // Wertung
  const nR = Math.max(0, ...S.players.map(p => p.rounds.length));
  $("score").innerHTML = `<thead><tr><th>Spieler</th>${Array.from({ length: nR }, (_, k) => `<th>R${k + 1}</th>`).join("")}<th>Summe</th></tr></thead><tbody>${S.players.map((p, i) =>
    `<tr class="${playing && i === S.active ? "on" : ""}"><td title="${esc(p.name)}">${esc(p.name)}</td>${p.rounds.map(v => `<td class="r${v === 0 ? " win" : ""}">${v === 0 ? "0" : v}</td>`).join("")}<td class="tot">${p.total}</td></tr>`).join("")}</tbody>`;
  $("score-note").textContent = o.ende === "p100" ? `Runde ${Math.max(1, S.roundNo)} · Schluss, sobald jemand 100 Strafpunkte hat.`
    : `Runde ${Math.max(1, S.roundNo)} von ${o.ende.slice(1)}${kit.online() && kit.roomId() ? ` · Raum ${kit.roomId()}` : ""}`;

  $("log").innerHTML = S.log.map(l => `<li>${l}</li>`).join("");
  $("rules-list").innerHTML = rulesHtml();

  // Ergebnis
  const res = $("result");
  if (S.phase === "over") {
    const rank = S.players.slice().sort((x, y) => x.total - y.total || y.wins - x.wins);
    const best = rank[0].total, win = rank.filter(p => p.total === best).map(p => p.name);
    const again = kit.online() && !kit.isHost()
      ? `<p class="sk-muted">Eine neue Runde kann ${esc((S.players.find(p => p.id === S.host) || {}).name || "der Gastgeber")} starten.</p>`
      : `<button class="btn primary" type="button" data-again>${kit.online() ? "Neues Spiel im selben Raum" : "Noch ein Spiel"}</button>`;
    res.innerHTML = `<h2>${win.length > 1 ? `Gleichstand: ${win.map(esc).join(" und ")}` : `${esc(win[0])} ${win[0] === "Du" ? "gewinnst" : "gewinnt"}`}</h2>
      <p>${S.roundNo} Runde${S.roundNo === 1 ? "" : "n"} gespielt. Wenige Strafpunkte sind gut.</p>
      <ol class="rank">${rank.map((p, k) => `<li><span>${k + 1}. ${esc(p.name)}</span><span>${p.total} Strafpunkte · ${p.wins}× Mau-Mau</span></li>`).join("")}</ol>${again}`;
    res.hidden = false;
  } else res.hidden = true;
}

// ---------- Einstellungen im Dialog „Neues Spiel“ ----------
const seg = (name, label, items, def) => `<div class="sk-field"><div class="sk-label">${label}</div><div class="sk-seg" role="radiogroup" aria-label="${label}">
  ${items.map(([v, t, sm]) => `<label><input type="radio" name="${name}" id="${name}-${v}" value="${v}"${v === def ? " checked" : ""}>${t}${sm ? `<small>${sm}</small>` : ""}</label>`).join("")}</div></div>`;
const chk = (id, t, sm, on) => `<label><input type="checkbox" id="${id}"${on ? " checked" : ""}>${t}<small>${sm}</small></label>`;
const setup = {
  html: seg("mm-hand", "Karten auf der Hand", [["5", "5 Karten"], ["6", "6 Karten"], ["7", "7 Karten"]], "5")
    + seg("mm-ende", "Spieldauer", [["r3", "3 Runden"], ["r5", "5 Runden"], ["r10", "10 Runden"], ["p100", "Bis 100", "Strafpunkte"]], "r5")
    + `<div class="sk-field"><div class="sk-label">Sonderkarten</div><div class="sk-seg">
      ${chk("mm-sieben", "7", "Nächster zieht 2", true)}${chk("mm-acht", "8", "Nächster setzt aus", true)}
      ${chk("mm-bube", "Bube", "wünscht eine Farbe", true)}${chk("mm-ass", "Ass", "nochmal legen", false)}</div></div>`,
  read(root) {
    const v = n => (root.querySelector(`input[name="${n}"]:checked`) || {}).value;
    const c = id => !!(root.querySelector("#" + id) || {}).checked;
    return { hand: +(v("mm-hand") || 5), ende: v("mm-ende") || "r5", sieben: c("mm-sieben"), acht: c("mm-acht"), bube: c("mm-bube"), ass: c("mm-ass") };
  },
};

// ---------- Spielkit verbinden ----------
kit = Spielkit.create({
  id: "maumau", version: 1, minPlayers: 2, maxPlayers: 6, bots: true, defaultBots: 2, privateHands: true,
  setup,
  defaultOptions: () => Object.assign({}, DEFAULTS),
  newPlayer, newState, onStart, whoActs, render,
  onState: s => { S = s; },
  validState: s => Array.isArray(s.deck) && Array.isArray(s.discard) && s.players.every(p => Array.isArray(p.hand)),
  roomStatus: s => `läuft · Runde ${s.roundNo}`,
  handoverText: s => s.phase !== "play" ? "Weiter geht's." : s.pending ? `Du musst ${s.pending} Karten ziehen oder eine 7 legen.`
    : s.wish ? `Gewünscht ist ${SUIT_NAME[s.wish]}. Deine Karten siehst du gleich.` : "Du bist dran. Deine Karten siehst du gleich.",
  // nur für automatische Tests der Regeln
  test: { canPlay, playCard, drawAction, passTurn, nextRound, startRound, playBots, botStep, endRound, handPoints, points, handSize, favSuit, get S() { return S; } },
});
kit.start();
})();
</script>
