    ? `<button class="knopf" data-act="mod-zu">Schließen</button>`
    : `<button class="knopf rand" data-act="mod-vollbild">⛶ Vollbild</button>${opt.ende || ""}`;
  return `<div class="blitz moderation">
    <div class="oben"><span class="bild l">${opt.glocke}</span><h2>Moderationskarte</h2>
      <span class="badge">${idx + 1} / ${karten.length}</span>
      ${opt.hinweis ? `<span class="leise klein">${opt.hinweis}</span>` : ""}
      <div class="aktionen">${knoepfe}</div></div>
    <div class="mod-karte">
      <div class="mod-schritt"><span class="n">${k.schrittNr}</span><span class="bild m">${k.ikon}</span> ${k.titel}</div>
      <p class="mod-text">${saetze(k.text)}</p>
      ${k.hinweis ? `<p class="mod-hinweis">${saetze(k.hinweis)}</p>` : ""}
      ${k.blitz && opt.blitzKnopf ? `<div><button class="knopf gross mod-blitz" data-act="tafel-blitz"><span class="bild m">${k.ikon}</span> Blitzlicht hier starten</button></div>` : ""}
    </div>
    <div class="mod-nav"><button class="knopf rand gross" data-act="mod-weiter" data-arg="-1" ${idx ? "" : "disabled"}>← Zurück</button>
      <div class="mod-punkte">${karten.map((x, i) => `<span class="${i === idx ? "an" : ""}"></span>`).join("")}</div>
      <button class="knopf gross" data-act="mod-weiter" data-arg="1" ${idx < karten.length - 1 ? "" : "disabled"}>Weiter →</button></div>
  </div>`;
}
function modKartenMitBild() {
  return moderationsKarten().map((k) => ({ ...k, ikon: BILDER[k.icon], schrittNr: SCHRITTE.findIndex(([x]) => x === (k.schritt === "nach-blitz" ? "abschluss" : k.schritt)) + 1 }));
}
// Karte, die zum aktuellen Schritt im Protokoll passt (-1, wenn keine passt, z. B. beim Protokoll)
function modOrtIdx(karten) {
  // Nach dem Abschluss (Schritt „Protokoll“): Rollen für die nächste Sitzung bzw. Ende zeigen
  if (ui.schritt === "protokoll") return karten.findIndex((k) => k.schritt === "nach-blitz");
  return karten.findIndex((k) => k.schritt === ui.schritt && (ui.schritt !== "anliegen" || k.titel.startsWith(`${T().einAnliegen} ${ui.anliegenIdx + 1}`)));
}
const nachBlitzIdx = (karten) => karten.findIndex((k) => k.schritt === "nach-blitz");
function modStartIdx(karten) { return Math.max(0, modOrtIdx(karten)); }
function renderModeration() {
  const el = $("#moderation");
  if (!mod.offen || !sitzung()) { el.innerHTML = ""; return; }
  const karten = modKartenMitBild();
  mod.idx = Math.max(0, Math.min(mod.idx, karten.length - 1));
  el.innerHTML = modHTML(karten, mod.idx, { modus: "lokal", glocke: BILDER.glocke, blitzKnopf: true });
}

// --- Tafel-Fenster: zweites Browserfenster auf dem Tafel-Bildschirm, live verbunden ------
let tafel = null;
function tafelOffen() { return tafel && !tafel.closed; }
const direktOffen = () => direkt.rolle === "protokoll" && direkt.conn?.open;
function tafelSenden() {
  if ((!tafelOffen() && !direktOffen()) || !sitzung()) return;
  const karten = modKartenMitBild();
  mod.idx = Math.max(0, Math.min(mod.idx, karten.length - 1));
  const daten = { typ: "klassenrat-mod", karten, idx: mod.idx, stufe: klasse().stufe, glocke: BILDER.glocke,
    hinweis: `Klasse ${klasse().name} · Sitzung ${sitzung().nr}`, blitz: blitzDaten() };
  if (tafelOffen()) tafel.postMessage(daten, "*");
  if (direktOffen()) { try { direkt.conn.send(daten); } catch (e) { /* getrennt */ } }
  mod.anzahl = karten.length;
  renderFern();
}
function renderFern() {
  const el = $("#tafel-fern");
  const verbunden = tafelOffen() || direktOffen();
  if (!verbunden && !(direkt.rolle === "protokoll" && direkt.status !== "aus")) { el.innerHTML = ""; return; }
  const art = tafelOffen() ? "Tafel" : "Tafel (direkt)";
  const status = !verbunden ? `<span class="badge offen">${esc(direkt.meldung || "verbinde …")}</span>`
    : direkt.ping != null && !tafelOffen() ? `<span class="leise klein">${direkt.ping} ms</span>` : "";
  el.innerHTML = `<div class="fern">${bild("glocke", "s")} <b>${art}</b> ${verbunden ? `Karte ${mod.idx + 1}${mod.anzahl ? " / " + mod.anzahl : ""}` : ""} ${status}
    ${verbunden ? `<button class="knopf mini rand" data-act="fern" data-arg="-1">◀</button><button class="knopf mini" data-act="fern" data-arg="1">▶</button>` : ""}
    <button class="x" data-act="tafel-zu" title="Verbindung zur Tafel beenden">✕</button></div>`;
}

// --- Direktverbindung Protokollgerät ↔ Tafel (WebRTC, Kopplung über einen 4-stelligen Code) ----
// Karten und Stimmen gehen verschlüsselt direkt von Gerät zu Gerät. Nur zum Finden der Geräte wird der
// öffentliche PeerJS-Vermittlungsdienst genutzt (er sieht Netzwerkadressen und Code, keine Inhalte).
const PEERJS_URL = "https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js";
const PEER_PREFIX = "klassenrat-jpw-tafel-";
const direkt = { rolle: null, peer: null, conn: null, code: "", status: "aus", meldung: "", ping: null, versuche: 0, timer: null };
function skriptLaden(url, globalName, name) {
  if (window[globalName]) return Promise.resolve();
  return new Promise((ok, fehler) => {
    const sc = document.createElement("script");
    sc.src = url; sc.onload = () => ok(); sc.onerror = () => fehler(new Error(`${name} konnte nicht geladen werden (keine Internetverbindung?)`));
    document.head.appendChild(sc);
  });
}
const peerLaden = () => skriptLaden(PEERJS_URL, "Peer", "Der Verbindungsdienst");
function direktBeenden() {
  clearTimeout(direkt.timer);
  try { direkt.conn?.close(); direkt.peer?.destroy(); } catch (e) { /* egal */ }
  Object.assign(direkt, { rolle: null, peer: null, conn: null, status: "aus", meldung: "", ping: null, versuche: 0 });
}

// Protokollgerät: mit der Tafel verbinden
async function direktVerbinden(code) {
  direktBeenden();
  Object.assign(direkt, { rolle: "protokoll", code, status: "verbinde", meldung: "verbinde …" });
  renderFern();
  try { await peerLaden(); } catch (e) { direkt.meldung = e.message; direkt.status = "fehler"; renderFern(); return; }
  const peer = direkt.peer = new window.Peer();
  const zeitlimit = () => {
    clearTimeout(direkt.timer);
    direkt.timer = setTimeout(() => {
      if (direktOffen()) return;
      direkt.status = "fehler";
      direkt.meldung = "keine Verbindung – Code prüfen; evtl. blockiert das Schulnetz direkte Verbindungen";
      renderFern();
    }, 15000);
  };
  const verbinden = () => {
    const conn = direkt.conn = peer.connect(PEER_PREFIX + code, { reliable: true });
    conn.on("open", () => {
      direkt.status = "verbunden"; direkt.meldung = ""; direkt.versuche = 0;
      mod.idx = Math.max(0, modOrtIdx(moderationsKarten()));
      tafelSenden();
      try { conn.send({ typ: "ping", t: Date.now() }); } catch (e) { /* egal */ }
      meldung("✓ Mit der Tafel verbunden");
    });
    conn.on("data", (d) => { if (d?.typ === "klassenrat-tafel") boardNachricht(d); });
    conn.on("close", () => {
      if (direkt.rolle !== "protokoll") return;
      direkt.status = "verbinde"; direkt.meldung = "Verbindung unterbrochen – verbinde neu …"; renderFern();
      if (direkt.versuche++ < 20) setTimeout(() => direkt.rolle === "protokoll" && verbinden(), 2000);
    });
  };
  peer.on("open", () => { verbinden(); zeitlimit(); });
  peer.on("error", (e) => {
    if (e.type === "peer-unavailable") {
      direkt.meldung = `Keine Tafel mit Code ${code} gefunden`; direkt.status = "fehler";
      if (direkt.versuche++ < 20 && direkt.conn) setTimeout(() => direkt.rolle === "protokoll" && verbinden(), 3000);
    } else { direkt.meldung = "Fehler: " + (e.type || e.message); direkt.status = "fehler"; }
    renderFern();
  });
  peer.on("disconnected", () => { try { peer.reconnect(); } catch (e) { /* egal */ } });
}

// Tafel: Code anzeigen und auf das Protokollgerät warten
async function direktTafelStarten() {
  direktBeenden();
  Object.assign(direkt, { rolle: "tafel", status: "starte" });
  tafelDaten = null; mod.offen = true;
  renderDirektTafel();
  document.documentElement.requestFullscreen?.().catch(() => {});
  try { await peerLaden(); } catch (e) { direkt.meldung = e.message; direkt.status = "fehler"; renderDirektTafel(); return; }
  const starten = () => {
    direkt.code = String(Math.floor(1000 + Math.random() * 9000));
    const peer = direkt.peer = new window.Peer(PEER_PREFIX + direkt.code);
    peer.on("open", () => { direkt.status = "wartet"; renderDirektTafel(); });
    peer.on("error", (e) => {
      if (e.type === "unavailable-id") { peer.destroy(); starten(); return; }  // Code schon vergeben → neuer Code
      direkt.status = "fehler"; direkt.meldung = "Fehler: " + (e.type || e.message); renderDirektTafel();
    });
    peer.on("disconnected", () => { try { peer.reconnect(); } catch (e) { /* egal */ } });
    peer.on("connection", (conn) => {
      if (direkt.conn?.open) { conn.on("open", () => conn.close()); return; }  // nur ein Protokollgerät
      direkt.conn = conn;
      conn.on("open", () => { direkt.status = "verbunden"; renderDirektTafel(); });
      conn.on("data", (d) => {
        if (d?.typ === "ping") { conn.send({ typ: "klassenrat-tafel", aktion: "pong", d: d.t }); return; }
        if (d?.typ !== "klassenrat-mod") return;
        tafelDaten = d; document.body.dataset.stufe = d.stufe; renderDirektTafel();
      });
      conn.on("close", () => { if (direkt.rolle === "tafel") { direkt.conn = null; direkt.status = "wartet"; renderDirektTafel(); } });
    });
  };
  starten();
}
function renderDirektTafel() {
  const el = $("#moderation");
  if (direkt.rolle !== "tafel") return;
  const ende = `<button class="knopf" data-act="direkt-ende">Beenden</button>`;
  if (direkt.status === "verbunden" && tafelDaten) {
    el.innerHTML = tb.blitz && tafelDaten.blitz ? boardBlitzHTML(tafelDaten.blitz)
      : modHTML(tafelDaten.karten, tafelDaten.idx, { modus: "direkt", glocke: tafelDaten.glocke, hinweis: tafelDaten.hinweis, blitzKnopf: true, ende });
    return;
  }
  const text = { starte: "Verbindung wird vorbereitet …", wartet: "Am Protokollgerät „Moderationskarten“ → „Direkt mit der Tafel verbinden“ wählen und diesen Code eingeben:",
    verbunden: "Verbunden – warte auf die Karten …", fehler: direkt.meldung }[direkt.status] || "";
  el.innerHTML = `<div class="blitz moderation"><div class="oben">${bild("glocke", "l")}<h2>Tafel – Direktverbindung</h2>
    <div class="aktionen"><button class="knopf rand" data-act="mod-vollbild">⛶ Vollbild</button>${ende}</div></div>
    <div class="mod-karte" style="align-items:center;text-align:center"><p class="mod-hinweis">${esc(text)}</p>
      ${direkt.status === "wartet" ? `<div class="code-gross">${direkt.code.split("").map((z) => `<span>${z}</span>`).join("")}</div>` : ""}
      ${direkt.status === "fehler" ? `<button class="knopf gross" data-act="direkt-tafel">Neu versuchen</button>` : ""}</div></div>`;
}
window.addEventListener("message", (e) => {
  const d = e.data;
  if (!d || d.typ !== "klassenrat-tafel" || e.source !== tafel) return;
  boardNachricht(d);
});
// Nachricht eines Tafel-Bildschirms (Tafel-Fenster oder Direktverbindung) verarbeiten
function boardNachricht(d) {
  if (d.aktion === "weiter") mod.idx += d.d;
  if (d.aktion === "nachBlitz") { const i = nachBlitzIdx(moderationsKarten()); if (i >= 0) mod.idx = i; }
  if (d.aktion === "stimme" || d.aktion === "zurueck") { stimmeZaehlen(d.d, d.aktion === "zurueck"); return; }
  if (d.aktion === "pong") { direkt.ping = Date.now() - d.d; renderFern(); return; }
  tafelSenden();
}
// Stimme aus dem Blitzlicht eines Tafel-Bildschirms übernehmen
function stimmeZaehlen(k, rueck) {
  const s = sitzung();
  if (!s || istGesperrt(s) || !["gut", "mittel", "schlecht"].includes(k)) return;
  s.feedback[k] = Math.max(0, (s.feedback[k] || 0) + (rueck ? -1 : 1));
  speichern();
  if (ui.view === "sitzung" && ui.schritt === "abschluss") render(); else tafelSenden();
}
setInterval(() => { if (tafel && tafel.closed) { tafel = null; renderFern(); } }, 1500);

// --- Tafel-Bildschirm (Tafel-Fenster oder Tafel-Rechner): Karten oder Blitzlicht ---------
const tb = { blitz: false, zeigen: false, verlauf: [], sperre: false, danke: null };
let tafelDaten = null;  // im Tafel-Fenster: zuletzt vom Hauptfenster empfangen
const imTafelFenster = () => location.hash === "#tafel";
const boardAktiv = () => imTafelFenster() || tafelOrdner.aktiv || direkt.rolle === "tafel";
const boardDaten = () => (tafelOrdner.aktiv ? tafelOrdner.daten : tafelDaten);
// Tafel → Protokollgerät (Tafel-Fenster oder Direktverbindung)
function boardAnHauptgeraet(aktion, d) {
  const nachricht = { typ: "klassenrat-tafel", aktion, d };
  if (imTafelFenster()) { try { window.opener?.postMessage(nachricht, "*"); } catch (e) { /* getrennt */ } }
  else if (direkt.rolle === "tafel" && direkt.conn?.open) { try { direkt.conn.send(nachricht); } catch (e) { /* getrennt */ } }
}
function boardBlitzHTML(b) {
  const zahlen = b.feedback || {};
  return blitzHTML({ ...b, zahlen, zeigen: tb.zeigen, rueckMoeglich: tb.verlauf.length && !tb.sperre, fertigText: "Zurück zu den Karten",
    summe: ["gut", "mittel", "schlecht"].reduce((n, k) => n + (zahlen[k] || 0), 0), leuchten: tb.leuchten, leuchtNr: tb.verlauf.length });
}
function boardNeuZeichnen() { imTafelFenster() ? tafelZeigen() : direkt.rolle === "tafel" ? renderDirektTafel() : renderTafelOrdner(); }
const BOARD_AKTIONEN = {
  "tafel-blitz"() { Object.assign(tb, { blitz: true, zeigen: false, verlauf: [], sperre: false, danke: null }); boardNeuZeichnen(); },
  "blitz-stimme"(k) {
    if (tb.sperre) return;
    const b = boardDaten()?.blitz;
    if (!b) return;
    tb.verlauf.push(k); tb.sperre = true; tb.leuchten = k;
    b.feedback[k] = (b.feedback[k] || 0) + 1;  // sofort anzeigen; das Protokollgerät bestätigt
    boardStimmeSenden(k, false);
    boardNeuZeichnen();
    setTimeout(() => { tb.sperre = false; }, BLITZ_PAUSE);
    clearTimeout(tb.leuchtTimer);
    tb.leuchtTimer = setTimeout(() => { tb.leuchten = null; boardNeuZeichnen(); }, 700);
  },
  "blitz-zurueck"() {
    const k = tb.verlauf.pop(), b = boardDaten()?.blitz;
    if (!k || !b) return;
    b.feedback[k] = Math.max(0, (b.feedback[k] || 0) - 1);
    boardStimmeSenden(k, true); boardNeuZeichnen();
  },
  "blitz-zeigen"() { tb.zeigen = !tb.zeigen; boardNeuZeichnen(); },
  "blitz-zu"() {  // Blitzlicht fertig → gleich die Karte mit den Rollen für die nächste Sitzung
    tb.blitz = false;
    if (tafelOrdner.aktiv) { const i = nachBlitzIdx(tafelOrdner.daten?.karten || []); if (i >= 0) tafelOrdner.idx = i; }
    else boardAnHauptgeraet("nachBlitz");
    boardNeuZeichnen();
  },
};
function boardStimmeSenden(k, rueck) {
  if (tafelOrdner.aktiv) ordnerStimmeSchreiben(k, rueck);
  else boardAnHauptgeraet(rueck ? "zurueck" : "stimme", k);
}

// Läuft im Tafel-Fenster (#tafel): zeigt nur die Karten, die das Hauptfenster schickt
function tafelStarten() {
  document.body.innerHTML = `<div id="tafel-ansicht"><div class="karte leer" style="margin:40px auto;max-width:560px">${bild("glocke", "l")}
    <p><b>Warte auf das Klassenrat-Tool …</b><br>Dieses Fenster auf den Tafel-Bildschirm ziehen und „⛶ Vollbild“ antippen.</p></div></div>`;
  document.body.classList.add("tafel");

  window.tafelZeigen = () => {
    if (!tafelDaten) return;

      : modHTML(tafelDaten.karten, tafelDaten.idx, { modus: "tafel", glocke: tafelDaten.glocke, hinweis: tafelDaten.hinweis, blitzKnopf: true });
  };
  const senden = (aktion, d) => { try { window.opener?.postMessage({ typ: "klassenrat-tafel", aktion, d }, "*"); } catch (e) { /* getrennt */ } };
  window.addEventListener("message", (e) => {
    const d = e.data;

  AKTIONEN["mod-weiter"] = (d) => senden("weiter", +d);
  AKTIONEN["mod-vollbild"] = () => document.documentElement.requestFullscreen?.().catch(() => {});
  AKTIONEN["mod-zu"] = () => { if (document.fullscreenElement) document.exitFullscreen?.(); };
  setInterval(() => {
    if (!window.opener || window.opener.closed) $("#tafel-ansicht").innerHTML = `<div class="karte leer" style="margin:40px auto;max-width:560px">
      <p><b>Verbindung zum Klassenrat-Tool getrennt.</b><br>Bitte das Tafel-Fenster im Tool neu öffnen.</p></div>`;

// --- Tafel-Rechner über OneDrive: liest die Karten, die das Protokollgerät in den Ordner schreibt ---
const tafelOrdner = { aktiv: false, handle: null, zeit: 0, daten: null, idx: 0, timer: null, fehler: "" };
async function tafelOrdnerWaehlen() {
  if (!ordnerMoeglich) { alert("Dafür wird Microsoft Edge oder Google Chrome am PC benötigt."); return; }
  try {
    const h = await window.showDirectoryPicker({ id: "klassenrat-tafel", mode: "readwrite" });

}
async function tafelOrdnerFortsetzen() {
  try {
    const h = await idb("readonly", (st) => st.get("tafelordner"));
    if (!h) return tafelOrdnerWaehlen();

    tafelOrdnerStarten(h);

}
function tafelOrdnerStarten(h) {
  Object.assign(tafelOrdner, { aktiv: true, handle: h, zeit: 0, daten: null, idx: 0, fehler: "" });

async function tafelOrdnerLesen() {
  try {
    const f = await (await tafelOrdner.handle.getFileHandle("klassenrat-tafel.json")).getFile();
    if (f.lastModified !== tafelOrdner.zeit) {
      const d = JSON.parse(await f.text());
      if (d.sitzungId !== tafelOrdner.daten?.sitzungId) tafelOrdner.idx = 0;
      if (d.ort && d.ort !== tafelOrdner.ort) { tafelOrdner.ort = d.ort; tafelOrdner.idx = d.idx || 0; }  // folgt dem Protokoll
      if (tb.blitz && tafelOrdner.daten?.blitz && d.blitz) {  // eigene, noch nicht bestätigte Stimmen nicht überschreiben
        for (const k of ["gut", "mittel", "schlecht"]) d.blitz.feedback[k] = Math.max(d.blitz.feedback[k] || 0, tafelOrdner.daten.blitz.feedback[k] || 0);
      }
      Object.assign(tafelOrdner, { daten: d, zeit: f.lastModified, fehler: "" });
    }

}
function renderTafelOrdner() {
  const el = $("#moderation"), d = tafelOrdner.daten;

// Blitzlicht-Stimmen vom Tafel-Rechner: in klassenrat-blitzlicht.json anhängen …
async function ordnerStimmeSchreiben(k, rueck) {
  const h = tafelOrdner.handle, sid = tafelOrdner.daten?.sitzungId;
  try {
    let stimmen = [];
    try {
      const alt = JSON.parse(await (await (await h.getFileHandle("klassenrat-blitzlicht.json")).getFile()).text());
      if (alt.sitzungId === sid) stimmen = alt.stimmen || [];
    } catch (e) { /* noch keine Datei */ }
    stimmen.push({ id: id(), k, rueck: !!rueck });
    await schreibeDatei(h, "klassenrat-blitzlicht.json", JSON.stringify({ sitzungId: sid, stimmen }));
  } catch (e) { tafelOrdner.fehler = "Stimme nicht gespeichert: " + e.message; }
}
// … und am Protokollgerät einsammeln (jede Stimme zählt nur einmal)
let ordnerBlitzZeit = 0;
setInterval(async () => {
  if (imTafelFenster() || tafelOrdner.aktiv || ordner.status !== "aktiv" || ui.view !== "sitzung" || !sitzung()) return;
  try {
    const f = await (await ordner.handle.getFileHandle("klassenrat-blitzlicht.json")).getFile();
    if (f.lastModified === ordnerBlitzZeit) return;
    ordnerBlitzZeit = f.lastModified;
    const d = JSON.parse(await f.text()), s = sitzung();
    if (d.sitzungId !== s.id || istGesperrt(s)) return;
    s.blitzIds ||= [];
    let neu = false;
    for (const st of d.stimmen || []) if (!s.blitzIds.includes(st.id) && ["gut", "mittel", "schlecht"].includes(st.k)) {
      s.blitzIds.push(st.id); s.feedback[st.k] = Math.max(0, (s.feedback[st.k] || 0) + (st.rueck ? -1 : 1)); neu = true;
    }
    if (neu) { speichern(); if (ui.schritt === "abschluss") render(); }
  } catch (e) { /* keine Stimmen */ }
}, 3000);

// --- Protokoll (Vorschau und Druck) -------------------------------------------

  const anw = k.schueler.length ? `${k.schueler.length - s.fehlend.length} von ${k.schueler.length}` : "–";
  const tab = (kopf, zeilen) => zeilen.length
    ? `<table><tr>${kopf.map((h) => `<th>${h}</th>`).join("")}</tr>${zeilen.map((z) => `<tr>${z.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</table>`
    : `<p class="leise">–</p>`;
  const offen = offeneFuer(s);
  const voll = (l) => l.filter((z) => z.namen.length || z.text);
  return `
  <div class="prot-kopf">${logoBlock()}
    <div><h1>${esc(t.titel)}</h1><div>Klasse <b>${esc(k.name)}</b> · ${esc(k.schuljahr || "")}</div></div>
    <div class="illu-k">${BILDER.klassenrat}</div></div>

    <div><small>Datum</small>${datum(s.datum, true)}</div><div><small>Sitzung Nr.</small>${s.nr}</div>
    <div><small>Beginn – Ende</small>${esc(s.beginn || "–")} – ${esc(s.ende || "–")}</div><div><small>Anwesend</small>${anw}</div>
    ${ROLLEN.map(([r]) => `<div><small>${t[r]}</small>${esc(s.rollen[r] || "–")}</div>`).join("")}
  </div>
  ${s.fehlend.length ? `<p><b>Es fehlen:</b> ${s.fehlend.map(esc).join(", ")}</p>` : ""}

  <h4>${bild("stern")} 1 · ${t.positiv}</h4>
  ${tab(["Name", "Aussage"], voll(s.positiv).map((z) => [esc(namenText(z.namen)), esc(z.text)]))}

  <h4>${bild("zurueck")} 2 · ${t.rueckblick}</h4>
  ${tab(["Beschluss vom", "Worum ging es?", "Beschluss", "zuständig", "Ergebnis", "Bemerkung"], offen.map((b) => {
    const r = s.rueckblick[b.id] || {};
    return [`${datum(b.sitzung.datum)}<br><small>Nr. ${b.sitzung.nr}</small>`, esc(b.anliegen.thema), esc(b.anliegen.beschluss), esc(namenText(b.anliegen.wer)), r.status === "ja" ? t.status.ja : r.status === "verworfen" ? t.status.verworfen + " – abgeschlossen" : (r.status ? t.status[r.status] : "nicht besprochen") + " – bleibt offen", esc(r.notiz)];
  }))}

  <h4>${bild("sprechen")} 3 · ${t.anliegen}</h4>
  ${s.anliegen.length ? s.anliegen.map((a, i) => {
    const vs = a.vorschlaege.filter((v) => v.text);
    const erg = { beschluss: t.beschluss, vertagt: "vertagt", keine: "keine Einigung", weiter: "weitergegeben an " + (a.weiterAn || "…") }[a.ergebnis] || "–";
    return `<div class="prot-block"><div class="bt">${t.einAnliegen} ${i + 1}: ${esc(a.thema || "")}</div>
      <p><b>${t.von}:</b> ${esc(namenText(a.von) || "–")}${a.art ? ` &nbsp;·&nbsp; <b>Art:</b> ${esc(a.art)}` : ""}</p>
      ${a.worum ? `<p><b>${t.worum.replace(/ \(.*\)/, "")}</b> ${esc(a.worum)}</p>` : ""}
      ${voll(a.aussagen).length ? `<p><b>${t.aussagen}</b></p>` + tab(["Name", "Aussage"], voll(a.aussagen).map((z) => [esc(namenText(z.namen)), esc(z.text)])) : ""}
      ${vs.length ? `<p><b>${t.vorschlaege}</b></p>` + tab([t.vorschlag, "von", "dafür", "dagegen", ...(k.stufe === "gs" ? [] : ["Enth."])],
        vs.map((v) => [esc(v.text), esc(namenText(v.von)), v.ja || 0, v.nein || 0, ...(k.stufe === "gs" ? [] : [v.enth || 0])])) : ""}
      <p><b>Ergebnis:</b> ${erg}${a.einstimmig ? ` (${esc(a.einstimmig)})` : ""}</p>
      ${a.ergebnis === "beschluss" ? `<p><b>${t.beschluss}:</b> ${esc(a.beschluss)}<br><b>Wer?</b> ${esc(namenText(a.wer) || "–")} &nbsp;·&nbsp; <b>Bis wann?</b> ${datum(a.bisWann)}</p>` : ""}

  <h4>${bild("froh")} 4 · ${t.abschluss}</h4>

  ${s.vorsatz ? `<p><b>Vorsatz:</b> ${esc(s.vorsatz)}</p>` : ""}

  <div class="prot-unterschriften">${UNTERSCHRIFTEN.map(([r]) => {

    · gedruckt am ${datum(heute())}</div>`;
}

// --- Auswertung (passwortgeschützt): Rollen und Jahresüberblick ----------------------
const BLITZ_FARBEN = { gut: "#2E9270", mittel: "#C9A227", schlecht: "#B04550" };  // geprüft auf Farbfehlsichtigkeit
function viewAuswertung() {
  const k = klasse(), t = T();
  if (!ui.auswertungFrei) return `<h2>${bild("stern", "m")} Auswertung ${esc(k.name)}</h2>
    <div class="karte leer">${bild("schloss", "l")}<p><b>Nur für Lehrkräfte.</b><br>Rollen-Übersicht und Jahresüberblick sind mit dem Passwort geschützt.</p>
    <button class="knopf" data-act="auswertung-oeffnen">${state.sperre ? "Mit Passwort öffnen" : "Passwort festlegen und öffnen"}</button></div>`;
  const sitz = sortiert(k), alleB = beschluesse(k);
  const anliegen = sitz.flatMap((s) => s.anliegen);
  const dauer = sitz.map((s) => s.beginn && s.ende ? (new Date("2000-01-01T" + s.ende) - new Date("2000-01-01T" + s.beginn)) / 6e4 : null).filter((m) => m > 0);
  const kachel = (zahl, text, icon) => `<div class="kachel">${bild(icon, "m")}<div><b>${zahl}</b><span>${text}</span></div></div>`;

  // Rollen
  const rollenStat = k.schueler.map((n) => {
    const z = Object.fromEntries(ROLLEN.map(([r]) => [r, 0])); let zuletzt = null;
    for (const s of sitz) for (const [r] of ROLLEN) if (s.rollen[r] === n) { z[r]++; zuletzt = s.datum; }
    return { n, z, summe: Object.values(z).reduce((a, b) => a + b, 0), zuletzt };
  });
  const maxRollen = Math.max(1, ...rollenStat.map((r) => r.summe));

  // Arten
  const artZahl = {};
  for (const a of anliegen) { const x = a.art || "ohne Angabe"; artZahl[x] = (artZahl[x] || 0) + 1; }
  const artListe = Object.entries(artZahl).sort((a, b) => b[1] - a[1]);
  const maxArt = Math.max(1, ...artListe.map(([, z]) => z));

  // Beschluss-Stand
  const stand = { offen: alleB.filter((b) => b.status === "offen").length };
  for (const st of ["ja", "teils", "nein", "verworfen"]) stand[st] = alleB.filter((b) => b.status === st).length;

  return `
  <div class="titelzeile"><h2>${bild("stern", "m")} Auswertung ${esc(k.name)} <span class="leise klein">${esc(k.schuljahr || "")}</span></h2>
    <button class="knopf rand" data-act="view" data-arg="sitzungen" style="margin-left:auto">${bild("schloss", "s")} Schließen</button></div>
  <div class="kacheln">
    ${kachel(sitz.length, "Sitzungen", "kalender")}${kachel(anliegen.length, k.stufe === "gs" ? "Themen" : "Anliegen", "sprechen")}
    ${kachel(alleB.length, "Beschlüsse", "beschluss")}${kachel(alleB.length ? Math.round(100 * stand.ja / alleB.length) + " %" : "–", t.status.ja, "haken")}
    ${kachel(dauer.length ? Math.round(dauer.reduce((a, b) => a + b, 0) / dauer.length) + " min" : "–", "Ø Dauer", "uhr")}
  </div>

  <div class="karte akzent">
    <h3 style="margin-top:0">${bild("leute")} Rollen-Übersicht <span class="leise klein">Wer hatte wie oft welche Rolle?</span></h3>
    ${k.schueler.length ? `<div class="tabelle-scroll"><table class="uebersicht rollen-tab"><tr><th>Name</th>${ROLLEN.map(([r, b]) => `<th title="${t[r]}">${bild(b, "s")} ${t[r]}</th>`).join("")}<th>gesamt</th><th>zuletzt</th></tr>
      ${rollenStat.map((r) => `<tr><td><b>${esc(r.n)}</b></td>${ROLLEN.map(([x]) => `<td class="zahl">${r.z[x] || "·"}</td>`).join("")}
        <td><span class="balken-zeile"><span class="balken" style="width:${(r.summe / maxRollen) * 100}%"></span><b>${r.summe}</b></span>
          ${r.summe ? "" : `<span class="badge offen">noch keine Rolle</span>`}</td>
        <td class="leise">${r.zuletzt ? datum(r.zuletzt) : "–"}</td></tr>`).join("")}</table></div>` : `<p class="leise">Keine Klassenliste hinterlegt.</p>`}
  </div>

  <div class="raster-2">
    <div class="karte">
      <h3 style="margin-top:0">${bild("wandzeitung")} ${k.stufe === "gs" ? "Themen" : "Anliegen"} nach Art</h3>
      ${artListe.length ? `<div class="hbalken">${artListe.map(([x, z]) => `<div class="hb-zeile" title="${esc(x)}: ${z}"><span class="hb-name">${esc(x)}</span>
        <span class="hb-spur"><span class="hb-balken" style="width:${(z / maxArt) * 100}%"></span></span><b>${z}</b></div>`).join("")}</div>` : `<p class="leise">Noch keine Daten.</p>`}
    </div>
    <div class="karte">
      <h3 style="margin-top:0">${bild("beschluss")} Stand der Beschlüsse</h3>
      ${alleB.length ? `<div class="stand-liste">${[["offen", "noch offen (nie überprüft)"], ["ja", t.status.ja], ["teils", t.status.teils], ["nein", t.status.nein], ["verworfen", t.status.verworfen]]
        .map(([st, l]) => `<div><span class="badge ${st}">${l}</span><b>${stand[st]}</b></div>`).join("")}</div>` : `<p class="leise">Noch keine Beschlüsse.</p>`}
    </div>
  </div>

  <div class="karte">
    <h3 style="margin-top:0">${bild("froh")} ${t.feedback.replace("Blitzlicht: ", "Blitzlicht – ")} <span class="leise klein">je Sitzung</span></h3>
    <div class="legende">${blitzOptionen().map(([x, ic, l]) => `<span><i style="background:${BLITZ_FARBEN[x]}"></i>${bild(ic, "s")} ${l}</span>`).join("")}</div>
    ${sitz.some((s) => s.feedback.gut + s.feedback.mittel + s.feedback.schlecht) ? `<div class="stapel">${sitz.map((s) => {
      const f = s.feedback, sum = (f.gut || 0) + (f.mittel || 0) + (f.schlecht || 0);
      return `<div class="st-zeile"><span class="st-name">Nr. ${s.nr} <small>${datum(s.datum)}</small></span>
        <span class="st-spur">${sum ? blitzOptionen().map(([x, , l]) => f[x] ? `<span class="st-teil" style="flex:${f[x]};background:${BLITZ_FARBEN[x]}" title="Nr. ${s.nr} – ${l}: ${f[x]}">${f[x] / sum >= .12 ? f[x] : ""}</span>` : "").join("") : `<span class="leise klein">kein Blitzlicht</span>`}</span>
        <span class="st-zahlen">${sum ? blitzOptionen().map(([x]) => f[x] || 0).join(" · ") : ""}</span></div>`;
    }).join("")}</div>` : `<p class="leise">Noch kein Blitzlicht erfasst.</p>`}
  </div>`;
}

// --- Online-Briefkasten: Kinder schicken Anliegen per QR-Code vom eigenen iPad ----------
// Das Tool der Lehrkraft ist der Briefkasten (direkte Verbindung über WebRTC/PeerJS, keine Daten auf Servern).
// Die Kinder bekommen keine Klassenliste zu sehen; sie tippen ihren Namen selbst.
const QR_URL = "https://unpkg.com/qrcode-generator@1.4.4/qrcode.js";
const BK_PREFIX = "klassenrat-jpw-bk-";
const onlineBk = {};  // Klassen-ID → { peer, status, code, meldung, qr }
function zufallsCode(n = 12) {
  const zeichen = "abcdefghjkmnpqrstuvwxyz23456789";
  return [...crypto.getRandomValues(new Uint8Array(n))].map((x) => zeichen[x % zeichen.length]).join("");
}
const postfachLink = (code) => location.href.split("#")[0] + "#postfach=" + code;
async function qrSvg(text) {
  await skriptLaden(QR_URL, "qrcode", "Der QR-Code-Baustein");
  const qr = window.qrcode(0, "M"); qr.addData(text); qr.make();
  return qr.createSvgTag({ cellSize: 8, margin: 2, scalable: true });
}
async function onlineBkStarten(k, { neuerCode = false, behalten = false } = {}) {
  // fester Code (QR-Code kann dauerhaft hängen) – außer „bei jedem Öffnen neuer Code“ ist eingestellt
  if (!k.onlineCode || neuerCode || (bkEinst(k).wechselCode && !behalten)) k.onlineCode = zufallsCode();
  k.bkOnline = true; speichern();
  onlineBkStoppen(k.id, false);
  const o = onlineBk[k.id] = { status: "starte", code: k.onlineCode, meldung: "", qr: null, versuche: 0, verbindungen: new Set() };
  const neuZeichnen = () => { if (["briefkasten", "sitzungen"].includes(ui.view)) render(); };
  qrSvg(postfachLink(o.code)).then((svg) => { o.qr = svg; if (ui.view === "briefkasten") render(); }).catch((e) => { o.qrFehler = e.message; });
  neuZeichnen();
  try { await peerLaden(); } catch (e) { o.status = "fehler"; o.meldung = e.message; neuZeichnen(); return; }
  const nochAktuell = () => onlineBk[k.id] === o;
  const anmelden = () => {
    if (!nochAktuell()) return;
    const peer = o.peer = new window.Peer(BK_PREFIX + o.code);
    peer.on("open", () => { o.status = "offen"; o.meldung = ""; o.versuche = 0; neuZeichnen(); });
    peer.on("error", (e) => {
      if (!nochAktuell() || peer !== o.peer) return;
      if (e.type === "unavailable-id") {
        // Nach dem Schließen gibt der Vermittlungsdienst die Adresse erst nach einigen Sekunden frei → erneut versuchen
        try { peer.destroy(); } catch (x) { /* egal */ }
        if (o.versuche++ < 20) {
          o.status = "starte"; o.meldung = "Wird geöffnet … (die vorherige Verbindung wird noch freigegeben)";
          o.timer = setTimeout(anmelden, 3000);
        } else { o.status = "fehler"; o.meldung = "Dieser Briefkasten ist bereits auf einem anderen Gerät geöffnet."; }
      } else if (["network", "server-error", "socket-error", "socket-closed"].includes(e.type)) {
        try { peer.destroy(); } catch (x) { /* egal */ }
        o.status = "starte"; o.meldung = "Verbindungsdienst nicht erreichbar – neuer Versuch …";
        o.timer = setTimeout(anmelden, 15000);
      } else if (e.type !== "peer-unavailable") o.meldung = "Fehler: " + e.type;
      neuZeichnen();
    });
    peer.on("disconnected", () => { if (nochAktuell() && peer === o.peer) { try { peer.reconnect(); } catch (x) { /* egal */ } } });
    peer.on("connection", (conn) => {
      conn.on("open", () => { o.verbindungen.add(conn); conn.send({ typ: "bk-info", klasse: k.name, stufe: k.stufe, arten: arten(k), anonym: bkEinst(k).anonym }); });
      conn.on("close", () => o.verbindungen.delete(conn));
      conn.on("data", (d) => onlineAnliegen(k, conn, d));
    });
  };
  anmelden();
}
function onlineBkStoppen(kid, merken = true) {
  clearTimeout(onlineBk[kid]?.timer);
  try { onlineBk[kid]?.peer?.disconnect(); onlineBk[kid]?.peer?.destroy(); } catch (e) { /* egal */ }
  delete onlineBk[kid];
  const k = state.klassen.find((x) => x.id === kid);
  if (merken && k) { k.bkOnline = false; speichern(); }
}
function onlineAnliegen(k, conn, d) {
  if (d?.typ !== "bk-anliegen") return;
  const e = bkEinst(k), text = (x, n) => String(x || "").trim().slice(0, n);
  const name = text(d.name, 60), thema = text(d.thema, 200), worum = text(d.worum, 1000);
  const art = arten(k).includes(d.art) ? d.art : "", geraet = text(d.geraet, 40), eid = text(d.id, 30) || id();
  const antwort = (ok, grund) => { try { conn.send({ typ: ok ? "bk-ok" : "bk-fehler", id: d.id, grund }); } catch (x) { /* weg */ } };
  if (!thema || (!name && !e.anonym)) return antwort(false, "Bitte deinen Namen und dein Anliegen eintragen.");
  if ((k.briefkasten || []).some((x) => x.id === eid)) return antwort(true);  // doppelt geschickt
  const heute = new Date().toDateString();
  k.bkLog = (k.bkLog || []).filter((x) => new Date(x.zeit).toDateString() === heute);
  if (e.proGeraet > 0 && geraet && k.bkLog.filter((x) => x.g === geraet).length >= e.proGeraet)
    return antwort(false, `Von diesem Gerät sind heute schon ${e.proGeraet === 1 ? "ein Anliegen" : e.proGeraet + " Anliegen"} gekommen. Mehr geht heute nicht – sprich sonst mit deiner Lehrkraft.`);
  if (e.proTag > 0 && name && k.bkLog.filter((x) => x.n === name.toLowerCase()).length >= e.proTag)
    return antwort(false, "Du hast heute schon genug Anliegen eingeworfen. Sprich sonst mit deiner Lehrkraft.");
  (k.briefkasten ||= []).push({ id: eid, namen: name ? [name] : [], art, thema, worum, zeit: Date.now(), quelle: "online" });
  k.bkLog.push({ g: geraet, n: name.toLowerCase(), zeit: Date.now() });
  speichern(); antwort(true);
  meldung(`📬 Neues Anliegen${name ? " von " + name : ""} – Klasse ${k.name}`);
  if (["sitzungen", "briefkasten"].includes(ui.view)) render();
}

// Seite für die Kinder (Link aus dem QR-Code: …#postfach=CODE)
function postfachStarten(code) {
  document.title = "Klassenrat-Briefkasten";
  document.body.innerHTML = `<div class="streifen"></div><main id="postfach" class="postfach"></main>`;
  const lsGet = (x) => { try { return localStorage.getItem(x); } catch (e) { return null; } };
  const lsSet = (x, v) => { try { localStorage.setItem(x, v); } catch (e) { /* egal */ } };
  let geraet = lsGet("klassenrat-geraet");
  if (!geraet) { geraet = zufallsCode(16); lsSet("klassenrat-geraet", geraet); }
  const pf = window.pf = { status: "verbinde", info: null, conn: null, peer: null, name: lsGet("klassenrat-name") || "", art: "", thema: "", worum: "",
    meldung: "", danke: false, sendet: null, versuche: 0 };
  const merken = () => { for (const f of ["name", "thema", "worum"]) { const el = document.getElementById("pf-" + f); if (el) pf[f] = el.value; } };
  const zeichnen = () => {
    const el = document.getElementById("postfach"), i = pf.info, gs = i?.stufe === "gs";
    if (i) document.body.dataset.stufe = i.stufe;
    const kopf = `<div class="pf-kopf">${bild("briefkasten", "l")}<div><h1>Klassenrat-Briefkasten</h1>${i ? `<p>Klasse ${esc(i.klasse)}</p>` : ""}</div></div>`;
    if (pf.status !== "offen") {
      el.innerHTML = kopf + `<div class="karte leer">${bild(pf.status === "geschlossen" ? "schloss" : "uhr", "l")}
        <p><b>${pf.status === "geschlossen" ? "Der Briefkasten ist gerade geschlossen." : "Verbinde mit dem Briefkasten …"}</b><br>
        ${pf.status === "geschlossen" ? "Deine Lehrkraft hat das Klassenrat-Tool gerade nicht geöffnet. Versuche es später noch einmal." : ""}
        ${pf.meldung ? `<br><span class="leise klein">${esc(pf.meldung)}</span>` : ""}</p>
        ${pf.status === "geschlossen" ? `<button class="knopf" data-act="pf-neu">Erneut versuchen</button>` : ""}</div>`;
      return;
    }
    if (pf.danke) {
      el.innerHTML = kopf + `<div class="karte leer">${bild("brief", "l")}<p><b>Danke! Dein Anliegen ist angekommen.</b><br>Es wird im nächsten Klassenrat besprochen.</p>
        <button class="knopf" data-act="pf-weiteres">Noch ein Anliegen</button></div>`;
      return;
    }
    const anonym = i.anonym && pf.anonym;
    const bereit = (pf.name.trim() || anonym) && pf.thema.trim() && !pf.sendet;
    el.innerHTML = kopf + `<div class="bk-form">
      <section><h3><span class="n">1</span> Dein Name</h3>
        ${anonym ? `<p class="pf-anonym">${bild("schloss", "s")} Dein Anliegen wird <b>ohne Namen</b> abgeschickt.</p>`
          : `<input type="text" id="pf-name" maxlength="60" autocomplete="name" value="${esc(pf.name)}" placeholder="Vor- und Nachname">`}
        ${i.anonym ? `<div class="chips abstand"><button class="chip ${anonym ? "an" : ""}" data-act="pf-anonym">${anonym ? "✓ ohne Namen" : "Ohne Namen abschicken"}</button></div>` : ""}</section>
      <section><h3><span class="n">2</span> ${gs ? "Was für ein Thema ist es?" : "Was für ein Anliegen ist es?"} <span class="leise klein">(freiwillig)</span></h3>
        <div class="chips gross">${i.arten.map((x) => `<button class="chip ${pf.art === x ? "an" : ""}" data-act="pf-art" data-arg="${esc(x)}">${esc(x)}</button>`).join("")}</div></section>
      <section><h3><span class="n">3</span> ${gs ? "Worum geht es? Schreibe einen Satz." : "Dein Anliegen in einem Satz"}</h3>
        <input type="text" id="pf-thema" maxlength="200" value="${esc(pf.thema)}" placeholder="z. B. In der Pause ist es im Klassenzimmer zu laut.">
        <textarea id="pf-worum" rows="3" maxlength="1000" placeholder="Möchtest du noch etwas erklären? (freiwillig)">${esc(pf.worum)}</textarea></section>
      ${pf.meldung ? `<p class="bk-meldung">${esc(pf.meldung)}</p>` : ""}
      <div class="bk-senden"><button class="knopf gross" data-act="pf-senden" ${bereit ? "" : "disabled"}>${bild("brief", "s")} ${pf.sendet ? "Wird gesendet …" : "Abschicken"}</button></div>
    </div>`;
  };
  const verbinden = async () => {
    pf.status = "verbinde"; pf.meldung = ""; zeichnen();
    try { await peerLaden(); } catch (e) { pf.status = "geschlossen"; pf.meldung = e.message; zeichnen(); return; }
    try { pf.peer?.destroy(); } catch (e) { /* egal */ }
    const peer = pf.peer = new window.Peer();
    peer.on("open", () => {
      const conn = pf.conn = peer.connect(BK_PREFIX + code, { reliable: true });
      conn.on("data", (d) => {
        if (d?.typ === "bk-info") { pf.info = d; pf.status = "offen"; zeichnen(); }
        if (d?.typ === "bk-ok" && d.id === pf.sendet) { clearTimeout(pf.zeit); pf.sendet = null; pf.danke = true; pf.art = ""; pf.thema = ""; pf.worum = ""; pf.meldung = ""; zeichnen(); }
        if (d?.typ === "bk-fehler" && d.id === pf.sendet) { clearTimeout(pf.zeit); pf.sendet = null; pf.meldung = d.grund; zeichnen(); }
      });
      conn.on("close", () => { pf.status = "geschlossen"; zeichnen(); });
    });
    peer.on("error", (e) => {
      pf.status = "geschlossen";

    });
  };
  Object.assign(AKTIONEN, {
    "pf-neu"() { pf.versuche = 0; verbinden(); },
    "pf-art"(x) { merken(); pf.art = pf.art === x ? "" : x; zeichnen(); },
    "pf-anonym"() { merken(); pf.anonym = !pf.anonym; zeichnen(); },
    "pf-weiteres"() { pf.danke = false; zeichnen(); },
    "pf-senden"() {
      merken();
      if (!pf.conn?.open) { pf.status = "geschlossen"; zeichnen(); return; }
      const anonym = pf.info?.anonym && pf.anonym;
      if (!anonym) lsSet("klassenrat-name", pf.name.trim());
      pf.sendet = id(); pf.meldung = "";
      pf.conn.send({ typ: "bk-anliegen", id: pf.sendet, name: anonym ? "" : pf.name, art: pf.art, thema: pf.thema, worum: pf.worum, geraet });
      zeichnen();
      pf.zeit = setTimeout(() => { if (pf.sendet) { pf.sendet = null; pf.meldung = "Keine Antwort vom Briefkasten – bitte noch einmal abschicken."; zeichnen(); } }, 10000);
    },
  });
  document.addEventListener("input", (e) => {
    if (!e.target.id?.startsWith("pf-")) return;
    merken();
    const knopf = document.querySelector("[data-act=pf-senden]");
    if (knopf && pf.info) knopf.disabled = !((pf.name.trim() || (pf.info.anonym && pf.anonym)) && pf.thema.trim() && !pf.sendet);
  });
  verbinden();
}

// --- Timer ---------------------------------------------------------------------
const timer = { offen: false, rest: 600, laeuft: false, int: null, ende: false };
function renderTimer() {
  const b = $("#timer-bereich");
  if (!klasse()) { b.innerHTML = ""; return; }
  if (!timer.offen) { b.innerHTML = `<button class="knopf timer-knopf" data-act="timer-auf">${bild("uhr", "s")} Timer</button>`; return; }
  const m = Math.floor(timer.rest / 60), s = timer.rest % 60;
  b.innerHTML = `<div class="timer ${timer.ende ? "ende" : ""}">
    <div class="kopf">${bild("uhr")} Zeitwächter/in <button class="x" data-act="timer-zu" title="Timer schließen">✕</button></div>
    <div class="zeit">${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}</div>
    <div class="reihe"><button class="knopf mini rand" data-act="timer-plus" data-arg="-60">−1</button>
      <button class="knopf mini" data-act="timer-los">${timer.laeuft ? "Pause" : "Start"}</button>
      <button class="knopf mini rand" data-act="timer-plus" data-arg="60">+1</button></div>
    <div class="reihe">${[2, 5, 10, 15].map((n) => `<button class="knopf mini zweit" data-act="timer-setzen" data-arg="${n}">${n}′</button>`).join("")}</div>
  </div>`;
}
function timerTick() {
  timer.rest = Math.max(0, timer.rest - 1);
  if (timer.rest === 0) { clearInterval(timer.int); timer.laeuft = false; timer.ende = true; piep(); }
  renderTimer();
}
function piep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, .35, .7].forEach((t) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(.25, ctx.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + t + .3);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + .3);
    });
  } catch (e) { /* kein Ton möglich */ }
}
function timerStarten(min) {
  clearInterval(timer.int);
  Object.assign(timer, { offen: true, rest: min * 60, laeuft: true, ende: false });
  timer.int = setInterval(timerTick, 1000);
  renderTimer();
}

// --- Automatische Sicherung in einen Ordner (z. B. OneDrive) ---------------------
// Der Browser schreibt die Sicherung in einen einmal gewählten Ordner. Liegt dieser im
// OneDrive-Ordner des PCs, lädt OneDrive die Datei automatisch hoch.
const ordner = { handle: null, status: "aus", zuletzt: null, fehler: "" };
const ordnerMoeglich = "showDirectoryPicker" in window;
function idb(modus, fn) {
  return new Promise((ok, fehler) => {
    const r = indexedDB.open("klassenrat-jpw", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onerror = () => fehler(r.error);
    r.onsuccess = () => {
      const tx = r.result.transaction("kv", modus), q = fn(tx.objectStore("kv"));
      tx.oncomplete = () => ok(q?.result);
      tx.onerror = () => fehler(tx.error);
    };
  });
}
async function ordnerLaden() {
  if (!ordnerMoeglich) return;
  try {
    ordner.handle = await idb("readonly", (st) => st.get("ordner"));
    if (ordner.handle) {
      ordner.status = (await ordner.handle.queryPermission({ mode: "readwrite" })) === "granted" ? "aktiv" : "pausiert";
      ordner.zuletzt = (await idb("readonly", (st) => st.get("zuletzt"))) || null;
    }
  } catch (e) { ordner.status = "aus"; }
  renderCloud();
  if (ui.view === "daten") render();
}
async function ordnerWaehlen() {
  try {
    const h = await window.showDirectoryPicker({ id: "klassenrat", mode: "readwrite", startIn: "documents" });
    ordner.handle = h; ordner.status = "aktiv";
    await idb("readwrite", (st) => st.put(h, "ordner"));
    const vorhanden = await dateiStand(h);
    if (vorhanden && vorhanden.zeit > (state.gespeichertAm || 0)) {
      // im Ordner liegen neuere Daten (z. B. von einem anderen Gerät): laden statt überschreiben
      if (!state.klassen.length || confirm(`Im Ordner liegt eine neuere Sicherung (Stand ${new Date(vorhanden.zeit).toLocaleString("de-DE")}). Jetzt laden?`)) {
        await dateiLaden(vorhanden.handle, { nurWennNeuer: false });
      } else ordner.basis = vorhanden.zeit;
    } else if (vorhanden) ordner.basis = vorhanden.zeit;
    if (vorhanden) await letzteDateiMerken(vorhanden.handle);
    await sichernInOrdner();
    if (!vorhanden) { const neu = await dateiStand(h); if (neu) await letzteDateiMerken(neu.handle); }
  } catch (e) {
    if (e.name !== "AbortError") alert("Der Ordner konnte nicht verwendet werden: " + e.message);
  }
  render();
}
async function ordnerFortsetzen() {
  try {
    ordner.status = (await ordner.handle.requestPermission({ mode: "readwrite" })) === "granted" ? "aktiv" : "pausiert";
    if (ordner.status === "aktiv") await sichernInOrdner();
  } catch (e) { ordner.status = "fehler"; ordner.fehler = e.message; }
  render();
}
async function ordnerTrennen() {
  if (!confirm("Automatische Sicherung beenden? Die Dateien im Ordner bleiben erhalten.")) return;
  ordner.handle = null; ordner.status = "aus";
  try { await idb("readwrite", (st) => st.delete("ordner")); } catch (e) { /* egal */ }
  render();
}
async function schreibeDatei(dir, name, text) {
  const f = await dir.getFileHandle(name, { create: true });
  const w = await f.createWritable();
  await w.write(text); await w.close();
}
let ordnerTimer;
function sichernInOrdnerSpaeter() { clearTimeout(ordnerTimer); ordnerTimer = setTimeout(sichernInOrdner, 2000); }
async function sichernInOrdner() {
  if (ordner.status !== "aktiv" || !ordner.handle) return;
  try {
    // Nicht überschreiben, wenn ein anderes Gerät inzwischen neuere Daten abgelegt hat
    const vorhanden = await dateiStand(ordner.handle);
    if (vorhanden && vorhanden.zeit > (ordner.basis || 0) && vorhanden.zeit > (state.gespeichertAm || 0)) {
      ordner.konflikt = vorhanden; renderCloud(); if (ui.view === "sitzungen") render(); return;
    }
    const json = JSON.stringify(state, null, 1);
    await schreibeDatei(ordner.handle, "klassenrat-sicherung.json", json);
    ordner.basis = state.gespeichertAm || Date.now(); ordner.konflikt = null;
    if (ui.view === "sitzung" && sitzung()) {  // Karten der geöffneten Sitzung für einen Tafel-Rechner
      await schreibeDatei(ordner.handle, "klassenrat-tafel.json", JSON.stringify({ typ: "klassenrat-tafel", zeit: Date.now(),
        klasse: klasse().name, sitzungId: sitzung().id, nr: sitzung().nr, stufe: klasse().stufe, karten: modKartenMitBild(),
        ort: mod.ort, idx: mod.ortIdx ?? 0, blitz: blitzDaten() }));
    }
    const verlauf = await ordner.handle.getDirectoryHandle("Verlauf", { create: true });
    await schreibeDatei(verlauf, `klassenrat-${heute()}.json`, json);  // eine Fassung pro Tag
    ordner.zuletzt = Date.now(); ordner.fehler = "";
    idb("readwrite", (st) => st.put(ordner.zuletzt, "zuletzt")).catch(() => {});
  } catch (e) {
    ordner.status = e.name === "NotAllowedError" ? "pausiert" : "fehler"; ordner.fehler = e.message;
  }
  renderCloud();
}
// --- Zuletzt geladene Datei merken und beim Start sofort öffnen --------------------------
async function dateiStand(dir) {  // Stand der Sicherung im Ordner (null, wenn keine da ist)
  try {
    const h = await dir.getFileHandle("klassenrat-sicherung.json"), f = await h.getFile();
    const d = JSON.parse(await f.text());
    return Array.isArray(d.klassen) ? { handle: h, daten: d, zeit: d.gespeichertAm || f.lastModified } : null;
  } catch (e) { return null; }
}
async function letzteDateiMerken(h) { try { await idb("readwrite", (st) => st.put(h, "letzteDatei")); } catch (e) { /* egal */ } }
// Lädt eine Sicherungsdatei. nurWennNeuer: nur übernehmen, wenn sie neuer ist als die Daten im Browser.
async function dateiLaden(h, { nurWennNeuer = true, fragen = false } = {}) {
  const f = await h.getFile(), neu = JSON.parse(await f.text());
  if (!Array.isArray(neu.klassen)) throw new Error("keine Klassenrat-Sicherung");
  const zeit = neu.gespeichertAm || f.lastModified;
  if (nurWennNeuer && zeit <= (state.gespeichertAm || 0)) return false;
  if (fragen && state.klassen.length && !confirm(`Sicherung vom ${new Date(zeit).toLocaleString("de-DE")} laden? Sie ersetzt die Daten in diesem Browser.`)) return false;
  const logo = state.logo;
  state = migrieren(neu);
  if (!state.logo && logo) state.logo = logo;
  state.gespeichertAm = zeit;
  try { localStorage.setItem(SPEICHER, JSON.stringify(state)); } catch (e) { /* voll */ }
  ordner.basis = zeit; ordner.konflikt = null; ui.ladenHandle = null;
  if (!state.klassen.some((k) => k.id === state.aktiveKlasse)) state.aktiveKlasse = state.klassen[0]?.id || null;
  await letzteDateiMerken(h);
  meldung(`☁ Daten geladen: ${h.name} – Stand ${new Date(zeit).toLocaleString("de-DE", { dateStyle: "short", timeStyle: "short" })}`);
  ui.view = "sitzungen"; render();
  return true;
}
async function autoLaden() {
  if (!ordnerMoeglich || imTafelFenster()) return;
  try {
    let h = await idb("readonly", (st) => st.get("letzteDatei"));
    if (!h && ordner.handle) h = (await dateiStand(ordner.handle))?.handle;
    if (!h) return;
    if ((await h.queryPermission({ mode: "read" })) === "granted") await dateiLaden(h);
    else { ui.ladenHandle = h; render(); }  // ein Klick nötig (Browser verlangt das nach einem Neustart)
  } catch (e) { /* Datei nicht mehr da */ }
}
async function ladenErlauben() {
  const h = ui.ladenHandle;
  if (!h) return;
  try {
    if ((await h.requestPermission({ mode: "read" })) !== "granted") return;
    if (!(await dateiLaden(h))) { ui.ladenHandle = null; meldung("☁ Die Daten in diesem Browser sind bereits aktuell."); render(); }
    if (ordner.handle && ordner.status !== "aktiv") ordnerFortsetzen();
  } catch (e) { ui.ladenHandle = null; render(); alert("Die Datei konnte nicht geladen werden: " + e.message); }
}
function ladenHinweis() {
  if (ui.ladenHandle) return `<div class="hinweis-box">${bild("kalender", "m")}<div style="flex:1"><b>Daten aus OneDrive laden?</b>
    <span class="leise klein">Zuletzt verwendet: ${esc(ui.ladenHandle.name)}. Der Browser braucht nach einem Neustart einmal deine Erlaubnis.</span>
    <div class="aktionen abstand"><button class="knopf" data-act="laden-erlauben">☁ Jetzt laden</button>
      <button class="knopf rand" data-act="laden-ignorieren">Nicht jetzt</button></div></div></div>`;
  if (ordner.konflikt) return `<div class="hinweis-box">${bild("regel", "m")}<div style="flex:1"><b>In OneDrive liegen neuere Daten</b> von einem anderen Gerät
    (Stand ${new Date(ordner.konflikt.zeit).toLocaleString("de-DE", { dateStyle: "short", timeStyle: "short" })}). Die automatische Sicherung ist angehalten, damit nichts überschrieben wird.
    <div class="aktionen abstand"><button class="knopf" data-act="konflikt-laden">Neuere Daten laden</button>
      <button class="knopf rand" data-act="konflikt-behalten">Meine Daten behalten und hochladen</button></div></div></div>`;
  return "";
}
function meldung(text) {
  const el = document.createElement("div");
  el.className = "meldung"; el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 4500);
}

async function ausOrdnerLaden() {
  try {
    if (ordner.status !== "aktiv") await ordnerFortsetzen();
    await dateiLaden(await ordner.handle.getFileHandle("klassenrat-sicherung.json"), { nurWennNeuer: false, fragen: true });

}
function renderCloud() {
  const el = $("#cloud");
  if (!el) return;
  if (!klasse() || !ordnerMoeglich) { el.innerHTML = ""; return; }
  const zeit = ordner.zuletzt ? new Date(ordner.zuletzt).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }) : "";

    fehler: `<button class="warn" data-act="view" data-arg="daten" title="${esc(ordner.fehler)}">☁ Sicherung fehlgeschlagen</button>`,
    aus: `<button data-act="view" data-arg="daten">☁ Sicherung einrichten</button>`,
  }[ordner.status];

// --- Dateien -------------------------------------------------------------------
// Knopf zum Laden einer Sicherung. Mit Dateizugriff (Edge/Chrome am PC) wird die Datei gemerkt;
// sonst ein echtes Dateifeld – das braucht Safari auf dem iPad, damit die Auswahl ankommt.
function ladenKnopf(text) {
  if (window.showOpenFilePicker) return `<button class="knopf rand" data-act="import">${text}</button>`;
  return `<label class="knopf rand datei-knopf">${text}<input type="file" accept=".json,application/json,text/plain" data-datei="sicherung"></label>`;
}
function dateiLesen(f, alsBild) {
  return new Promise((ok, fehler) => {
    const r = new FileReader();
    r.onload = () => ok(r.result);
    r.onerror = () => fehler(r.error);
    alsBild ? r.readAsDataURL(f) : r.readAsText(f);
  });
}
async function sicherungAusDatei(f) {
  try {
    const neu = JSON.parse(await dateiLesen(f));
    if (!Array.isArray(neu.klassen)) throw new Error("keine Klassenrat-Sicherung");
    if (state.klassen.length && !confirm("Die Sicherung ersetzt alle Daten auf diesem Gerät. Fortfahren?")) return;
    const logo = state.logo;
    state = migrieren(neu);
    if (!state.logo && logo) state.logo = logo;
    if (!state.klassen.some((k) => k.id === state.aktiveKlasse)) state.aktiveKlasse = state.klassen[0]?.id || null;
    ui.view = "sitzungen"; speichern(); render();
    meldung(`Sicherung geladen: ${f.name}`);
  } catch (e) { alert("Diese Datei ist keine gültige Klassenrat-Sicherung (" + (e.message || e) + ")."); }
}
document.addEventListener("change", async (e) => {
  const inp = e.target.closest?.("input[data-datei]");
  if (!inp || !inp.files?.[0]) return;
  const f = inp.files[0];
  inp.value = "";  // dieselbe Datei später erneut wählbar
  if (inp.dataset.datei === "sicherung") return sicherungAusDatei(f);
  if (inp.dataset.datei === "logo") {
    if (f.size > 1.5e6) { alert("Die Datei ist zu groß (max. 1,5 MB)."); return; }
    state.logo = await dateiLesen(f, true); speichern(); render();
  }
});
async function exportieren() {
  state.letzterExport = Date.now();
  const blob = new Blob([JSON.stringify(state, null, 1)], { type: "application/json" });
  // iPad/iPhone: Teilen-Menü öffnen → „In Dateien sichern“ → OneDrive-Ordner wählen
  const datei = new File([blob], `klassenrat-sicherung-${heute()}.json`, { type: "application/json" });
  if (istIOS && navigator.canShare?.({ files: [datei] })) {
    try { await navigator.share({ files: [datei], title: "Klassenrat-Sicherung" }); speichern(); render(); return; }
    catch (e) { if (e.name === "AbortError") return; }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `klassenrat-sicherung-${heute()}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  speichern(); render();
}

const AKTIONEN = {
  view(v) { ui.view = v; ui.entsperrt = null; if (v !== "auswertung") ui.auswertungFrei = false; render(); scrollTo(0, 0); },
  async "auswertung-oeffnen"() {
    if (!state.sperre) {
      const r = await neuesPasswortDialog("Passwort festlegen", "Die Auswertung ist durch dasselbe Passwort geschützt wie abgeschlossene Sitzungen. Lege es einmalig fest.");
      if (!Array.isArray(r)) return;
      await pwSetzen(r[0]);
    } else if (!(await passwortAbfragen("Die Auswertung ist nur für Lehrkräfte."))) return;
    ui.auswertungFrei = true; render();
  },
  "neue-sitzung": neueSitzung,
  oeffnen(sid) {
    sichernInOrdnerSpaeter();
    const s = klasse().sitzungen.find((x) => x.id === sid);
    Object.assign(ui, { sitzungId: sid, schritt: s.gesperrt ? "protokoll" : "start", view: "sitzung", ziel: null, anliegenIdx: 0, entsperrt: null });
    render(); scrollTo(0, 0);
  },
  schritt(s) { ui.schritt = s; ui.ziel = null; render(); scrollTo(0, 0); },
  ziel(pfad) {
    ui.ziel = pfad;
    if (zielArt(pfad) === "zeile") ui.fokus = pfad + ".text";
    render();
  },
  name(n) {
    const s = sitzung(), z = ui.ziel, art = zielArt(z);
    if (!art) return;

      s.anliegen.splice(+i, 1); ui.anliegenIdx = Math.max(0, Math.min(ui.anliegenIdx, s.anliegen.length - 1)); ui.ziel = null;
      speichern(); render();
    }
  },
  "vertagt-uebernehmen"() {
    const s = sitzung(), vorher = sortiert(klasse()).filter((x) => x.nr < s.nr).at(-1);
    for (const a of vorher.anliegen.filter((a) => a.ergebnis === "vertagt" && !s.anliegen.some((b) => b.aus === a.id))) {
      s.anliegen.push(neuesAnliegen({ aus: a.id, thema: a.thema, von: [...a.von], art: a.art, worum: a.worum + (a.worum ? "\n" : "") + `(vertagt aus Sitzung ${vorher.nr})` }));
    }
    speichern(); render();
  },
  "vorschlag-neu"(i) { sitzung().anliegen[i].vorschlaege.push({ text: "", von: [], ja: 0, nein: 0, enth: 0 }); speichern(); render(); },
  "beste-idee"(i) {
    const a = sitzung().anliegen[i];
    const beste = a.vorschlaege.filter((v) => v.text).sort((x, y) => (y.ja || 0) - (x.ja || 0))[0];
    if (beste) { a.beschluss = beste.text; speichern(); render(); }
  },
  zaehlen(arg) {
    const [pfad, d] = arg.split("|"), teile = pfad.split("."), feld = teile.pop();
    const o = teile.reduce((x, k) => x[k], sitzung());
    o[feld] = Math.max(0, (o[feld] || 0) + +d); speichern(); render();
  },
  filter(f) { ui.filter = f; render(); },
  "klasse-anlegen"() {
    const name = $("#nk-name").value.trim();
    if (!name) { $("#nk-name").focus(); return; }
    const k = { id: id(), name, schuljahr: $("#nk-jahr").value.trim(), lehrkraft: "", timer: 10,
      stufe: document.querySelector("[name=nk-stufe]:checked").value,
      schueler: $("#nk-schueler").value.split("\n").map((x) => x.trim()).filter(Boolean), sitzungen: [] };
    state.klassen.push(k); state.aktiveKlasse = k.id; ui.view = "sitzungen"; speichern(); render();
  },
  "klasse-neu"() { $("#app").innerHTML = viewWillkommen(true); },
  "klasse-loeschen"() {
    const k = klasse();
    if (confirm(`Klasse ${k.name} mit allen ${k.sitzungen.length} Sitzungen löschen? Das kann nicht rückgängig gemacht werden.`)) {
      state.klassen = state.klassen.filter((x) => x.id !== k.id); state.aktiveKlasse = state.klassen[0]?.id || null;
      ui.view = "sitzungen"; speichern(); render();
    }
  },
  "schueler-speichern"() {
    klasse().schueler = [...new Set($("#schuelerliste").value.split("\n").map((x) => x.trim()).filter(Boolean))];
    speichern(); render();
  },
  "schueler-sortieren"() {
    const ta = $("#schuelerliste");
    ta.value = ta.value.split("\n").map((x) => x.trim()).filter(Boolean).sort((a, b) => a.localeCompare(b, "de")).join("\n");
  },
  export: exportieren,
  async import() {
    if (window.showOpenFilePicker) {  // mit Dateizugriff: Datei merken und beim nächsten Start wieder öffnen
      try {
        const [h] = await window.showOpenFilePicker({ id: "klassenrat-laden", types: [{ description: "Klassenrat-Sicherung", accept: { "application/json": [".json"] } }] });
        await dateiLaden(h, { nurWennNeuer: false, fragen: true });
      } catch (e) { if (e.name !== "AbortError") alert("Diese Datei ist keine gültige Klassenrat-Sicherung."); }
      return;
    }
  },
  "logo-zuruecksetzen"() { if (confirm("Schullogo von diesem Gerät entfernen?")) { state.logo = null; speichern(); render(); } },
  "alles-loeschen"() {
    if (confirm("Wirklich ALLE Daten löschen? Lade vorher eine Sicherung herunter, wenn du sie noch brauchst.")) {
      try { localStorage.removeItem(SPEICHER); } catch (e) { /* egal */ }
      state = laden(); ui.view = "sitzungen"; render();
    }
  },
  "ordner-waehlen": ordnerWaehlen,
  "laden-erlauben": ladenErlauben,
  "laden-ignorieren"() { ui.ladenHandle = null; render(); },
  async "konflikt-laden"() { if (ordner.konflikt) await dateiLaden(ordner.konflikt.handle, { nurWennNeuer: false }); },
  async "konflikt-behalten"() {
    if (!confirm("Deine Daten ersetzen dann die neueren Daten in OneDrive. Fortfahren?")) return;
    ordner.basis = ordner.konflikt?.zeit || Date.now(); ordner.konflikt = null; await sichernInOrdner(); render();
  },
  "ordner-fortsetzen": ordnerFortsetzen,
  "ordner-trennen": ordnerTrennen,
  "ordner-laden": ausOrdnerLaden,
  "timer-auf"() { timer.offen = true; timer.rest = (klasse()?.timer || 10) * 60; timer.ende = false; renderTimer(); },
  "timer-zu"() { clearInterval(timer.int); timer.offen = false; timer.laeuft = false; timer.ende = false; renderTimer(); },
  "timer-start"() { timerStarten(klasse()?.timer || 10); },
  "timer-los"() {
    if (timer.laeuft) { clearInterval(timer.int); timer.laeuft = false; }
    else if (timer.rest > 0) { timer.ende = false; timer.laeuft = true; timer.int = setInterval(timerTick, 1000); }
    renderTimer();
  },
  "timer-plus"(d) { timer.rest = Math.max(0, timer.rest + +d); timer.ende = false; renderTimer(); },
  "timer-setzen"(n) { clearInterval(timer.int); Object.assign(timer, { rest: n * 60, laeuft: false, ende: false }); renderTimer(); },
};

const ERLAUBT_GESPERRT = ["schritt", "anliegen-tab", "drucken", "view", "entsperren", "moderation", "mod-direkt", "mod-tafel", "mod-hier", "mod-export", "mod-onedrive", "dialog-zu"];
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || (el.tagName === "LABEL")) return;
  e.preventDefault();
  e.stopPropagation();
  if (el.closest("#sperrbereich.gesperrt") && !ERLAUBT_GESPERRT.includes(el.dataset.act)) return;
  AKTIONEN[el.dataset.act]?.(el.dataset.arg);
});
document.addEventListener("input", (e) => {
  const el = e.target;
  const wert = el.dataset.typ === "zahl" ? (+el.value || 0) : el.value;
  if (el.dataset.k && sitzung()) {
    if (el.dataset.k.startsWith("rueckblick.")) { /* Notiz nur bei gesetztem Status */
      const [, bid] = el.dataset.k.split(".");
      if (!sitzung().rueckblick[bid]) return;
    }
    pfadSetzen(sitzung(), el.dataset.k, wert);
  } else if (el.dataset.kk && klasse()) {
    pfadSetzen(klasse(), el.dataset.kk, wert);
  } else return;
  speichern();
  if ("neuZeichnen" in el.dataset) render();
});
document.addEventListener("change", (e) => {
  if (e.target.id === "klassenwahl") {
    if (e.target.value === "__neu") { $("#app").innerHTML = viewWillkommen(true); return; }
    state.aktiveKlasse = e.target.value; ui.view = "sitzungen"; speichern(); render();
  }
});
// Briefkasten: Eingaben merken, ohne neu zu zeichnen (Knopf freigeben, sobald Name und Satz da sind)
function bkFelderMerken() {
  const t = $("#bk-thema"), w = $("#bk-worum");
  if (t) bk.thema = t.value;
  if (w) bk.worum = w.value;
}
document.addEventListener("input", (e) => {
  if (e.target.id === "bk-thema" || e.target.id === "bk-worum") {
    bkFelderMerken();
    const knopf = document.querySelector("[data-act=bk-senden]");
    const bereit = bk.name !== null && bk.thema.trim();
    if (knopf) knopf.disabled = !bereit;
    if ($("#bk-hinweis")) $("#bk-hinweis").textContent = bereit ? "" : "Bitte deinen Namen antippen und das Anliegen aufschreiben.";
  }
  if (e.target.dataset?.bk && klasse()) {
    const k = klasse(), key = e.target.dataset.bk;
    k.bkEinst = { ...bkEinst(k), [key]: e.target.type === "checkbox" ? e.target.checked : Math.max(0, +e.target.value || 0) };
    speichern();
    document.querySelectorAll(`[data-bk="${key}"]`).forEach((x) => { if (x !== e.target && x.type === "checkbox") x.checked = e.target.checked; });
    // verbundene Kinder-iPads sofort informieren (z. B. „ohne Namen“ erlaubt)
    for (const c of onlineBk[k.id]?.verbindungen || []) {
      try { if (c.open) c.send({ typ: "bk-info", klasse: k.name, stufe: k.stufe, arten: arten(k), anonym: bkEinst(k).anonym }); } catch (x) { /* weg */ }
    }
  }
});
// Textfelder wachsen mit dem Inhalt; Reiter zeigt das Thema sofort
document.addEventListener("input", (e) => {
  if (e.target.tagName === "TEXTAREA" && e.target.rows === 1) hoeheAnpassen(e.target);
  if ("frueher" in e.target.dataset) frueherZeigen(e.target);
  if ("reiter" in e.target.dataset) { const t = document.querySelector(".reiter button.aktiv .t"); if (t) t.textContent = e.target.value || T().einAnliegen; }
});
// Klick in eine Aussage-Zeile: angetippte Namen gehören zu dieser Zeile
document.addEventListener("focusin", (e) => {
  const z = e.target.dataset?.ziel;
  if (z && z !== ui.ziel) { ui.ziel = z; zielAnzeigen(); }
});
// Enter beendet die Zeile – der nächste Name beginnt eine neue
document.addEventListener("keydown", (e) => {
  if (mod.offen) {
    if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); AKTIONEN["mod-weiter"](1); }
    if (e.key === "ArrowLeft") AKTIONEN["mod-weiter"](-1);
    if (e.key === "Escape") AKTIONEN["mod-zu"]();
    return;
  }
  const z = e.target.dataset?.ziel;
  if (e.target.id === "neue-art" && e.key === "Enter") { e.preventDefault(); AKTIONEN["art-neu"](); return; }
  if (e.target.id?.startsWith("neu-baustein-") && e.key === "Enter") { e.preventDefault(); AKTIONEN["baustein-neu"](e.target.id.slice(13)); return; }
  if (z && e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    ui.ziel = z.split(".").slice(0, -1).join(".");
    e.target.blur(); zielAnzeigen();
  }
});
// Namen antippen, ohne dass das Textfeld den Fokus verliert
document.addEventListener("pointerdown", (e) => { if (e.target.closest(".namenleiste .chip")) e.preventDefault(); });
window.addEventListener("resize", () => document.documentElement.style.setProperty("--kopfhoehe", document.querySelector(".app-kopf").offsetHeight + "px"));
window.addEventListener("afterprint", () => ($("#druck").innerHTML = ""));

if (location.hash === "#tafel") tafelStarten();
else if (location.hash.startsWith("#postfach=")) postfachStarten(decodeURIComponent(location.hash.slice(10)).replace(/[^a-z0-9]/gi, ""));
else {
  render(); ordnerLaden().then(autoLaden);
  // Online-Briefkästen, die offen waren, wieder öffnen
  for (const k of state.klassen) if (k.bkOnline) onlineBkStarten(k);
  // war der Briefkasten offen (z. B. Seite neu geladen), geht es dort weiter
  if (state.briefkastenAktiv && state.klassen.some((k) => k.id === state.briefkastenAktiv)) {
    state.aktiveKlasse = state.briefkastenAktiv; render(); bk.offen = true; renderBriefkasten();
  }
}
</script>
