  const sitz = sortiert(k), alleB = beschluesse(k);
  const anliegen = sitz.flatMap((s) => s.anliegen);
  const dauer = sitz.map((s) => s.beginn && s.ende ? (new Date("2000-01-01T" + s.ende) - new Date("2000-01-01T" + s.beginn)) / 6e4 : null).filter((m) => m > 0);
  const kachel = (zahl, text, icon) => `<div class="kachel">${bild(icon, "m")}<div><b>${zahl}</b><span>${text}</span></div></div>`;

  // Rollen
  const rollenStat = k.schueler.map((n) => {
    const z = Object.fromEntries(ROLLEN.map(([r]) => [r, 0])); let zuletzt = null;
    for (const s of sitz) for (const [r] of ROLLEN) if (s.rollen[r] === n) { z[r]++; zuletzt = s.datum; }
    return { n, z, summe: Object.values(z).reduce((a, b) => a + b, 0), zuletzt };
  });
  const maxRollen = Math.max(1, ...rollenStat.map((r) => r.summe));

  // Arten
  const artZahl = {};
  for (const a of anliegen) { const x = a.art || "ohne Angabe"; artZahl[x] = (artZahl[x] || 0) + 1; }
  const artListe = Object.entries(artZahl).sort((a, b) => b[1] - a[1]);
  const maxArt = Math.max(1, ...artListe.map(([, z]) => z));

  // Beschluss-Stand
  const stand = { offen: alleB.filter((b) => b.status === "offen").length };
  for (const st of ["ja", "teils", "nein", "verworfen"]) stand[st] = alleB.filter((b) => b.status === st).length;

  return `
  <div class="titelzeile"><h2>${bild("stern", "m")} Auswertung ${esc(k.name)} <span class="leise klein">${esc(k.schuljahr || "")}</span></h2>
    <span class="aktionen" style="margin-left:auto"><button class="knopf zweit" data-act="jahresrueckblick">${bild("stern", "s")} Jahresrückblick drucken</button>
      <button class="knopf rand" data-act="view" data-arg="sitzungen">${bild("schloss", "s")} Schließen</button></span></div>
  <div class="kacheln">
    ${kachel(sitz.length, "Sitzungen", "kalender")}${kachel(anliegen.length, k.stufe === "gs" ? "Themen" : "Anliegen", "sprechen")}
    ${kachel(alleB.length, "Beschlüsse", "beschluss")}${kachel(alleB.length ? Math.round(100 * stand.ja / alleB.length) + " %" : "–", t.status.ja, "haken")}
    ${kachel(dauer.length ? Math.round(dauer.reduce((a, b) => a + b, 0) / dauer.length) + " min" : "–", "Ø Dauer", "uhr")}
    ${(() => { const m = anliegen.filter((a) => sprechzeitText(a)).map(sprechMinuten); return m.length ? kachel(Math.round(m.reduce((a, b) => a + b, 0) / m.length) + " min", `Ø je ${k.stufe === "gs" ? "Thema" : "Anliegen"}`, "sprechen") : ""; })()}
  </div>

  <div class="karte akzent">
    <h3 style="margin-top:0">${bild("leute")} Rollen-Übersicht <span class="leise klein">Wer hatte wie oft welche Rolle?</span></h3>
    ${k.schueler.length ? `<div class="tabelle-scroll"><table class="uebersicht rollen-tab"><tr><th>Name</th>${ROLLEN.map(([r, b]) => `<th title="${t[r]}">${bild(b, "s")} ${t[r]}</th>`).join("")}<th>gesamt</th><th>zuletzt</th></tr>
      ${rollenStat.map((r) => `<tr><td><b>${esc(r.n)}</b></td>${ROLLEN.map(([x]) => `<td class="zahl">${r.z[x] || "·"}</td>`).join("")}
        <td><span class="balken-zeile"><span class="balken" style="width:${(r.summe / maxRollen) * 100}%"></span><b>${r.summe}</b></span>
          ${r.summe ? "" : `<span class="badge offen">noch keine Rolle</span>`}</td>
        <td class="leise">${r.zuletzt ? datum(r.zuletzt) : "–"}</td></tr>`).join("")}</table></div>` : `<p class="leise">Keine Klassenliste hinterlegt.</p>`}
  </div>

  <div class="raster-2">
    <div class="karte">
      <h3 style="margin-top:0">${bild("wandzeitung")} ${k.stufe === "gs" ? "Themen" : "Anliegen"} nach Art</h3>
      ${artListe.length ? `<div class="hbalken">${artListe.map(([x, z]) => `<div class="hb-zeile" title="${esc(x)}: ${z}"><span class="hb-name">${esc(x)}</span>
        <span class="hb-spur"><span class="hb-balken" style="width:${(z / maxArt) * 100}%"></span></span><b>${z}</b></div>`).join("")}</div>` : `<p class="leise">Noch keine Daten.</p>`}
    </div>
    <div class="karte">
      <h3 style="margin-top:0">${bild("beschluss")} Stand der Beschlüsse</h3>
      ${alleB.length ? `<div class="stand-liste">${[["offen", "noch offen (nie überprüft)"], ["ja", t.status.ja], ["teils", t.status.teils], ["nein", t.status.nein], ["verworfen", t.status.verworfen]]
        .map(([st, l]) => `<div><span class="badge ${st}">${l}</span><b>${stand[st]}</b></div>`).join("")}</div>` : `<p class="leise">Noch keine Beschlüsse.</p>`}
    </div>
  </div>

  <div class="karte">
    <h3 style="margin-top:0">${bild("froh")} ${t.feedback.replace("Blitzlicht: ", "Blitzlicht – ")} <span class="leise klein">je Sitzung</span></h3>
    <div class="legende">${blitzOptionen().map(([x, ic, l]) => `<span><i style="background:${BLITZ_FARBEN[x]}"></i>${bild(ic, "s")} ${l}</span>`).join("")}</div>
    ${sitz.some((s) => s.feedback.gut + s.feedback.mittel + s.feedback.schlecht) ? `<div class="stapel">${sitz.map((s) => {
      const f = s.feedback, sum = (f.gut || 0) + (f.mittel || 0) + (f.schlecht || 0);

        <span class="st-zahlen">${sum ? blitzOptionen().map(([x]) => f[x] || 0).join(" · ") : ""}</span></div>`;
    }).join("")}</div>` : `<p class="leise">Noch kein Blitzlicht erfasst.</p>`}
  </div>`;
}

    <p class="leise klein">Die Kinder sehen dann den Knopf „Ohne Namen abschicken“. Du siehst bei diesen Anliegen keinen Absender; die Begrenzung pro Gerät gilt trotzdem.</p>
    <div class="ergebnis abstand"><label><input type="checkbox" data-bk="wechselCode" ${e.wechselCode ? "checked" : ""}> Bei jedem Öffnen einen neuen Zufallscode erzeugen</label></div>
    <p class="leise klein">Aus: Der QR-Code bleibt gültig und kann dauerhaft im Klassenzimmer hängen. An: sicherer, der QR-Code muss aber jedes Mal neu gezeigt werden.</p>
    <label class="feld" style="max-width:360px">Höchstens so viele Anliegen pro Gerät und Tag (0 = unbegrenzt)
      <input type="number" min="0" max="20" data-bk="proGeraet" value="${e.proGeraet}"></label>
    <details class="abgabe abstand" ${e.abgabe ? "open" : ""}><summary><b>Zusätzlich: Abgabe als Datei über OneDrive</b> <span class="leise klein">(optional – wenn das Schulnetz keine Direktverbindung zulässt)</span></summary>
      <p class="leise klein">Kommt keine Verbindung zustande, können die Kinder ihr Anliegen als Datei speichern und über einen OneDrive-Link hochladen.
        So geht's: OneDrive im Browser öffnen → einen Ordner anlegen (z. B. „Klassenrat-Eingang ${esc(k.name)}“) → Ordner markieren → <b>„Dateien anfordern“</b>
        → Link kopieren und hier einfügen. Die Kinder können dort nur hochladen, aber nichts sehen. Der Link steht danach auch im QR-Code
        (bitte den QR-Code neu drucken).</p>
      <label class="feld">Link „Dateien anfordern“<input type="url" data-bk-text="abgabe" value="${esc(e.abgabe)}" placeholder="https://…sharepoint.com/…"></label>
      ${e.abgabe && !ABGABE_OK.test(e.abgabe) ? `<p class="bk-meldung">Bitte einen OneDrive-/SharePoint-Link verwenden (beginnt mit https:// und enthält sharepoint.com, onedrive oder 1drv.ms).</p>` : ""}
      <p class="leise klein" style="margin-top:10px"><b>Abgegebene Dateien einlesen:</b>
        ${ordnerMoeglich ? `Den Ordner wählen, in den OneDrive die hochgeladenen Dateien auf diesem PC legt (meist <i>OneDrive › Dateien anfordern › …</i>).
          Das Tool liest ihn alle 30 Sekunden ein und entfernt eingelesene Dateien.` : "Auf diesem Gerät die Dateien von Hand auswählen (z. B. aus OneDrive in der Dateien-App)."}</p>
      <div class="aktionen">
        ${ordnerMoeglich ? (bkEingang.status === "aktiv" ? `<span class="badge ja">Eingangsordner „${esc(bkEingang.handle?.name)}“ aktiv${bkEingang.zuletzt ? " · geprüft " + uhrzeit(bkEingang.zuletzt) : ""}</span>`
          : bkEingang.status === "pausiert" ? `<button class="knopf mini" data-act="bk-eingang-fortsetzen">Eingangsordner fortsetzen</button>` : "")
          + `<button class="knopf mini ${bkEingang.status === "aktiv" ? "rand" : "zweit"}" data-act="bk-eingang-waehlen">${bkEingang.handle ? "Anderen Eingangsordner wählen …" : "Eingangsordner wählen …"}</button>` : ""}
        <label class="knopf mini rand datei-knopf">Dateien von Hand einlesen …<input type="file" accept=".json,application/json" multiple data-datei="anliegen"></label></div>
      ${bkEingang.fehler ? `<p class="bk-meldung">${esc(bkEingang.fehler)}</p>` : ""}
    </details>
  </div>`;
}

// Seite für die Kinder (Link aus dem QR-Code: …#postfach=CODE)
// Ist der Briefkasten nicht erreichbar, bleibt das Anliegen auf dem iPad gespeichert und wird automatisch nachgeschickt.
function postfachStarten(code, abgabeLink) {
  document.title = "Klassenrat-Briefkasten";
  document.body.innerHTML = `<div class="streifen"></div><main id="postfach" class="postfach"></main>`;
  const lsGet = (x) => { try { return localStorage.getItem(x); } catch (e) { return null; } };
  const lsSet = (x, v) => { try { localStorage.setItem(x, v); } catch (e) { /* egal */ } };
  const lsJson = (x, ersatz) => { try { return JSON.parse(lsGet(x)) ?? ersatz; } catch (e) { return ersatz; } };
  let geraet = lsGet("klassenrat-geraet");
  if (!geraet) { geraet = zufallsCode(16); lsSet("klassenrat-geraet", geraet); }
  const WARTE = "klassenrat-warte-" + code, INFO = "klassenrat-info-" + code;
  const zweiWochen = Date.now() - 14 * 864e5;
  const pf = window.pf = { status: "verbinde", info: lsJson(INFO, null), conn: null, peer: null, name: lsGet("klassenrat-name") || "", art: "", thema: "", worum: "",
    vertraulich: false, meldung: "", hinweis: "", danke: false, sendet: null, versuche: 0, timer: null,
    warte: lsJson(WARTE, []).filter((x) => x && x.zeit > zweiWochen), diag: {} };
  if (abgabeLink && ABGABE_OK.test(abgabeLink) && !pf.info?.abgabe) pf.abgabe = abgabeLink;
  const info = () => pf.info || { klasse: "", stufe: "ms", arten: ARTEN, anonym: false, vertraulich: true };
  const abgabe = () => (pf.info?.abgabe && ABGABE_OK.test(pf.info.abgabe) ? pf.info.abgabe : pf.abgabe || "");
  const warteSpeichern = () => lsSet(WARTE, JSON.stringify(pf.warte));
  const merken = () => { for (const f of ["name", "thema", "worum"]) { const el = document.getElementById("pf-" + f); if (el) pf[f] = el.value; } };
  const felderLeeren = () => Object.assign(pf, { art: "", thema: "", worum: "", vertraulich: false });
  const verbunden = () => pf.status === "offen" && pf.conn?.open;
  // Was hakt? Schritte der Verbindung mit ✓ / ✗ / …
  const DIAG = [["internet", "Internet"], ["baustein", "Verbindungsbaustein geladen"], ["dienst", "Vermittlungsdienst erreichbar"],
    ["briefkasten", "Briefkasten deiner Lehrkraft geöffnet"], ["direkt", "Direkte Verbindung im Netz möglich"]];
  const ursache = () => {
    const d = pf.diag;
    if (d.internet === false) return ["Kein Internet.", "Prüfe das WLAN deines iPads."];
    if (d.baustein === false) return ["Die Verbindung wird blockiert.", "Wahrscheinlich sperrt ein Filter auf deinem iPad die Seite unpkg.com. Sag deiner Lehrkraft Bescheid."];
    if (d.dienst === false) return ["Der Vermittlungsdienst ist nicht erreichbar.", "Er ist gerade gestört oder wird im Schulnetz blockiert (0.peerjs.com)."];
    if (d.briefkasten === false) return ["Der Briefkasten ist gerade geschlossen.", "Das Klassenrat-Tool deiner Lehrkraft ist im Moment nicht geöffnet."];
    if (d.direkt === false) return ["Der Briefkasten ist offen, aber das Netz lässt keine direkte Verbindung zu.", "Das liegt meist am Schul-WLAN. Sag deiner Lehrkraft Bescheid."];
    return ["Der Briefkasten ist gerade nicht erreichbar.", ""];
  };
  const zeichnen = () => {
    const el = document.getElementById("postfach"), i = info(), gs = i.stufe === "gs";
    document.body.dataset.stufe = i.stufe;
    const kopf = `<div class="pf-kopf">${bild("briefkasten", "l")}<div><h1>Klassenrat-Briefkasten</h1>${i.klasse ? `<p>Klasse ${esc(i.klasse)}</p>` : ""}</div></div>`;
    const n = pf.warte.length;
    let stand = "";
    if (pf.status === "verbinde") stand = `<div class="pf-stand">${bild("uhr", "m")}<div><b>Verbinde mit dem Briefkasten …</b></div></div>`;
    else if (pf.status === "geschlossen") {
      const [titel, text] = ursache();
      stand = `<div class="pf-stand zu">${bild("schloss", "m")}<div><b>${esc(titel)}</b>${text ? `<br><span class="klein">${esc(text)}</span>` : ""}
        <br><span class="klein">Du kannst dein Anliegen trotzdem aufschreiben. Es wird auf diesem iPad gespeichert und automatisch geschickt, sobald der Briefkasten erreichbar ist.</span>
        <details class="pf-diag"><summary>Verbindung prüfen</summary><ul>${DIAG.map(([k, l]) => `<li class="${pf.diag[k] === true ? "ja" : pf.diag[k] === false ? "nein" : ""}">
          <span>${pf.diag[k] === true ? "✓" : pf.diag[k] === false ? "✗" : "…"}</span>${l}</li>`).join("")}</ul>
          <button class="knopf mini" data-act="pf-neu">Erneut versuchen</button></details></div></div>`;
    }
    const warte = n ? `<div class="pf-warte">${bild("brief", "m")}<div><b>${n === 1 ? "Ein Anliegen wartet" : n + " Anliegen warten"} auf diesem iPad.</b>
        <br><span class="klein">${verbunden() ? "Wird gerade geschickt …" : "Es wird automatisch geschickt, sobald der Briefkasten offen ist. Lass diese Seite offen oder öffne den Link später noch einmal."}</span>
        ${!verbunden() && abgabe() ? `<div class="pf-abgabe"><b>Oder als Datei abgeben:</b>
          <div class="aktionen"><button class="knopf mini" data-act="pf-datei">1. Datei speichern</button>
            <a class="knopf mini rand" href="${esc(abgabe())}" target="_blank" rel="noopener">2. Abgabe-Seite öffnen und Datei hochladen</a></div>
          ${pf.dateiGespeichert ? `<span class="klein">Die Datei liegt in „Downloads“ bzw. in der Dateien-App. Auf der Abgabe-Seite „Dateien auswählen“ tippen und sie hochladen.</span>` : ""}</div>` : ""}
        ${!verbunden() ? `<div class="aktionen"><button class="knopf mini rand" data-act="pf-neu">Jetzt erneut versuchen</button></div>` : ""}</div></div>` : "";
    const hinweis = pf.hinweis ? `<p class="bk-gut">${esc(pf.hinweis)}</p>` : "";
    if (pf.danke) {
      const text = pf.danke === "wartet" ? `<b>Dein Anliegen ist auf diesem iPad gespeichert.</b><br>Es wird automatisch geschickt, sobald der Briefkasten offen ist.`
        : pf.danke === "vertraulich" ? "<b>Danke! Deine Nachricht ist bei deiner Lehrkraft angekommen.</b><br>Nur sie kann sie lesen."
        : "<b>Danke! Dein Anliegen ist angekommen.</b><br>Es wird im nächsten Klassenrat besprochen.";
      el.innerHTML = kopf + stand + warte + `<div class="karte leer">${bild(pf.danke === "vertraulich" ? "schloss" : pf.danke === "wartet" ? "uhr" : "brief", "l")}<p>${text}</p>
        <button class="knopf" data-act="pf-weiteres">Noch ein Anliegen</button></div>`;
      return;
    }
    const anonym = i.anonym && pf.anonym;
    const bereit = (pf.name.trim() || anonym) && pf.thema.trim() && !pf.sendet;
    el.innerHTML = kopf + stand + warte + hinweis + `<div class="bk-form">
      <section><h3><span class="n">1</span> Dein Name</h3>
        ${anonym ? `<p class="pf-anonym">${bild("schloss", "s")} Dein Anliegen wird <b>ohne Namen</b> abgeschickt.</p>`
          : `<input type="text" id="pf-name" maxlength="60" autocomplete="name" value="${esc(pf.name)}" placeholder="Vor- und Nachname">`}
        ${i.anonym ? `<div class="chips abstand"><button class="chip ${anonym ? "an" : ""}" data-act="pf-anonym">${anonym ? "✓ ohne Namen" : "Ohne Namen abschicken"}</button></div>` : ""}</section>
      <section><h3><span class="n">2</span> ${gs ? "Was für ein Thema ist es?" : "Was für ein Anliegen ist es?"} <span class="leise klein">(freiwillig)</span></h3>
        <div class="chips gross">${i.arten.map((x) => `<button class="chip ${pf.art === x ? "an" : ""}" data-act="pf-art" data-arg="${esc(x)}">${esc(x)}</button>`).join("")}</div></section>
      <section><h3><span class="n">3</span> ${gs ? "Worum geht es? Schreibe einen Satz." : "Dein Anliegen in einem Satz"}</h3>
        <input type="text" id="pf-thema" maxlength="200" value="${esc(pf.thema)}" placeholder="z. B. In der Pause ist es im Klassenzimmer zu laut.">
        <textarea id="pf-worum" rows="3" maxlength="1000" placeholder="Möchtest du noch etwas erklären? (freiwillig)">${esc(pf.worum)}</textarea></section>
      ${i.vertraulich ? `<section><h3><span class="n">4</span> Wer soll es lesen?</h3>${vertraulichWahl(pf.vertraulich, "pf-vertraulich", gs)}</section>` : ""}
      ${pf.meldung ? `<p class="bk-meldung">${esc(pf.meldung)}</p>` : ""}
      <div class="bk-senden"><button class="knopf gross" data-act="pf-senden" ${bereit ? "" : "disabled"}>${bild(pf.vertraulich && i.vertraulich ? "schloss" : "brief", "s")}
        ${pf.sendet ? "Wird gesendet …" : verbunden() ? "Abschicken" : "Speichern und später schicken"}</button></div>
    </div>`;
  };
  const senden = (e) => { try { pf.conn.send(e); return true; } catch (x) { return false; } };
  const warteSenden = () => { for (const e of pf.warte) if (e.id !== pf.sendet) senden(e); };
  const nochmal = (ms) => {
    clearTimeout(pf.timer);
    if (pf.versuche++ > 1000) return;
    pf.timer = setTimeout(() => { if (!verbunden()) verbinden(); }, ms ?? (pf.warte.length ? 10000 : 15000));
  };
  const verbinden = async () => {
    clearTimeout(pf.timer); clearTimeout(pf.direktTimer);
    pf.status = "verbinde"; pf.diag = { internet: navigator.onLine !== false };
    zeichnen();
    if (!pf.diag.internet) { pf.status = "geschlossen"; zeichnen(); nochmal(); return; }
    try { await peerLaden(); pf.diag.baustein = true; } catch (e) { pf.diag.baustein = false; pf.status = "geschlossen"; zeichnen(); nochmal(); return; }
    try { pf.peer?.destroy(); } catch (e) { /* egal */ }
    const peer = pf.peer = new window.Peer();
    peer.on("open", () => {
      if (peer !== pf.peer) return;
      pf.diag.dienst = true;
      const conn = pf.conn = peer.connect(BK_PREFIX + code, { reliable: true });
      // Gibt es den Briefkasten, aber die Verbindung kommt nicht zustande, blockiert meist das Netz direkte Verbindungen
      pf.direktTimer = setTimeout(() => {
        if (conn.open || conn !== pf.conn) return;
        if (pf.diag.briefkasten !== false) { pf.diag.briefkasten = true; pf.diag.direkt = false; }
        pf.status = "geschlossen"; zeichnen(); nochmal();
      }, 12000);
      conn.on("open", () => { pf.diag.briefkasten = true; pf.diag.direkt = true; clearTimeout(pf.direktTimer); });
      conn.on("data", (d) => {
        if (d?.typ === "bk-info") {
          pf.info = d; lsSet(INFO, JSON.stringify(d)); pf.status = "offen"; pf.versuche = 0;
          zeichnen(); warteSenden();
        }
        if ((d?.typ === "bk-ok" || d?.typ === "bk-fehler") && pf.warte.some((x) => x.id === d.id)) {
          const e = pf.warte.find((x) => x.id === d.id);
          pf.warte = pf.warte.filter((x) => x.id !== d.id); warteSpeichern();
          if (d.id === pf.sendet) {
            clearTimeout(pf.zeit); pf.sendet = null;
            if (d.typ === "bk-ok") { pf.danke = e.vertraulich ? "vertraulich" : true; felderLeeren(); pf.meldung = ""; }
            else pf.meldung = d.grund;
          } else if (d.typ === "bk-ok") pf.hinweis = `✓ Dein gespeichertes Anliegen „${e.thema}“ ist angekommen.`;
          else pf.hinweis = `Dein gespeichertes Anliegen „${e.thema}“ wurde nicht angenommen: ${d.grund}`;
          zeichnen();
        }
      });
      conn.on("close", () => { if (conn !== pf.conn) return; pf.status = "geschlossen"; pf.diag.briefkasten = false; zeichnen(); nochmal(); });
    });
    peer.on("error", (e) => {
      if (peer !== pf.peer) return;
      clearTimeout(pf.direktTimer);
      if (e.type === "peer-unavailable") pf.diag.briefkasten = false;
      else if (["network", "server-error", "socket-error", "socket-closed", "browser-incompatible"].includes(e.type)) pf.diag.dienst = pf.diag.dienst || false;
      else pf.meldung = "Verbindung nicht möglich (" + e.type + ")";
      if (pf.diag.dienst === undefined) pf.diag.dienst = false;
      pf.status = "geschlossen"; zeichnen(); nochmal();
    });
  };
  Object.assign(AKTIONEN, {
    "pf-neu"() { pf.versuche = 0; verbinden(); },
    "pf-art"(x) { merken(); pf.art = pf.art === x ? "" : x; zeichnen(); },
    "pf-anonym"() { merken(); pf.anonym = !pf.anonym; zeichnen(); },
    "pf-vertraulich"(x) { merken(); pf.vertraulich = x === "1"; zeichnen(); },
    "pf-weiteres"() { pf.danke = false; pf.hinweis = ""; zeichnen(); },
    "pf-senden"() {
      merken();
      const i = info(), anonym = i.anonym && pf.anonym;
      if (!((pf.name.trim() || anonym) && pf.thema.trim()) || pf.sendet) return;
      if (!anonym) lsSet("klassenrat-name", pf.name.trim());
      const e = { typ: "bk-anliegen", id: id(), name: anonym ? "" : pf.name.trim(), art: pf.art, thema: pf.thema.trim(), worum: pf.worum.trim(), geraet,
        vertraulich: !!(pf.vertraulich && i.vertraulich), zeit: Date.now() };
      pf.warte.push(e); warteSpeichern(); pf.meldung = ""; pf.hinweis = "";
      if (verbunden() && senden(e)) {
        pf.sendet = e.id; zeichnen();
        // keine Antwort: bleibt gespeichert und wird beim nächsten Verbinden erneut geschickt
        pf.zeit = setTimeout(() => { if (pf.sendet === e.id) { pf.sendet = null; pf.danke = "wartet"; felderLeeren(); zeichnen(); verbinden(); } }, 10000);
      } else { pf.danke = "wartet"; felderLeeren(); zeichnen(); if (pf.status !== "verbinde") verbinden(); }
    },
    async "pf-datei"() {
      const inhalt = JSON.stringify({ klassenrat: "anliegen", version: 1, code, eintraege: pf.warte });
      const name = `klassenrat-anliegen-${geraet.slice(0, 6)}-${Date.now().toString(36)}.json`;
      const datei = new File([inhalt], name, { type: "application/json" });
      if (istIOS && navigator.canShare?.({ files: [datei] })) {
        try { await navigator.share({ files: [datei], title: "Klassenrat-Anliegen" }); pf.dateiGespeichert = true; zeichnen(); return; } catch (x) { if (x.name === "AbortError") return; }
      }
      const a = document.createElement("a");
      a.href = URL.createObjectURL(datei); a.download = name; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      pf.dateiGespeichert = true; zeichnen();
    },
  });
  document.addEventListener("input", (e) => {
    if (!e.target.id?.startsWith("pf-")) return;
    merken();
    const knopf = document.querySelector("[data-act=pf-senden]");
    if (knopf) knopf.disabled = !((pf.name.trim() || (info().anonym && pf.anonym)) && pf.thema.trim() && !pf.sendet);
  });
  // zurück auf der Seite oder wieder online → sofort neu verbinden
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && !verbunden() && pf.status !== "verbinde") verbinden(); });
  window.addEventListener("online", () => { if (!verbunden()) verbinden(); });
  verbinden();
}

// Auswahl „für den Klassenrat“ / „nur für die Lehrkraft“ (Briefkasten am Tablet und online)

      <small>${gs ? "Wir sprechen alle zusammen darüber." : "Das Anliegen wird in der Sitzung besprochen."}</small></span></button>
    <button class="${an ? "an" : ""}" data-act="${act}" data-arg="1">${bild("schloss", "m")}<span><b>Nur für meine Lehrkraft</b>
      <small>${gs ? "Nur deine Lehrerin oder dein Lehrer liest das. Ihr redet allein darüber." : "Vertraulich – kommt nicht in den Klassenrat. Deine Lehrkraft spricht mit dir allein."}</small></span></button></div>`;
}
function renderBriefkasten() {

    return;
  }
  const bereit = (bk.name || (e.anonym && bk.name === "")) !== null && bk.name !== null && bk.thema.trim();
  el.innerHTML = `<div class="blitz bk">

      <section><h3><span class="n">2</span> ${gs ? "Was für ein Thema ist es?" : "Was für ein Anliegen ist es?"} <span class="leise klein">(freiwillig)</span></h3>
        <div class="chips gross">${arten(k).map((x) => `<button class="chip ${bk.art === x ? "an" : ""}" data-act="bk-art" data-arg="${esc(x)}">${esc(x)}</button>`).join("")}</div></section>
      <section><h3><span class="n">3</span> ${gs ? "Worum geht es? Schreibe einen Satz." : "Dein Anliegen in einem Satz"}</h3>

// --- Protokoll-iPad: Die Protokollantin / der Protokollant schreibt am eigenen iPad mit -----------------
// Das Gerät der Lehrkraft bleibt maßgeblich: Das iPad schickt nur Änderungen (Pfad → Wert), die Lehrkraft
// übernimmt sie, sieht sie sofort und schickt den Stand zurück. Auf dem iPad wird nichts gespeichert.
const PROT_PREFIX = "klassenrat-jpw-prot-";
const PROT_FELDER = ["positiv", "anliegen", "vorsatz"];  // nur das darf das Protokoll-iPad ändern
const PROT_SCHRITTE = ["positiv", "anliegen"];
// Schritt der Lehrkraft → passender Schritt auf dem Protokoll-iPad (vor und nach den Anliegen gibt es nichts mitzuschreiben)
const PROT_ZIEL = { start: "positiv", positiv: "positiv", rueckblick: "positiv", anliegen: "anliegen", abschluss: "anliegen", protokoll: "anliegen" };
const pr = { kind: false, rolle: null, peer: null, conn: null, code: "", status: "aus", schreiben: true, kid: null, sid: null,
  meldung: "", qr: null, timer: null, basis: null, sendeTimer: null, ort: null, versuche: 0, dialogOffen: false };
const kopie = (x) => JSON.parse(JSON.stringify(x));
const protLink = (code) => location.href.split("#")[0] + "#protokoll=" + code;

// Unterschiede zweier Stände als Liste [Pfad, Wert] bzw. [Pfad, null, 1] (gelöscht); Listen mit neuer Länge als Ganzes
function aenderungen(alt, neu, pfad = "", aus = []) {
  if (alt === neu) return aus;
  const obj = (x) => x !== null && typeof x === "object";
  if (!obj(alt) || !obj(neu) || Array.isArray(alt) !== Array.isArray(neu) || (Array.isArray(neu) && alt.length !== neu.length)) {
    aus.push(neu === undefined ? [pfad, null, 1] : [pfad, neu]);
    return aus;
  }
  for (const key of new Set([...Object.keys(alt), ...Object.keys(neu)])) aenderungen(alt[key], neu[key], pfad ? pfad + "." + key : key, aus);
  return aus;
}
// Eine Änderung vom Protokoll-iPad prüfen und übernehmen
function opAnwenden(s, pfad, wert, weg) {
  if (typeof pfad !== "string" || pfad.length > 200) return false;
  const teile = pfad.split(".");
  if (!PROT_FELDER.includes(teile[0]) || teile.some((x) => !x || ["__proto__", "prototype", "constructor"].includes(x))) return false;
  if (!weg && JSON.stringify(wert ?? null).length > 200000) return false;
  let o = s;
  for (const x of teile.slice(0, -1)) { if (!o || typeof o !== "object" || !Object.hasOwn(o, x)) return false; o = o[x]; }
  if (!o || typeof o !== "object") return false;
  const letzt = teile.at(-1), alt = o[letzt];
  if (Array.isArray(o) && !/^\d+$/.test(letzt)) return false;
  if (weg) { if (Array.isArray(o)) return false; delete o[letzt]; return true; }
  if (alt != null && (typeof alt !== typeof wert || Array.isArray(alt) !== Array.isArray(wert))) return false;
  o[letzt] = wert;
  return true;
}
// Neu zeichnen, ohne jemandem beim Tippen das Feld wegzunehmen: Werte anderer Felder sofort, Rest beim Verlassen des Felds
function liveAktualisieren() {
  const f = document.activeElement;
  if (!f?.matches?.("#app input, #app textarea, #app select")) { render(); return; }
  document.querySelectorAll("#app [data-k]").forEach((el) => {
    if (el === f || el.type === "radio" || el.type === "checkbox") return;
    const w = wertAn(el.dataset.k);
    if (w != null && el.value !== String(w)) el.value = w;
  });
  ui.spaeterZeichnen = true;
}
document.addEventListener("focusout", () => setTimeout(() => {
  if (ui.spaeterZeichnen && !document.activeElement?.matches?.("#app input, #app textarea, #app select")) { ui.spaeterZeichnen = false; render(); }
}, 120));

// Gerät der Lehrkraft ------------------------------------------------------------------------
async function prStarten() {
  prBeenden();
  const k = klasse(), s = sitzung();
  Object.assign(pr, { rolle: "lehrkraft", code: zufallsCode(12), status: "starte", schreiben: true, kid: k.id, sid: s.id, meldung: "", qr: null, qrFehler: "" });
  const meins = pr.code;
  prDialogZeigen();
  qrSvg(protLink(meins)).then((svg) => { if (pr.code === meins) { pr.qr = svg; prDialogZeigen(true); } })
    .catch((e) => { pr.qrFehler = e.message; prDialogZeigen(true); });
  try { await peerLaden(); } catch (e) { pr.status = "fehler"; pr.meldung = e.message; prAnzeigen(); return; }
  if (pr.code !== meins) return;
  const peer = pr.peer = new window.Peer(PROT_PREFIX + meins);
  peer.on("open", () => { if (pr.peer === peer) { pr.status = pr.conn?.open ? "verbunden" : "wartet"; prAnzeigen(); } });
  peer.on("error", (e) => {
    if (pr.peer !== peer || e.type === "peer-unavailable") return;
    if (["network", "server-error", "socket-error", "socket-closed"].includes(e.type)) { pr.meldung = "Verbindungsdienst nicht erreichbar"; }
    else { pr.status = "fehler"; pr.meldung = "Fehler: " + e.type; }
    prAnzeigen();
  });
  peer.on("disconnected", () => { if (pr.peer === peer) { try { peer.reconnect(); } catch (x) { /* egal */ } } });
  peer.on("connection", (conn) => {
    conn.on("open", () => {
      if (pr.conn?.open && pr.conn !== conn) { try { conn.send({ typ: "pr-belegt" }); } catch (x) { /* weg */ } setTimeout(() => conn.close(), 300); return; }
      pr.conn = conn; pr.status = "verbunden";
      if (document.querySelector("#dialog .prot-dialog")) { $("#dialog").innerHTML = ""; pr.dialogOffen = false; }
      prAnzeigen(); prStandSenden();
      meldung("📝 Protokoll-iPad verbunden");
    });
    conn.on("data", (d) => { if (conn === pr.conn) prNachricht(d); });
    conn.on("close", () => { if (conn === pr.conn) { pr.conn = null; if (pr.rolle === "lehrkraft") { pr.status = "wartet"; prAnzeigen(); } } });
  });
}
function prBeenden() {
  clearTimeout(pr.sendeTimer);

  if (pr.conn?.open) { try { pr.conn.send({ typ: "pr-ende" }); } catch (e) { /* weg */ } }
  const alt = pr.peer;
  setTimeout(() => { try { alt?.destroy(); } catch (e) { /* egal */ } }, 400);  // Abschied noch zustellen
  Object.assign(pr, { rolle: null, peer: null, conn: null, status: "aus", code: "", qr: null, sid: null });
  prAnzeigen();
}

function prStandSendenSpaeter() { clearTimeout(pr.sendeTimer); pr.sendeTimer = setTimeout(prStandSenden, 200); }
function prStandSenden() {
  if (pr.rolle !== "lehrkraft" || !pr.conn?.open) return;
  const k = state.klassen.find((x) => x.id === pr.kid), s = k?.sitzungen.find((x) => x.id === pr.sid);
  if (!s) { prBeenden(); return; }
  const { unterschriften, ...rest } = s;
  const ort = ui.view === "sitzung" && ui.sitzungId === s.id ? { schritt: ui.schritt, idx: ui.anliegenIdx } : null;
  try {
    pr.conn.send({ typ: "pr-stand", schreiben: pr.schreiben && !s.gesperrt, ort, sitzung: { ...rest, unterschriften: {} },
      klasse: { id: k.id, name: k.name, stufe: k.stufe, schueler: k.schueler, arten: k.arten || null, bausteine: k.bausteine || null, timer: k.timer, lehrkraft: k.lehrkraft } });

function prNachricht(d) {

  const k = state.klassen.find((x) => x.id === pr.kid), s = k?.sitzungen.find((x) => x.id === pr.sid);
  if (!s || s.gesperrt || !pr.schreiben) { prStandSenden(); return; }
  let neu = false;
  for (const op of d.ops.slice(0, 300)) if (Array.isArray(op) && opAnwenden(s, op[0], op[1], op[2])) neu = true;
  if (!neu) { prStandSenden(); return; }

  if (ui.view === "sitzung" && ui.sitzungId === s.id) liveAktualisieren();

// Protokoll-iPad (Link aus dem QR-Code: …#protokoll=CODE) ------------------------------------------
function protokollantStarten(code) {

  state = { version: 2, klassen: [], aktiveKlasse: null, logo: null };

async function prKindVerbinden() {
  if (["ende", "belegt"].includes(pr.status)) return;
  try { await peerLaden(); } catch (e) { pr.status = "getrennt"; pr.meldung = e.message; render(); return; }
  try { pr.peer?.destroy(); } catch (e) { /* egal */ }
  const peer = pr.peer = new window.Peer();
  const nochmal = () => {
    if (["ende", "belegt"].includes(pr.status) || pr.versuche++ > 200) return;
    clearTimeout(pr.timer);
    pr.timer = setTimeout(() => { if (!pr.conn?.open) prKindVerbinden(); }, 3000);
  };
  peer.on("open", () => {
    const conn = pr.conn = peer.connect(PROT_PREFIX + pr.code, { reliable: true });
    conn.on("open", () => { pr.versuche = 0; conn.send({ typ: "pr-hallo" }); });
    conn.on("data", prKindNachricht);
    conn.on("close", () => {
      if (["ende", "belegt"].includes(pr.status) || conn !== pr.conn) return;
      pr.status = "getrennt"; pr.meldung = "Verbindung unterbrochen – verbinde neu …"; render(); nochmal();
    });
  });
  peer.on("error", (e) => {
    if (["ende", "belegt"].includes(pr.status) || peer !== pr.peer) return;
    pr.status = "getrennt";
    pr.meldung = e.type === "peer-unavailable" ? "Das Gerät der Lehrkraft ist gerade nicht erreichbar." : "Verbindung nicht möglich (" + e.type + ")";
    render(); nochmal();
  });
}
function prKindNachricht(d) {
  if (d?.typ === "pr-belegt") { pr.status = "belegt"; render(); return; }
  if (d?.typ === "pr-ende") { pr.status = "ende"; state.klassen = []; pr.basis = null; try { pr.conn?.close(); } catch (e) { /* egal */ } render(); return; }
  if (d?.typ !== "pr-stand" || !d.sitzung || !d.klasse) return;
  const offen = prKindSenden();  // eigene, noch nicht geschickte Änderungen zuerst
  for (const [p, w, weg] of offen) opAnwenden(d.sitzung, p, w, weg);
  const k = { ...d.klasse, arten: d.klasse.arten || undefined, bausteine: d.klasse.bausteine || undefined, sitzungen: [d.sitzung] };
  const vorher = { status: pr.status, schreiben: pr.schreiben, sid: ui.sitzungId };
  state.klassen = [k]; state.aktiveKlasse = k.id; ui.sitzungId = d.sitzung.id;
  pr.basis = kopie(d.sitzung);
  pr.status = "verbunden"; pr.schreiben = !!d.schreiben; pr.meldung = "";
  let neuZeichnen = vorher.status !== "verbunden" || vorher.schreiben !== pr.schreiben || vorher.sid !== ui.sitzungId;
  // dem Protokoll der Lehrkraft folgen (neuer Schritt / neues Anliegen)
  if (d.ort && PROT_ZIEL[d.ort.schritt] && JSON.stringify(d.ort) !== JSON.stringify(pr.ort)) {
    const ziel = PROT_ZIEL[d.ort.schritt];
    if (ziel !== ui.schritt || d.ort.schritt === "anliegen") { ui.schritt = ziel; ui.ziel = null; }

    neuZeichnen = true;

}
function prKindSendenSpaeter() { clearTimeout(pr.sendeTimer); pr.sendeTimer = setTimeout(prKindSenden, 120); }
function prKindSenden() {
  clearTimeout(pr.sendeTimer);

}

// --- Timer ---------------------------------------------------------------------
// timer.aid: Anliegen, zu dem der Timer gehört; timer.reste merkt sich die Restzeit, wenn ein anderes Anliegen geöffnet wird
const timer = { offen: false, rest: 600, laeuft: false, int: null, ende: false, aid: null, reste: {}, gesamt: 600 };
function timerTitel() {
  const s = sitzung(), i = s?.anliegen.findIndex((a) => a.id === timer.aid);
  return i >= 0 ? `${T().einAnliegen} ${i + 1}` : "";
}
function renderTimer() {
  const b = $("#timer-bereich");

  if (!timer.offen) { b.innerHTML = `<button class="knopf timer-knopf" data-act="timer-auf">${bild("uhr", "s")} Timer</button>`; return; }
  const m = Math.floor(timer.rest / 60), s = timer.rest % 60, titel = timerTitel();
  const bald = !timer.ende && timer.rest <= 120 && timer.gesamt > 120;
  b.innerHTML = `<div class="timer ${timer.ende ? "ende" : bald ? "bald" : ""}">
    <div class="kopf">${bild("uhr")} Zeitwächter/in<button class="x" data-act="timer-zu" title="Timer schließen">✕</button></div>
    ${titel ? `<div class="timer-titel">${esc(titel)}</div>` : ""}
    <div class="zeit">${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}</div>
    ${timer.ende ? `<div class="timer-text">Die Zeit ist um!</div>` : bald ? `<div class="timer-text">Noch 2 Minuten – Bescheid geben!</div>` : ""}
    <div class="reihe"><button class="knopf mini rand" data-act="timer-plus" data-arg="-60">−1</button>
      <button class="knopf mini" data-act="timer-los">${timer.laeuft ? "Pause" : "Start"}</button>
      <button class="knopf mini rand" data-act="timer-plus" data-arg="60">+1</button></div>
    <div class="reihe">${[2, 5, 10, 15].map((n) => `<button class="knopf mini zweit" data-act="timer-setzen" data-arg="${n}">${n}′</button>`).join("")}</div>
  </div>`;
}
function timerTick() {
  timer.rest = Math.max(0, timer.rest - 1);
  if (timer.rest === 120 && timer.gesamt > 120) { piep(1); meldung("⏱ Noch 2 Minuten – Zeitwächter/in gibt Bescheid"); timerGeaendert(); }
  if (timer.rest === 0) { clearInterval(timer.int); timer.laeuft = false; timer.ende = true; piep(); timerGeaendert(); }
  renderTimer();
}
function piep(anzahl = 3) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, .35, .7].slice(0, anzahl).forEach((t) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(.25, ctx.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + t + .3);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + .3);
    });
  } catch (e) { /* kein Ton möglich */ }
}
function timerStarten(min, aid = null) {
  clearInterval(timer.int);
  Object.assign(timer, { offen: true, rest: min * 60, gesamt: min * 60, laeuft: true, ende: false, aid });
  timer.int = setInterval(timerTick, 1000);
  renderTimer(); timerGeaendert();
}
function timerWeiter() {
  if (timer.laeuft || timer.rest <= 0) return;
  timer.ende = false; timer.laeuft = true; timer.int = setInterval(timerTick, 1000);
}
function timerPause() { clearInterval(timer.int); timer.laeuft = false; }
// Was eine Tafel zur Uhr braucht (Restzeit als Zeitpunkt, damit die Tafel selbst weiterzählt)
function zeitDaten() {
  if (!timer.offen) return null;
  return { bis: timer.laeuft ? Date.now() + timer.rest * 1000 : null, rest: timer.rest, ende: timer.ende, gesamt: timer.gesamt, titel: timerTitel() };
}
function timerGeaendert() {
  if (tafelOffen() || direktOffen()) tafelSenden();
  if (ordner.status === "aktiv" && ui.view === "sitzung") sichernInOrdnerSpaeter();
  if (ui.view === "sitzung" && ui.schritt === "anliegen") {  // Knopf im Anliegen (Pause/Timer) aktualisieren
    const knopf = document.querySelector(".anliegen-kopf [data-act=timer-start]");

function zeitplanFolgen() {
  if (pr.kind) return;
  const s = sitzung(), k = klasse();
  const a = ui.view === "sitzung" && s && ui.schritt === "anliegen" ? s.anliegen[ui.anliegenIdx] : null;
  sprechzeitWechsel(s, a);
  if (timer.aid && a?.id !== timer.aid) {
    timer.reste[timer.aid] = { rest: timer.rest, laeuft: timer.laeuft, ende: timer.ende, gesamt: timer.gesamt };
    timerPause(); timer.aid = null; timer.offen = false;

  if (!a || a.id === timer.aid || k.autoTimer === false || istGesperrt(s) || s.datum !== heute()) return;

// --- Sprechzeit: Ist der Zeitwächter aktiv, wird gespeichert, wann und wie lange ein Anliegen besprochen wurde ----
// a.zeiten = [{ von, bis }] (Zeitstempel). Kurzes Durchblättern (unter 15 s) zählt nicht.
const sprech = { sid: null, aid: null };
function sprechzeitBeenden(sofort) {
  if (!sprech.aid) return;
  const a = state.klassen.flatMap((k) => k.sitzungen).find((x) => x.id === sprech.sid)?.anliegen.find((x) => x.id === sprech.aid);
  const seg = a?.zeiten?.at(-1);
  if (seg && !seg.bis) { if (Date.now() - seg.von < 15000) a.zeiten.pop(); else seg.bis = Date.now(); }
  sprech.sid = sprech.aid = null;
  if (sofort) { try { localStorage.setItem(SPEICHER, JSON.stringify(state)); } catch (e) { /* voll */ } } else speichern();
}
function sprechzeitWechsel(s, a) {
  if (sprech.aid && (a?.id !== sprech.aid || s?.id !== sprech.sid)) sprechzeitBeenden();
  if (!a || a.id === sprech.aid || !rolleAktiv(s, "zeit") || istGesperrt(s) || s.datum !== heute()) return;
  const seg = (a.zeiten ||= []).at(-1);
  if (seg && !seg.bis) seg.bis = seg.von;  // nicht sauber beendet (z. B. Seite geschlossen)
  a.zeiten.push({ von: Date.now() });

window.addEventListener("pagehide", () => { if (!pr.kind) sprechzeitBeenden(true); });
const uhrzeit = (z) => new Date(z).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
function sprechMinuten(a) {

}
function sprechzeitText(a) {
  const segs = [];
  for (const z of (a.zeiten || []).filter((x) => x.bis !== x.von)) {  // Abschnitte mit kurzer Lücke zusammenfassen
    const vor = segs.at(-1);
    if (vor?.bis && z.von - vor.bis < 120000) vor.bis = z.bis; else segs.push({ ...z });
  }
  if (!segs.length) return "";
  return `${segs.map((z) => `${uhrzeit(z.von)}–${z.bis ? uhrzeit(z.bis) : sprech.aid === a.id ? "jetzt" : "?"}`).join(", ")} · ${sprechMinuten(a)} min`;
}
function timerFuerAnliegen(a, auto) {
  const alt = timer.reste[a.id];
  if (alt) {
    Object.assign(timer, { offen: true, rest: alt.rest, ende: alt.ende, gesamt: alt.gesamt, aid: a.id });
    if (alt.laeuft || !auto) timerWeiter();

// --- Automatische Sicherung in einen Ordner (z. B. OneDrive) ---------------------
// Der Browser schreibt die Sicherung in einen einmal gewählten Ordner. Liegt dieser im
// OneDrive-Ordner des PCs, lädt OneDrive die Datei automatisch hoch.
const ordner = { handle: null, status: "aus", zuletzt: null, fehler: "" };
const ordnerMoeglich = "showDirectoryPicker" in window;
function idb(modus, fn) {
  return new Promise((ok, fehler) => {
    const r = indexedDB.open("klassenrat-jpw", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onerror = () => fehler(r.error);
    r.onsuccess = () => {
      const tx = r.result.transaction("kv", modus), q = fn(tx.objectStore("kv"));
      tx.oncomplete = () => ok(q?.result);
      tx.onerror = () => fehler(tx.error);
    };

}
async function ordnerLaden() {
  if (!ordnerMoeglich) return;
  try {
    ordner.handle = await idb("readonly", (st) => st.get("ordner"));
    if (ordner.handle) {
      ordner.status = (await ordner.handle.queryPermission({ mode: "readwrite" })) === "granted" ? "aktiv" : "pausiert";
      ordner.zuletzt = (await idb("readonly", (st) => st.get("zuletzt"))) || null;
    }
  } catch (e) { ordner.status = "aus"; }
  renderCloud();
  if (ui.view === "daten") render();
}
async function ordnerWaehlen() {
  try {
    const h = await window.showDirectoryPicker({ id: "klassenrat", mode: "readwrite", startIn: "documents" });
    ordner.handle = h; ordner.status = "aktiv";
    await idb("readwrite", (st) => st.put(h, "ordner"));
    const vorhanden = await dateiStand(h);
    if (vorhanden && vorhanden.zeit > (state.gespeichertAm || 0)) {
      // im Ordner liegen neuere Daten (z. B. von einem anderen Gerät): laden statt überschreiben
      if (!state.klassen.length || confirm(`Im Ordner liegt eine neuere Sicherung (Stand ${new Date(vorhanden.zeit).toLocaleString("de-DE")}). Jetzt laden?`)) {
        await dateiLaden(vorhanden.handle, { nurWennNeuer: false });
      } else ordner.basis = vorhanden.zeit;
    } else if (vorhanden) ordner.basis = vorhanden.zeit;
    if (vorhanden) await letzteDateiMerken(vorhanden.handle);
    await sichernInOrdner();
    if (!vorhanden) { const neu = await dateiStand(h); if (neu) await letzteDateiMerken(neu.handle); }
  } catch (e) {

  }

}
async function ordnerFortsetzen() {

    if (ordner.status === "aktiv") await sichernInOrdner();

let ordnerTimer;

    const vorhanden = await dateiStand(ordner.handle);

async function dateiStand(dir) {  // Stand der Sicherung im Ordner (null, wenn keine da ist)
  try {
    const h = await dir.getFileHandle("klassenrat-sicherung.json"), f = await h.getFile();
    const d = JSON.parse(await f.text());

  } catch (e) { return null; }
}

// Lädt eine Sicherungsdatei. nurWennNeuer: nur übernehmen, wenn sie neuer ist als die Daten im Browser.
async function dateiLaden(h, { nurWennNeuer = true, fragen = false } = {}) {
  const f = await h.getFile();
  let neu = JSON.parse(await f.text());
  if (!Array.isArray(neu.klassen) && !istVerschluesselt(neu)) throw new Error("keine Klassenrat-Sicherung");
  const zeit = neu.gespeichertAm || f.lastModified;
  if (nurWennNeuer && zeit <= (state.gespeichertAm || 0)) return false;
  if (fragen && state.klassen.length && !confirm(`Sicherung vom ${new Date(zeit).toLocaleString("de-DE")} laden? Sie ersetzt die Daten in diesem Browser.`)) return false;
  if (istVerschluesselt(neu)) neu = await entschluesseln(neu, h.name);
  if (!Array.isArray(neu.klassen)) throw new Error("keine Klassenrat-Sicherung");
  const logo = state.logo;
  state = migrieren(neu);
  if (!state.logo && logo) state.logo = logo;
  state.gespeichertAm = zeit;
  try { localStorage.setItem(SPEICHER, JSON.stringify(state)); } catch (e) { /* voll */ }
  ordner.basis = zeit; ordner.konflikt = null; ui.ladenHandle = null;
  if (!state.klassen.some((k) => k.id === state.aktiveKlasse)) state.aktiveKlasse = state.klassen[0]?.id || null;
  await letzteDateiMerken(h);
  meldung(`☁ Daten geladen: ${h.name} – Stand ${new Date(zeit).toLocaleString("de-DE", { dateStyle: "short", timeStyle: "short" })}`);
  ui.view = "sitzungen"; render();

}

// Knopf zum Laden einer Sicherung. Mit Dateizugriff (Edge/Chrome am PC) wird die Datei gemerkt;

function ladenKnopf(text) {
  if (window.showOpenFilePicker) return `<button class="knopf rand" data-act="import">${text}</button>`;
  return `<label class="knopf rand datei-knopf">${text}<input type="file" accept=".json,application/json,text/plain" data-datei="sicherung"></label>`;
}
function dateiLesen(f, alsBild) {
  return new Promise((ok, fehler) => {
    const r = new FileReader();
    r.onload = () => ok(r.result);
    r.onerror = () => fehler(r.error);
    alsBild ? r.readAsDataURL(f) : r.readAsText(f);
  });
}
async function sicherungAusDatei(f) {
  try {
    let neu = JSON.parse(await dateiLesen(f));
    if (!Array.isArray(neu.klassen) && !istVerschluesselt(neu)) throw new Error("keine Klassenrat-Sicherung");
    if (state.klassen.length && !confirm("Die Sicherung ersetzt alle Daten auf diesem Gerät. Fortfahren?")) return;
    if (istVerschluesselt(neu)) neu = await entschluesseln(neu, f.name);
    if (!Array.isArray(neu.klassen)) throw new Error("keine Klassenrat-Sicherung");
    const logo = state.logo;
    state = migrieren(neu);
    if (!state.logo && logo) state.logo = logo;
    if (!state.klassen.some((k) => k.id === state.aktiveKlasse)) state.aktiveKlasse = state.klassen[0]?.id || null;
    ui.view = "sitzungen"; speichern(); render();
    state.letzteDatei = { name: f.name, zeit: f.lastModified || Date.now() }; speichern();
    meldung(`☁ Sicherung geladen: ${f.name}`);
  } catch (e) { if (e.name !== "AbortError") alert("Diese Datei ist keine gültige Klassenrat-Sicherung (" + (e.message || e) + ")."); }
}
document.addEventListener("change", async (e) => {

  if (!inp || !inp.files?.[0]) return;
  const f = inp.files[0], alleDateien = [...inp.files];
  inp.value = "";  // dieselbe Datei später erneut wählbar
  if (inp.dataset.datei === "sicherung") return sicherungAusDatei(f);

    const dateien = alleDateien;
    let neu = 0; const fehler = [];
    for (const x of dateien) { const r = anliegenDateiEinlesen(await dateiLesen(x)); neu += r.neu || 0; if (r.fehler) fehler.push(`${x.name}: ${r.fehler}`); }
    if (neu) speichern();

    alert(`${neu === 1 ? "Ein neues Anliegen" : neu + " neue Anliegen"} eingelesen.${fehler.length ? "\n\nNicht eingelesen:\n" + fehler.join("\n") : ""}`);
    return;
  }
  if (inp.dataset.datei === "logo") {
    if (f.size > 1.5e6) { alert("Die Datei ist zu groß (max. 1,5 MB)."); return; }
    state.logo = await dateiLesen(f, true); speichern(); render();

      s.anliegen.splice(+i, 1); ui.anliegenIdx = Math.max(0, Math.min(ui.anliegenIdx, s.anliegen.length - 1)); ui.ziel = null;
      speichern(); render();
    }
  },
  "vertagt-uebernehmen"() {
    const s = sitzung(), vorher = sortiert(klasse()).filter((x) => x.nr < s.nr).at(-1);
    for (const a of vorher.anliegen.filter((a) => a.ergebnis === "vertagt" && !s.anliegen.some((b) => b.aus === a.id))) {
      s.anliegen.push(neuesAnliegen({ aus: a.id, thema: a.thema, von: [...a.von], art: a.art, worum: a.worum + (a.worum ? "\n" : "") + `(vertagt aus Sitzung ${vorher.nr})` }));
    }
    speichern(); render();
  },
  "vorschlag-neu"(i) { sitzung().anliegen[i].vorschlaege.push({ text: "", von: [], ja: 0, nein: 0, enth: 0 }); speichern(); render(); },
  "beste-idee"(i) {
    const a = sitzung().anliegen[i];
    const beste = a.vorschlaege.filter((v) => v.text).sort((x, y) => (y.ja || 0) - (x.ja || 0))[0];
    if (beste) { a.beschluss = beste.text; speichern(); render(); }
  },
  zaehlen(arg) {
    const [pfad, d] = arg.split("|"), teile = pfad.split("."), feld = teile.pop();
    const o = teile.reduce((x, k) => x[k], sitzung());
    o[feld] = Math.max(0, (o[feld] || 0) + +d); speichern(); render();
  },
  filter(f) { ui.filter = f; render(); },
  "klasse-anlegen"() {
    const name = $("#nk-name").value.trim();
    if (!name) { $("#nk-name").focus(); return; }
    const k = { id: id(), name, schuljahr: $("#nk-jahr").value.trim(), lehrkraft: "", timer: 10,
      stufe: document.querySelector("[name=nk-stufe]:checked").value,
      schueler: $("#nk-schueler").value.split("\n").map((x) => x.trim()).filter(Boolean), sitzungen: [] };
    state.klassen.push(k); state.aktiveKlasse = k.id; ui.view = "sitzungen"; speichern(); render();
  },
  "klasse-neu"() { $("#app").innerHTML = viewWillkommen(true); },
  "klasse-loeschen"() {
    const k = klasse();
    if (confirm(`Klasse ${k.name} mit allen ${k.sitzungen.length} Sitzungen löschen? Das kann nicht rückgängig gemacht werden.`)) {
      state.klassen = state.klassen.filter((x) => x.id !== k.id); state.aktiveKlasse = state.klassen[0]?.id || null;
      ui.view = "sitzungen"; speichern(); render();
    }
  },
  "schueler-speichern"() {
    klasse().schueler = [...new Set($("#schuelerliste").value.split("\n").map((x) => x.trim()).filter(Boolean))];
    speichern(); render();
  },
  "schueler-sortieren"() {
    const ta = $("#schuelerliste");
    ta.value = ta.value.split("\n").map((x) => x.trim()).filter(Boolean).sort((a, b) => a.localeCompare(b, "de")).join("\n");
  },
  export: exportieren,
  async "teilen-jetzt"() {
    const datei = ui.teilenDatei; $("#dialog").innerHTML = "";
    if (!datei) return;
    try { await navigator.share({ files: [datei], title: "Klassenrat-Sicherung" }); speichern(); render(); } catch (e) { /* abgebrochen */ }
  },
  async "schluessel-eingeben"() {
    if (await passwortAbfragen("Die automatische Sicherung wird mit deinem Passwort verschlüsselt. Bitte gib es einmal ein.")) {
      if (ordner.status === "schluessel") ordner.status = "aktiv";
      await sichernInOrdner(); render();
    }
  },
  async import() {
    if (window.showOpenFilePicker) {  // mit Dateizugriff: Datei merken und beim nächsten Start wieder öffnen
      try {
        const [h] = await window.showOpenFilePicker({ id: "klassenrat-laden", types: [{ description: "Klassenrat-Sicherung", accept: { "application/json": [".json"] } }] });
        await dateiLaden(h, { nurWennNeuer: false, fragen: true });
      } catch (e) { if (e.name !== "AbortError") alert("Diese Datei ist keine gültige Klassenrat-Sicherung."); }
      return;
    }
  },
  "logo-zuruecksetzen"() { if (confirm("Schullogo von diesem Gerät entfernen?")) { state.logo = null; speichern(); render(); } },
  "alles-loeschen"() {
    if (confirm("Wirklich ALLE Daten löschen? Lade vorher eine Sicherung herunter, wenn du sie noch brauchst.")) {
      try { localStorage.removeItem(SPEICHER); } catch (e) { /* egal */ }
      Object.assign(krypto, { schluessel: null, salz: null });
      idb("readwrite", (st) => st.delete("schluessel")).catch(() => {});
      state = laden(); ui.view = "sitzungen"; render();
    }
  },
  "ordner-waehlen": ordnerWaehlen,
  "laden-erlauben": ladenErlauben,
  "laden-ignorieren"() { ui.ladenHandle = null; render(); },
  async "konflikt-laden"() { if (ordner.konflikt) await dateiLaden(ordner.konflikt.handle, { nurWennNeuer: false }).catch(() => {}); },
  async "konflikt-behalten"() {
    if (!confirm("Deine Daten ersetzen dann die neueren Daten in OneDrive. Fortfahren?")) return;
    ordner.basis = ordner.konflikt?.zeit || Date.now(); ordner.konflikt = null; await sichernInOrdner(); render();
  },
  "ordner-fortsetzen": ordnerFortsetzen,
  "ordner-trennen": ordnerTrennen,
  "ordner-laden": ausOrdnerLaden,
  "timer-auf"() { timer.offen = true; timer.rest = timer.gesamt = (klasse()?.timer || 10) * 60; timer.ende = false; renderTimer(); timerGeaendert(); },
  "timer-zu"() {
    timerPause(); if (timer.aid) delete timer.reste[timer.aid];
    Object.assign(timer, { offen: false, ende: false, aid: null }); renderTimer(); timerGeaendert();
  },
  "timer-start"(i) {
    const a = sitzung()?.anliegen[i];
    if (!a) { timerStarten(klasse()?.timer || 10); return; }
    if (timer.aid === a.id) { timer.laeuft ? timerPause() : timer.rest > 0 ? timerWeiter() : timerStarten(minutenFuer(a), a.id); renderTimer(); timerGeaendert(); return; }
    if (timer.aid) timer.reste[timer.aid] = { rest: timer.rest, laeuft: false, ende: timer.ende, gesamt: timer.gesamt };
    timerPause(); timerFuerAnliegen(a, false);
  },
  "timer-los"() {
    if (timer.laeuft) timerPause(); else timerWeiter();
    renderTimer(); timerGeaendert();
  },
  "timer-plus"(d) { timer.rest = Math.max(0, timer.rest + +d); if (+d > 0) timer.gesamt = Math.max(timer.gesamt, timer.rest); timer.ende = false; renderTimer(); timerGeaendert(); },
  "timer-setzen"(n) { timerPause(); Object.assign(timer, { rest: n * 60, gesamt: n * 60, ende: false }); renderTimer(); timerGeaendert(); },
};

const ERLAUBT_GESPERRT = ["schritt", "anliegen-tab", "drucken", "view", "entsperren", "moderation", "mod-direkt", "tafel-wahl-direkt", "mod-tafel", "mod-hier", "mod-export", "mod-onedrive", "dialog-zu",
  "rollen-hilfe", "antrag-drucken", "antrag-teilen"];
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || (el.tagName === "LABEL")) return;
  e.preventDefault();
  e.stopPropagation();
  if (el.closest("#sperrbereich.gesperrt") && !ERLAUBT_GESPERRT.includes(el.dataset.act)) return;
  AKTIONEN[el.dataset.act]?.(el.dataset.arg, el);
});
document.addEventListener("input", (e) => {
  const el = e.target;
  const wert = el.type === "checkbox" ? el.checked : el.dataset.typ === "zahl" ? (+el.value || 0) : el.value;
  if (el.dataset.k && sitzung()) {
    if (el.dataset.k.startsWith("rueckblick.")) { /* Notiz nur bei gesetztem Status */
      const [, bid] = el.dataset.k.split(".");
      if (!sitzung().rueckblick[bid]) return;
    }
    pfadSetzen(sitzung(), el.dataset.k, wert);
  } else if (el.dataset.kk && klasse()) {
    pfadSetzen(klasse(), el.dataset.kk, wert);
  } else return;
  speichern();
  if ("neuZeichnen" in el.dataset) render();
});
document.addEventListener("change", (e) => {
  if (e.target.id === "klassenwahl") {
    if (e.target.value === "__neu") { $("#app").innerHTML = viewWillkommen(true); return; }
    state.aktiveKlasse = e.target.value; ui.view = "sitzungen"; speichern(); render();
  }
});
// Briefkasten: Eingaben merken, ohne neu zu zeichnen (Knopf freigeben, sobald Name und Satz da sind)
function bkFelderMerken() {
  const t = $("#bk-thema"), w = $("#bk-worum");
  if (t) bk.thema = t.value;
  if (w) bk.worum = w.value;
}
document.addEventListener("input", (e) => {
  if (e.target.id === "bk-thema" || e.target.id === "bk-worum") {
    bkFelderMerken();
    const knopf = document.querySelector("[data-act=bk-senden]");
    const bereit = bk.name !== null && bk.thema.trim();
    if (knopf) knopf.disabled = !bereit;
    if ($("#bk-hinweis")) $("#bk-hinweis").textContent = bereit ? "" : "Bitte deinen Namen antippen und das Anliegen aufschreiben.";
  }
  if (e.target.dataset?.wg && klasse()) {
    const k = klasse(), aid = e.target.dataset.wg;
    (k.weitergaben ||= {})[aid] = { ...(k.weitergaben[aid] || {}), antwort: e.target.value };
    speichern();
  }
  if (e.target.dataset?.bkText && klasse()) {
    const k = klasse();
    k.bkEinst = { ...bkEinst(k), [e.target.dataset.bkText]: e.target.value.trim() };
    speichern();
    clearTimeout(ui.abgabeTimer);
    ui.abgabeTimer = setTimeout(() => {  // QR-Code und verbundene iPads mit dem neuen Link versorgen
      const o = onlineBk[k.id];
      if (o) qrSvg(postfachLink(o.code, k)).then((svg) => { o.qr = svg; bkNeuZeichnen(true); }).catch(() => {});
      for (const c of o?.verbindungen || []) { try { if (c.open) c.send(bkInfo(k)); } catch (x) { /* weg */ } }
    }, 800);
  }
  if (e.target.dataset?.bk && klasse()) {
    const k = klasse(), key = e.target.dataset.bk;
    k.bkEinst = { ...bkEinst(k), [key]: e.target.type === "checkbox" ? e.target.checked : Math.max(0, +e.target.value || 0) };
    speichern();
    document.querySelectorAll(`[data-bk="${key}"]`).forEach((x) => { if (x !== e.target && x.type === "checkbox") x.checked = e.target.checked; });
    // verbundene Kinder-iPads sofort informieren (z. B. „ohne Namen“ erlaubt)
    for (const c of onlineBk[k.id]?.verbindungen || []) {
      try { if (c.open) c.send(bkInfo(k)); } catch (x) { /* weg */ }
    }
  }
});
// Textfelder wachsen mit dem Inhalt; Reiter zeigt das Thema sofort
document.addEventListener("input", (e) => {
  if (e.target.tagName === "TEXTAREA" && e.target.rows === 1) hoeheAnpassen(e.target);
  if ("frueher" in e.target.dataset) frueherZeigen(e.target);
  // geplante Minuten geändert, während der Timer dieses Anliegens läuft → Restzeit anpassen
  const m = e.target.dataset.k?.match(/^anliegen\.(\d+)\.minuten$/);
  if (m && sitzung()?.anliegen[m[1]]?.id === timer.aid && timer.offen) {
    const neu = minutenFuer(sitzung().anliegen[m[1]]) * 60;
    timer.rest = Math.max(0, timer.rest + neu - timer.gesamt); timer.gesamt = neu; timer.ende = timer.rest === 0 && timer.ende;
    renderTimer(); timerGeaendert();
  }
  if ("reiter" in e.target.dataset) { const t = document.querySelector(".reiter button.aktiv .t"); if (t) t.textContent = e.target.value || T().einAnliegen; }
});
// Klick in eine Aussage-Zeile: angetippte Namen gehören zu dieser Zeile
document.addEventListener("focusin", (e) => {
  const z = e.target.dataset?.ziel;
  if (z && z !== ui.ziel) { ui.ziel = z; zielAnzeigen(); }
});
// Enter beendet die Zeile – der nächste Name beginnt eine neue
document.addEventListener("keydown", (e) => {
  if (mod.offen) {
    if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); AKTIONEN["mod-weiter"](1); }
    if (e.key === "ArrowLeft") AKTIONEN["mod-weiter"](-1);
    if (e.key === "Escape") AKTIONEN["mod-zu"]();
    return;
  }
  const z = e.target.dataset?.ziel;
  if (e.target.id === "neue-art" && e.key === "Enter") { e.preventDefault(); AKTIONEN["art-neu"](); return; }
  if (e.target.id?.startsWith("neu-baustein-") && e.key === "Enter") { e.preventDefault(); AKTIONEN["baustein-neu"](e.target.id.slice(13)); return; }
  if (z && e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    ui.ziel = z.split(".").slice(0, -1).join(".");
    e.target.blur(); zielAnzeigen();
  }
});
// Namen antippen, ohne dass das Textfeld den Fokus verliert
document.addEventListener("pointerdown", (e) => { if (e.target.closest(".namenleiste .chip")) e.preventDefault(); });
window.addEventListener("resize", () => document.documentElement.style.setProperty("--kopfhoehe", document.querySelector(".app-kopf").offsetHeight + "px"));
window.addEventListener("afterprint", () => ($("#druck").innerHTML = ""));

// Installierbare App (Chrome/Edge): Hintergrunddienst nur über https (GitHub Pages)
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(() => {});
if (location.hash === "#tafel") tafelStarten();
else if (location.hash.startsWith("#postfach=")) {
  const [code, ...rest] = location.hash.slice(10).split("&");
  postfachStarten(decodeURIComponent(code).replace(/[^a-z0-9]/gi, ""), new URLSearchParams(rest.join("&")).get("a"));
}
else if (location.hash.startsWith("#protokoll=")) protokollantStarten(decodeURIComponent(location.hash.slice(11)).replace(/[^a-z0-9]/gi, ""));
else {
  render(); schluesselLaden().then(ordnerLaden).then(autoLaden).then(bkEingangLaden);
  // Online-Briefkästen, die offen waren, wieder öffnen
  for (const k of state.klassen) if (k.bkOnline) onlineBkStarten(k);
  // war der Briefkasten offen (z. B. Seite neu geladen), geht es dort weiter
  if (state.briefkastenAktiv && state.klassen.some((k) => k.id === state.briefkastenAktiv)) {
    state.aktiveKlasse = state.briefkastenAktiv; render(); bk.offen = true; renderBriefkasten();
  }
}
</script>
