    setTimeout(() => { bk.danke = false; renderBriefkasten(); }, 2500);
  },
  async "bk-beenden"() {
    if (!(await passwortAbfragen("Briefkasten beenden (nur Lehrkraft)."))) return;
    bk.offen = false; delete state.briefkastenAktiv; speichern();
    if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
    renderBriefkasten(); render();
  },
  "bk-loeschen"(bid) {
    const k = klasse(), x = k.briefkasten.find((y) => y.id === bid);
    if (x && confirm(`Anliegen „${x.thema}“ löschen?`)) { k.briefkasten = k.briefkasten.filter((y) => y.id !== bid); speichern(); render(); }
  },
  "bk-leeren"() { if (confirm("Alle Einträge im Briefkasten löschen?")) { klasse().briefkasten = []; speichern(); render(); } },
  "bk-uebernehmen"(bid) {
    const k = klasse(), s = sitzung(), x = k.briefkasten.find((y) => y.id === bid);
    if (!x) return;
    s.anliegen.push(neuesAnliegen({ thema: x.thema, von: [...x.namen], art: x.art, worum: x.worum, ausBriefkasten: x.id }));
    k.briefkasten = k.briefkasten.filter((y) => y.id !== bid);
    ui.anliegenIdx = s.anliegen.length - 1; ui.ziel = null;
    speichern(); render();
  },
  "bk-alle"() {
    const k = klasse(), s = sitzung();
    for (const x of k.briefkasten) s.anliegen.push(neuesAnliegen({ thema: x.thema, von: [...x.namen], art: x.art, worum: x.worum, ausBriefkasten: x.id }));
    k.briefkasten = []; ui.anliegenIdx = Math.max(0, s.anliegen.length - 1); ui.ziel = null;
    speichern(); render();
  },
  "anliegen-tab"(i) { ui.anliegenIdx = +i; ui.ziel = null; render(); scrollTo(0, 0); },
  "unterschrift-weg"(r) { delete sitzung().unterschriften[r]; speichern(); render(); },
  async "sitzung-loeschen"(sid) {
    const k = klasse(), s = k.sitzungen.find((x) => x.id === sid);
    if (s.gesperrt && !(await passwortAbfragen(`Sitzung Nr. ${s.nr} ist abgeschlossen. Zum Löschen das Passwort eingeben.`))) return;
    if (confirm(`Sitzung Nr. ${s.nr} vom ${datum(s.datum)} wirklich löschen?`)) { k.sitzungen = k.sitzungen.filter((x) => x.id !== sid); speichern(); render(); }
  },
  drucken(sid) { const s = klasse().sitzungen.find((x) => x.id === sid); drucken(protokollHTML(s)); },
  "beschluesse-drucken"() {
    const k = klasse();
    drucken(`<div class="prot-kopf"><div class="logo">${logoHTML()}</div><div><h1>Beschlüsse</h1><div>Klassenrat ${esc(k.name)} · ${esc(k.schuljahr || "")} · Stand ${datum(heute())}</div></div></div>`
      + beschlussTabelle(beschluesse(k).reverse(), T()).replace('class="uebersicht"', ""));
  },
  zeit(feld) { sitzung()[feld] = jetzt(); speichern(); render(); },
  fehlt(name) {
    const s = sitzung();
    s.fehlend = s.fehlend.includes(name) ? s.fehlend.filter((n) => n !== name) : [...s.fehlend, name];
    speichern(); render();
  },
  "rollen-vorschlag"(pfad) {
    const s = sitzung();
    s[pfad] = rollenVorschlag(klasse(), pfad === "rollen" ? s.fehlend : []);
    speichern(); render();
  },
  "zeile-neu"(pfad) {
    const liste = wertAn(pfad);
    liste.push({ namen: [], text: "" });
    ui.ziel = `${pfad}.${liste.length - 1}`; ui.fokus = ui.ziel + ".text";
    speichern(); render();
  },
  "zeile-weg"(pfad) {
    const teile = pfad.split("."), i = +teile.pop();
    teile.reduce((o, k) => o[k], sitzung()).splice(i, 1);
    ui.ziel = null; speichern(); render();
  },
  "rb-status"(arg) {
    const [bid, st] = arg.split("|"), s = sitzung();
    const r = s.rueckblick[bid] || (s.rueckblick[bid] = {});
    r.status = r.status === st ? "" : st;
    if (!r.status) delete s.rueckblick[bid];
    speichern(); render();
  },
  "anliegen-neu"() {
    const s = sitzung();
    s.anliegen.push(neuesAnliegen());
    ui.anliegenIdx = s.anliegen.length - 1; ui.ziel = null; ui.fokus = `anliegen.${ui.anliegenIdx}.thema`;
    speichern(); render();
  },
  "anliegen-weg"(i) {
    const s = sitzung();
    if (confirm(`${T().einAnliegen} „${s.anliegen[i].thema || "ohne Thema"}“ löschen?`)) {
      s.anliegen.splice(+i, 1); ui.anliegenIdx = Math.max(0, Math.min(ui.anliegenIdx, s.anliegen.length - 1)); ui.ziel = null;
      speichern(); render();
    }
  },
  "vertagt-uebernehmen"() {
    const s = sitzung(), vorher = sortiert(klasse()).filter((x) => x.nr < s.nr).at(-1);
    for (const a of vorher.anliegen.filter((a) => a.ergebnis === "vertagt" && !s.anliegen.some((b) => b.aus === a.id))) {
      s.anliegen.push(neuesAnliegen({ aus: a.id, thema: a.thema, von: [...a.von], art: a.art, worum: a.worum + (a.worum ? "\n" : "") + `(vertagt aus Sitzung ${vorher.nr})` }));
    }
    speichern(); render();
  },
  "vorschlag-neu"(i) { sitzung().anliegen[i].vorschlaege.push({ text: "", von: [], ja: 0, nein: 0, enth: 0 }); speichern(); render(); },
  "beste-idee"(i) {
    const a = sitzung().anliegen[i];
    const beste = a.vorschlaege.filter((v) => v.text).sort((x, y) => (y.ja || 0) - (x.ja || 0))[0];
    if (beste) { a.beschluss = beste.text; speichern(); render(); }
  },
  zaehlen(arg) {
    const [pfad, d] = arg.split("|"), teile = pfad.split("."), feld = teile.pop();
    const o = teile.reduce((x, k) => x[k], sitzung());
    o[feld] = Math.max(0, (o[feld] || 0) + +d); speichern(); render();
  },
  filter(f) { ui.filter = f; render(); },
  "klasse-anlegen"() {
    const name = $("#nk-name").value.trim();
    if (!name) { $("#nk-name").focus(); return; }
    const k = { id: id(), name, schuljahr: $("#nk-jahr").value.trim(), lehrkraft: "", timer: 10,
      stufe: document.querySelector("[name=nk-stufe]:checked").value,
      schueler: $("#nk-schueler").value.split("\n").map((x) => x.trim()).filter(Boolean), sitzungen: [] };
    state.klassen.push(k); state.aktiveKlasse = k.id; ui.view = "sitzungen"; speichern(); render();
  },
  "klasse-neu"() { $("#app").innerHTML = viewWillkommen(true); },
  "klasse-loeschen"() {
    const k = klasse();
    if (confirm(`Klasse ${k.name} mit allen ${k.sitzungen.length} Sitzungen löschen? Das kann nicht rückgängig gemacht werden.`)) {
      state.klassen = state.klassen.filter((x) => x.id !== k.id); state.aktiveKlasse = state.klassen[0]?.id || null;
      ui.view = "sitzungen"; speichern(); render();
    }
  },
  "schueler-speichern"() {
    klasse().schueler = [...new Set($("#schuelerliste").value.split("\n").map((x) => x.trim()).filter(Boolean))];
    speichern(); render();
  },
  "schueler-sortieren"() {
    const ta = $("#schuelerliste");
    ta.value = ta.value.split("\n").map((x) => x.trim()).filter(Boolean).sort((a, b) => a.localeCompare(b, "de")).join("\n");
  },
  export: exportieren,
  import() {
    dateiWaehlen(".json,application/json", async (f) => {
      try {
        const neu = JSON.parse(await f.text());
        if (!Array.isArray(neu.klassen)) throw new Error();
        if (state.klassen.length && !confirm("Die Sicherung ersetzt alle Daten in diesem Browser. Fortfahren?")) return;
        state = migrieren(neu); ui.view = "sitzungen"; speichern(); render();
      } catch (e) { alert("Diese Datei ist keine gültige Klassenrat-Sicherung."); }
    });
  },
  "logo-laden"() {
    dateiWaehlen("image/*", (f) => {
      if (f.size > 1.5e6) { alert("Die Datei ist zu groß (max. 1,5 MB)."); return; }
      const r = new FileReader();
      r.onload = () => { state.logo = r.result; speichern(); render(); };
      r.readAsDataURL(f);
    });
  },
  "logo-zuruecksetzen"() { state.logo = null; speichern(); render(); },
  "alles-loeschen"() {
    if (confirm("Wirklich ALLE Daten löschen? Lade vorher eine Sicherung herunter, wenn du sie noch brauchst.")) {
      try { localStorage.removeItem(SPEICHER); } catch (e) { /* egal */ }
      state = laden(); ui.view = "sitzungen"; render();
    }
  },
  "ordner-waehlen": ordnerWaehlen,
  "ordner-fortsetzen": ordnerFortsetzen,
  "ordner-trennen": ordnerTrennen,
  "ordner-laden": ausOrdnerLaden,
  "timer-auf"() { timer.offen = true; timer.rest = (klasse()?.timer || 10) * 60; timer.ende = false; renderTimer(); },
  "timer-zu"() { clearInterval(timer.int); timer.offen = false; timer.laeuft = false; timer.ende = false; renderTimer(); },
  "timer-start"() { timerStarten(klasse()?.timer || 10); },
  "timer-los"() {
    if (timer.laeuft) { clearInterval(timer.int); timer.laeuft = false; }
    else if (timer.rest > 0) { timer.ende = false; timer.laeuft = true; timer.int = setInterval(timerTick, 1000); }
    renderTimer();
  },
  "timer-plus"(d) { timer.rest = Math.max(0, timer.rest + +d); timer.ende = false; renderTimer(); },
  "timer-setzen"(n) { clearInterval(timer.int); Object.assign(timer, { rest: n * 60, laeuft: false, ende: false }); renderTimer(); },
};

const ERLAUBT_GESPERRT = ["schritt", "anliegen-tab", "drucken", "view", "entsperren", "moderation"];
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || (el.tagName === "LABEL")) return;
  e.preventDefault();
  e.stopPropagation();
  if (el.closest("#sperrbereich.gesperrt") && !ERLAUBT_GESPERRT.includes(el.dataset.act)) return;
  AKTIONEN[el.dataset.act]?.(el.dataset.arg);
});
document.addEventListener("input", (e) => {
  const el = e.target;
  const wert = el.dataset.typ === "zahl" ? (+el.value || 0) : el.value;
  if (el.dataset.k && sitzung()) {
    if (el.dataset.k.startsWith("rueckblick.")) { /* Notiz nur bei gesetztem Status */
      const [, bid] = el.dataset.k.split(".");
      if (!sitzung().rueckblick[bid]) return;
    }
    pfadSetzen(sitzung(), el.dataset.k, wert);
  } else if (el.dataset.kk && klasse()) {
    pfadSetzen(klasse(), el.dataset.kk, wert);
  } else return;
  speichern();
  if ("neuZeichnen" in el.dataset) render();
});
document.addEventListener("change", (e) => {
  if (e.target.id === "klassenwahl") {
    if (e.target.value === "__neu") { $("#app").innerHTML = viewWillkommen(true); return; }
    state.aktiveKlasse = e.target.value; ui.view = "sitzungen"; speichern(); render();
  }
});
// Briefkasten: Eingaben merken, ohne neu zu zeichnen (Knopf freigeben, sobald Name und Satz da sind)
function bkFelderMerken() {
  const t = $("#bk-thema"), w = $("#bk-worum");
  if (t) bk.thema = t.value;
  if (w) bk.worum = w.value;
}
document.addEventListener("input", (e) => {
  if (e.target.id === "bk-thema" || e.target.id === "bk-worum") {
    bkFelderMerken();
    const knopf = document.querySelector("[data-act=bk-senden]");
    const bereit = bk.name !== null && bk.thema.trim();
    if (knopf) knopf.disabled = !bereit;
    if ($("#bk-hinweis")) $("#bk-hinweis").textContent = bereit ? "" : "Bitte deinen Namen antippen und das Anliegen aufschreiben.";
  }
  if (e.target.dataset?.bk && klasse()) {
    const k = klasse(), key = e.target.dataset.bk;
    k.bkEinst = { ...bkEinst(k), [key]: e.target.type === "checkbox" ? e.target.checked : Math.max(0, +e.target.value || 0) };
    speichern();
  }
});
// Textfelder wachsen mit dem Inhalt; Reiter zeigt das Thema sofort
document.addEventListener("input", (e) => {
  if (e.target.tagName === "TEXTAREA" && e.target.rows === 1) hoeheAnpassen(e.target);
  if ("frueher" in e.target.dataset) frueherZeigen(e.target);
  if ("reiter" in e.target.dataset) { const t = document.querySelector(".reiter button.aktiv .t"); if (t) t.textContent = e.target.value || T().einAnliegen; }
});
// Klick in eine Aussage-Zeile: angetippte Namen gehören zu dieser Zeile
document.addEventListener("focusin", (e) => {
  const z = e.target.dataset?.ziel;
  if (z && z !== ui.ziel) { ui.ziel = z; zielAnzeigen(); }
});
// Enter beendet die Zeile – der nächste Name beginnt eine neue
document.addEventListener("keydown", (e) => {
  if (mod.offen) {
    if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); AKTIONEN["mod-weiter"](1); }
    if (e.key === "ArrowLeft") AKTIONEN["mod-weiter"](-1);
    if (e.key === "Escape") AKTIONEN["mod-zu"]();
    return;
  }
  const z = e.target.dataset?.ziel;
  if (e.target.id === "neue-art" && e.key === "Enter") { e.preventDefault(); AKTIONEN["art-neu"](); return; }
  if (e.target.id?.startsWith("neu-baustein-") && e.key === "Enter") { e.preventDefault(); AKTIONEN["baustein-neu"](e.target.id.slice(13)); return; }
  if (z && e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    ui.ziel = z.split(".").slice(0, -1).join(".");
    e.target.blur(); zielAnzeigen();
  }
});
// Namen antippen, ohne dass das Textfeld den Fokus verliert
document.addEventListener("pointerdown", (e) => { if (e.target.closest(".namenleiste .chip")) e.preventDefault(); });
window.addEventListener("resize", () => document.documentElement.style.setProperty("--kopfhoehe", document.querySelector(".app-kopf").offsetHeight + "px"));
window.addEventListener("afterprint", () => ($("#druck").innerHTML = ""));

if (location.hash === "#tafel") tafelStarten();
else {
  render(); ordnerLaden();
  // war der Briefkasten offen (z. B. Seite neu geladen), geht es dort weiter
  if (state.briefkastenAktiv && state.klassen.some((k) => k.id === state.briefkastenAktiv)) {
    state.aktiveKlasse = state.briefkastenAktiv; render(); bk.offen = true; renderBriefkasten();
  }
}
</script>
