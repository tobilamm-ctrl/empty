<style>
:root {
  --rot: #B4595E; --gruen: #65A690; --gelb: #F1D766; --grau: #B9BABE;
  --text: #2b2b2b; --leise: #6b6b6b; --linie: #e3e0d8; --hg: #f6f4ef; --karte: #fff;
  --akzent: #4E927C; --akzent-hell: #E6F2EE; --akzent-dunkel: #33705C;
  --radius: 14px;
}
body[data-stufe="gs"] { --akzent: #A64A50; --akzent-hell: #F8E9EA; --akzent-dunkel: #85363C; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: var(--text); background: var(--hg); font-size: 16px; line-height: 1.4; }
body[data-stufe="gs"] { font-size: 17px; }
button, input, select, textarea { font: inherit; color: inherit; }
.streifen { height: 6px; background: linear-gradient(90deg, var(--rot) 0 40%, var(--gelb) 40% 50%, var(--grau) 50% 60%, var(--gruen) 60% 100%); }

/* Kopfleiste */
.app-kopf { display: flex; align-items: center; gap: 16px; padding: 10px 20px; background: #fff; border-bottom: 1px solid var(--linie); flex-wrap: wrap; position: sticky; top: 0; z-index: 20; }
.app-kopf .logo { width: 120px; flex: none; }
.app-kopf .logo .app-symbol { display: block; width: 52px; height: 52px; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.app-kopf .logo .app-symbol svg { width: 100%; height: 100%; display: block; }
.app-kopf .logo:has(.app-symbol) { width: auto; }
.logo-vorschau { margin: 6px 0 12px; } .logo-vorschau img { max-height: 90px; max-width: 260px; }
.app-kopf .logo svg, .app-kopf .logo img { width: 100%; height: auto; display: block; max-height: 64px; object-fit: contain; }
.app-titel { display: flex; flex-direction: column; gap: 2px; }
.app-titel h1 { margin: 0; font-size: 1.4rem; color: var(--akzent); }
.app-titel select { border: 1px solid var(--linie); border-radius: 8px; padding: 3px 6px; background: #fff; font-size: .9rem; }
nav.haupt { display: flex; gap: 2px; margin-left: auto; flex-wrap: wrap; }
@media (max-width: 1120px) { nav.haupt button .t { display: none; } nav.haupt button .bild { width: 1.5em; height: 1.5em; } }
nav.haupt button { display: flex; align-items: center; gap: 6px; border: 0; background: transparent; padding: 8px 10px; border-radius: 999px; cursor: pointer; color: var(--leise); font-weight: 600; }
nav.haupt button:hover { background: var(--hg); }
nav.haupt button.aktiv { background: var(--akzent-hell); color: var(--akzent-dunkel); }
.gespeichert { position: absolute; right: 20px; bottom: 2px; font-size: .72rem; color: var(--leise); }
.cloud { font-size: .8rem; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.cloud .cloud-label { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--linie); background: #fff; border-radius: 999px; padding: 4px 10px; cursor: pointer; font-weight: 600; color: var(--leise); }
.datei-knopf { position: relative; overflow: hidden; }
.datei-knopf input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; font-size: 0; width: 100%; }
.cloud button { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--linie); background: #fff; border-radius: 999px; padding: 4px 10px; cursor: pointer; font-weight: 600; color: var(--leise); }
.cloud .an { border-color: #bfe0d4; color: #2f7660; background: #eef8f4; }
.cloud .warn { border-color: #f3d9a0; color: #8a6400; background: #fff8e1; }

main { max-width: 1140px; margin: 0 auto; padding: 22px 18px 120px; }
h2 { font-size: 1.35rem; margin: 0 0 12px; display: flex; align-items: center; gap: 10px; }
h3 { font-size: 1.05rem; margin: 18px 0 8px; display: flex; align-items: center; gap: 8px; color: var(--akzent-dunkel); }
.leise { color: var(--leise); }
.klein { font-size: .85rem; }

/* Bilder */
.bild { display: inline-flex; flex: none; width: 1.6em; height: 1.6em; }
.bild svg, .bild img { width: 100%; height: 100%; display: block; }
.bild.m { width: 2.2em; height: 2.2em; }
.bild.l { width: 3.2em; height: 3.2em; }
.bild.s { width: 1.25em; height: 1.25em; }
.illu { max-width: 360px; margin: 0 auto 6px; }
.illu svg { width: 100%; height: auto; display: block; }

/* Karten & Formular */
.karte { background: var(--karte); border-radius: var(--radius); padding: 18px 20px; box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.04); margin-bottom: 16px; }
.karte.akzent { border-top: 5px solid var(--akzent); }
.raster { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(210px, 100%), 1fr)); gap: 12px 16px; }
.raster > * { min-width: 0; }
/* Safari (iPad) gibt Datums-/Zeitfeldern eine eigene Mindestbreite und Höhe – angleichen */
input[type=date], input[type=time] { -webkit-appearance: none; appearance: none; display: block; min-width: 0; max-width: 100%; height: 42px; line-height: 24px; text-align: left; }
input[type=date]::-webkit-date-and-time-value, input[type=time]::-webkit-date-and-time-value { text-align: left; min-height: 24px; }
label.feld, div.feld { display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; font-size: .85rem; color: var(--leise); font-weight: 600; }
label.feld .zeile, div.feld .zeile { display: flex; align-items: center; gap: 8px; min-height: 32px; }
.raster > .feld > :first-child:not(.zeile) { min-height: 32px; display: flex; align-items: center; }
input[type=text], input[type=password], input[type=date], input[type=time], input[type=number], textarea, select.feld {
  width: 100%; border: 1.5px solid var(--linie); border-radius: 10px; padding: 8px 10px; background: #fff; font-weight: 400; color: var(--text); font-size: 1rem;
}
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--akzent); box-shadow: 0 0 0 3px var(--akzent-hell); }
textarea { resize: vertical; min-height: 64px; }
.knopf { display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 999px; padding: 9px 16px; cursor: pointer; font-weight: 700; background: var(--akzent); color: #fff; text-decoration: none; }
.knopf:hover { background: var(--akzent-dunkel); }
.knopf.zweit { background: var(--akzent-hell); color: var(--akzent-dunkel); }
.knopf.zweit:hover { filter: brightness(.96); }
.knopf.rand { background: #fff; color: var(--text); border: 1.5px solid var(--linie); }
.knopf.gefahr { background: #fff; color: var(--rot); border: 1.5px solid #f0c9ce; }
.knopf.gross { padding: 13px 22px; font-size: 1.05rem; }
.knopf.mini { padding: 4px 10px; font-size: .85rem; }
.x { border: 0; background: transparent; color: var(--grau); cursor: pointer; font-size: 1.3rem; line-height: 1; padding: 4px 8px; border-radius: 8px; }
.x:hover { color: var(--rot); background: #fbeaec; }
.aktionen { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.abstand { margin-top: 14px; }

/* Listen-Zeilen (Namen + Aussage) */
.zeilen { display: flex; flex-direction: column; gap: 8px; }
.zeilen .z { display: grid; grid-template-columns: minmax(150px, 1fr) 3fr auto; gap: 8px; align-items: stretch; border-radius: 12px; padding: 4px; margin: -4px; }
.zeilen .z.ziel { background: var(--akzent-hell); }

/* Namen antippen */
.namenleiste { position: sticky; top: var(--kopfhoehe, 80px); z-index: 15; background: #fff; border-radius: var(--radius); padding: 10px 14px 12px; margin-bottom: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.08); border-left: 6px solid var(--akzent); }
.namenleiste .ziel-info { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: .85rem; color: var(--leise); margin-bottom: 8px; }
.namenleiste .ziel-info b { color: var(--akzent-dunkel); }
.namenleiste .chips { max-height: 132px; overflow-y: auto; }
.namenleiste .chip { font-weight: 600; padding: 7px 13px; user-select: none; }
.namenleiste .chip.extra { border-style: dashed; color: var(--leise); }
.namensfeld { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; min-height: 42px; border: 1.5px dashed var(--linie); border-radius: 10px; padding: 5px 8px; background: #fff; cursor: pointer; font-weight: 400; color: var(--text); }
.namensfeld:hover { border-color: var(--akzent); }
.namensfeld.ziel { border-style: solid; border-color: var(--akzent); box-shadow: 0 0 0 3px var(--akzent-hell); }
.namensfeld .leer-hinweis { color: #9a9a9a; font-size: .9rem; }
.nchip { display: inline-flex; align-items: center; gap: 2px; background: var(--akzent); color: #fff; border-radius: 999px; padding: 3px 4px 3px 10px; font-size: .88rem; font-weight: 600; }
.nchip button { border: 0; background: transparent; color: #fff; cursor: pointer; font-size: .95rem; line-height: 1; padding: 2px 5px; border-radius: 50%; opacity: .8; }
.nchip button:hover { opacity: 1; background: rgba(255,255,255,.2); }

/* Redeliste, Satzanfänge, schnelle Abstimmung, frühere Beschlüsse */
.redeliste { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; background: var(--hg); border-radius: 12px; padding: 8px 10px; margin-bottom: 10px; border: 1.5px dashed transparent; }
.redeliste.aktiv { border-color: var(--akzent); background: var(--akzent-hell); }
.redeliste .rl-titel { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: var(--akzent-dunkel); margin-right: 4px; }
.redeliste .nchip { background: #fff; color: var(--text); border: 1.5px solid var(--linie); }
.redeliste .nchip button { color: var(--grau); }
.redeliste .nchip.dran { background: var(--akzent); color: #fff; border-color: var(--akzent); }
.redeliste .nchip.dran button { color: #fff; }
.redeliste .rl-knoepfe { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.bausteine { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--linie); font-size: .85rem; color: var(--leise); }
.bausteine > span { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; }
.unterkopf { margin: 14px 0 6px; font-size: .95rem; color: var(--akzent-dunkel); }
.namenleiste .chip.baustein.neu { font-style: normal; border-style: dashed; background: #fff; color: var(--leise); }
.namenleiste .chip.baustein { font-weight: 500; font-style: italic; padding: 5px 11px; background: #fffdf3; border-color: #efe3b4; }
.schnell { grid-column: 1 / -1; display: flex; justify-content: flex-end; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: -2px; }
.schnell button:disabled { opacity: .45; cursor: not-allowed; }
.mit-frueher { display: flex; flex-direction: column; gap: 4px; }
.frueher { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.frueher:empty { display: none; }
.frueher .chip { font-size: .85rem; padding: 4px 10px; background: #fffdf3; border-color: #efe3b4; text-align: left; }

/* Reiter für Anliegen */
.reiter { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 6px; margin-bottom: 10px; }
.reiter button { display: flex; align-items: center; gap: 8px; border: 1.5px solid var(--linie); background: #fff; border-radius: 12px; padding: 8px 14px 8px 8px; cursor: pointer; white-space: nowrap; font-weight: 700; color: var(--leise); max-width: 260px; }
.reiter button span.t { overflow: hidden; text-overflow: ellipsis; }
.reiter button .n { display: inline-flex; flex: none; width: 26px; height: 26px; border-radius: 50%; align-items: center; justify-content: center; background: var(--hg); font-size: .85rem; }
.reiter button.aktiv { border-color: var(--akzent); background: var(--akzent); color: #fff; }
.reiter button.aktiv .n { background: #fff; color: var(--akzent); }
.reiter button.neu { border-style: dashed; color: var(--akzent-dunkel); padding-left: 14px; }
.reiter .erg { width: 9px; height: 9px; border-radius: 50%; flex: none; background: #ddd; }
.reiter .erg.beschluss { background: var(--gruen); } .reiter .erg.vertagt { background: var(--gelb); } .reiter .erg.keine { background: var(--rot); } .reiter .erg.weiter { background: var(--grau); }

/* Unterschriften */
.pads { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.pad { display: flex; flex-direction: column; gap: 6px; }
.pad canvas { width: 100%; height: 130px; border: 1.5px dashed var(--grau); border-radius: 12px; background: #fff; touch-action: none; cursor: crosshair; }
.pad.fertig canvas { border-style: solid; border-color: var(--akzent); }
.pad .unter { display: flex; justify-content: space-between; align-items: center; font-size: .85rem; color: var(--leise); }
.prot-unterschriften img { display: block; height: 52px; max-width: 100%; object-fit: contain; margin-bottom: 2px; }
.prot-unterschriften .platz { height: 52px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1.5px solid var(--linie); background: #fff; border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: .9rem; }
.chip.an { background: var(--akzent); border-color: var(--akzent); color: #fff; }
.art-wahl { min-height: 42px; align-items: center; }
.art-wahl .chip { font-weight: 600; padding: 7px 13px; }
.art-liste .chip { display: inline-flex; align-items: center; gap: 4px; cursor: default; padding-right: 4px; }
.art-liste .chip button { border: 0; background: transparent; cursor: pointer; color: var(--grau); font-size: 1rem; padding: 0 6px; border-radius: 50%; }
.art-liste .chip button:hover { color: var(--rot); background: #fbeaec; }
.chip.fehlt { background: #fff3f4; border-color: #f0c9ce; color: var(--rot); text-decoration: line-through; }

/* Sitzungsliste */
.liste-sitzungen { display: grid; gap: 12px; }
.sitzung-karte { display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center; }
.datum-kachel { width: 64px; text-align: center; border-radius: 12px; background: var(--akzent-hell); color: var(--akzent-dunkel); padding: 6px 0; font-weight: 800; line-height: 1.1; }
.datum-kachel small { display: block; font-weight: 600; font-size: .75rem; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: .78rem; font-weight: 700; background: #eee; color: #555; }
.badge.offen { background: #fff4d1; color: #8a6400; }
.badge.ja { background: #e1f3ec; color: #22775d; }
.badge.teils { background: #fff4d1; color: #8a6400; }
.badge.nein { background: #fbe4e7; color: #a12636; }
.badge.verworfen { background: #ececec; color: #5c5c5c; }
.badge.ueberfaellig { background: var(--rot); color: #fff; }

/* Schritte */
.schritte { display: flex; flex-wrap: nowrap; gap: 5px; overflow-x: auto; padding: 2px 2px 4px; margin-bottom: 16px; container-type: inline-size; scrollbar-width: thin; }
.schritt { flex: 1 1 auto; justify-content: center; display: flex; align-items: center; gap: 6px; border: 0; background: #fff; border-radius: 999px; padding: 6px 11px 6px 6px; cursor: pointer; white-space: nowrap; font-weight: 700; font-size: .92rem; color: var(--leise); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
.schritt .bild { width: 1.15em; height: 1.15em; }
@container (max-width: 1060px) { .schritt .bild { display: none; } }
@container (max-width: 860px) { .schritt { font-size: .85rem; padding-right: 9px; } }
.schritt .n { display: inline-flex; width: 26px; height: 26px; border-radius: 50%; align-items: center; justify-content: center; background: var(--hg); font-size: .85rem; }
.schritt.aktiv { background: var(--akzent); color: #fff; }
.schritt.aktiv .n { background: #fff; color: var(--akzent); }
.schritt.beenden { background: var(--akzent-hell); color: var(--akzent-dunkel); }
.fusszeile { display: flex; justify-content: space-between; margin-top: 18px; }
.titelzeile { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.titelzeile h2 { margin: 0; }

/* Anliegen */
.anliegen { border-left: 6px solid var(--akzent); }
.anliegen-kopf { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.anliegen-kopf .nr { background: var(--akzent); color: #fff; width: 32px; height: 32px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; flex: none; }
.anliegen-kopf input { font-size: 1.1rem; font-weight: 700; }
.vorschlag { display: grid; grid-template-columns: minmax(150px, 1fr) 3fr auto auto; gap: 8px; align-items: center; }
.zaehler { display: inline-flex; align-items: center; border: 1.5px solid var(--linie); border-radius: 999px; overflow: hidden; background: #fff; }
.zaehler button { border: 0; background: transparent; width: 30px; height: 34px; cursor: pointer; font-size: 1.1rem; font-weight: 700; color: var(--leise); }
.zaehler button:hover { background: var(--hg); }
.zaehler b { min-width: 26px; text-align: center; }
.zaehler .bild { width: 1.3em; height: 1.3em; margin-left: 6px; }
.zaehler-gruppe { display: flex; gap: 6px; flex-wrap: wrap; }
.ergebnis { display: flex; gap: 6px; flex-wrap: wrap; }
.ergebnis label { display: flex; align-items: center; gap: 6px; border: 1.5px solid var(--linie); border-radius: 999px; padding: 6px 12px; cursor: pointer; background: #fff; font-weight: 600; font-size: .92rem; }
.ergebnis input { accent-color: var(--akzent); }
.ergebnis label:has(input:checked) { border-color: var(--akzent); background: var(--akzent-hell); color: var(--akzent-dunkel); }
.beschluss-box { background: var(--akzent-hell); border-radius: 12px; padding: 12px 14px; margin-top: 10px; }

/* Rückblick */
.rb { display: grid; grid-template-columns: 1fr auto; gap: 10px 16px; align-items: center; }
.rb-karte { border: 1.5px solid var(--linie); border-radius: 14px; margin-bottom: 14px; overflow: hidden; background: #fff; }
.rb-karte.erledigt { border-color: #bfe0d4; }
.rb-kopf { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--akzent-hell); padding: 9px 14px; color: var(--akzent-dunkel); font-weight: 700; }
.rb-kopf .datum-gross { font-size: 1.05rem; }
.rb-kopf .alter { font-weight: 600; font-size: .85rem; color: var(--leise); }
.rb-kopf .badge { margin-left: auto; }
.rb-inhalt { padding: 14px; }
.rb-beschluss { font-size: 1.25rem; font-weight: 800; line-height: 1.3; margin: 0 0 12px; display: flex; gap: 10px; align-items: flex-start; }
.rb-beschluss .bild { width: 1.4em; height: 1.4em; margin-top: 2px; }
.rb-fakten { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin-bottom: 12px; }
.rb-fakt { background: var(--hg); border-radius: 10px; padding: 8px 12px; }
.rb-fakt small { display: flex; align-items: center; gap: 6px; font-size: .75rem; font-weight: 700; color: var(--leise); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 3px; }
.rb-fakt small .bild { width: 1.2em; height: 1.2em; }
.rb-fakt div { font-weight: 700; }
.rb-fakt p { margin: 3px 0 0; font-size: .88rem; color: var(--leise); font-weight: 400; }
.rb-fakt .nchip { padding-right: 10px; margin: 0 4px 3px 0; }
.rb-fakt.warn { background: #fbe4e7; }
.rb-frage { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; border-top: 1px dashed var(--linie); padding-top: 12px; }
.rb-frage b { font-size: 1.05rem; }
.rb-frage .status-wahl { margin-left: auto; }
.status-wahl { display: flex; gap: 6px; flex-wrap: wrap; }
.status-wahl button { display: flex; flex-direction: column; align-items: center; gap: 2px; border: 2px solid var(--linie); background: #fff; border-radius: 12px; padding: 6px 10px; cursor: pointer; font-size: .8rem; font-weight: 700; color: var(--leise); min-width: 70px; }
.status-wahl button.an { border-color: var(--akzent); background: var(--akzent-hell); color: var(--akzent-dunkel); }

/* Feedback */
.feedback { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.fb { border: 2px solid var(--linie); border-radius: 16px; background: #fff; padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
.fb:hover { border-color: var(--akzent); }
.fb .bild { width: 64px; height: 64px; }
.fb b { font-size: 1.8rem; }
.fb .x { font-size: .85rem; }

.leer { text-align: center; padding: 26px 10px; color: var(--leise); }
.leer .bild { width: 64px; height: 64px; margin-bottom: 6px; }
.hinweis-box { display: flex; gap: 12px; align-items: flex-start; background: #fff8e1; border: 1px solid #f3e1a6; border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; }
.hinweis-box.info { background: var(--akzent-hell); border-color: transparent; }

table.uebersicht { width: 100%; border-collapse: collapse; }
table.uebersicht th, table.uebersicht td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--linie); vertical-align: top; }
table.uebersicht th { font-size: .8rem; color: var(--leise); text-transform: uppercase; letter-spacing: .03em; }

/* Timer */
.timer { position: fixed; right: 18px; bottom: 18px; z-index: 50; background: #fff; border-radius: 18px; box-shadow: 0 8px 30px rgba(0,0,0,.18); padding: 12px 14px; width: 230px; border-top: 5px solid var(--akzent); }
.timer .zeit { font-size: 2.6rem; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.timer .kopf { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.timer .kopf .x { margin-left: auto; }
.timer .reihe { display: flex; gap: 6px; justify-content: center; margin-top: 6px; flex-wrap: wrap; }
.timer.ende { animation: blink 0.8s infinite; }
@keyframes blink { 50% { background: #fbe4e7; } }
.timer-knopf { position: fixed; right: 18px; bottom: 18px; z-index: 40; box-shadow: 0 6px 18px rgba(0,0,0,.18); }

/* Protokoll (Vorschau & Druck) */
.papier { background: #fff; box-shadow: 0 2px 14px rgba(0,0,0,.1); padding: 14mm 13mm; max-width: 210mm; margin: 0 auto; font-family: Arial, Helvetica, sans-serif; font-size: 10pt; color: #111; }
.prot-kopf { display: flex; align-items: center; gap: 14px; border-bottom: 2.5px solid var(--akzent); padding-bottom: 8px; margin-bottom: 8px; }
.prot-kopf .logo { width: 150px; flex: none; }
.prot-kopf .logo svg, .prot-kopf .logo img { width: 100%; height: auto; display: block; max-height: 80px; object-fit: contain; }
.prot-kopf h1 { margin: 0; color: var(--akzent); font-size: 20pt; }
.prot-kopf .illu-k { width: 170px; margin-left: auto; flex: none; }
.prot-kopf .illu-k svg { width: 100%; height: auto; display: block; }
.prot-meta { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px 12px; margin: 8px 0; }
.prot-meta div { border-bottom: 1px solid #bbb; padding: 2px 0; }
.prot-meta small { color: #666; display: block; font-size: 7.5pt; }
.papier h4 { display: flex; align-items: center; gap: 8px; margin: 14px 0 6px; padding: 5px 8px; background: var(--akzent-hell); border-left: 4px solid var(--akzent); color: var(--akzent-dunkel); font-size: 11.5pt; break-after: avoid; }
.papier h4 .bild { width: 1.5em; height: 1.5em; }
.papier table { width: 100%; border-collapse: collapse; margin: 4px 0 6px; }
.papier th, .papier td { border: 1px solid #888; padding: 4px 6px; text-align: left; vertical-align: top; }
.papier th { background: #f2f2f2; font-size: 8.5pt; }
.prot-block { border: 1.5px solid var(--akzent); border-radius: 6px; padding: 0 10px 8px; margin: 10px 0; break-inside: avoid; }
.prot-block .bt { background: var(--akzent); color: #fff; margin: 0 -10px 6px; padding: 5px 10px; font-weight: 700; border-radius: 4px 4px 0 0; display: flex; gap: 8px; align-items: center; }
.prot-block p { margin: 4px 0; }
.prot-unterschriften { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 18px; break-inside: avoid; }
.prot-unterschriften .linie { border-top: 1px solid #555; font-size: 8pt; color: #555; padding-top: 3px; }
.prot-fuss { margin-top: 18px; font-size: 7.5pt; color: #888; border-top: 1px solid #ddd; padding-top: 4px; }

/* Sperre */
.gesperrt input:disabled, .gesperrt textarea:disabled, .gesperrt select:disabled { background: #faf9f6; color: var(--text); opacity: 1; }
.gesperrt button:disabled { opacity: .35; cursor: not-allowed; }
.gesperrt button.an:disabled, .gesperrt .status-wahl button.an:disabled { opacity: 1; }
.gesperrt .x, .gesperrt [data-act="zeile-neu"], .gesperrt [data-act="vorschlag-neu"], .gesperrt .reiter .neu,
.gesperrt .nchip button, .gesperrt [data-act="beste-idee"], .gesperrt [data-act="rollen-vorschlag"], .gesperrt [data-act="zeit"],
.gesperrt [data-act="unterschrift-weg"], .gesperrt [data-act="timer-start"] { display: none; }
.gesperrt .namensfeld { cursor: default; border-style: solid; background: #faf9f6; }
.gesperrt canvas { cursor: not-allowed; }
.sperr-box { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; background: #fff8e1; border: 1px solid #f3e1a6; }
.sperr-box.offen { background: #eef8f4; border-color: #bfe0d4; }
.sperr-box .knopf { margin-left: auto; }

/* Blitzlicht im Vollbild */
.blitz { position: fixed; inset: 0; z-index: 90; background: var(--hg); display: flex; flex-direction: column; padding: 18px; gap: 14px; }
.blitz .oben { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.blitz h2 { margin: 0; font-size: clamp(1.4rem, 4vw, 2.4rem); color: var(--akzent-dunkel); }
.blitz .oben .aktionen { margin-left: auto; }
.blitz .wahl { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2.5vmin; }
.blitz .wahl button { border: 0; border-radius: 28px; background: #fff; box-shadow: 0 6px 24px rgba(0,0,0,.08); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vmin; cursor: pointer; font-size: clamp(1.2rem, 3.4vmin, 2.2rem); font-weight: 800; color: var(--text); transition: transform .08s; touch-action: manipulation; }
.blitz .wahl button:active { transform: scale(.97); }
.blitz .wahl .bild { width: 34vmin; height: 34vmin; max-width: 300px; max-height: 300px; }
.blitz .wahl .zahl { font-size: clamp(1.6rem, 6vmin, 3.6rem); color: var(--akzent-dunkel); }
.blitz .unten { text-align: center; color: var(--leise); font-weight: 600; }
.blitz .danke { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: rgba(255,255,255,.93); font-size: clamp(2rem, 8vmin, 5rem); font-weight: 800; color: var(--akzent-dunkel); }
.blitz .danke small { font-size: clamp(1rem, 3vmin, 1.6rem); color: var(--leise); font-weight: 600; }
@media (orientation: portrait) and (max-width: 700px) { .blitz .wahl { grid-template-columns: 1fr; } .blitz .wahl .bild { width: 18vh; height: 18vh; } .blitz .wahl button { flex-direction: row; } }

/* Moderationskarten */
.moderation .mod-karte { flex: 1; background: #fff; border-radius: 28px; box-shadow: 0 6px 24px rgba(0,0,0,.08); padding: clamp(20px, 5vmin, 60px); display: flex; flex-direction: column; justify-content: center; gap: 2vmin; border-top: 10px solid var(--akzent); }
.mod-schritt { display: flex; align-items: center; gap: 14px; font-size: clamp(1.5rem, 4.6vmin, 3rem); font-weight: 800; color: var(--akzent-dunkel); line-height: 1.15; }
.mod-schritt .bild.m { width: 1.4em; height: 1.4em; }
.mod-schritt .n { display: inline-flex; flex: none; font-size: .7em; width: 2em; height: 2em; border-radius: 50%; align-items: center; justify-content: center; background: var(--akzent); color: #fff; }
.mod-text { font-size: clamp(1.6rem, 5.2vmin, 3.4rem); font-weight: 700; line-height: 1.3; margin: 0; }
.mod-hinweis { font-size: clamp(1.1rem, 3vmin, 1.9rem); color: var(--leise); margin: 0; line-height: 1.4; }
.mod-nav { display: flex; align-items: center; gap: 12px; }
.mod-punkte { flex: 1; display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
.mod-punkte span { width: 10px; height: 10px; border-radius: 50%; background: #d9d6cd; }
.mod-punkte span.an { background: var(--akzent); }
.mod-nav button:disabled { opacity: .35; }

/* Fristen & Aushang */
.fristen { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: .92rem; }
.fristen li { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.fristen li.ueber b { color: var(--rot); }
.aushang .prot-kopf h1 { font-size: 30pt; }
.ah-karte { display: flex; gap: 16px; align-items: flex-start; border: 2px solid var(--akzent); border-left-width: 10px; border-radius: 12px; padding: 14px 18px; margin: 14px 0; break-inside: avoid; }
.ah-karte > .bild { width: 44px; height: 44px; }
.ah-text { font-size: 20pt; font-weight: 800; line-height: 1.25; }
.ah-info { margin-top: 6px; font-size: 12pt; color: #444; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.ah-info span { color: #888; font-size: 10pt; }

/* Auswertung */
.kacheln { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kachel { background: #fff; border-radius: var(--radius); padding: 14px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
.kachel b { display: block; font-size: 1.7rem; line-height: 1.1; }
.kachel span { color: var(--leise); font-size: .85rem; font-weight: 600; }
.raster-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 0 16px; }
.tabelle-scroll { overflow-x: auto; }
.rollen-tab td.zahl { text-align: center; font-variant-numeric: tabular-nums; }
.rollen-tab th { white-space: nowrap; }
.balken-zeile { display: inline-flex; align-items: center; gap: 6px; width: 120px; }
.balken { height: 10px; border-radius: 0 4px 4px 0; background: var(--akzent); min-width: 2px; }
.hbalken { display: flex; flex-direction: column; gap: 8px; }
.hb-zeile { display: grid; grid-template-columns: minmax(90px, 30%) 1fr 32px; align-items: center; gap: 10px; }
.hb-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hb-spur { height: 16px; }
.hb-balken { display: block; height: 100%; background: var(--akzent); border-radius: 0 4px 4px 0; min-width: 2px; }
.stand-liste { display: flex; flex-direction: column; gap: 8px; }
.stand-liste div { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--linie); padding-bottom: 6px; }
.legende { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 10px; font-size: .9rem; color: var(--leise); }
.legende span { display: inline-flex; align-items: center; gap: 5px; }

@keyframes puls { 50% { opacity: .6; } }

/* Rollen an/aus */
.rollen-schalter { margin-left: auto; border: 0; background: transparent; padding: 0; cursor: pointer; }
.rollen-schalter .knubbel { display: block; width: 34px; height: 20px; border-radius: 999px; background: #d6d3cb; position: relative; transition: background .2s; }

}

  if (!kryptoOk) { const salz = id() + id(); state.sperre = { salz, hash: await altHash(pw, salz) }; speichern(); return; }
  const salz = zufallsCode(24), r = await ableiten(pw, salz);
  state.sperre = { art: "pbkdf2", salz, runden: PW_RUNDEN, hash: r.hash };
  await schluesselMerken(salz, r.schluessel);
  speichern();
}
const istVerschluesselt = (d) => d?.klassenrat === "verschluesselt";
async function verschluesseln(text) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const daten = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, krypto.schluessel, new TextEncoder().encode(text));
  // außen nur der Zeitstempel (Welche Datei ist neuer?) und was zum Ableiten des Schlüssels nötig ist
  return JSON.stringify({ klassenrat: "verschluesselt", version: 1, gespeichertAm: state.gespeichertAm, salz: krypto.salz,
    runden: state.sperre.runden || PW_RUNDEN, iv: zuB64(iv), daten: zuB64(daten) });
}
// Text der Sicherungsdatei; null, wenn verschlüsselt werden muss, der Schlüssel aber fehlt
async function sicherungsText() {
  if (!verschluesseltSichern()) return JSON.stringify(state, null, 1);
  if (!schluesselDa()) return null;
  return verschluesseln(JSON.stringify(state));
}
async function sicherungsTextMitPasswort() {
  let text = await sicherungsText();
  if (text === null) {
    if (!(await passwortAbfragen("Die Sicherung wird mit deinem Passwort verschlüsselt. Bitte gib es einmal ein."))) throw abbruch();
    text = await sicherungsText();
  }
  return text;
}
const abbruch = () => Object.assign(new Error("abgebrochen"), { name: "AbortError" });
// Entschlüsselt eine Sicherungsdatei; fragt nach dem Passwort, wenn der passende Schlüssel fehlt
async function entschluesseln(d, name) {
  if (!kryptoOk) throw new Error("Dieser Browser kann verschlüsselte Sicherungen nicht öffnen.");
  const oeffnen = async (k) => JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: ausB64(d.iv) }, k, ausB64(d.daten))));
  if (krypto.schluessel && krypto.salz === d.salz) { try { return await oeffnen(krypto.schluessel); } catch (e) { /* passt nicht */ } }
  let inhalt = null;
  const r = await dialog({ titel: "Verschlüsselte Sicherung", text: `„${esc(name || "Sicherung")}“ ist mit dem Passwort der Lehrkraft verschlüsselt
      (Stand ${new Date(d.gespeichertAm || Date.now()).toLocaleString("de-DE", { dateStyle: "short", timeStyle: "short" })}).`,
    felder: ["Passwort"], knopf: "Öffnen",
    pruefen: async ([pw]) => {
      try {
        const k = await ableiten(pw, d.salz, d.runden || PW_RUNDEN);
        inhalt = await oeffnen(k.schluessel);
        await schluesselMerken(d.salz, k.schluessel);
        return "";
      } catch (e) { return "Das Passwort passt nicht zu dieser Sicherung."; }
    } });
  if (!Array.isArray(r) || !inhalt) throw abbruch();
  return inhalt;
}

// --- Unterschriften -------------------------------------------------------------
function padStarten(c) {
  const rolle = c.dataset.pad, s = sitzung();
  const dpr = window.devicePixelRatio || 1;
  c.width = c.clientWidth * dpr; c.height = c.clientHeight * dpr;
  const ctx = c.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.lineWidth = 2.4; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#1d2b4f";
  const alt = s.unterschriften?.[rolle];
  if (alt) { const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0, c.clientWidth, c.clientHeight); img.src = alt.bild; }
  let zeichnet = false, gezeichnet = false;
  const punkt = (e) => { const r = c.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  c.addEventListener("pointerdown", (e) => { if (istGesperrt(s)) return; zeichnet = true; c.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.moveTo(...punkt(e)); e.preventDefault(); });
  c.addEventListener("pointermove", (e) => { if (!zeichnet) return; ctx.lineTo(...punkt(e)); ctx.stroke(); gezeichnet = true; });
  const ende = () => {
    if (!zeichnet) return;
    zeichnet = false;
    if (!gezeichnet) return;
    s.unterschriften ||= {};
    s.unterschriften[rolle] = { bild: c.toDataURL("image/png"), zeit: Date.now() };
    c.parentElement.classList.add("fertig");
    const papier = document.querySelector("#app .papier");
    if (papier) papier.innerHTML = protokollHTML(s);
    speichern();
  };
  c.addEventListener("pointerup", ende);
  c.addEventListener("pointercancel", ende);
}

      <button class="knopf zweit" data-act="moderation" title="Karten zum Vorlesen für die Leitung">${bild("glocke", "s")} Moderationskarten</button></span>`}
  </div>
  <div class="schritte">${schritteListe().map(([key, x, b]) => `<button class="schritt ${ui.schritt === key ? "aktiv" : ""}" data-act="schritt" data-arg="${key}"><span class="n">${SCHRITTE.findIndex(([y]) => y === key) + 1}</span>${bild(b, "s")}${titel(key, x)}</button>`).join("")}
    ${pr.kind ? "" : `<button class="schritt beenden" data-act="beenden"><span class="n">${SCHRITTE.length + 1}</span>${bild(istGesperrt(s) ? "schloss" : "haken", "s")}${istGesperrt(s) ? "Zur Übersicht" : "Sitzung beenden"}</button>`}</div>
  ${s.gesperrt ? (istGesperrt(s)
    ? `<div class="sperr-box">${bild("schloss", "m")}<div><b>Abgeschlossen und gesperrt</b> seit ${new Date(s.gesperrt).toLocaleString("de-DE", { dateStyle: "medium", timeStyle: "short" })}.<br>
        <span class="leise klein">Ansehen und Drucken ist möglich. Zum Ändern wird das Passwort benötigt.</span></div>
        <button class="knopf" data-act="entsperren">Entsperren …</button></div>`
    : `<div class="sperr-box offen">${bild("schloss_offen", "m")}<div><b>Vorübergehend entsperrt.</b><br>
        <span class="leise klein">Nachträgliche Änderungen werden im Protokoll vermerkt. Beim Verlassen wird die Sitzung wieder gesperrt.</span></div>
        <button class="knopf" data-act="sperren">Wieder sperren</button></div>`) : ""}
  <div id="sperrbereich" class="${istGesperrt(s) ? "gesperrt" : ""}">

  ${inhalt}
  </div>
  ${pr.kind ? `<div class="fusszeile">${schrittNachbar(-1) ? `<button class="knopf rand" data-act="schritt" data-arg="${schrittNachbar(-1)}">← Zurück</button>` : "<span></span>"}
    ${schrittNachbar(1) ? `<button class="knopf" data-act="schritt" data-arg="${schrittNachbar(1)}">Weiter →</button>` : ""}</div>`
  : ui.schritt !== "protokoll" ? `<div class="fusszeile">
    ${schrittNachbar(-1) ? `<button class="knopf rand" data-act="schritt" data-arg="${schrittNachbar(-1)}">← Zurück</button>` : "<span></span>"}
    <button class="knopf" data-act="schritt" data-arg="${schrittNachbar(1)}">Weiter →</button></div>`
    : `<div class="fusszeile"><button class="knopf rand" data-act="schritt" data-arg="abschluss">← Zurück</button>
       <button class="knopf" data-act="beenden">${bild(istGesperrt(s) ? "schloss" : "haken", "s")} ${istGesperrt(s) ? "Zur Übersicht" : "Sitzung beenden"}</button></div>`}`;
}
const schritteListe = () => (pr.kind ? SCHRITTE.filter(([k]) => PROT_SCHRITTE.includes(k)) : SCHRITTE);
function schrittNachbar(d) {
  const liste = schritteListe(), i = liste.findIndex(([k]) => k === ui.schritt) + d;
  return liste[i]?.[0];
}
// --- Namen antippen ------------------------------------------------------------
// Ein "Ziel" ist der Pfad, dem angetippte Namen zugeordnet werden:
//  Liste von Zeilen  -> neue Zeile mit dem Namen   ·  Zeile -> Name dazu/weg
//  Liste von Namen   -> Name dazu/weg              ·  Text (Rolle) -> Name setzen
let zielTexte = {};
function wertAn(pfad) { return pfad.split(".").reduce((o, k) => (o == null ? o : o[k]), sitzung()); }
function zielArt(pfad) {
  const w = pfad && wertAn(pfad);
  if (w === undefined || w === null) return null;
  if (typeof w === "string") return "einzeln";
  if (Array.isArray(w)) return /^(positiv|anliegen\.\d+\.aussagen)$/.test(pfad) ? "liste" : "mehrere";
  if (typeof w === "object" && Array.isArray(w.namen)) return "zeile";
  return null;
}
function kurzname(n, alle) {
  const teile = n.trim().split(/\s+/);
  if (teile.length < 2) return n;
  const kurz = `${teile[0]} ${teile.at(-1)[0]}.`;
  return alle.filter((x) => x !== n && x.startsWith(teile[0] + " ") && x.trim().split(/\s+/).at(-1)[0] === teile.at(-1)[0]).length ? n : kurz;
}
function standardZiel() {
  const s = sitzung();
  if (ui.schritt === "positiv") return "positiv";
  if (ui.schritt === "anliegen") return s.anliegen[ui.anliegenIdx] ? `anliegen.${ui.anliegenIdx}.aussagen` : null;
  if (ui.schritt === "start" || ui.schritt === "abschluss") {
    const basis = ui.schritt === "start" ? "rollen" : "naechsteRollen";
    const aktiv = aktiveRollen(s);
    if (!aktiv.length) return null;
    const frei = aktiv.find(([r]) => !s[basis][r]);
    return `${basis}.${(frei || aktiv[0])[0]}`;
  }
  return null;
}
function zielGueltig() {
  const z = ui.ziel;
  if (!z || !zielArt(z)) return false;
  if (ui.schritt === "positiv") return z.startsWith("positiv");
  if (ui.schritt === "anliegen") return z.startsWith(`anliegen.${ui.anliegenIdx}.`);
  if (ui.schritt === "start") return z.startsWith("rollen.");
  if (ui.schritt === "abschluss") return z.startsWith("naechsteRollen.");
  return false;
}
function namenLeiste() {
  const k = klasse(), s = sitzung();
  const z = ui.ziel, art = zielArt(z);
  const w = z ? wertAn(z) : null;
  const gewaehlt = art === "zeile" ? w.namen : art === "mehrere" ? w : art === "einzeln" ? [w] : [];
  const anwesend = k.schueler.filter((n) => !s.fehlend.includes(n));
  const info = zielTexte[z]?.text || "";
  const hinweis = { liste: "Name antippen → neue Zeile, dann den Text eingeben.",
    zeile: "Weitere Namen antippen, um sie derselben Zeile zuzuordnen.",
    mehrere: z?.endsWith(".redeliste") ? "Wer sich meldet, antippen – die Reihenfolge bleibt erhalten." : "Namen an- oder abwählen.",
    einzeln: "Einen Namen antippen." }[art] || "";
  const bausteinArt = z && (art === "liste" || art === "zeile") ? (z.startsWith("positiv") ? "positiv" : "aussagen") : null;
  const bausteine = bausteinArt ? bausteineFuer(bausteinArt) : [];
  const listePfad = art === "zeile" ? z.split(".").slice(0, -1).join(".") : null;
  const extras = art === "einzeln" ? [] : ["ganze Klasse", "Lehrkraft"];
  if (!k.schueler.length) return `<div class="namenleiste"><div class="ziel-info">Keine Klassenliste hinterlegt.
    <button class="knopf mini" data-act="view" data-arg="klasse">Klassenliste eintragen</button></div></div>`;
  return `<div class="namenleiste">
    <div class="ziel-info">${bild("leute", "s")} <span>Namen für: <b>${esc(info)}</b></span><span>· ${hinweis}</span>
      ${listePfad ? `<button class="knopf mini zweit" data-act="ziel" data-arg="${listePfad}" style="margin-left:auto">＋ neue Zeile</button>` : ""}</div>
    <div class="chips">${anwesend.map((n) => `<button class="chip ${gewaehlt.includes(n) ? "an" : ""}" data-act="name" data-arg="${esc(n)}" title="${esc(n)}">${esc(kurzname(n, k.schueler))}</button>`).join("")}
      ${z?.endsWith(".redeliste") ? "" : extras.map((n) => `<button class="chip extra ${gewaehlt.includes(n) ? "an" : ""}" data-act="name" data-arg="${n}">${n}</button>`).join("")}</div>
    ${bausteinArt ? `<div class="bausteine"><span>${bild("stift", "s")} Satzanfänge:</span>${bausteine.map((x) => `<button class="chip baustein" data-act="baustein" data-arg="${esc(x)}">${esc(x.trim())} …</button>`).join("")}
      <button class="chip baustein neu" data-act="baustein-neu" data-arg="${bausteinArt}" title="eigenen Satzanfang ergänzen">＋ eigener</button></div>` : ""}

function namensFeld(pfad, werte, text) {

function rollenFelder(obj, pfad, t) {

function namenZeilen(liste, pfad, platzhalter, titel) {

function weitergabeBox(s) {

function schrittRueckblick(s, t) {

  };

// --- Zeitplan: geplante Minuten je Anliegen, Timer folgt dem geöffneten Anliegen -----------------
const minutenFuer = (a, k = klasse()) => Math.max(1, +a.minuten || +k.timer || 10);
function zeitplanZeile(s, k, t) {
  const summe = s.anliegen.reduce((n, a) => n + minutenFuer(a, k), 0);
  const offen = s.anliegen.filter((a) => !a.ergebnis).reduce((n, a) => n + minutenFuer(a, k), 0);
  const ende = offen ? new Date(Date.now() + offen * 6e4).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }) : "";
  return `<p class="zeitplan">${bild("uhr", "s")} <b>Zeitplan:</b> ${s.anliegen.length} ${s.anliegen.length === 1 ? t.einAnliegen : t.mehrere} · ${summe} min geplant

      ${pr.kind ? "" : `<div class="aktionen abstand"><button class="knopf mini zweit" data-act="antrag-drucken" data-arg="${sitzung().id}|${i}">📄 ${gs ? "Brief" : "Antrag"} drucken</button>

}
function anwesendZahl() { const k = klasse(), s = sitzung(); return k.schueler.length ? k.schueler.length - s.fehlend.length : 0; }
function redeliste(a, i, p, text) {

      : `<span class="leise klein">${aktiv ? "Wer sich meldet, oben antippen." : "keine Wortmeldungen"}</span>`}
    <span class="rl-knoepfe">

      ${a.redeliste.length ? `<button class="knopf mini" data-act="naechste-wortmeldung" data-arg="${i}">▶ ${esc(kurzname(a.redeliste[0], k.schueler))} ist dran</button>` : ""}
    </span></div>`;
}
function schnellAbstimmung(v, i, j, gs) {
  const anw = anwesendZahl();

  return `<div class="schnell"><span class="leise klein">${summe} von ${anw} Stimmen</span>

// Frühere Beschlüsse der Klasse als Vorschläge beim Tippen
let frueherTreffer = {};
function frueherZeigen(el) {
  const box = el.parentElement.querySelector(".frueher") || el.closest("label")?.nextElementSibling;
  if (!box?.classList.contains("frueher")) return;
  const eingabe = el.value.toLowerCase();
  const woerter = eingabe.split(/[^a-zäöüß0-9]+/).filter((w) => w.length >= 4);
  if (!woerter.length) { box.innerHTML = ""; return; }
  const alle = new Set();
  for (const s of klasse().sitzungen) for (const a of s.anliegen) if (a.ergebnis === "beschluss" && a.beschluss) alle.add(a.beschluss.trim());
  const treffer = [...alle].filter((x) => x.toLowerCase() !== eingabe.trim())
    .map((x) => [x, woerter.filter((w) => x.toLowerCase().includes(w)).length]).filter(([, n]) => n)
    .sort((a, b) => b[1] - a[1]).slice(0, 4).map(([x]) => x);
  frueherTreffer[el.dataset.k] = treffer;
  box.innerHTML = treffer.length ? `<span class="leise klein">${bild("beschluss", "s")} früher beschlossen:</span>`
    + treffer.map((x, n) => `<button class="chip" data-act="frueher" data-arg="${el.dataset.k}|${n}">${esc(x)}</button>`).join("") : "";
}

function zaehler(pfad, wert, icon, titel) {

    <button data-act="zaehlen" data-arg="${pfad}|-1" aria-label="${titel} weniger">−</button><b>${wert || 0}</b>
    <button data-act="zaehlen" data-arg="${pfad}|1" aria-label="${titel} mehr">+</button></span>`;
}

function blitzOptionen() {

// --- Moderationskarten: Sätze zum Vorlesen für die Leitung -----------------------
const mod = { offen: false, idx: 0 };
// Auf den Moderationskarten (Tafel!) nur Vorname + Anfangsbuchstabe des Nachnamens, z. B. „Peter T.“
// Bei gleichen Kürzeln in der Klasse werden so viele Buchstaben genommen, bis es eindeutig ist.
function kartenName(name, alle = klasse()?.schueler || []) {
  const teile = String(name || "").trim().split(/\s+/);
  if (teile.length < 2 || ["ganze Klasse", "Lehrkraft"].includes(name)) return name;
  const zerlegt = (x) => { const p = x.trim().split(/\s+/); return [p[0], p.at(-1)]; };
  const [vor, nach] = [teile[0], teile.at(-1)];
  for (let l = 1; l <= nach.length; l++) {
    const gleich = alle.some((x) => { if (x === name) return false; const [v, n] = zerlegt(x); return v === vor && n.slice(0, l) === nach.slice(0, l); });
    if (!gleich) return `${vor} ${nach.slice(0, l)}.`;
  }
  return name;
}
function moderationsKarten() {
  const s = sitzung(), k = klasse(), t = T(), gs = k.stufe === "gs";
  const n = (x) => esc((Array.isArray(x) ? x : x ? [x] : []).map((y) => kartenName(y)).join(", "));
  const karten = [];
  const add = (schritt, icon, titel, text, hinweis = "") => karten.push({ schritt, icon, titel, text, hinweis });
  const rollen = aktiveRollen(s).filter(([r]) => r !== "leitung" && s.rollen[r]).map(([r]) => `${t[r]}: <b>${n(s.rollen[r])}</b>`).join(" · ");
  add("start", "glocke", "Eröffnung", gs ? "Ich begrüße euch zu unserem Klassenrat!" : `Ich eröffne den Klassenrat. Heute ist unsere Sitzung Nr. ${s.nr}.`,
    rollen ? `Heute helfen mit: ${rollen}` : "");
  add("start", "regel", "Unsere Regeln", gs ? "Wir hören einander zu. Wir lassen andere ausreden. Wir sind freundlich zueinander."
    : "Wir lassen einander ausreden. Wir sprechen respektvoll miteinander. Wir bleiben beim Thema.");
  add("positiv", "stern", t.positiv, gs ? "Wer möchte etwas Schönes erzählen? Wem möchtest du danken?"
    : "Wir beginnen mit der Positivrunde. Wer möchte etwas Positives sagen oder sich bei jemandem bedanken?");
  const offen = offeneFuer(s);
  if (!offen.length) add("rueckblick", "zurueck", t.rueckblick, gs ? "Vom letzten Mal ist nichts mehr offen." : "Aus den letzten Sitzungen sind keine Beschlüsse offen.");
  offen.forEach((b) => add("rueckblick", "zurueck", t.rueckblick,
    `${gs ? "Am" : "Beim Klassenrat am"} ${datum(b.sitzung.datum, true)} haben wir ${gs ? "abgemacht" : "beschlossen"}: <b>${esc(b.anliegen.beschluss)}</b>`
    + (b.anliegen.wer?.length ? `<br>${gs ? "Darum kümmern sich" : "Zuständig war"}: <b>${n(b.anliegen.wer)}</b>` : ""),
    gs ? "Hat das geklappt?" : "Wurde der Beschluss umgesetzt?"));
  if (!s.anliegen.length) add("anliegen", "wandzeitung", t.anliegen, gs ? "Welche Themen stehen heute auf der Wandzeitung?" : "Welche Anliegen stehen heute auf der Wandzeitung?");
  s.anliegen.forEach((a, i) => {
    const titel = `${t.einAnliegen} ${i + 1}${a.thema ? ": " + esc(a.thema) : ""}`;
    add("anliegen", "sprechen", titel, gs ? `Jetzt kommt das Thema <b>${esc(a.thema || "…")}</b>.${a.von.length ? ` ${n(a.von)}, erzähl uns bitte davon.` : ""}`
      : `Wir kommen zu ${t.einAnliegen} ${i + 1}: <b>${esc(a.thema || "…")}</b>.${a.von.length ? ` ${n(a.von)}, bitte erkläre dein Anliegen.` : ""}`,
      gs ? "Danach: Wer möchte etwas dazu sagen?" : "Danach: Wer möchte etwas dazu sagen? Zuerst die Betroffenen.");
    add("anliegen", gs ? "idee" : "hand", titel, gs ? "Wer hat eine Idee, was wir machen können?" : "Welche Lösungsvorschläge gibt es?",
      gs ? "Wir stimmen ab: Wer ist dafür? Wer ist dagegen?" : "Wir stimmen ab: Wer ist dafür? Wer ist dagegen? Wer enthält sich? – Wer übernimmt das, und bis wann?");
  });
  add("abschluss", "froh", t.abschluss, gs ? "Wie fandet ihr unseren Klassenrat heute?" : "Zum Schluss das Blitzlicht: Wie fandet ihr die heutige Sitzung?");
  karten.at(-1).blitz = true;
  // immer zeigen – die Namen erscheinen, sobald sie im Protokoll eingetragen werden
  const neu = aktiveRollen(s).map(([r]) => `${t[r]}: <b>${s.naechsteRollen[r] ? n(s.naechsteRollen[r]) : "…"}</b>`).join("<br>");
  const terminText = s.naechsterTermin ? `${gs ? "Der nächste Klassenrat ist am" : "Nächster Klassenrat:"} <b>${datum(s.naechsterTermin, true)}</b>` : "";
  if (neu) add("nach-blitz", "kalender", "Nächstes Mal", gs ? "Beim nächsten Klassenrat helfen:" : "In der nächsten Sitzung übernehmen:", neu + (terminText ? "<br>" + terminText : ""));
  else add("nach-blitz", "kalender", "Nächstes Mal", terminText || (gs ? "Bald ist wieder Klassenrat." : "Der nächste Termin folgt."));
  add("nach-blitz", "haken", "Ende", gs ? "Der Klassenrat ist zu Ende. Danke an alle!" : "Ich beende den Klassenrat. Vielen Dank an alle!");
  karten.at(-1).ende = true;
  return karten;
}
// Reine Darstellung (keine Zugriffe auf den Zustand), damit sie auch im Tafel-Fenster

function modHTML(karten, idx, opt) {

}
function modKartenMitBild() {
  return moderationsKarten().map((k) => ({ ...k, ikon: BILDER[k.icon], schrittNr: SCHRITTE.findIndex(([x]) => x === (k.schritt === "nach-blitz" ? "abschluss" : k.schritt)) + 1 }));
}
// Karte, die zum aktuellen Schritt im Protokoll passt (-1, wenn keine passt, z. B. beim Protokoll)
function modOrtIdx(karten) {
  // Nach dem Abschluss (Schritt „Protokoll“): Rollen für die nächste Sitzung bzw. Ende zeigen
  if (ui.schritt === "protokoll") return karten.findIndex((k) => k.schritt === "nach-blitz");
  if (ui.schritt === "anliegen" && !sitzung()?.anliegen.length) return karten.findIndex((k) => k.schritt === "anliegen");
  return karten.findIndex((k) => k.schritt === ui.schritt && (ui.schritt !== "anliegen" || k.titel.startsWith(`${T().einAnliegen} ${ui.anliegenIdx + 1}`)));
}
const nachBlitzIdx = (karten) => karten.findIndex((k) => k.schritt === "nach-blitz");
function modStartIdx(karten) { return Math.max(0, modOrtIdx(karten)); }
function renderModeration() {
  const el = $("#moderation");
  if (!mod.offen || !sitzung()) { el.innerHTML = ""; return; }
  const karten = modKartenMitBild();
  mod.idx = Math.max(0, Math.min(mod.idx, karten.length - 1));
  el.innerHTML = modHTML(karten, mod.idx, { modus: "lokal", glocke: BILDER.glocke, blitzKnopf: true, uhr: true });
}

// --- Tafel-Fenster: zweites Browserfenster auf dem Tafel-Bildschirm, live verbunden ------
let tafel = null;
function tafelOffen() { return tafel && !tafel.closed; }
const direktOffen = () => direkt.rolle === "protokoll" && direkt.conn?.open;
function tafelSenden() {
  if ((!tafelOffen() && !direktOffen()) || !sitzung()) return;
  const karten = modKartenMitBild();
  mod.idx = Math.max(0, Math.min(mod.idx, karten.length - 1));
  const daten = { typ: "klassenrat-mod", karten, idx: mod.idx, stufe: klasse().stufe, glocke: BILDER.glocke,
    hinweis: `Klasse ${klasse().name} · Sitzung ${sitzung().nr}`, blitz: blitzDaten(), zeit: zeitDaten() };
  if (tafelOffen()) tafel.postMessage(daten, "*");
  if (direktOffen()) { try { direkt.conn.send(daten); } catch (e) { /* getrennt */ } }
  mod.anzahl = karten.length;
  renderFern();
}
function renderFern() {
  const el = $("#tafel-fern");
  const verbunden = tafelOffen() || direktOffen();
  if (!verbunden && !(direkt.rolle === "protokoll" && direkt.status !== "aus")) { el.innerHTML = ""; return; }
  const art = tafelOffen() ? "Tafel" : "Tafel (direkt)";
  const status = !verbunden ? `<span class="badge offen">${esc(direkt.meldung || "verbinde …")}</span>`
    : direkt.ping != null && !tafelOffen() ? `<span class="leise klein">${direkt.ping} ms</span>` : "";
  el.innerHTML = `<div class="fern">${bild("glocke", "s")} <b>${art}</b> ${verbunden ? `Karte ${mod.idx + 1}${mod.anzahl ? " / " + mod.anzahl : ""}` : ""} ${status}
    ${verbunden ? `<button class="knopf mini rand" data-act="fern" data-arg="-1">◀</button><button class="knopf mini" data-act="fern" data-arg="1">▶</button>` : ""}
    <button class="x" data-act="tafel-zu" title="Verbindung zur Tafel beenden">✕</button></div>`;
}

// --- Direktverbindung Protokollgerät ↔ Tafel (WebRTC, Kopplung über einen 4-stelligen Code) ----
// Karten und Stimmen gehen verschlüsselt direkt von Gerät zu Gerät. Nur zum Finden der Geräte wird der
// öffentliche PeerJS-Vermittlungsdienst genutzt (er sieht Netzwerkadressen und Code, keine Inhalte).
const PEERJS_URL = "https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js";
const PEER_PREFIX = "klassenrat-jpw-tafel-";
const direkt = { rolle: null, peer: null, conn: null, code: "", status: "aus", meldung: "", ping: null, versuche: 0, timer: null };
function skriptLaden(url, globalName, name) {
  if (window[globalName]) return Promise.resolve();
  return new Promise((ok, fehler) => {
    const sc = document.createElement("script");
    sc.src = url; sc.onload = () => ok(); sc.onerror = () => fehler(new Error(`${name} konnte nicht geladen werden (keine Internetverbindung?)`));
    document.head.appendChild(sc);
  });
}
const peerLaden = () => skriptLaden(PEERJS_URL, "Peer", "Der Verbindungsdienst");
function direktBeenden() {
  clearTimeout(direkt.timer);
  try { direkt.conn?.close(); direkt.peer?.destroy(); } catch (e) { /* egal */ }
  Object.assign(direkt, { rolle: null, peer: null, conn: null, status: "aus", meldung: "", ping: null, versuche: 0 });
}

// Protokollgerät: mit der Tafel verbinden
async function direktVerbinden(code) {
  direktBeenden();
  Object.assign(direkt, { rolle: "protokoll", code, status: "verbinde", meldung: "verbinde …" });
  renderFern();
  try { await peerLaden(); } catch (e) { direkt.meldung = e.message; direkt.status = "fehler"; renderFern(); return; }
  const peer = direkt.peer = new window.Peer();
  const zeitlimit = () => {
    clearTimeout(direkt.timer);
    direkt.timer = setTimeout(() => {
      if (direktOffen()) return;
      direkt.status = "fehler";
      direkt.meldung = "keine Verbindung – Code prüfen; evtl. blockiert das Schulnetz direkte Verbindungen";
      renderFern();
    }, 15000);
  };
  const verbinden = () => {
    const conn = direkt.conn = peer.connect(PEER_PREFIX + code, { reliable: true });
    conn.on("open", () => {
      direkt.status = "verbunden"; direkt.meldung = ""; direkt.versuche = 0;
      mod.idx = Math.max(0, modOrtIdx(moderationsKarten()));
      tafelSenden();
      try { conn.send({ typ: "ping", t: Date.now() }); } catch (e) { /* egal */ }
      meldung("✓ Mit der Tafel verbunden");
    });
    conn.on("data", (d) => { if (d?.typ === "klassenrat-tafel") boardNachricht(d); });
    conn.on("close", () => {
      if (direkt.rolle !== "protokoll") return;
      direkt.status = "verbinde"; direkt.meldung = "Verbindung unterbrochen – verbinde neu …"; renderFern();
      if (direkt.versuche++ < 20) setTimeout(() => direkt.rolle === "protokoll" && verbinden(), 2000);
    });
  };
  peer.on("open", () => { verbinden(); zeitlimit(); });
  peer.on("error", (e) => {
    if (e.type === "peer-unavailable") {
      direkt.meldung = `Keine Tafel mit Code ${code} gefunden`; direkt.status = "fehler";
      if (direkt.versuche++ < 20 && direkt.conn) setTimeout(() => direkt.rolle === "protokoll" && verbinden(), 3000);
    } else { direkt.meldung = "Fehler: " + (e.type || e.message); direkt.status = "fehler"; }
    renderFern();
  });
  peer.on("disconnected", () => { try { peer.reconnect(); } catch (e) { /* egal */ } });
}

// Tafel: Code anzeigen und auf das Protokollgerät warten
async function direktTafelStarten() {
  direktBeenden();
  Object.assign(direkt, { rolle: "tafel", status: "starte" });
  tafelDaten = null; mod.offen = true;
  renderDirektTafel();
  document.documentElement.requestFullscreen?.().catch(() => {});
  try { await peerLaden(); } catch (e) { direkt.meldung = e.message; direkt.status = "fehler"; renderDirektTafel(); return; }
  const starten = () => {
    direkt.code = String(Math.floor(1000 + Math.random() * 9000));
    const peer = direkt.peer = new window.Peer(PEER_PREFIX + direkt.code);
    peer.on("open", () => { direkt.status = "wartet"; renderDirektTafel(); });
    peer.on("error", (e) => {
      if (e.type === "unavailable-id") { peer.destroy(); starten(); return; }  // Code schon vergeben → neuer Code
      direkt.status = "fehler"; direkt.meldung = "Fehler: " + (e.type || e.message); renderDirektTafel();
    });
    peer.on("disconnected", () => { try { peer.reconnect(); } catch (e) { /* egal */ } });
    peer.on("connection", (conn) => {
      if (direkt.conn?.open) { conn.on("open", () => conn.close()); return; }  // nur ein Protokollgerät
      direkt.conn = conn;
      conn.on("open", () => { direkt.status = "verbunden"; renderDirektTafel(); });
      conn.on("data", (d) => {
        if (d?.typ === "ping") { conn.send({ typ: "klassenrat-tafel", aktion: "pong", d: d.t }); return; }
        if (d?.typ !== "klassenrat-mod") return;
        tafelDaten = d; document.body.dataset.stufe = d.stufe; renderDirektTafel();
      });
      conn.on("close", () => { if (direkt.rolle === "tafel") { direkt.conn = null; direkt.status = "wartet"; renderDirektTafel(); } });
    });
  };
  starten();
}
function renderDirektTafel() {
  const el = $("#moderation");
  if (direkt.rolle !== "tafel") return;
  const ende = `<button class="knopf" data-act="direkt-ende">Beenden</button>`;
  if (direkt.status === "verbunden" && tafelDaten) {
    el.innerHTML = tb.blitz && tafelDaten.blitz ? boardBlitzHTML(tafelDaten.blitz)
      : modHTML(tafelDaten.karten, tafelDaten.idx, { modus: "direkt", glocke: tafelDaten.glocke, hinweis: tafelDaten.hinweis, blitzKnopf: true, ende, uhr: true });
    return;
  }
  const text = { starte: "Verbindung wird vorbereitet …", wartet: "Am Protokollgerät „Moderationskarten“ → „Direkt mit der Tafel verbinden“ wählen und diesen Code eingeben:",
    verbunden: "Verbunden – warte auf die Karten …", fehler: direkt.meldung }[direkt.status] || "";
  el.innerHTML = `<div class="blitz moderation"><div class="oben">${bild("glocke", "l")}<h2>Tafel – Direktverbindung</h2>
    <div class="aktionen"><button class="knopf rand" data-act="mod-vollbild">⛶ Vollbild</button>${ende}</div></div>
    <div class="mod-karte" style="align-items:center;text-align:center"><p class="mod-hinweis">${esc(text)}</p>
      ${direkt.status === "wartet" ? `<div class="code-gross">${direkt.code.split("").map((z) => `<span>${z}</span>`).join("")}</div>` : ""}
      ${direkt.status === "fehler" ? `<button class="knopf gross" data-act="direkt-tafel">Neu versuchen</button>` : ""}</div></div>`;
}
window.addEventListener("message", (e) => {
  const d = e.data;
  if (!d || d.typ !== "klassenrat-tafel" || e.source !== tafel) return;
  boardNachricht(d);
});
// Nachricht eines Tafel-Bildschirms (Tafel-Fenster oder Direktverbindung) verarbeiten
function boardNachricht(d) {
  if (d.aktion === "weiter") mod.idx += d.d;
  if (d.aktion === "nachBlitz") { const i = nachBlitzIdx(moderationsKarten()); if (i >= 0) mod.idx = i; }
  if (d.aktion === "stimme" || d.aktion === "zurueck") { stimmeZaehlen(d.d, d.aktion === "zurueck"); return; }
  if (d.aktion === "pong") { direkt.ping = Date.now() - d.d; renderFern(); return; }
  tafelSenden();
}
// Stimme aus dem Blitzlicht eines Tafel-Bildschirms übernehmen
function stimmeZaehlen(k, rueck) {
  const s = sitzung();
  if (!s || istGesperrt(s) || !["gut", "mittel", "schlecht"].includes(k)) return;
  s.feedback[k] = Math.max(0, (s.feedback[k] || 0) + (rueck ? -1 : 1));
  speichern();
  if (ui.view === "sitzung" && ui.schritt === "abschluss") render(); else tafelSenden();
}
setInterval(() => { if (tafel && tafel.closed) { tafel = null; renderFern(); } }, 1500);
// Uhr des Zeitwächters auf den Moderationskarten (Tafel zählt selbst weiter)
function uhrAktualisieren() {
  const el = document.querySelector(".tafel-uhr");
  if (!el) return;
  const z = boardAktiv() ? boardDaten()?.zeit : zeitDaten();
  if (!z) { el.hidden = true; return; }
  const rest = z.bis ? Math.max(0, Math.round((z.bis - Date.now()) / 1000)) : z.rest;
  const um = z.ende || rest === 0, bald = !um && rest <= 120 && z.gesamt > 120;
  el.hidden = false;
  el.className = "tafel-uhr" + (um ? " um" : bald ? " bald" : "");
  el.textContent = um ? "⏱ Die Zeit ist um!" : `⏱ ${String(Math.floor(rest / 60)).padStart(2, "0")}:${String(rest % 60).padStart(2, "0")}${bald ? " · noch 2 Minuten" : ""}`;
}
setInterval(uhrAktualisieren, 500);

// --- Tafel-Bildschirm (Tafel-Fenster oder Tafel-Rechner): Karten oder Blitzlicht ---------
const tb = { blitz: false, zeigen: false, verlauf: [], sperre: false, danke: null };
let tafelDaten = null;  // im Tafel-Fenster: zuletzt vom Hauptfenster empfangen
const imTafelFenster = () => location.hash === "#tafel";
const boardAktiv = () => imTafelFenster() || tafelOrdner.aktiv || direkt.rolle === "tafel";
const boardDaten = () => (tafelOrdner.aktiv ? tafelOrdner.daten : tafelDaten);
// Tafel → Protokollgerät (Tafel-Fenster oder Direktverbindung)
function boardAnHauptgeraet(aktion, d) {
  const nachricht = { typ: "klassenrat-tafel", aktion, d };
  if (imTafelFenster()) { try { window.opener?.postMessage(nachricht, "*"); } catch (e) { /* getrennt */ } }
  else if (direkt.rolle === "tafel" && direkt.conn?.open) { try { direkt.conn.send(nachricht); } catch (e) { /* getrennt */ } }
}
function boardBlitzHTML(b) {
  const zahlen = b.feedback || {};
  return blitzHTML({ ...b, zahlen, zeigen: tb.zeigen, rueckMoeglich: tb.verlauf.length && !tb.sperre, fertigText: "Zurück zu den Karten",
    summe: ["gut", "mittel", "schlecht"].reduce((n, k) => n + (zahlen[k] || 0), 0), leuchten: tb.leuchten, leuchtNr: tb.verlauf.length });
}
function boardNeuZeichnen() { imTafelFenster() ? tafelZeigen() : direkt.rolle === "tafel" ? renderDirektTafel() : renderTafelOrdner(); }
const BOARD_AKTIONEN = {
  "tafel-blitz"() { Object.assign(tb, { blitz: true, zeigen: false, verlauf: [], sperre: false, danke: null }); boardNeuZeichnen(); },
  "blitz-stimme"(k) {
    if (tb.sperre) return;
    const b = boardDaten()?.blitz;
    if (!b) return;
    tb.verlauf.push(k); tb.sperre = true; tb.leuchten = k;
    b.feedback[k] = (b.feedback[k] || 0) + 1;  // sofort anzeigen; das Protokollgerät bestätigt
    boardStimmeSenden(k, false);
    boardNeuZeichnen();
    setTimeout(() => { tb.sperre = false; }, BLITZ_PAUSE);
    clearTimeout(tb.leuchtTimer);
    tb.leuchtTimer = setTimeout(() => { tb.leuchten = null; boardNeuZeichnen(); }, 700);
  },
  "blitz-zurueck"() {
    const k = tb.verlauf.pop(), b = boardDaten()?.blitz;
    if (!k || !b) return;
    b.feedback[k] = Math.max(0, (b.feedback[k] || 0) - 1);
    boardStimmeSenden(k, true); boardNeuZeichnen();
  },
  "blitz-zeigen"() { tb.zeigen = !tb.zeigen; boardNeuZeichnen(); },
  "blitz-zu"() {  // Blitzlicht fertig → gleich die Karte mit den Rollen für die nächste Sitzung
    tb.blitz = false;
    if (tafelOrdner.aktiv) { const i = nachBlitzIdx(tafelOrdner.daten?.karten || []); if (i >= 0) tafelOrdner.idx = i; }
    else boardAnHauptgeraet("nachBlitz");
    boardNeuZeichnen();
  },
};
function boardStimmeSenden(k, rueck) {
  if (tafelOrdner.aktiv) ordnerStimmeSchreiben(k, rueck);
  else boardAnHauptgeraet(rueck ? "zurueck" : "stimme", k);
}

// Läuft im Tafel-Fenster (#tafel): zeigt nur die Karten, die das Hauptfenster schickt
function tafelStarten() {
  document.body.innerHTML = `<div id="tafel-ansicht"><div class="karte leer" style="margin:40px auto;max-width:560px">${bild("glocke", "l")}
    <p><b>Warte auf das Klassenrat-Tool …</b><br>Dieses Fenster auf den Tafel-Bildschirm ziehen und „⛶ Vollbild“ antippen.</p></div></div>`;
  document.body.classList.add("tafel");
  let letzte = null;
  window.tafelZeigen = () => {
    if (!tafelDaten) return;
    $("#tafel-ansicht").innerHTML = tb.blitz && tafelDaten.blitz ? boardBlitzHTML(tafelDaten.blitz)
      : modHTML(tafelDaten.karten, tafelDaten.idx, { modus: "tafel", glocke: tafelDaten.glocke, hinweis: tafelDaten.hinweis, blitzKnopf: true, uhr: true });
  };
  const senden = (aktion, d) => { try { window.opener?.postMessage({ typ: "klassenrat-tafel", aktion, d }, "*"); } catch (e) { /* getrennt */ } };
  window.addEventListener("message", (e) => {
    const d = e.data;
    if (!d || d.typ !== "klassenrat-mod") return;
    letzte = tafelDaten = d;
    document.body.dataset.stufe = d.stufe;
    document.title = "Klassenrat – Tafel";
    tafelZeigen();
  });
  Object.assign(AKTIONEN, BOARD_AKTIONEN);
  mod.offen = true;  // Pfeiltasten blättern
  AKTIONEN["mod-weiter"] = (d) => senden("weiter", +d);
  AKTIONEN["mod-vollbild"] = () => document.documentElement.requestFullscreen?.().catch(() => {});
  AKTIONEN["mod-zu"] = () => { if (document.fullscreenElement) document.exitFullscreen?.(); };
  setInterval(() => {
    if (!window.opener || window.opener.closed) $("#tafel-ansicht").innerHTML = `<div class="karte leer" style="margin:40px auto;max-width:560px">
      <p><b>Verbindung zum Klassenrat-Tool getrennt.</b><br>Bitte das Tafel-Fenster im Tool neu öffnen.</p></div>`;
  }, 2000);
  senden("bereit");
}

// --- Tafel-Rechner über OneDrive: liest die Karten, die das Protokollgerät in den Ordner schreibt ---
const tafelOrdner = { aktiv: false, handle: null, zeit: 0, daten: null, idx: 0, timer: null, fehler: "" };
async function tafelOrdnerWaehlen() {
  if (!ordnerMoeglich) { alert("Dafür wird Microsoft Edge oder Google Chrome am PC benötigt."); return; }
  try {
    const h = await window.showDirectoryPicker({ id: "klassenrat-tafel", mode: "readwrite" });
    await idb("readwrite", (st) => st.put(h, "tafelordner"));
    tafelOrdnerStarten(h);
  } catch (e) { if (e.name !== "AbortError") alert("Der Ordner konnte nicht geöffnet werden: " + e.message); }
}
async function tafelOrdnerFortsetzen() {
  try {
    const h = await idb("readonly", (st) => st.get("tafelordner"));
    if (!h) return tafelOrdnerWaehlen();
    if ((await h.requestPermission({ mode: "readwrite" })) !== "granted") return;
    tafelOrdnerStarten(h);
  } catch (e) { tafelOrdnerWaehlen(); }
}
function tafelOrdnerStarten(h) {
  Object.assign(tafelOrdner, { aktiv: true, handle: h, zeit: 0, daten: null, idx: 0, fehler: "" });
  mod.offen = true;
  clearInterval(tafelOrdner.timer);
  tafelOrdner.timer = setInterval(tafelOrdnerLesen, 3000);
  tafelOrdnerLesen();
  document.documentElement.requestFullscreen?.().catch(() => {});
}
async function tafelOrdnerLesen() {
  try {
    const f = await (await tafelOrdner.handle.getFileHandle("klassenrat-tafel.json")).getFile();
    if (f.lastModified !== tafelOrdner.zeit) {
      const d = JSON.parse(await f.text());
      if (d.sitzungId !== tafelOrdner.daten?.sitzungId) tafelOrdner.idx = 0;
      if (d.ort && d.ort !== tafelOrdner.ort) { tafelOrdner.ort = d.ort; tafelOrdner.idx = d.idx || 0; }  // folgt dem Protokoll
      if (tb.blitz && tafelOrdner.daten?.blitz && d.blitz) {  // eigene, noch nicht bestätigte Stimmen nicht überschreiben
        for (const k of ["gut", "mittel", "schlecht"]) d.blitz.feedback[k] = Math.max(d.blitz.feedback[k] || 0, tafelOrdner.daten.blitz.feedback[k] || 0);
      }
      Object.assign(tafelOrdner, { daten: d, zeit: f.lastModified, fehler: "" });
    }
  } catch (e) { tafelOrdner.fehler = e.name === "NotFoundError" ? "leer" : e.message; }
  renderTafelOrdner();
}
function renderTafelOrdner() {
  const el = $("#moderation"), d = tafelOrdner.daten;
  if (!tafelOrdner.aktiv) { el.innerHTML = ""; return; }
  const ende = `<button class="knopf" data-act="tafel-ordner-ende">Beenden</button>`;
  if (!d) {
    el.innerHTML = `<div class="blitz moderation"><div class="oben">${bild("glocke", "l")}<h2>Tafel</h2><div class="aktionen">${ende}</div></div>
      <div class="mod-karte"><p class="mod-text"><span class="satz">Warte auf das Protokollgerät …</span></p>
      <p class="mod-hinweis"><span class="satz">${tafelOrdner.fehler && tafelOrdner.fehler !== "leer" ? esc(tafelOrdner.fehler)
        : "Am Protokollgerät die automatische OneDrive-Sicherung einrichten und eine Sitzung öffnen."}</span>
      <span class="satz">Die Karten erscheinen hier, sobald OneDrive die Datei übertragen hat.</span></p></div></div>`;
    return;
  }
  tafelOrdner.idx = Math.max(0, Math.min(tafelOrdner.idx, d.karten.length - 1));
  document.body.dataset.stufe = d.stufe;
  const alt = (Date.now() - d.zeit) / 6e4;
  if (tb.blitz && d.blitz) { el.innerHTML = boardBlitzHTML(d.blitz); return; }
  el.innerHTML = modHTML(d.karten, tafelOrdner.idx, { modus: "ordner", glocke: BILDER.glocke, ende, blitzKnopf: true, uhr: true,
    hinweis: `Klasse ${esc(d.klasse)} · Sitzung ${d.nr} · Stand ${new Date(d.zeit).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })}${alt > 30 ? " (älter als 30 Minuten)" : ""}` });
}

// Blitzlicht-Stimmen vom Tafel-Rechner: in klassenrat-blitzlicht.json anhängen …
async function ordnerStimmeSchreiben(k, rueck) {
  const h = tafelOrdner.handle, sid = tafelOrdner.daten?.sitzungId;
  try {
    let stimmen = [];
    try {
      const alt = JSON.parse(await (await (await h.getFileHandle("klassenrat-blitzlicht.json")).getFile()).text());
      if (alt.sitzungId === sid) stimmen = alt.stimmen || [];
    } catch (e) { /* noch keine Datei */ }
    stimmen.push({ id: id(), k, rueck: !!rueck });
    await schreibeDatei(h, "klassenrat-blitzlicht.json", JSON.stringify({ sitzungId: sid, stimmen }));
  } catch (e) { tafelOrdner.fehler = "Stimme nicht gespeichert: " + e.message; }
}
// … und am Protokollgerät einsammeln (jede Stimme zählt nur einmal)
let ordnerBlitzZeit = 0;
setInterval(async () => {
  if (imTafelFenster() || tafelOrdner.aktiv || ordner.status !== "aktiv" || ui.view !== "sitzung" || !sitzung()) return;
  try {
    const f = await (await ordner.handle.getFileHandle("klassenrat-blitzlicht.json")).getFile();
    if (f.lastModified === ordnerBlitzZeit) return;
    ordnerBlitzZeit = f.lastModified;
    const d = JSON.parse(await f.text()), s = sitzung();
    if (d.sitzungId !== s.id || istGesperrt(s)) return;
    s.blitzIds ||= [];
    let neu = false;
    for (const st of d.stimmen || []) if (!s.blitzIds.includes(st.id) && ["gut", "mittel", "schlecht"].includes(st.k)) {
      s.blitzIds.push(st.id); s.feedback[st.k] = Math.max(0, (s.feedback[st.k] || 0) + (st.rueck ? -1 : 1)); neu = true;
    }
    if (neu) { speichern(); if (ui.schritt === "abschluss") render(); }
  } catch (e) { /* keine Stimmen */ }
}, 3000);

// Eigenständige Datei mit den Karten dieser Sitzung (für Tafel-PC oder ein zweites Tablet)
function modExportieren() {
  const k = klasse(), s = sitzung(), karten = modKartenMitBild();
  const stand = `Klasse ${k.name} · Sitzung ${s.nr} · Stand ${new Date().toLocaleString("de-DE", { dateStyle: "short", timeStyle: "short" })}`;
  const json = (x) => JSON.stringify(x).replace(/</g, "\\u003c");
  const css = document.querySelector("style").textContent;
  const html = `<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moderationskarten ${esc(k.name)} – Sitzung ${s.nr}</title><style>${css}</style></head>
<body data-stufe="${k.stufe}" class="tafel"><div id="m"></div><script>
const karten = ${json(karten)}, GLOCKE = ${json(BILDER.glocke)}, STAND = ${json(stand)};
let idx = 0;
${modHTML.toString()}
function zeigen() { document.getElementById("m").innerHTML = modHTML(karten, idx, { modus: "export", glocke: GLOCKE, hinweis: STAND }); }
function weiter(d) { idx = Math.max(0, Math.min(karten.length - 1, idx + d)); zeigen(); }
document.addEventListener("click", (e) => { const b = e.target.closest("[data-act]"); if (!b) return;
  if (b.dataset.act === "mod-weiter") weiter(+b.dataset.arg);
  if (b.dataset.act === "mod-vollbild") document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); });
document.addEventListener("keydown", (e) => { if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); weiter(1); } if (e.key === "ArrowLeft") weiter(-1); });
zeigen();
<\/script></body></html>`;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([html], { type: "text/html" }));
  a.download = `moderationskarten-${k.name}-sitzung-${s.nr}.html`.replace(/[^\w.\-äöüÄÖÜß]+/g, "-");
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// --- Jahresrückblick zum Ausdrucken – ohne Namen ----------------------------------------------------
function ohneNamen(text, k) {
  let x = String(text || "");
  const teile = new Set();
  for (const n of k.schueler) { teile.add(n); teile.add(kartenName(n, k.schueler)); for (const w of n.split(/\s+/)) if (w.length >= 3) teile.add(w); }
  for (const w of [...teile].sort((a, b) => b.length - a.length)) {
    x = x.replace(new RegExp(`(?<![\\p{L}\\p{N}])${w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}(?![\\p{L}\\p{N}])`, "gu"), "…");
  }
  return x.replace(/…(\s*…)+/g, "…");
}
function jahresrueckblickHTML(k) {
  const t = TEXTE[k.stufe], gs = k.stufe === "gs", sitz = sortiert(k), alleB = beschluesse(k);
  const on = (x) => esc(ohneNamen(x, k));
  const anliegen = sitz.flatMap((s) => s.anliegen);
  const positiv = sitz.reduce((n, s) => n + s.positiv.filter((z) => z.text || z.namen.length).length, 0);
  const geschafft = alleB.filter((b) => b.status === "ja"), offen = alleB.filter(istOffen);
  const kachel = (zahl, text, icon) => `<div class="kachel">${bild(icon, "m")}<div><b>${zahl}</b><span>${text}</span></div></div>`;
  const artZahl = {};
  for (const a of anliegen) { const x = a.art || "ohne Angabe"; artZahl[x] = (artZahl[x] || 0) + 1; }
  const artListe = Object.entries(artZahl).sort((a, b) => b[1] - a[1]), maxArt = Math.max(1, ...artListe.map(([, z]) => z));
  const summe = { gut: 0, mittel: 0, schlecht: 0 };
  for (const s of sitz) for (const x in summe) summe[x] += s.feedback[x] || 0;
  const umgesetztAm = (b) => b.verlauf.find((v) => v.status === "ja")?.datum;
  return `<div class="jahr">
    <div class="prot-kopf">${logoBlock()}<div><h1>${gs ? "Unser Klassenrat-Jahr" : "Unser Klassenratsjahr"}</h1>
      <div>Klasse <b>${esc(k.name)}</b> · Schuljahr ${esc(k.schuljahr || schuljahr())}</div></div><div class="illu-k">${BILDER.klassenrat}</div></div>
    <div class="kacheln">${kachel(sitz.length, gs ? "Klassenräte" : "Sitzungen", "kalender")}${kachel(anliegen.length, gs ? "Themen besprochen" : "Anliegen besprochen", "sprechen")}
      ${kachel(alleB.length, gs ? "Abmachungen" : "Beschlüsse", "beschluss")}${kachel(geschafft.length, gs ? "davon geklappt" : "davon umgesetzt", "haken")}
      ${kachel(positiv, gs ? "schöne Momente erzählt" : "Beiträge in der Positivrunde", "stern")}</div>
    <h4>${bild("haken")} Das haben wir geschafft</h4>
    ${geschafft.length ? geschafft.map((b) => `<div class="ah-karte">${bild("haken")}<div><div class="ah-text">${on(b.anliegen.beschluss)}</div>
      <div class="ah-info"><span>beschlossen am ${datum(b.sitzung.datum)}${umgesetztAm(b) ? ` · ${gs ? "geklappt" : "umgesetzt"} (festgestellt am ${datum(umgesetztAm(b))})` : ""}</span></div></div></div>`).join("")
      : `<p class="leise">Noch kein Beschluss als „${esc(t.status.ja)}“ markiert.</p>`}
    ${offen.length ? `<h4>${bild("zurueck")} Daran arbeiten wir noch</h4><ul class="jr-liste">${offen.map((b) => `<li>${on(b.anliegen.beschluss)} <span class="leise">(seit ${datum(b.sitzung.datum)})</span></li>`).join("")}</ul>` : ""}
    <div class="raster-2 jr-raster">
      <div><h4>${bild("wandzeitung")} Worüber wir gesprochen haben</h4>
        ${artListe.length ? `<div class="hbalken">${artListe.map(([x, z]) => `<div class="hb-zeile"><span class="hb-name">${on(x)}</span>
          <span class="hb-spur"><span class="hb-balken" style="width:${(z / maxArt) * 100}%"></span></span><b>${z}</b></div>`).join("")}</div>` : `<p class="leise">–</p>`}</div>
      <div><h4>${bild("froh")} Wie fanden wir unsere Sitzungen?</h4>
        <div class="legende">${blitzOptionen().map(([x, ic, l]) => `<span><i style="background:${BLITZ_FARBEN[x]}"></i>${bild(ic, "s")} ${l}: <b>${summe[x]}</b></span>`).join("")}</div>
        ${sitz.some((s) => s.feedback.gut + s.feedback.mittel + s.feedback.schlecht) ? `<div class="stapel">${sitz.map((s) => {
          const f = s.feedback, sum = (f.gut || 0) + (f.mittel || 0) + (f.schlecht || 0);
          return `<div class="st-zeile"><span class="st-name">Nr. ${s.nr} <small>${datum(s.datum)}</small></span>
            <span class="st-spur">${sum ? blitzOptionen().map(([x]) => f[x] ? `<span class="st-teil" style="flex:${f[x]};background:${BLITZ_FARBEN[x]}">${f[x] / sum >= .12 ? f[x] : ""}</span>` : "").join("") : `<span class="leise klein">kein Blitzlicht</span>`}</span>
            <span class="st-zahlen">${sum ? blitzOptionen().map(([x]) => f[x] || 0).join(" · ") : ""}</span></div>`;
        }).join("")}</div>` : `<p class="leise">Noch kein Blitzlicht erfasst.</p>`}</div>
    </div>
    <div class="prot-fuss">Klassenrat ${esc(k.name)} · Jahresrückblick ohne Namen · erstellt am ${datum(heute())}</div>
  </div>`;
}

function beschlussTabelle(liste, t) {

// --- Auswertung (passwortgeschützt): Rollen und Jahresüberblick ----------------------
const BLITZ_FARBEN = { gut: "#2E9270", mittel: "#C9A227", schlecht: "#B04550" };  // geprüft auf Farbfehlsichtigkeit
function viewAuswertung() {
  const k = klasse(), t = T();
  if (!ui.auswertungFrei) return `<h2>${bild("stern", "m")} Auswertung ${esc(k.name)}</h2>
    <div class="karte leer">${bild("schloss", "l")}<p><b>Nur für Lehrkräfte.</b><br>Rollen-Übersicht und Jahresüberblick sind mit dem Passwort geschützt.</p>
