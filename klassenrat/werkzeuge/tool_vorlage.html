<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klassenrat</title>
<style>
:root {
  --rot: #B4595E; --gruen: #65A690; --gelb: #F1D766; --grau: #B9BABE;
  --text: #2b2b2b; --leise: #6b6b6b; --linie: #e3e0d8; --hg: #f6f4ef; --karte: #fff;
  --akzent: #4E927C; --akzent-hell: #E6F2EE; --akzent-dunkel: #33705C;
  --radius: 14px;
}
body[data-stufe="gs"] { --akzent: #A64A50; --akzent-hell: #F8E9EA; --akzent-dunkel: #85363C; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: var(--text); background: var(--hg); font-size: 16px; line-height: 1.4; }
body[data-stufe="gs"] { font-size: 17px; }
button, input, select, textarea { font: inherit; color: inherit; }
.streifen { height: 6px; background: linear-gradient(90deg, var(--rot) 0 40%, var(--gelb) 40% 50%, var(--grau) 50% 60%, var(--gruen) 60% 100%); }

/* Kopfleiste */
.app-kopf { display: flex; align-items: center; gap: 16px; padding: 10px 20px; background: #fff; border-bottom: 1px solid var(--linie); flex-wrap: wrap; position: sticky; top: 0; z-index: 20; }
.app-kopf .logo { width: 120px; flex: none; }
.app-kopf .logo svg, .app-kopf .logo img { width: 100%; height: auto; display: block; max-height: 64px; object-fit: contain; }
.app-titel { display: flex; flex-direction: column; gap: 2px; }
.app-titel h1 { margin: 0; font-size: 1.4rem; color: var(--akzent); }
.app-titel select { border: 1px solid var(--linie); border-radius: 8px; padding: 3px 6px; background: #fff; font-size: .9rem; }
nav.haupt { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
nav.haupt button { display: flex; align-items: center; gap: 6px; border: 0; background: transparent; padding: 8px 12px; border-radius: 999px; cursor: pointer; color: var(--leise); font-weight: 600; }
nav.haupt button:hover { background: var(--hg); }
nav.haupt button.aktiv { background: var(--akzent-hell); color: var(--akzent-dunkel); }
.gespeichert { font-size: .8rem; color: var(--leise); min-width: 80px; text-align: right; }
.cloud { font-size: .8rem; }
.cloud button { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--linie); background: #fff; border-radius: 999px; padding: 4px 10px; cursor: pointer; font-weight: 600; color: var(--leise); }
.cloud .an { border-color: #bfe0d4; color: #2f7660; background: #eef8f4; }
.cloud .warn { border-color: #f3d9a0; color: #8a6400; background: #fff8e1; }

main { max-width: 1140px; margin: 0 auto; padding: 22px 18px 120px; }
h2 { font-size: 1.35rem; margin: 0 0 12px; display: flex; align-items: center; gap: 10px; }
h3 { font-size: 1.05rem; margin: 18px 0 8px; display: flex; align-items: center; gap: 8px; color: var(--akzent-dunkel); }
.leise { color: var(--leise); }
.klein { font-size: .85rem; }

/* Bilder */
.bild { display: inline-flex; flex: none; width: 1.6em; height: 1.6em; }
.bild svg, .bild img { width: 100%; height: 100%; display: block; }
.bild.m { width: 2.2em; height: 2.2em; }
.bild.l { width: 3.2em; height: 3.2em; }
.bild.s { width: 1.25em; height: 1.25em; }
.illu { max-width: 360px; margin: 0 auto 6px; }
.illu svg { width: 100%; height: auto; display: block; }

/* Karten & Formular */
.karte { background: var(--karte); border-radius: var(--radius); padding: 18px 20px; box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.04); margin-bottom: 16px; }
.karte.akzent { border-top: 5px solid var(--akzent); }
.raster { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px 16px; }
label.feld, div.feld { display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; font-size: .85rem; color: var(--leise); font-weight: 600; }
label.feld .zeile, div.feld .zeile { display: flex; align-items: center; gap: 8px; min-height: 32px; }
.raster > .feld > :first-child:not(.zeile) { min-height: 32px; display: flex; align-items: center; }
input[type=text], input[type=password], input[type=date], input[type=time], input[type=number], textarea, select.feld {
  width: 100%; border: 1.5px solid var(--linie); border-radius: 10px; padding: 8px 10px; background: #fff; font-weight: 400; color: var(--text); font-size: 1rem;
}
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--akzent); box-shadow: 0 0 0 3px var(--akzent-hell); }
textarea { resize: vertical; min-height: 64px; }
.knopf { display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 999px; padding: 9px 16px; cursor: pointer; font-weight: 700; background: var(--akzent); color: #fff; text-decoration: none; }
.knopf:hover { background: var(--akzent-dunkel); }
.knopf.zweit { background: var(--akzent-hell); color: var(--akzent-dunkel); }
.knopf.zweit:hover { filter: brightness(.96); }
.knopf.rand { background: #fff; color: var(--text); border: 1.5px solid var(--linie); }
.knopf.gefahr { background: #fff; color: var(--rot); border: 1.5px solid #f0c9ce; }
.knopf.gross { padding: 13px 22px; font-size: 1.05rem; }
.knopf.mini { padding: 4px 10px; font-size: .85rem; }
.x { border: 0; background: transparent; color: var(--grau); cursor: pointer; font-size: 1.3rem; line-height: 1; padding: 4px 8px; border-radius: 8px; }
.x:hover { color: var(--rot); background: #fbeaec; }
.aktionen { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.abstand { margin-top: 14px; }

/* Listen-Zeilen (Namen + Aussage) */
.zeilen { display: flex; flex-direction: column; gap: 8px; }
.zeilen .z { display: grid; grid-template-columns: minmax(150px, 1fr) 3fr auto; gap: 8px; align-items: stretch; border-radius: 12px; padding: 4px; margin: -4px; }
.zeilen .z.ziel { background: var(--akzent-hell); }

/* Namen antippen */
.namenleiste { position: sticky; top: var(--kopfhoehe, 80px); z-index: 15; background: #fff; border-radius: var(--radius); padding: 10px 14px 12px; margin-bottom: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.08); border-left: 6px solid var(--akzent); }
.namenleiste .ziel-info { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: .85rem; color: var(--leise); margin-bottom: 8px; }
.namenleiste .ziel-info b { color: var(--akzent-dunkel); }
.namenleiste .chips { max-height: 132px; overflow-y: auto; }
.namenleiste .chip { font-weight: 600; padding: 7px 13px; user-select: none; }
.namenleiste .chip.extra { border-style: dashed; color: var(--leise); }
.namensfeld { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; min-height: 42px; border: 1.5px dashed var(--linie); border-radius: 10px; padding: 5px 8px; background: #fff; cursor: pointer; font-weight: 400; color: var(--text); }
.namensfeld:hover { border-color: var(--akzent); }
.namensfeld.ziel { border-style: solid; border-color: var(--akzent); box-shadow: 0 0 0 3px var(--akzent-hell); }
.namensfeld .leer-hinweis { color: #9a9a9a; font-size: .9rem; }
.nchip { display: inline-flex; align-items: center; gap: 2px; background: var(--akzent); color: #fff; border-radius: 999px; padding: 3px 4px 3px 10px; font-size: .88rem; font-weight: 600; }
.nchip button { border: 0; background: transparent; color: #fff; cursor: pointer; font-size: .95rem; line-height: 1; padding: 2px 5px; border-radius: 50%; opacity: .8; }
.nchip button:hover { opacity: 1; background: rgba(255,255,255,.2); }

/* Reiter für Anliegen */
.reiter { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 6px; margin-bottom: 10px; }
.reiter button { display: flex; align-items: center; gap: 8px; border: 1.5px solid var(--linie); background: #fff; border-radius: 12px; padding: 8px 14px 8px 8px; cursor: pointer; white-space: nowrap; font-weight: 700; color: var(--leise); max-width: 260px; }
.reiter button span.t { overflow: hidden; text-overflow: ellipsis; }
.reiter button .n { display: inline-flex; flex: none; width: 26px; height: 26px; border-radius: 50%; align-items: center; justify-content: center; background: var(--hg); font-size: .85rem; }
.reiter button.aktiv { border-color: var(--akzent); background: var(--akzent); color: #fff; }
.reiter button.aktiv .n { background: #fff; color: var(--akzent); }
.reiter button.neu { border-style: dashed; color: var(--akzent-dunkel); padding-left: 14px; }
.reiter .erg { width: 9px; height: 9px; border-radius: 50%; flex: none; background: #ddd; }
.reiter .erg.beschluss { background: var(--gruen); } .reiter .erg.vertagt { background: var(--gelb); } .reiter .erg.keine { background: var(--rot); } .reiter .erg.weiter { background: var(--grau); }

/* Unterschriften */
.pads { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.pad { display: flex; flex-direction: column; gap: 6px; }
.pad canvas { width: 100%; height: 130px; border: 1.5px dashed var(--grau); border-radius: 12px; background: #fff; touch-action: none; cursor: crosshair; }
.pad.fertig canvas { border-style: solid; border-color: var(--akzent); }
.pad .unter { display: flex; justify-content: space-between; align-items: center; font-size: .85rem; color: var(--leise); }
.prot-unterschriften img { display: block; height: 52px; max-width: 100%; object-fit: contain; margin-bottom: 2px; }
.prot-unterschriften .platz { height: 52px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1.5px solid var(--linie); background: #fff; border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: .9rem; }
.chip.an { background: var(--akzent); border-color: var(--akzent); color: #fff; }
.chip.fehlt { background: #fff3f4; border-color: #f0c9ce; color: var(--rot); text-decoration: line-through; }

/* Sitzungsliste */
.liste-sitzungen { display: grid; gap: 12px; }
.sitzung-karte { display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center; }
.datum-kachel { width: 64px; text-align: center; border-radius: 12px; background: var(--akzent-hell); color: var(--akzent-dunkel); padding: 6px 0; font-weight: 800; line-height: 1.1; }
.datum-kachel small { display: block; font-weight: 600; font-size: .75rem; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: .78rem; font-weight: 700; background: #eee; color: #555; }
.badge.offen { background: #fff4d1; color: #8a6400; }
.badge.ja { background: #e1f3ec; color: #22775d; }
.badge.teils { background: #fff4d1; color: #8a6400; }
.badge.nein { background: #fbe4e7; color: #a12636; }
.badge.ueberfaellig { background: var(--rot); color: #fff; }

/* Schritte */
.schritte { display: flex; flex-wrap: nowrap; gap: 5px; overflow-x: auto; padding: 2px 2px 4px; margin-bottom: 16px; container-type: inline-size; scrollbar-width: thin; }
.schritt { flex: 1 1 auto; justify-content: center; display: flex; align-items: center; gap: 6px; border: 0; background: #fff; border-radius: 999px; padding: 6px 11px 6px 6px; cursor: pointer; white-space: nowrap; font-weight: 700; font-size: .92rem; color: var(--leise); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
.schritt .bild { width: 1.15em; height: 1.15em; }
@container (max-width: 1060px) { .schritt .bild { display: none; } }
@container (max-width: 860px) { .schritt { font-size: .85rem; padding-right: 9px; } }
.schritt .n { display: inline-flex; width: 26px; height: 26px; border-radius: 50%; align-items: center; justify-content: center; background: var(--hg); font-size: .85rem; }
.schritt.aktiv { background: var(--akzent); color: #fff; }
.schritt.aktiv .n { background: #fff; color: var(--akzent); }
.schritt.beenden { background: var(--akzent-hell); color: var(--akzent-dunkel); }
.fusszeile { display: flex; justify-content: space-between; margin-top: 18px; }
.titelzeile { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.titelzeile h2 { margin: 0; }

/* Anliegen */
.anliegen { border-left: 6px solid var(--akzent); }
.anliegen-kopf { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.anliegen-kopf .nr { background: var(--akzent); color: #fff; width: 32px; height: 32px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; flex: none; }
.anliegen-kopf input { font-size: 1.1rem; font-weight: 700; }
.vorschlag { display: grid; grid-template-columns: minmax(150px, 1fr) 3fr auto auto; gap: 8px; align-items: center; }
.zaehler { display: inline-flex; align-items: center; border: 1.5px solid var(--linie); border-radius: 999px; overflow: hidden; background: #fff; }
.zaehler button { border: 0; background: transparent; width: 30px; height: 34px; cursor: pointer; font-size: 1.1rem; font-weight: 700; color: var(--leise); }
.zaehler button:hover { background: var(--hg); }
.zaehler b { min-width: 26px; text-align: center; }
.zaehler .bild { width: 1.3em; height: 1.3em; margin-left: 6px; }
.zaehler-gruppe { display: flex; gap: 6px; flex-wrap: wrap; }
.ergebnis { display: flex; gap: 6px; flex-wrap: wrap; }
.ergebnis label { display: flex; align-items: center; gap: 6px; border: 1.5px solid var(--linie); border-radius: 999px; padding: 6px 12px; cursor: pointer; background: #fff; font-weight: 600; font-size: .92rem; }
.ergebnis input { accent-color: var(--akzent); }
.ergebnis label:has(input:checked) { border-color: var(--akzent); background: var(--akzent-hell); color: var(--akzent-dunkel); }
.beschluss-box { background: var(--akzent-hell); border-radius: 12px; padding: 12px 14px; margin-top: 10px; }

/* Rückblick */
.rb { display: grid; grid-template-columns: 1fr auto; gap: 10px 16px; align-items: center; }
.rb-karte { border: 1.5px solid var(--linie); border-radius: 14px; margin-bottom: 14px; overflow: hidden; background: #fff; }
.rb-karte.erledigt { border-color: #bfe0d4; }
.rb-kopf { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--akzent-hell); padding: 9px 14px; color: var(--akzent-dunkel); font-weight: 700; }
.rb-kopf .datum-gross { font-size: 1.05rem; }
.rb-kopf .alter { font-weight: 600; font-size: .85rem; color: var(--leise); }
.rb-kopf .badge { margin-left: auto; }
.rb-inhalt { padding: 14px; }
.rb-beschluss { font-size: 1.25rem; font-weight: 800; line-height: 1.3; margin: 0 0 12px; display: flex; gap: 10px; align-items: flex-start; }
.rb-beschluss .bild { width: 1.4em; height: 1.4em; margin-top: 2px; }
.rb-fakten { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin-bottom: 12px; }
.rb-fakt { background: var(--hg); border-radius: 10px; padding: 8px 12px; }
.rb-fakt small { display: flex; align-items: center; gap: 6px; font-size: .75rem; font-weight: 700; color: var(--leise); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 3px; }
.rb-fakt small .bild { width: 1.2em; height: 1.2em; }
.rb-fakt div { font-weight: 700; }
.rb-fakt p { margin: 3px 0 0; font-size: .88rem; color: var(--leise); font-weight: 400; }
.rb-fakt .nchip { padding-right: 10px; margin: 0 4px 3px 0; }
.rb-fakt.warn { background: #fbe4e7; }
.rb-frage { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; border-top: 1px dashed var(--linie); padding-top: 12px; }
.rb-frage b { font-size: 1.05rem; }
.rb-frage .status-wahl { margin-left: auto; }
.status-wahl { display: flex; gap: 6px; }
.status-wahl button { display: flex; flex-direction: column; align-items: center; gap: 2px; border: 2px solid var(--linie); background: #fff; border-radius: 12px; padding: 6px 10px; cursor: pointer; font-size: .8rem; font-weight: 700; color: var(--leise); min-width: 70px; }
.status-wahl button.an { border-color: var(--akzent); background: var(--akzent-hell); color: var(--akzent-dunkel); }

/* Feedback */
.feedback { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.fb { border: 2px solid var(--linie); border-radius: 16px; background: #fff; padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
.fb:hover { border-color: var(--akzent); }
.fb .bild { width: 64px; height: 64px; }
.fb b { font-size: 1.8rem; }
.fb .x { font-size: .85rem; }

.leer { text-align: center; padding: 26px 10px; color: var(--leise); }
.leer .bild { width: 64px; height: 64px; margin-bottom: 6px; }
.hinweis-box { display: flex; gap: 12px; align-items: flex-start; background: #fff8e1; border: 1px solid #f3e1a6; border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; }
.hinweis-box.info { background: var(--akzent-hell); border-color: transparent; }

table.uebersicht { width: 100%; border-collapse: collapse; }
table.uebersicht th, table.uebersicht td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--linie); vertical-align: top; }
table.uebersicht th { font-size: .8rem; color: var(--leise); text-transform: uppercase; letter-spacing: .03em; }

/* Timer */
.timer { position: fixed; right: 18px; bottom: 18px; z-index: 50; background: #fff; border-radius: 18px; box-shadow: 0 8px 30px rgba(0,0,0,.18); padding: 12px 14px; width: 230px; border-top: 5px solid var(--akzent); }
.timer .zeit { font-size: 2.6rem; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.timer .kopf { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.timer .kopf .x { margin-left: auto; }
.timer .reihe { display: flex; gap: 6px; justify-content: center; margin-top: 6px; flex-wrap: wrap; }
.timer.ende { animation: blink 0.8s infinite; }
@keyframes blink { 50% { background: #fbe4e7; } }
.timer-knopf { position: fixed; right: 18px; bottom: 18px; z-index: 40; box-shadow: 0 6px 18px rgba(0,0,0,.18); }

/* Protokoll (Vorschau & Druck) */
.papier { background: #fff; box-shadow: 0 2px 14px rgba(0,0,0,.1); padding: 14mm 13mm; max-width: 210mm; margin: 0 auto; font-family: Arial, Helvetica, sans-serif; font-size: 10pt; color: #111; }
.prot-kopf { display: flex; align-items: center; gap: 14px; border-bottom: 2.5px solid var(--akzent); padding-bottom: 8px; margin-bottom: 8px; }
.prot-kopf .logo { width: 150px; flex: none; }
.prot-kopf .logo svg, .prot-kopf .logo img { width: 100%; height: auto; display: block; max-height: 80px; object-fit: contain; }
.prot-kopf h1 { margin: 0; color: var(--akzent); font-size: 20pt; }
.prot-kopf .illu-k { width: 170px; margin-left: auto; flex: none; }
.prot-kopf .illu-k svg { width: 100%; height: auto; display: block; }
.prot-meta { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px 12px; margin: 8px 0; }
.prot-meta div { border-bottom: 1px solid #bbb; padding: 2px 0; }
.prot-meta small { color: #666; display: block; font-size: 7.5pt; }
.papier h4 { display: flex; align-items: center; gap: 8px; margin: 14px 0 6px; padding: 5px 8px; background: var(--akzent-hell); border-left: 4px solid var(--akzent); color: var(--akzent-dunkel); font-size: 11.5pt; break-after: avoid; }
.papier h4 .bild { width: 1.5em; height: 1.5em; }
.papier table { width: 100%; border-collapse: collapse; margin: 4px 0 6px; }
.papier th, .papier td { border: 1px solid #888; padding: 4px 6px; text-align: left; vertical-align: top; }
.papier th { background: #f2f2f2; font-size: 8.5pt; }
.prot-block { border: 1.5px solid var(--akzent); border-radius: 6px; padding: 0 10px 8px; margin: 10px 0; break-inside: avoid; }
.prot-block .bt { background: var(--akzent); color: #fff; margin: 0 -10px 6px; padding: 5px 10px; font-weight: 700; border-radius: 4px 4px 0 0; display: flex; gap: 8px; align-items: center; }
.prot-block p { margin: 4px 0; }
.prot-unterschriften { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 18px; break-inside: avoid; }
.prot-unterschriften .linie { border-top: 1px solid #555; font-size: 8pt; color: #555; padding-top: 3px; }
.prot-fuss { margin-top: 18px; font-size: 7.5pt; color: #888; border-top: 1px solid #ddd; padding-top: 4px; }

/* Sperre */
.gesperrt input:disabled, .gesperrt textarea:disabled, .gesperrt select:disabled { background: #faf9f6; color: var(--text); opacity: 1; }
.gesperrt button:disabled { opacity: .35; cursor: not-allowed; }
.gesperrt button.an:disabled, .gesperrt .status-wahl button.an:disabled { opacity: 1; }
.gesperrt .x, .gesperrt [data-act="zeile-neu"], .gesperrt [data-act="vorschlag-neu"], .gesperrt .reiter .neu,
.gesperrt .nchip button, .gesperrt [data-act="beste-idee"], .gesperrt [data-act="rollen-vorschlag"], .gesperrt [data-act="zeit"],
.gesperrt [data-act="unterschrift-weg"], .gesperrt [data-act="timer-start"] { display: none; }
.gesperrt .namensfeld { cursor: default; border-style: solid; background: #faf9f6; }
.gesperrt canvas { cursor: not-allowed; }
.sperr-box { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; background: #fff8e1; border: 1px solid #f3e1a6; }
.sperr-box.offen { background: #eef8f4; border-color: #bfe0d4; }
.sperr-box .knopf { margin-left: auto; }

/* Blitzlicht im Vollbild */
.blitz { position: fixed; inset: 0; z-index: 90; background: var(--hg); display: flex; flex-direction: column; padding: 18px; gap: 14px; }
.blitz .oben { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.blitz h2 { margin: 0; font-size: clamp(1.4rem, 4vw, 2.4rem); color: var(--akzent-dunkel); }
.blitz .oben .aktionen { margin-left: auto; }
.blitz .wahl { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2.5vmin; }
.blitz .wahl button { border: 0; border-radius: 28px; background: #fff; box-shadow: 0 6px 24px rgba(0,0,0,.08); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vmin; cursor: pointer; font-size: clamp(1.2rem, 3.4vmin, 2.2rem); font-weight: 800; color: var(--text); transition: transform .08s; touch-action: manipulation; }
.blitz .wahl button:active { transform: scale(.97); }
.blitz .wahl .bild { width: 34vmin; height: 34vmin; max-width: 300px; max-height: 300px; }
.blitz .wahl .zahl { font-size: clamp(1.6rem, 6vmin, 3.6rem); color: var(--akzent-dunkel); }
.blitz .unten { text-align: center; color: var(--leise); font-weight: 600; }
.blitz .danke { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: rgba(255,255,255,.93); font-size: clamp(2rem, 8vmin, 5rem); font-weight: 800; color: var(--akzent-dunkel); }
.blitz .danke small { font-size: clamp(1rem, 3vmin, 1.6rem); color: var(--leise); font-weight: 600; }
@media (orientation: portrait) and (max-width: 700px) { .blitz .wahl { grid-template-columns: 1fr; } .blitz .wahl .bild { width: 18vh; height: 18vh; } .blitz .wahl button { flex-direction: row; } }

/* Dialog */
.dialog-hg { position: fixed; inset: 0; background: rgba(30,30,30,.45); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px; }
.dialog { background: #fff; border-radius: 18px; padding: 20px 22px; width: min(420px, 100%); box-shadow: 0 20px 60px rgba(0,0,0,.25); border-top: 6px solid var(--akzent); }
.dialog h3 { margin: 0 0 8px; }
.dialog .fehler { color: var(--rot); font-weight: 700; font-size: .9rem; min-height: 1.2em; margin: 6px 0 0; }
.dialog form { display: flex; flex-direction: column; gap: 10px; }

#druck { display: none; }
@media print {
  @page { size: A4; margin: 12mm; }
  body { background: #fff; }
  body > *:not(#druck) { display: none !important; }
  #druck { display: block; }
  #druck .papier { box-shadow: none; padding: 0; max-width: none; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

@media (max-width: 720px) {
  .app-kopf { padding: 8px 12px; }
  .app-kopf .logo { width: 84px; }
  nav.haupt { margin-left: 0; width: 100%; }
  nav.haupt button span.t { display: none; }
  main { padding: 16px 12px 120px; }
  .zeilen .z { grid-template-columns: 1fr auto; }
  .zeilen .z > :nth-child(2) { grid-column: 1 / 2; }
  .namenleiste .chips { max-height: 96px; }
  .vorschlag { grid-template-columns: 1fr; }
  .sitzung-karte { grid-template-columns: auto 1fr; }
  .sitzung-karte .aktionen { grid-column: 1 / -1; }
  .feedback { grid-template-columns: 1fr; }
  .rb { grid-template-columns: 1fr; }
  .prot-meta { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body data-stufe="ms">
<div class="streifen"></div>
<header class="app-kopf">
  <div class="logo" id="logo"></div>
  <div class="app-titel">
    <h1>Klassenrat</h1>
    <select id="klassenwahl" aria-label="Klasse wählen"></select>
  </div>
  <nav class="haupt" id="nav"></nav>
  <div class="cloud" id="cloud"></div>
  <div class="gespeichert" id="gespeichert"></div>
</header>
<main id="app"></main>
<div id="timer-bereich"></div>
<div id="druck"></div>
<div id="dialog"></div>
<div id="blitz"></div>

<script>
/*__BILDER__*/

// ---------------------------------------------------------------------------
// Texte je Schulart
// ---------------------------------------------------------------------------
const TEXTE = {
  gs: {
    titel: "Unser Klassenrat", stufe: "Grundschule (Kl. 1–4)",
    leitung: "Leitung", protokoll: "Schreiber/in", zeit: "Zeitwächter/in", regel: "Regelwächter/in",
    positiv: "Das war schön", positivTipp: "„Ich fand schön, dass …“",
    rueckblick: "Hat es geklappt?", rueckblickTipp: "Das hatten wir beschlossen. Hat es geklappt?",
    anliegen: "Unsere Themen", einAnliegen: "Thema", mehrere: "Themen", von: "Wer hat das Thema?",
    worum: "Worum geht es?", aussagen: "Was sagen die Kinder?", aussage: "Das sagt das Kind …",
    vorschlaege: "Unsere Ideen", vorschlag: "Idee", beschluss: "Das machen wir",
    abschluss: "Wie war's?", feedback: "Wie war unser Klassenrat?",
    status: { ja: "geklappt", teils: "ein bisschen", nein: "nicht geklappt" },
    kind: "Kind", kinder: "Kinder",
    schritt: { positiv: "Das war schön", rueckblick: "Geklappt?", anliegen: "Themen", abschluss: "Wie war's?" },
  },
  ms: {
    titel: "Klassenrat – Protokoll", stufe: "Mittelschule (Kl. 5–9)",
    leitung: "Präsident/in", protokoll: "Protokollant/in", zeit: "Zeitwächter/in", regel: "Regelwächter/in",
    positiv: "Positivrunde", positivTipp: "„Mir hat gefallen, dass …“ · „Ich bedanke mich bei …, weil …“",
    rueckblick: "Rückblick", rueckblickTipp: "Wurden die Beschlüsse der letzten Sitzungen umgesetzt?",
    anliegen: "Anliegen", einAnliegen: "Anliegen", mehrere: "Anliegen", von: "eingebracht von",
    worum: "Worum geht es? (in eigenen Worten)", aussagen: "Aussagen / Sichtweisen", aussage: "Aussage (sinngemäß)",
    vorschlaege: "Lösungsvorschläge & Abstimmung", vorschlag: "Vorschlag", beschluss: "Beschluss",
    abschluss: "Abschluss", feedback: "Blitzlicht: Wie war die Sitzung?",
    status: { ja: "umgesetzt", teils: "teilweise", nein: "nicht umgesetzt" },
    kind: "Schüler/in", kinder: "Schüler/innen",
  },
};
const ROLLEN = [["leitung", "glocke"], ["protokoll", "stift"], ["zeit", "uhr"], ["regel", "regel"]];
const UNTERSCHRIFTEN = [["leitung"], ["protokoll"], ["lehrkraft"]];
function unterschriftName(s, r, t) {
  if (r === "lehrkraft") return "Lehrkraft" + (klasse().lehrkraft ? ": " + esc(klasse().lehrkraft) : "");
  return t[r] + (s.rollen[r] ? ": " + esc(s.rollen[r]) : "");
}
const ARTEN = ["Kritik", "Wunsch", "Vorschlag", "Konflikt", "Information"];
const ERGEBNISSE = [["beschluss", "Beschluss"], ["vertagt", "vertagt"], ["keine", "keine Einigung"], ["weiter", "weitergeben"]];
const SCHRITTE = [
  ["start", "Start", "leute"], ["positiv", null, "stern"], ["rueckblick", null, "zurueck"],
  ["anliegen", null, "sprechen"], ["abschluss", null, "froh"], ["protokoll", "Protokoll", "beschluss"],
];

// ---------------------------------------------------------------------------
// Speicher
// ---------------------------------------------------------------------------
const SPEICHER = "klassenrat-jpw-v1";
let state = laden();
const ui = { view: "sitzungen", sitzungId: null, schritt: "start", filter: "offen", ziel: null, anliegenIdx: 0, fokus: null };

function laden() {
  try {
    const s = JSON.parse(localStorage.getItem(SPEICHER));
    if (s && Array.isArray(s.klassen)) return migrieren(s);
  } catch (e) { /* leer oder gesperrt */ }
  return { version: 2, klassen: [], aktiveKlasse: null, logo: null, letzterExport: null };
}
// Version 1 speicherte einen Namen als Text, ab Version 2 sind es Listen (mehrere Namen je Aussage).
function migrieren(st) {
  const liste = (x) => (Array.isArray(x) ? x : x ? [x] : []);
  for (const k of st.klassen) for (const s of k.sitzungen) {
    for (const z of [...(s.positiv || []), ...s.anliegen.flatMap((a) => a.aussagen || [])]) {
      if (!z.namen) { z.namen = liste(z.name); delete z.name; }
    }
    for (const a of s.anliegen) {
      a.von = liste(a.von); a.wer = liste(a.wer);
      for (const v of a.vorschlaege || []) v.von = liste(v.von);
    }
    s.unterschriften ||= {};
  }
  st.version = 2;
  return st;
}
let speicherTimer;
function speichern() {
  clearTimeout(speicherTimer);
  speicherTimer = setTimeout(() => {
    const el = document.getElementById("gespeichert");
    sichernInOrdnerSpaeter();
    try {
      localStorage.setItem(SPEICHER, JSON.stringify(state));
      el.textContent = "✓ gespeichert";
    } catch (e) {
      el.textContent = "⚠ nicht gespeichert";
      alert("Speichern im Browser ist nicht möglich. Bitte unter „Daten“ eine Sicherung herunterladen.");
    }
    setTimeout(() => (el.textContent = ""), 1800);
  }, 250);
}

// ---------------------------------------------------------------------------
// Hilfen
// ---------------------------------------------------------------------------
const $ = (s) => document.querySelector(s);
const id = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const heute = () => new Date().toISOString().slice(0, 10);
const jetzt = () => new Date().toTimeString().slice(0, 5);
function datum(d, lang) {
  if (!d) return "–";
  const opt = lang ? { weekday: "long", day: "numeric", month: "long", year: "numeric" } : { day: "2-digit", month: "2-digit", year: "numeric" };
  return new Date(d + "T00:00").toLocaleDateString("de-DE", opt);
}
function bild(name, kl = "") {
  if (name === "logo" && state.logo) return `<span class="bild ${kl}"><img src="${state.logo}" alt="Schullogo"></span>`;
  return `<span class="bild ${kl}">${BILDER[name] || ""}</span>`;
}
function logoHTML() { return state.logo ? `<img src="${state.logo}" alt="Schullogo">` : BILDER.logo; }
const klasse = () => state.klassen.find((k) => k.id === state.aktiveKlasse);
const sitzung = () => klasse()?.sitzungen.find((s) => s.id === ui.sitzungId);
const T = () => TEXTE[klasse()?.stufe || "ms"];
const sortiert = (k) => [...k.sitzungen].sort((a, b) => a.nr - b.nr);

function pfadSetzen(obj, pfad, wert) {
  const teile = pfad.split(".");
  let o = obj;
  for (let i = 0; i < teile.length - 1; i++) o = o[teile[i]];
  o[teile.at(-1)] = wert;
}

// ---------------------------------------------------------------------------
// Fachlogik
// ---------------------------------------------------------------------------
function neueSitzung() {
  const k = klasse();
  const liste = sortiert(k);
  const letzte = liste.at(-1);
  const s = {
    id: id(), nr: (letzte?.nr || 0) + 1, datum: heute(), beginn: "", ende: "",
    rollen: { leitung: "", protokoll: "", zeit: "", regel: "" }, fehlend: [],
    positiv: [], rueckblick: {}, anliegen: [],
    feedback: { gut: 0, mittel: 0, schlecht: 0 }, vorsatz: "",
    naechsteRollen: { leitung: "", protokoll: "", zeit: "", regel: "" }, naechsterTermin: "", unterschriften: {},
  };
  if (letzte && Object.values(letzte.naechsteRollen || {}).some(Boolean)) s.rollen = { ...letzte.naechsteRollen };
  else s.rollen = rollenVorschlag(k, []);
  k.sitzungen.push(s);
  ui.sitzungId = s.id; ui.schritt = "start"; ui.view = "sitzung"; ui.ziel = null; ui.anliegenIdx = 0;
  speichern(); render();
}

// Wer am seltensten (und am längsten nicht) eine Rolle hatte, ist als Nächstes dran.
function rollenVorschlag(k, fehlend) {
  const stat = Object.fromEntries(k.schueler.map((n) => [n, { anzahl: 0, zuletzt: 0 }]));
  for (const s of k.sitzungen) for (const n of Object.values(s.rollen)) if (stat[n]) { stat[n].anzahl++; stat[n].zuletzt = Math.max(stat[n].zuletzt, s.nr); }
  const kandidaten = k.schueler.filter((n) => !fehlend.includes(n))
    .sort((a, b) => stat[a].anzahl - stat[b].anzahl || stat[a].zuletzt - stat[b].zuletzt || Math.random() - .5);
  const r = {};
  ROLLEN.forEach(([rolle], i) => (r[rolle] = kandidaten[i] || ""));
  return r;
}

// Alle Beschlüsse einer Klasse mit Verlauf der Überprüfungen.
function beschluesse(k) {
  const liste = [];
  const sitz = sortiert(k);
  for (const s of sitz) for (const a of s.anliegen) {
    if (a.ergebnis !== "beschluss" || !a.beschluss) continue;
    const verlauf = sitz.filter((x) => x.nr > s.nr && x.rueckblick?.[a.id]?.status)
      .map((x) => ({ nr: x.nr, datum: x.datum, ...x.rueckblick[a.id] }));
    liste.push({ id: a.id, sitzung: s, anliegen: a, verlauf, status: verlauf.at(-1)?.status || "offen" });
  }
  return liste;
}
// Beschlüsse, die in Sitzung s überprüft werden: aus früheren Sitzungen, vorher nicht als umgesetzt markiert.
function offeneFuer(s) {
  return beschluesse(klasse()).filter((b) => b.sitzung.nr < s.nr && !b.verlauf.some((v) => v.nr < s.nr && v.status === "ja"));
}
// --- Sperre abgeschlossener Sitzungen --------------------------------------------
// Schutz vor versehentlichen oder unbefugten Änderungen in der Oberfläche (keine Verschlüsselung).
const istGesperrt = (s) => !!s?.gesperrt && ui.entsperrt !== s.id;
async function pwHash(pw, salz) {
  const text = salz + "|" + pw;
  if (window.crypto?.subtle) {
    const h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return [...new Uint8Array(h)].map((b) => b.toString(16).padStart(2, "0")).join("");
  }
  let h = 2166136261;  // Ersatz, falls der Browser kein SHA-256 anbietet
  for (const c of text) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  return "fnv" + (h >>> 0).toString(16);
}
async function pwPruefen(pw) { return !!state.sperre && (await pwHash(pw, state.sperre.salz)) === state.sperre.hash; }
async function pwSetzen(pw) { const salz = id() + id(); state.sperre = { salz, hash: await pwHash(pw, salz) }; speichern(); }

// Kleiner Dialog mit Passwortfeldern. Liefert die Eingaben oder null (abgebrochen / zweiter Knopf).
function dialog({ titel, text, felder, knopf, zweitKnopf, pruefen }) {
  return new Promise((fertig) => {
    const box = $("#dialog");
    box.innerHTML = `<div class="dialog-hg"><div class="dialog" role="dialog" aria-modal="true">
      <h3>${bild("schloss", "m")} ${titel}</h3><p class="leise">${text}</p>
      <form>${felder.map((f, i) => `<label class="feld">${f}<input type="password" name="f${i}" autocomplete="off"></label>`).join("")}
        <p class="fehler"></p>
        <div class="aktionen"><button class="knopf" type="submit">${knopf}</button>
          ${zweitKnopf ? `<button class="knopf rand" type="button" data-wahl="zweit">${zweitKnopf}</button>` : ""}
          <button class="knopf rand" type="button" data-wahl="abbrechen">Abbrechen</button></div></form></div></div>`;
    const form = box.querySelector("form");
    const zu = (wert) => { box.innerHTML = ""; fertig(wert); };
    form.querySelector("input")?.focus();
    box.querySelectorAll("[data-wahl]").forEach((b) => b.addEventListener("click", (e) => { e.stopPropagation(); zu(b.dataset.wahl === "zweit" ? "zweit" : null); }));
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const werte = felder.map((_, i) => form.elements["f" + i].value);
      const fehler = pruefen ? await pruefen(werte) : "";
      if (fehler) { form.querySelector(".fehler").textContent = fehler; return; }
      zu(werte);
    });
  });
}
async function neuesPasswortDialog(titel, text, zweitKnopf, knopf = "Passwort speichern") {
  return dialog({ titel, text, felder: ["Neues Passwort (mind. 4 Zeichen)", "Passwort wiederholen"], knopf, zweitKnopf,
    pruefen: ([a, b]) => (a.length < 4 ? "Bitte mindestens 4 Zeichen." : a !== b ? "Die Passwörter stimmen nicht überein." : "") });
}
async function passwortAbfragen(text) {
  const r = await dialog({ titel: "Passwort eingeben", text, felder: ["Passwort"], knopf: "Bestätigen",
    pruefen: async ([pw]) => ((await pwPruefen(pw)) ? "" : "Das Passwort ist falsch.") });
  return Array.isArray(r);
}

const namenText = (x) => (Array.isArray(x) ? x.join(", ") : x || "");
function ueberfaellig(b) { return b.status !== "ja" && b.anliegen.bisWann && b.anliegen.bisWann < heute(); }

function neuesAnliegen(vorlage) {
  return {
    id: id(), thema: "", von: [], art: "", worum: "", aussagen: [],
    vorschlaege: [{ text: "", von: [], ja: 0, nein: 0, enth: 0 }],
    ergebnis: "", weiterAn: "", beschluss: "", wer: [], bisWann: "", ueberpruefung: "", einstimmig: "",
    ...(vorlage || {}),
  };
}

// ---------------------------------------------------------------------------
// Darstellung
// ---------------------------------------------------------------------------
function render() {
  const k = klasse();
  document.body.dataset.stufe = k?.stufe || "ms";
  document.title = k ? `Klassenrat ${k.name}` : "Klassenrat";
  $("#logo").innerHTML = logoHTML();
  $("#klassenwahl").innerHTML = state.klassen.map((x) => `<option value="${x.id}" ${x.id === state.aktiveKlasse ? "selected" : ""}>Klasse ${esc(x.name)}</option>`).join("")
    + `<option value="__neu">+ Klasse anlegen …</option>`;
  $("#klassenwahl").hidden = !state.klassen.length;
  const navs = [["sitzungen", "Sitzungen", "kalender"], ["beschluesse", "Beschlüsse", "beschluss"], ["klasse", "Klasse", "leute"], ["daten", "Daten", "wandzeitung"]];
  const aktivNav = ui.view === "sitzung" ? "sitzungen" : ui.view;
  $("#nav").innerHTML = k ? navs.map(([v, t, b]) => `<button data-act="view" data-arg="${v}" class="${aktivNav === v ? "aktiv" : ""}">${bild(b, "s")}<span class="t">${t}</span></button>`).join("") : "";

  const app = $("#app");
  if (!k) app.innerHTML = viewWillkommen();
  else if (ui.view === "sitzung" && sitzung()) app.innerHTML = viewSitzung();
  else if (ui.view === "beschluesse") app.innerHTML = viewBeschluesse();
  else if (ui.view === "klasse") app.innerHTML = viewKlasse();
  else if (ui.view === "daten") app.innerHTML = viewDaten();
  else { ui.view = "sitzungen"; app.innerHTML = viewSitzungen(); }
  renderTimer();
  renderCloud();
  nachRender();
}

function nachRender() {
  document.documentElement.style.setProperty("--kopfhoehe", document.querySelector(".app-kopf").offsetHeight + "px");
  document.querySelectorAll("textarea[rows='1']").forEach(hoeheAnpassen);
  if (ui.fokus) {
    const el = document.querySelector(`[data-k="${ui.fokus}"]`);
    ui.fokus = null;
    if (el) { el.focus({ preventScroll: true }); el.setSelectionRange?.(el.value.length, el.value.length); }
  }
  document.querySelectorAll("canvas[data-pad]").forEach(padStarten);
  document.querySelectorAll("#sperrbereich.gesperrt :is(input, textarea, select)").forEach((el) => (el.disabled = true));
  document.querySelectorAll("#sperrbereich.gesperrt button[data-act]").forEach((b) => { if (!ERLAUBT_GESPERRT.includes(b.dataset.act)) b.disabled = true; });
}
function hoeheAnpassen(ta) { ta.style.height = "auto"; ta.style.height = Math.max(ta.scrollHeight + 3, 44) + "px"; }

// Ziel wechseln, ohne neu zu zeichnen (z. B. beim Klick in ein Textfeld)
function zielAnzeigen() {
  document.querySelectorAll(".zeilen .z").forEach((z) => z.classList.toggle("ziel", z.querySelector("[data-ziel]")?.dataset.ziel === ui.ziel));
  document.querySelectorAll(".namensfeld").forEach((f) => f.classList.toggle("ziel", f.dataset.arg === ui.ziel));
  const leiste = document.querySelector(".namenleiste");
  if (leiste) leiste.outerHTML = namenLeiste();
}

// --- Unterschriften -------------------------------------------------------------
function padStarten(c) {
  const rolle = c.dataset.pad, s = sitzung();
  const dpr = window.devicePixelRatio || 1;
  c.width = c.clientWidth * dpr; c.height = c.clientHeight * dpr;
  const ctx = c.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.lineWidth = 2.4; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#1d2b4f";
  const alt = s.unterschriften?.[rolle];
  if (alt) { const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0, c.clientWidth, c.clientHeight); img.src = alt.bild; }
  let zeichnet = false, gezeichnet = false;
  const punkt = (e) => { const r = c.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  c.addEventListener("pointerdown", (e) => { if (istGesperrt(s)) return; zeichnet = true; c.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.moveTo(...punkt(e)); e.preventDefault(); });
  c.addEventListener("pointermove", (e) => { if (!zeichnet) return; ctx.lineTo(...punkt(e)); ctx.stroke(); gezeichnet = true; });
  const ende = () => {
    if (!zeichnet) return;
    zeichnet = false;
    if (!gezeichnet) return;
    s.unterschriften ||= {};
    s.unterschriften[rolle] = { bild: c.toDataURL("image/png"), zeit: Date.now() };
    c.parentElement.classList.add("fertig");
    const papier = document.querySelector("#app .papier");
    if (papier) papier.innerHTML = protokollHTML(s);
    speichern();
  };
  c.addEventListener("pointerup", ende);
  c.addEventListener("pointercancel", ende);
}

function viewWillkommen(zusatz) {
  return `
  <div class="karte akzent" style="max-width:640px;margin:20px auto">
    <div class="illu">${BILDER.klassenrat}</div>
    <h2 style="justify-content:center">${zusatz ? "Weitere Klasse anlegen" : "Willkommen beim digitalen Klassenrat!"}</h2>
    <p class="leise" style="text-align:center">Lege eine Klasse an. Danach kannst du jede Sitzung Schritt für Schritt protokollieren.
    Alle Daten bleiben auf diesem Gerät.</p>
    <div class="raster abstand">
      <label class="feld">Klasse<input type="text" id="nk-name" placeholder="z. B. 3a oder 7b"></label>

    </div>

      <label>${bild("leute", "s")}<input type="radio" name="nk-stufe" value="ms" checked> Mittelschule (Kl. 5–9)</label>
    </div>
    <h3>${bild("leute", "s")} Klassenliste</h3>

    <div class="aktionen abstand">
      <button class="knopf gross" data-act="klasse-anlegen">Klasse anlegen</button>
      ${zusatz ? `<button class="knopf rand" data-act="view" data-arg="sitzungen">Abbrechen</button>` : `<button class="knopf rand" data-act="import">Sicherung laden …</button>`}
    </div>
  </div>`;
}
function schuljahr() {
  const d = new Date(), j = d.getFullYear(), m = d.getMonth();
  return m >= 7 ? `${j}/${String(j + 1).slice(2)}` : `${j - 1}/${String(j).slice(2)}`;
}

// --- Sitzung -----------------------------------------------------------------
function viewSitzung() {
  const s = sitzung(), t = T();
  const titel = (n, x) => x || t.schritt?.[n] || t[n];
  zielTexte = {};
  if (s.anliegen.length && ui.anliegenIdx >= s.anliegen.length) ui.anliegenIdx = s.anliegen.length - 1;
  if (!zielGueltig()) ui.ziel = standardZiel();
  const inhalt = { start: schrittStart, positiv: schrittPositiv, rueckblick: schrittRueckblick, anliegen: schrittAnliegen, abschluss: schrittAbschluss, protokoll: schrittProtokoll }[ui.schritt](s, t);
  const mitNamen = ui.schritt === "positiv" || (ui.schritt === "anliegen" && s.anliegen.length);
  return `
  <div class="titelzeile">
    <button class="knopf rand" data-act="view" data-arg="sitzungen">← Übersicht</button>
    <h2>Sitzung Nr. ${s.nr} <span class="leise klein">${datum(s.datum, true)}</span></h2>
    ${Object.keys(s.unterschriften || {}).length ? `<span class="badge ja">${bild("unterschrift", "s")} unterschrieben</span>` : ""}
    ${s.gesperrt ? `<span class="badge">${bild(istGesperrt(s) ? "schloss" : "schloss_offen", "s")} ${istGesperrt(s) ? "gesperrt" : "entsperrt"}</span>` : ""}
  </div>
  <div class="schritte">${SCHRITTE.map(([key, x, b], i) => `<button class="schritt ${ui.schritt === key ? "aktiv" : ""}" data-act="schritt" data-arg="${key}"><span class="n">${i + 1}</span>${bild(b, "s")}${titel(key, x)}</button>`).join("")}
    <button class="schritt beenden" data-act="beenden"><span class="n">${SCHRITTE.length + 1}</span>${bild(istGesperrt(s) ? "schloss" : "haken", "s")}${istGesperrt(s) ? "Zur Übersicht" : "Sitzung beenden"}</button></div>
  ${s.gesperrt ? (istGesperrt(s)
    ? `<div class="sperr-box">${bild("schloss", "m")}<div><b>Abgeschlossen und gesperrt</b> seit ${new Date(s.gesperrt).toLocaleString("de-DE", { dateStyle: "medium", timeStyle: "short" })}.<br>
        <span class="leise klein">Ansehen und Drucken ist möglich. Zum Ändern wird das Passwort benötigt.</span></div>
        <button class="knopf" data-act="entsperren">Entsperren …</button></div>`
    : `<div class="sperr-box offen">${bild("schloss_offen", "m")}<div><b>Vorübergehend entsperrt.</b><br>
        <span class="leise klein">Nachträgliche Änderungen werden im Protokoll vermerkt. Beim Verlassen wird die Sitzung wieder gesperrt.</span></div>
        <button class="knopf" data-act="sperren">Wieder sperren</button></div>`) : ""}
  <div id="sperrbereich" class="${istGesperrt(s) ? "gesperrt" : ""}">
  ${ui.schritt === "anliegen" ? anliegenReiter(s, t) : ""}

  ${inhalt}
  </div>
  ${ui.schritt !== "protokoll" ? `<div class="fusszeile">
    ${schrittNachbar(-1) ? `<button class="knopf rand" data-act="schritt" data-arg="${schrittNachbar(-1)}">← Zurück</button>` : "<span></span>"}
    <button class="knopf" data-act="schritt" data-arg="${schrittNachbar(1)}">Weiter →</button></div>`
    : `<div class="fusszeile"><button class="knopf rand" data-act="schritt" data-arg="abschluss">← Zurück</button>
       <button class="knopf" data-act="beenden">${bild(istGesperrt(s) ? "schloss" : "haken", "s")} ${istGesperrt(s) ? "Zur Übersicht" : "Sitzung beenden"}</button></div>`}`;
}
function schrittNachbar(d) {
  const i = SCHRITTE.findIndex(([k]) => k === ui.schritt) + d;
  return SCHRITTE[i]?.[0];
}
// --- Namen antippen ------------------------------------------------------------
// Ein "Ziel" ist der Pfad, dem angetippte Namen zugeordnet werden:
//  Liste von Zeilen  -> neue Zeile mit dem Namen   ·  Zeile -> Name dazu/weg
//  Liste von Namen   -> Name dazu/weg              ·  Text (Rolle) -> Name setzen
let zielTexte = {};
function wertAn(pfad) { return pfad.split(".").reduce((o, k) => (o == null ? o : o[k]), sitzung()); }
function zielArt(pfad) {
  const w = pfad && wertAn(pfad);
  if (w === undefined || w === null) return null;
  if (typeof w === "string") return "einzeln";
  if (Array.isArray(w)) return /^(positiv|anliegen\.\d+\.aussagen)$/.test(pfad) ? "liste" : "mehrere";
  if (typeof w === "object" && Array.isArray(w.namen)) return "zeile";
  return null;
}
function kurzname(n, alle) {
  const teile = n.trim().split(/\s+/);
  if (teile.length < 2) return n;
  const kurz = `${teile[0]} ${teile.at(-1)[0]}.`;
  return alle.filter((x) => x !== n && x.startsWith(teile[0] + " ") && x.trim().split(/\s+/).at(-1)[0] === teile.at(-1)[0]).length ? n : kurz;
}
function standardZiel() {
  const s = sitzung();
  if (ui.schritt === "positiv") return "positiv";
  if (ui.schritt === "anliegen") return s.anliegen[ui.anliegenIdx] ? `anliegen.${ui.anliegenIdx}.aussagen` : null;
  if (ui.schritt === "start" || ui.schritt === "abschluss") {
    const basis = ui.schritt === "start" ? "rollen" : "naechsteRollen";
    const frei = ROLLEN.find(([r]) => !s[basis][r]);
    return `${basis}.${(frei || ROLLEN[0])[0]}`;
  }
  return null;
}
function zielGueltig() {
  const z = ui.ziel;
  if (!z || !zielArt(z)) return false;
  if (ui.schritt === "positiv") return z.startsWith("positiv");
  if (ui.schritt === "anliegen") return z.startsWith(`anliegen.${ui.anliegenIdx}.`);
  if (ui.schritt === "start") return z.startsWith("rollen.");
  if (ui.schritt === "abschluss") return z.startsWith("naechsteRollen.");
  return false;
}
function namenLeiste() {
  const k = klasse(), s = sitzung();
  const z = ui.ziel, art = zielArt(z);
  const w = z ? wertAn(z) : null;
  const gewaehlt = art === "zeile" ? w.namen : art === "mehrere" ? w : art === "einzeln" ? [w] : [];
  const anwesend = k.schueler.filter((n) => !s.fehlend.includes(n));
  const info = zielTexte[z]?.text || "";
  const hinweis = { liste: "Name antippen → neue Zeile, dann den Text eingeben.",
    zeile: "Weitere Namen antippen, um sie derselben Zeile zuzuordnen.",
    mehrere: "Namen an- oder abwählen.", einzeln: "Einen Namen antippen." }[art] || "";
  const listePfad = art === "zeile" ? z.split(".").slice(0, -1).join(".") : null;
  const extras = art === "einzeln" ? [] : ["ganze Klasse", "Lehrkraft"];
  if (!k.schueler.length) return `<div class="namenleiste"><div class="ziel-info">Keine Klassenliste hinterlegt.
    <button class="knopf mini" data-act="view" data-arg="klasse">Klassenliste eintragen</button></div></div>`;
  return `<div class="namenleiste">
    <div class="ziel-info">${bild("leute", "s")} <span>Namen für: <b>${esc(info)}</b></span><span>· ${hinweis}</span>
      ${listePfad ? `<button class="knopf mini zweit" data-act="ziel" data-arg="${listePfad}" style="margin-left:auto">＋ neue Zeile</button>` : ""}</div>
    <div class="chips">${anwesend.map((n) => `<button class="chip ${gewaehlt.includes(n) ? "an" : ""}" data-act="name" data-arg="${esc(n)}" title="${esc(n)}">${esc(kurzname(n, k.schueler))}</button>`).join("")}
      ${extras.map((n) => `<button class="chip extra ${gewaehlt.includes(n) ? "an" : ""}" data-act="name" data-arg="${n}">${n}</button>`).join("")}</div>
  </div>`;
}
function namensFeld(pfad, werte, text) {
  if (!zielTexte[pfad]) zielTexte[pfad] = { text };
  const liste = Array.isArray(werte) ? werte : werte ? [werte] : [];
  return `<div class="namensfeld ${ui.ziel === pfad ? "ziel" : ""}" data-act="ziel" data-arg="${pfad}" title="antippen, dann oben Namen wählen">
    ${liste.length ? liste.map((n) => `<span class="nchip">${esc(n)}<button data-act="name-weg" data-arg="${pfad}|${esc(n)}" aria-label="${esc(n)} entfernen">✕</button></span>`).join("")
      : `<span class="leer-hinweis">antippen, Namen wählen</span>`}</div>`;
}
function rollenFelder(obj, pfad, t) {
  return `<div class="raster">${ROLLEN.map(([r, b]) => `<div class="feld"><span class="zeile">${bild(b)} ${t[r]}</span>
    ${namensFeld(`${pfad}.${r}`, obj[r], t[r])}</div>`).join("")}</div>`;
}
function namenZeilen(liste, pfad, platzhalter, titel) {
  zielTexte[pfad] = { text: `${titel} – neue Zeile`, liste: true };
  return `<div class="zeilen">${liste.map((z, i) => {
    const zp = `${pfad}.${i}`;
    zielTexte[zp] = { text: `${titel} – Zeile ${i + 1}` };
    return `<div class="z ${ui.ziel === zp ? "ziel" : ""}">
    ${namensFeld(zp, z.namen, "")}
    <textarea rows="1" data-k="${zp}.text" data-ziel="${zp}" placeholder="${esc(platzhalter)}">${esc(z.text)}</textarea>
    <button class="x" data-act="zeile-weg" data-arg="${zp}" title="Zeile entfernen">✕</button></div>`;
  }).join("")}</div>
    ${liste.length ? "" : `<p class="leise klein">Noch keine Einträge – oben einen Namen antippen.</p>`}
    <div class="aktionen abstand"><button class="knopf mini zweit" data-act="zeile-neu" data-arg="${pfad}">＋ Zeile ohne Namen</button></div>`;
}

function schrittStart(s, t) {
  const k = klasse();
  const anw = k.schueler.length - s.fehlend.length;
  const rollen = rollenFelder(s.rollen, "rollen", t);
  return `
  <div class="karte akzent">
    <h3 style="margin-top:0">${bild("kalender")} Sitzung</h3>
    <div class="raster">
      <label class="feld">Datum<input type="date" data-k="datum" value="${esc(s.datum)}"></label>
      <label class="feld">Sitzung Nr.<input type="number" min="1" data-k="nr" data-typ="zahl" value="${s.nr}"></label>
      <label class="feld"><span class="zeile">Beginn <button class="knopf mini rand" data-act="zeit" data-arg="beginn">jetzt</button></span><input type="time" data-k="beginn" value="${esc(s.beginn)}"></label>
      <label class="feld"><span class="zeile">Ende <button class="knopf mini rand" data-act="zeit" data-arg="ende">jetzt</button></span><input type="time" data-k="ende" value="${esc(s.ende)}"></label>
    </div>
  </div>
  <div class="karte">
    <h3 style="margin-top:0">${bild("haken")} Anwesenheit <span class="leise klein">${k.schueler.length ? `${anw} von ${k.schueler.length} anwesend – zum Abmelden antippen` : ""}</span></h3>
    ${k.schueler.length ? `<div class="chips">${k.schueler.map((n) => `<button class="chip ${s.fehlend.includes(n) ? "fehlt" : ""}" data-act="fehlt" data-arg="${esc(n)}">${esc(n)}</button>`).join("")}</div>`
      : `<p class="leise">Keine Klassenliste hinterlegt. <button class="knopf mini" data-act="view" data-arg="klasse">Klassenliste eintragen</button></p>`}
  </div>
  ${namenLeiste()}
  <div class="karte">
    <div class="titelzeile" style="margin-bottom:6px"><h3 style="margin:0">${bild("leute")} Rollen</h3>
      <button class="knopf mini zweit" data-act="rollen-vorschlag" data-arg="rollen" style="margin-left:auto">Rollen vorschlagen</button></div>

  </div>`;
}

function schrittPositiv(s, t) {
  return `<div class="karte akzent">
    <h3 style="margin-top:0">${bild("stern", "m")} ${t.positiv} <span class="leise klein">${t.positivTipp}</span></h3>

}

function schrittRueckblick(s, t) {
  const offen = offeneFuer(s);
  if (!offen.length) return `<div class="karte leer">${bild("haken", "l")}<p><b>Keine offenen Beschlüsse.</b><br>Aus früheren Sitzungen ist nichts zu überprüfen.</p></div>`;

  const vor = (d) => {
    const tage = Math.round((new Date(heute() + "T00:00") - new Date(d + "T00:00")) / 864e5);
    return tage <= 0 ? "heute" : tage === 1 ? "gestern" : tage < 14 ? `vor ${tage} Tagen` : `vor ${Math.round(tage / 7)} Wochen`;
  };
  return `<div class="karte akzent">

    ${offen.map((b) => {
      const r = s.rueckblick[b.id] || {}, a = b.anliegen;

          <span class="alter">· Sitzung Nr. ${b.sitzung.nr} · ${vor(b.sitzung.datum)}</span>
          ${frueher.length ? `<span class="badge ${frueher.at(-1).status}">zuletzt: ${t.status[frueher.at(-1).status]} (Nr. ${frueher.at(-1).nr})</span>` : `<span class="badge offen">erstmals im Rückblick</span>`}</div>
        <div class="rb-inhalt">
          <p class="rb-beschluss">${bild("beschluss")}<span>${esc(a.beschluss)}</span></p>
          <div class="rb-fakten">
            <div class="rb-fakt"><small>${bild("sprechen")} Worum ging es?</small><div>${esc(a.thema || "–")}</div>

            <div class="rb-fakt"><small>${bild("leute")} Zuständig</small>

            <div class="rb-fakt ${faellig && r.status !== "ja" ? "warn" : ""}"><small>${bild("uhr")} Bis wann?</small>
              <div>${a.bisWann ? datum(a.bisWann, true) : "ohne Frist"}</div>${faellig && r.status !== "ja" ? `<p>Frist ist abgelaufen</p>` : ""}</div>
            ${stimmen ? `<div class="rb-fakt"><small>${bild("hand")} Abstimmung</small><div>${stimmen.ja || 0} dafür · ${stimmen.nein || 0} dagegen${stimmen.enth ? ` · ${stimmen.enth} Enth.` : ""}</div>
              ${a.einstimmig ? `<p>${esc(a.einstimmig)}</p>` : ""}</div>` : ""}
          </div>
          ${frueher.length ? `<p class="leise klein" style="margin:-4px 0 10px">Bisherige Überprüfungen: ${frueher.map((v) => `Nr. ${v.nr} ${t.status[v.status]}${v.notiz ? ` („${esc(v.notiz)}“)` : ""}`).join(" · ")}</p>` : ""}
          <div class="rb-frage"><b>${klasse().stufe === "gs" ? "Hat es geklappt?" : "Wurde der Beschluss umgesetzt?"}</b>

function anliegenReiter(s, t) {
  return `<div class="reiter">${s.anliegen.map((a, i) => `<button class="${i === ui.anliegenIdx ? "aktiv" : ""}" data-act="anliegen-tab" data-arg="${i}" title="${esc(a.thema)}">
      <span class="n">${i + 1}</span><span class="t">${esc(a.thema || t.einAnliegen + " " + (i + 1))}</span><span class="erg ${a.ergebnis}"></span></button>`).join("")}
    <button class="neu" data-act="anliegen-neu">＋ ${t.einAnliegen}</button></div>`;
}

function schrittAnliegen(s, t) {
  const k = klasse();
  const vorher = sortiert(k).filter((x) => x.nr < s.nr).at(-1);
  const vertagt = (vorher?.anliegen || []).filter((a) => a.ergebnis === "vertagt" && !s.anliegen.some((b) => b.aus === a.id));
  return `
  ${vertagt.length ? `<div class="hinweis-box info">${bild("zurueck", "m")}<div><b>Vertagt aus Sitzung ${vorher.nr}:</b> ${vertagt.map((a) => esc(a.thema || "ohne Thema")).join(", ")}
    <div class="aktionen abstand"><button class="knopf mini" data-act="vertagt-uebernehmen">Übernehmen</button></div></div></div>` : ""}
  ${s.anliegen.length ? anliegenKarte(s.anliegen[ui.anliegenIdx], ui.anliegenIdx, t, k)
    : `<div class="karte leer">${bild("wandzeitung", "l")}<p>Noch kein ${t.einAnliegen}. Trage die ${t.anliegen} von der Wandzeitung ein.</p>
       <button class="knopf" data-act="anliegen-neu">＋ ${t.einAnliegen}</button></div>`}`;
}

function anliegenKarte(a, i, t, k) {
  const p = `anliegen.${i}`;
  const gs = k.stufe === "gs";
  const nr = (x) => `${t.einAnliegen} ${i + 1}: ${x}`;
  return `<div class="karte anliegen">
    <div class="anliegen-kopf">
      <span class="nr">${i + 1}</span>
      <input type="text" data-k="${p}.thema" data-reiter value="${esc(a.thema)}" placeholder="${t.einAnliegen}: Worum geht es in einem Satz?">
      <button class="knopf mini zweit" data-act="timer-start" title="Timer für dieses ${t.einAnliegen} starten">${bild("uhr", "s")} Timer</button>
      <button class="x" data-act="anliegen-weg" data-arg="${i}" title="${t.einAnliegen} löschen">✕</button>
    </div>
    <div class="raster">
      <div class="feld"><span class="zeile">${t.von}</span>${namensFeld(`${p}.von`, a.von, nr(t.von))}</div>
      <label class="feld"><span class="zeile">Art</span><select class="feld" data-k="${p}.art"><option value="">–</option>${ARTEN.map((x) => `<option ${a.art === x ? "selected" : ""}>${x}</option>`).join("")}</select></label>
    </div>
    <label class="feld abstand">${t.worum}<textarea rows="2" data-k="${p}.worum">${esc(a.worum)}</textarea></label>

    <h3>${bild("sprechen")} ${t.aussagen} <span class="leise klein">${gs ? "" : "Betroffene zuerst, dann die Klasse"}</span></h3>
    ${namenZeilen(a.aussagen, p + ".aussagen", t.aussage, nr(t.aussagen))}

    <h3>${bild(gs ? "idee" : "hand")} ${t.vorschlaege}</h3>
    <div class="zeilen">${a.vorschlaege.map((v, j) => `<div class="vorschlag">
      ${namensFeld(`${p}.vorschlaege.${j}.von`, v.von, nr(`${t.vorschlag} ${j + 1} – von`))}
      <input type="text" data-k="${p}.vorschlaege.${j}.text" value="${esc(v.text)}" placeholder="${t.vorschlag}">
      <div class="zaehler-gruppe">
        ${zaehler(`${p}.vorschlaege.${j}.ja`, v.ja, "daumen_hoch", "dafür")}
        ${zaehler(`${p}.vorschlaege.${j}.nein`, v.nein, "daumen_runter", "dagegen")}
        ${gs ? "" : zaehler(`${p}.vorschlaege.${j}.enth`, v.enth, null, "Enthaltung")}
      </div>
      <button class="x" data-act="zeile-weg" data-arg="${p}.vorschlaege.${j}" title="Vorschlag entfernen">✕</button>
    </div>`).join("")}</div>
    <div class="aktionen abstand"><button class="knopf mini zweit" data-act="vorschlag-neu" data-arg="${i}">＋ ${t.vorschlag}</button></div>

    <h3>${bild("beschluss")} Ergebnis</h3>
    <div class="ergebnis">${ERGEBNISSE.map(([v, l]) => `<label><input type="radio" name="erg-${a.id}" data-k="${p}.ergebnis" data-neu-zeichnen value="${v}" ${a.ergebnis === v ? "checked" : ""}> ${v === "beschluss" ? t.beschluss : l}</label>`).join("")}</div>
    ${a.ergebnis === "beschluss" ? `<div class="beschluss-box">
      <label class="feld"><span class="zeile">${bild("haken")} ${t.beschluss}
        ${a.vorschlaege.some((v) => v.text) ? `<button class="knopf mini rand" data-act="beste-idee" data-arg="${i}">Vorschlag mit den meisten Stimmen übernehmen</button>` : ""}</span>
        <textarea rows="2" data-k="${p}.beschluss">${esc(a.beschluss)}</textarea></label>
      <div class="raster abstand">
        <div class="feld"><span class="zeile">Wer?</span>${namensFeld(`${p}.wer`, a.wer, nr("Wer setzt den Beschluss um?"))}</div>
        <label class="feld"><span class="zeile">Bis wann?</span><input type="date" data-k="${p}.bisWann" value="${esc(a.bisWann)}"></label>
        ${gs ? "" : `<label class="feld"><span class="zeile">Abstimmung</span><select class="feld" data-k="${p}.einstimmig"><option value="">–</option>
          <option ${a.einstimmig === "einstimmig" ? "selected" : ""}>einstimmig</option><option ${a.einstimmig === "mit Mehrheit" ? "selected" : ""}>mit Mehrheit</option></select></label>`}
      </div></div>` : ""}
    ${a.ergebnis === "weiter" ? `<div class="beschluss-box"><label class="feld">Weitergeben an<input type="text" data-k="${p}.weiterAn" value="${esc(a.weiterAn)}" placeholder="${gs ? "Lehrkraft, Schulleitung …" : "Lehrkraft, SMV, Schulleitung …"}"></label></div>` : ""}
    ${a.ergebnis === "vertagt" ? `<p class="leise klein">Wird in der nächsten Sitzung zur Übernahme vorgeschlagen.</p>` : ""}
  </div>
  ${ui.anliegenIdx < sitzung().anliegen.length - 1 ? `<div class="aktionen"><button class="knopf zweit" data-act="anliegen-tab" data-arg="${i + 1}">Nächstes ${t.einAnliegen} →</button></div>` : ""}`;
}
function zaehler(pfad, wert, icon, titel) {
  return `<span class="zaehler" title="${titel}">${icon ? bild(icon) : `<span class="klein leise" style="margin-left:8px">Enth.</span>`}
    <button data-act="zaehlen" data-arg="${pfad}|-1" aria-label="${titel} weniger">−</button><b>${wert || 0}</b>
    <button data-act="zaehlen" data-arg="${pfad}|1" aria-label="${titel} mehr">+</button></span>`;
}

function schrittAbschluss(s, t) {
  const fb = blitzOptionen();
  const rollen = rollenFelder(s.naechsteRollen, "naechsteRollen", t);
  return `
  <div class="karte akzent">
    <div class="titelzeile" style="margin-bottom:8px"><h3 style="margin:0">${bild("froh", "m")} ${t.feedback} <span class="leise klein">antippen zum Zählen</span></h3>
      <button class="knopf zweit" data-act="blitz-vollbild" style="margin-left:auto">⛶ Vollbild zum Herumgeben</button></div>
    <div class="feedback">${fb.map(([k, ic, l]) => `<div class="fb" data-act="zaehlen" data-arg="feedback.${k}|1">${bild(ic)}<b>${s.feedback[k] || 0}</b><span>${l}</span>
      <button class="x" data-act="zaehlen" data-arg="feedback.${k}|-1" title="einen abziehen">− 1</button></div>`).join("")}</div>
    <label class="feld abstand">${bild("idee", "s")} Das nehmen wir uns für die nächste Sitzung vor<input type="text" data-k="vorsatz" value="${esc(s.vorsatz)}"></label>
  </div>
  ${istGesperrt(s) ? "" : namenLeiste()}
  <div class="karte">
    <div class="titelzeile" style="margin-bottom:6px"><h3 style="margin:0">${bild("kalender")} Nächste Sitzung</h3>
      <button class="knopf mini zweit" data-act="rollen-vorschlag" data-arg="naechsteRollen" style="margin-left:auto">Rollen vorschlagen</button></div>
    ${rollen}
    <div class="raster abstand"><label class="feld">Nächster Klassenrat am<input type="date" data-k="naechsterTermin" value="${esc(s.naechsterTermin)}"></label>
    <label class="feld"><span class="zeile">Ende der Sitzung <button class="knopf mini rand" data-act="zeit" data-arg="ende">jetzt</button></span><input type="time" data-k="ende" value="${esc(s.ende)}"></label></div>
  </div>`;
}
function blitzOptionen() {
  const gs = klasse().stufe === "gs";
  return [["gut", "froh", "gut"], ["mittel", "mittel", gs ? "geht so" : "mittel"], ["schlecht", "traurig", gs ? "nicht gut" : "schlecht"]];
}

// --- Blitzlicht im Vollbild: Tablet herumgeben oder an der Tafel antippen --------------
const blitz = { offen: false, zeigen: false, verlauf: [], sperre: false };
function renderBlitz(danke) {
  const el = $("#blitz"), s = sitzung();
  if (!blitz.offen || !s) { el.innerHTML = ""; return; }
  const summe = ["gut", "mittel", "schlecht"].reduce((n, k) => n + (s.feedback[k] || 0), 0);
  el.innerHTML = `<div class="blitz">
    <div class="oben">${bild("froh", "l")}<h2>${T().feedback}</h2>
      <div class="aktionen">
        <button class="knopf rand" data-act="blitz-zeigen">${blitz.zeigen ? "Ergebnis verbergen" : "Ergebnis zeigen"}</button>
        <button class="knopf rand" data-act="blitz-zurueck" ${blitz.verlauf.length ? "" : "disabled"}>Letzte Stimme zurücknehmen</button>
        <button class="knopf" data-act="blitz-zu">Fertig</button></div></div>
    <div class="wahl">${blitzOptionen().map(([k, ic, l]) => `<button data-act="blitz-stimme" data-arg="${k}">${bild(ic)}<span>${l}</span>
      ${blitz.zeigen ? `<span class="zahl">${s.feedback[k] || 0}</span>` : ""}</button>`).join("")}</div>
    <div class="unten">${summe} Stimme${summe === 1 ? "" : "n"} abgegeben · Einmal antippen und weitergeben</div>
    ${danke ? `<div class="danke">${bild(danke, "l")}Danke!<small>Bitte weitergeben</small></div>` : ""}
  </div>`;
}
function schrittProtokoll(s, t) {
  return `<div class="karte akzent">
      <h3 style="margin-top:0">${bild("unterschrift", "m")} Unterschreiben <span class="leise klein">mit Finger, Stift oder Maus ins Feld schreiben</span></h3>
      <div class="pads">${UNTERSCHRIFTEN.map(([r]) => `<div class="pad ${s.unterschriften?.[r] ? "fertig" : ""}">
        <canvas data-pad="${r}"></canvas>
        <div class="unter"><span>${unterschriftName(s, r, t)}</span><button class="knopf mini rand" data-act="unterschrift-weg" data-arg="${r}">löschen</button></div></div>`).join("")}</div>
      <p class="leise klein">Die Unterschriften erscheinen automatisch im Protokoll. Bitte erst unterschreiben, wenn das Protokoll fertig ist.</p>
    </div>
    <div class="aktionen" style="margin-bottom:14px">
      <button class="knopf gross" data-act="drucken" data-arg="${s.id}">Drucken / als PDF speichern</button>
      <span class="leise klein">Tipp: Im Druckdialog „Als PDF speichern“ wählen, um das Protokoll abzulegen.</span></div>
    <div class="papier">${protokollHTML(s)}</div>`;
}

// --- Protokoll (Vorschau und Druck) -------------------------------------------
function protokollHTML(s) {
  const k = klasse(), t = TEXTE[k.stufe];
  const anw = k.schueler.length ? `${k.schueler.length - s.fehlend.length} von ${k.schueler.length}` : "–";
  const tab = (kopf, zeilen) => zeilen.length
    ? `<table><tr>${kopf.map((h) => `<th>${h}</th>`).join("")}</tr>${zeilen.map((z) => `<tr>${z.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</table>`
    : `<p class="leise">–</p>`;
  const offen = offeneFuer(s);
  const voll = (l) => l.filter((z) => z.namen.length || z.text);
  return `
  <div class="prot-kopf"><div class="logo">${logoHTML()}</div>
    <div><h1>${esc(t.titel)}</h1><div>Klasse <b>${esc(k.name)}</b> · ${esc(k.schuljahr || "")}</div></div>
    <div class="illu-k">${BILDER.klassenrat}</div></div>
  <div class="prot-meta">
    <div><small>Datum</small>${datum(s.datum, true)}</div><div><small>Sitzung Nr.</small>${s.nr}</div>
    <div><small>Beginn – Ende</small>${esc(s.beginn || "–")} – ${esc(s.ende || "–")}</div><div><small>Anwesend</small>${anw}</div>
    ${ROLLEN.map(([r]) => `<div><small>${t[r]}</small>${esc(s.rollen[r] || "–")}</div>`).join("")}
  </div>
  ${s.fehlend.length ? `<p><b>Es fehlen:</b> ${s.fehlend.map(esc).join(", ")}</p>` : ""}

  <h4>${bild("stern")} 1 · ${t.positiv}</h4>
  ${tab(["Name", "Aussage"], voll(s.positiv).map((z) => [esc(namenText(z.namen)), esc(z.text)]))}

  <h4>${bild("zurueck")} 2 · ${t.rueckblick}</h4>
  ${tab(["Beschluss vom", "Worum ging es?", "Beschluss", "zuständig", "Ergebnis", "Bemerkung"], offen.map((b) => {
    const r = s.rueckblick[b.id] || {};
    return [`${datum(b.sitzung.datum)}<br><small>Nr. ${b.sitzung.nr}</small>`, esc(b.anliegen.thema), esc(b.anliegen.beschluss), esc(namenText(b.anliegen.wer)), r.status === "ja" ? t.status.ja : (r.status ? t.status[r.status] : "nicht besprochen") + " – bleibt offen", esc(r.notiz)];
  }))}

  <h4>${bild("sprechen")} 3 · ${t.anliegen}</h4>
  ${s.anliegen.length ? s.anliegen.map((a, i) => {
    const vs = a.vorschlaege.filter((v) => v.text);
    const erg = { beschluss: t.beschluss, vertagt: "vertagt", keine: "keine Einigung", weiter: "weitergegeben an " + (a.weiterAn || "…") }[a.ergebnis] || "–";
    return `<div class="prot-block"><div class="bt">${t.einAnliegen} ${i + 1}: ${esc(a.thema || "")}</div>
      <p><b>${t.von}:</b> ${esc(namenText(a.von) || "–")}${a.art ? ` &nbsp;·&nbsp; <b>Art:</b> ${esc(a.art)}` : ""}</p>
      ${a.worum ? `<p><b>${t.worum.replace(/ \(.*\)/, "")}</b> ${esc(a.worum)}</p>` : ""}
      ${voll(a.aussagen).length ? `<p><b>${t.aussagen}</b></p>` + tab(["Name", "Aussage"], voll(a.aussagen).map((z) => [esc(namenText(z.namen)), esc(z.text)])) : ""}
      ${vs.length ? `<p><b>${t.vorschlaege}</b></p>` + tab([t.vorschlag, "von", "dafür", "dagegen", ...(k.stufe === "gs" ? [] : ["Enth."])],
        vs.map((v) => [esc(v.text), esc(namenText(v.von)), v.ja || 0, v.nein || 0, ...(k.stufe === "gs" ? [] : [v.enth || 0])])) : ""}
      <p><b>Ergebnis:</b> ${erg}${a.einstimmig ? ` (${esc(a.einstimmig)})` : ""}</p>
      ${a.ergebnis === "beschluss" ? `<p><b>${t.beschluss}:</b> ${esc(a.beschluss)}<br><b>Wer?</b> ${esc(namenText(a.wer) || "–")} &nbsp;·&nbsp; <b>Bis wann?</b> ${datum(a.bisWann)}</p>` : ""}
    </div>`;
  }).join("") : `<p class="leise">–</p>`}

  <h4>${bild("froh")} 4 · ${t.abschluss}</h4>
  <p><b>${t.feedback}</b> &nbsp; ${bild("froh", "s")} ${s.feedback.gut || 0} &nbsp; ${bild("mittel", "s")} ${s.feedback.mittel || 0} &nbsp; ${bild("traurig", "s")} ${s.feedback.schlecht || 0}</p>
  ${s.vorsatz ? `<p><b>Vorsatz:</b> ${esc(s.vorsatz)}</p>` : ""}
  <p><b>Rollen nächste Sitzung:</b> ${ROLLEN.map(([r]) => `${t[r]}: ${esc(s.naechsteRollen[r] || "–")}`).join(" · ")}</p>
  <p><b>Nächster Klassenrat:</b> ${datum(s.naechsterTermin, true)}</p>
  <div class="prot-unterschriften">${UNTERSCHRIFTEN.map(([r]) => {
    const u = s.unterschriften?.[r];
    return `<div>${u ? `<img src="${u.bild}" alt="Unterschrift">` : `<div class="platz"></div>`}
      <div class="linie">${unterschriftName(s, r, t)}${u ? ` · unterschrieben ${new Date(u.zeit).toLocaleString("de-DE", { dateStyle: "short", timeStyle: "short" })}` : ""}</div></div>`;
  }).join("")}</div>
  <div class="prot-fuss">Klassenrat ${esc(k.name)} · Sitzung ${s.nr}
    ${s.gesperrt ? ` · abgeschlossen am ${new Date(s.gesperrt).toLocaleString("de-DE", { dateStyle: "medium", timeStyle: "short" })}` : ""}
    ${s.nachtraeglich?.length ? ` · nachträglich geöffnet am ${s.nachtraeglich.map((z) => new Date(z).toLocaleString("de-DE", { dateStyle: "short", timeStyle: "short" })).join(", ")}` : ""}
    · gedruckt am ${datum(heute())}</div>`;
}

function drucken(html) {
  $("#druck").innerHTML = `<div class="papier">${html}</div>`;
  setTimeout(() => window.print(), 50);
}

// --- Beschlüsse ----------------------------------------------------------------
function viewBeschluesse() {
  const k = klasse(), t = T();
  const alle = beschluesse(k).reverse();
  const filter = { offen: (b) => b.status !== "ja", erledigt: (b) => b.status === "ja", alle: () => true }[ui.filter];
  const liste = alle.filter(filter);
  const zahl = (f) => alle.filter(f).length;
  return `
  <div class="titelzeile"><h2>${bild("beschluss", "m")} Beschlüsse ${esc(k.name)}</h2>
    <button class="knopf rand" data-act="beschluesse-drucken" style="margin-left:auto">Liste drucken</button></div>
  <div class="chips" style="margin-bottom:14px">
    ${[["offen", "offen", (b) => b.status !== "ja"], ["erledigt", t.status.ja, (b) => b.status === "ja"], ["alle", "alle", () => true]]
      .map(([f, l, fn]) => `<button class="chip ${ui.filter === f ? "an" : ""}" data-act="filter" data-arg="${f}">${l} (${zahl(fn)})</button>`).join("")}
  </div>
  <div class="karte">${liste.length ? beschlussTabelle(liste, t) : `<div class="leer">${bild("haken", "l")}<p>Keine Beschlüsse in dieser Ansicht.</p></div>`}</div>`;
}
function beschlussTabelle(liste, t) {
  return `<table class="uebersicht"><tr><th>Beschluss</th><th>Sitzung</th><th>Wer?</th><th>Bis wann?</th><th>Stand</th></tr>
    ${liste.map((b) => `<tr>
      <td><b>${esc(b.anliegen.beschluss)}</b><br><span class="leise klein">${esc(b.anliegen.thema)}</span></td>
      <td>Nr. ${b.sitzung.nr}<br><span class="leise klein">${datum(b.sitzung.datum)}</span></td>
      <td>${esc(namenText(b.anliegen.wer) || "–")}</td>
      <td>${datum(b.anliegen.bisWann)} ${ueberfaellig(b) ? `<span class="badge ueberfaellig">überfällig</span>` : ""}</td>
      <td><span class="badge ${b.status}">${b.status === "offen" ? "noch offen" : t.status[b.status]}</span>
        ${b.verlauf.map((v) => `<div class="leise klein">Nr. ${v.nr}: ${t.status[v.status]}${v.notiz ? " – " + esc(v.notiz) : ""}</div>`).join("")}</td>
    </tr>`).join("")}</table>`;
}

// --- Klasse & Daten ------------------------------------------------------------
function viewKlasse() {
  const k = klasse();
  return `
  <h2>${bild("leute", "m")} Klasse ${esc(k.name)}</h2>
  <div class="karte akzent">
    <div class="raster">
      <label class="feld">Klasse<input type="text" data-kk="name" value="${esc(k.name)}"></label>
      <label class="feld">Schuljahr<input type="text" data-kk="schuljahr" value="${esc(k.schuljahr)}"></label>
      <label class="feld">Klassenlehrkraft<input type="text" data-kk="lehrkraft" value="${esc(k.lehrkraft)}"></label>
      <label class="feld">Timer-Vorgabe (Minuten)<input type="number" min="1" max="60" data-kk="timer" data-typ="zahl" value="${k.timer || 10}"></label>
    </div>
    <h3>Schulart</h3>
    <div class="ergebnis">
      <label><input type="radio" name="stufe" data-kk="stufe" data-neu-zeichnen value="gs" ${k.stufe === "gs" ? "checked" : ""}> Grundschule (Kl. 1–4)</label>
      <label><input type="radio" name="stufe" data-kk="stufe" data-neu-zeichnen value="ms" ${k.stufe === "ms" ? "checked" : ""}> Mittelschule (Kl. 5–9)</label>
    </div>
    <p class="leise klein">Die Schulart legt Farben und Begriffe fest (z. B. „Schreiber/in“ und „Unsere Ideen“ in der Grundschule).</p>
  </div>
  <div class="karte">
    <h3 style="margin-top:0">${bild("leute")} Klassenliste <span class="leise klein">${k.schueler.length} ${T().kinder}</span></h3>
    <label class="feld">Ein Name pro Zeile<textarea id="schuelerliste" rows="12">${esc(k.schueler.join("\n"))}</textarea></label>
    <div class="aktionen abstand"><button class="knopf" data-act="schueler-speichern">Klassenliste übernehmen</button>
      <button class="knopf rand" data-act="schueler-sortieren">Alphabetisch sortieren</button></div>
  </div>
  <div class="karte">
    <h3 style="margin-top:0">Weitere Klassen</h3>
    <div class="aktionen"><button class="knopf zweit" data-act="klasse-neu">＋ Klasse anlegen</button>
      <button class="knopf gefahr" data-act="klasse-loeschen">Diese Klasse löschen</button></div>
  </div>`;
}

function viewDaten() {
