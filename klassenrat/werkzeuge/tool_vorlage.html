// --- Timer ---------------------------------------------------------------------
const timer = { offen: false, rest: 600, laeuft: false, int: null, ende: false };
function renderTimer() {
  const b = $("#timer-bereich");
  if (!klasse()) { b.innerHTML = ""; return; }
  if (!timer.offen) { b.innerHTML = `<button class="knopf timer-knopf" data-act="timer-auf">${bild("uhr", "s")} Timer</button>`; return; }
  const m = Math.floor(timer.rest / 60), s = timer.rest % 60;
  b.innerHTML = `<div class="timer ${timer.ende ? "ende" : ""}">
    <div class="kopf">${bild("uhr")} Zeitwächter/in <button class="x" data-act="timer-zu" title="Timer schließen">✕</button></div>
    <div class="zeit">${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}</div>
    <div class="reihe"><button class="knopf mini rand" data-act="timer-plus" data-arg="-60">−1</button>
      <button class="knopf mini" data-act="timer-los">${timer.laeuft ? "Pause" : "Start"}</button>
      <button class="knopf mini rand" data-act="timer-plus" data-arg="60">+1</button></div>
    <div class="reihe">${[2, 5, 10, 15].map((n) => `<button class="knopf mini zweit" data-act="timer-setzen" data-arg="${n}">${n}′</button>`).join("")}</div>
  </div>`;
}
function timerTick() {
  timer.rest = Math.max(0, timer.rest - 1);
  if (timer.rest === 0) { clearInterval(timer.int); timer.laeuft = false; timer.ende = true; piep(); }
  renderTimer();
}
function piep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, .35, .7].forEach((t) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(.25, ctx.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + t + .3);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + .3);
    });
  } catch (e) { /* kein Ton möglich */ }
}
function timerStarten(min) {
  clearInterval(timer.int);
  Object.assign(timer, { offen: true, rest: min * 60, laeuft: true, ende: false });
  timer.int = setInterval(timerTick, 1000);
  renderTimer();
}

// --- Automatische Sicherung in einen Ordner (z. B. OneDrive) ---------------------
// Der Browser schreibt die Sicherung in einen einmal gewählten Ordner. Liegt dieser im
// OneDrive-Ordner des PCs, lädt OneDrive die Datei automatisch hoch.
const ordner = { handle: null, status: "aus", zuletzt: null, fehler: "" };
const ordnerMoeglich = "showDirectoryPicker" in window;
function idb(modus, fn) {
  return new Promise((ok, fehler) => {
    const r = indexedDB.open("klassenrat-jpw", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onerror = () => fehler(r.error);
    r.onsuccess = () => {
      const tx = r.result.transaction("kv", modus), q = fn(tx.objectStore("kv"));
      tx.oncomplete = () => ok(q?.result);
      tx.onerror = () => fehler(tx.error);
    };
  });
}
async function ordnerLaden() {
  if (!ordnerMoeglich) return;
  try {
    ordner.handle = await idb("readonly", (st) => st.get("ordner"));
    if (ordner.handle) {
      ordner.status = (await ordner.handle.queryPermission({ mode: "readwrite" })) === "granted" ? "aktiv" : "pausiert";
      ordner.zuletzt = (await idb("readonly", (st) => st.get("zuletzt"))) || null;
    }
  } catch (e) { ordner.status = "aus"; }
  renderCloud();
  if (ui.view === "daten") render();
}
async function ordnerWaehlen() {
  try {
    const h = await window.showDirectoryPicker({ id: "klassenrat", mode: "readwrite", startIn: "documents" });
    ordner.handle = h; ordner.status = "aktiv";
    await idb("readwrite", (st) => st.put(h, "ordner"));
    await sichernInOrdner();
  } catch (e) {
    if (e.name !== "AbortError") alert("Der Ordner konnte nicht verwendet werden: " + e.message);
  }
  render();
}
async function ordnerFortsetzen() {
  try {
    ordner.status = (await ordner.handle.requestPermission({ mode: "readwrite" })) === "granted" ? "aktiv" : "pausiert";
    if (ordner.status === "aktiv") await sichernInOrdner();
  } catch (e) { ordner.status = "fehler"; ordner.fehler = e.message; }
  render();
}
async function ordnerTrennen() {
  if (!confirm("Automatische Sicherung beenden? Die Dateien im Ordner bleiben erhalten.")) return;
  ordner.handle = null; ordner.status = "aus";
  try { await idb("readwrite", (st) => st.delete("ordner")); } catch (e) { /* egal */ }
  render();
}
async function schreibeDatei(dir, name, text) {
  const f = await dir.getFileHandle(name, { create: true });
  const w = await f.createWritable();
  await w.write(text); await w.close();
}
let ordnerTimer;
function sichernInOrdnerSpaeter() { clearTimeout(ordnerTimer); ordnerTimer = setTimeout(sichernInOrdner, 2000); }
async function sichernInOrdner() {
  if (ordner.status !== "aktiv" || !ordner.handle) return;
  try {
    const json = JSON.stringify(state, null, 1);
    await schreibeDatei(ordner.handle, "klassenrat-sicherung.json", json);
    const verlauf = await ordner.handle.getDirectoryHandle("Verlauf", { create: true });
    await schreibeDatei(verlauf, `klassenrat-${heute()}.json`, json);  // eine Fassung pro Tag
    ordner.zuletzt = Date.now(); ordner.fehler = "";
    idb("readwrite", (st) => st.put(ordner.zuletzt, "zuletzt")).catch(() => {});
  } catch (e) {
    ordner.status = e.name === "NotAllowedError" ? "pausiert" : "fehler"; ordner.fehler = e.message;
  }
  renderCloud();
}
async function ausOrdnerLaden() {
  try {
    if (ordner.status !== "aktiv") await ordnerFortsetzen();
    const f = await (await ordner.handle.getFileHandle("klassenrat-sicherung.json")).getFile();
    const neu = JSON.parse(await f.text());
    if (!Array.isArray(neu.klassen)) throw new Error("keine Klassenrat-Sicherung");
    if (!confirm(`Sicherung vom ${new Date(f.lastModified).toLocaleString("de-DE")} laden? Sie ersetzt die Daten in diesem Browser.`)) return;
    state = migrieren(neu); ui.view = "sitzungen"; speichern(); render();
  } catch (e) { alert("Im Ordner wurde keine gültige Sicherung gefunden. " + (e.message || "")); }
}
function renderCloud() {
  const el = $("#cloud");
  if (!el) return;
  if (!klasse() || !ordnerMoeglich) { el.innerHTML = ""; return; }
  const zeit = ordner.zuletzt ? new Date(ordner.zuletzt).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }) : "";
  el.innerHTML = {
    aktiv: `<button class="an" data-act="view" data-arg="daten" title="Automatische Sicherung aktiv">☁ gesichert ${zeit}</button>`,
    pausiert: `<button class="warn" data-act="ordner-fortsetzen" title="Zum Fortsetzen antippen">☁ Sicherung pausiert – fortsetzen</button>`,
    fehler: `<button class="warn" data-act="view" data-arg="daten" title="${esc(ordner.fehler)}">☁ Sicherung fehlgeschlagen</button>`,
    aus: `<button data-act="view" data-arg="daten">☁ Sicherung einrichten</button>`,
  }[ordner.status];
}

// --- Dateien -------------------------------------------------------------------
function dateiWaehlen(accept, cb) {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = accept;
  inp.onchange = () => inp.files[0] && cb(inp.files[0]);
  inp.click();
}
function exportieren() {
  state.letzterExport = Date.now();
  const blob = new Blob([JSON.stringify(state, null, 1)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `klassenrat-sicherung-${heute()}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  speichern(); render();
}

    const k = { id: id(), name, schuljahr: $("#nk-jahr").value.trim(), lehrkraft: "", timer: 10,
      stufe: document.querySelector("[name=nk-stufe]:checked").value,
      schueler: $("#nk-schueler").value.split("\n").map((x) => x.trim()).filter(Boolean), sitzungen: [] };
    state.klassen.push(k); state.aktiveKlasse = k.id; ui.view = "sitzungen"; speichern(); render();
  },
  "klasse-neu"() { $("#app").innerHTML = viewWillkommen(true); },
  "klasse-loeschen"() {
    const k = klasse();
    if (confirm(`Klasse ${k.name} mit allen ${k.sitzungen.length} Sitzungen löschen? Das kann nicht rückgängig gemacht werden.`)) {
      state.klassen = state.klassen.filter((x) => x.id !== k.id); state.aktiveKlasse = state.klassen[0]?.id || null;
      ui.view = "sitzungen"; speichern(); render();
    }
  },
  "schueler-speichern"() {
    klasse().schueler = [...new Set($("#schuelerliste").value.split("\n").map((x) => x.trim()).filter(Boolean))];
    speichern(); render();
  },
  "schueler-sortieren"() {
    const ta = $("#schuelerliste");
    ta.value = ta.value.split("\n").map((x) => x.trim()).filter(Boolean).sort((a, b) => a.localeCompare(b, "de")).join("\n");
  },
  export: exportieren,
  import() {
    dateiWaehlen(".json,application/json", async (f) => {
      try {
        const neu = JSON.parse(await f.text());
        if (!Array.isArray(neu.klassen)) throw new Error();
        if (state.klassen.length && !confirm("Die Sicherung ersetzt alle Daten in diesem Browser. Fortfahren?")) return;
        state = migrieren(neu); ui.view = "sitzungen"; speichern(); render();
      } catch (e) { alert("Diese Datei ist keine gültige Klassenrat-Sicherung."); }
    });
  },
  "logo-laden"() {
    dateiWaehlen("image/*", (f) => {
      if (f.size > 1.5e6) { alert("Die Datei ist zu groß (max. 1,5 MB)."); return; }
      const r = new FileReader();
      r.onload = () => { state.logo = r.result; speichern(); render(); };
      r.readAsDataURL(f);
    });
  },
  "logo-zuruecksetzen"() { state.logo = null; speichern(); render(); },
  "alles-loeschen"() {
    if (confirm("Wirklich ALLE Daten löschen? Lade vorher eine Sicherung herunter, wenn du sie noch brauchst.")) {
      try { localStorage.removeItem(SPEICHER); } catch (e) { /* egal */ }
      state = laden(); ui.view = "sitzungen"; render();
    }
  },
  "ordner-waehlen": ordnerWaehlen,
  "ordner-fortsetzen": ordnerFortsetzen,
  "ordner-trennen": ordnerTrennen,
  "ordner-laden": ausOrdnerLaden,
  "timer-auf"() { timer.offen = true; timer.rest = (klasse()?.timer || 10) * 60; timer.ende = false; renderTimer(); },
  "timer-zu"() { clearInterval(timer.int); timer.offen = false; timer.laeuft = false; timer.ende = false; renderTimer(); },
  "timer-start"() { timerStarten(klasse()?.timer || 10); },
  "timer-los"() {
    if (timer.laeuft) { clearInterval(timer.int); timer.laeuft = false; }
    else if (timer.rest > 0) { timer.ende = false; timer.laeuft = true; timer.int = setInterval(timerTick, 1000); }
    renderTimer();
  },
  "timer-plus"(d) { timer.rest = Math.max(0, timer.rest + +d); timer.ende = false; renderTimer(); },
  "timer-setzen"(n) { clearInterval(timer.int); Object.assign(timer, { rest: n * 60, laeuft: false, ende: false }); renderTimer(); },
};

const ERLAUBT_GESPERRT = ["schritt", "anliegen-tab", "drucken", "view", "entsperren"];
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || (el.tagName === "LABEL")) return;
  e.preventDefault();
  e.stopPropagation();
  if (el.closest("#sperrbereich.gesperrt") && !ERLAUBT_GESPERRT.includes(el.dataset.act)) return;
  AKTIONEN[el.dataset.act]?.(el.dataset.arg);
});
document.addEventListener("input", (e) => {
  const el = e.target;
  const wert = el.dataset.typ === "zahl" ? (+el.value || 0) : el.value;
  if (el.dataset.k && sitzung()) {
    if (el.dataset.k.startsWith("rueckblick.")) { /* Notiz nur bei gesetztem Status */
      const [, bid] = el.dataset.k.split(".");
      if (!sitzung().rueckblick[bid]) return;
    }
    pfadSetzen(sitzung(), el.dataset.k, wert);
  } else if (el.dataset.kk && klasse()) {
    pfadSetzen(klasse(), el.dataset.kk, wert);
  } else return;
  speichern();
  if ("neuZeichnen" in el.dataset) render();
});
document.addEventListener("change", (e) => {
  if (e.target.id === "klassenwahl") {
    if (e.target.value === "__neu") { $("#app").innerHTML = viewWillkommen(true); return; }
    state.aktiveKlasse = e.target.value; ui.view = "sitzungen"; speichern(); render();
  }
});
// Textfelder wachsen mit dem Inhalt; Reiter zeigt das Thema sofort
document.addEventListener("input", (e) => {
  if (e.target.tagName === "TEXTAREA" && e.target.rows === 1) hoeheAnpassen(e.target);
  if ("reiter" in e.target.dataset) { const t = document.querySelector(".reiter button.aktiv .t"); if (t) t.textContent = e.target.value || T().einAnliegen; }
});
// Klick in eine Aussage-Zeile: angetippte Namen gehören zu dieser Zeile
document.addEventListener("focusin", (e) => {
  const z = e.target.dataset?.ziel;
  if (z && z !== ui.ziel) { ui.ziel = z; zielAnzeigen(); }
});
// Enter beendet die Zeile – der nächste Name beginnt eine neue
document.addEventListener("keydown", (e) => {
  const z = e.target.dataset?.ziel;
  if (z && e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    ui.ziel = z.split(".").slice(0, -1).join(".");
    e.target.blur(); zielAnzeigen();
  }
});
// Namen antippen, ohne dass das Textfeld den Fokus verliert
document.addEventListener("pointerdown", (e) => { if (e.target.closest(".namenleiste .chip")) e.preventDefault(); });
window.addEventListener("resize", () => document.documentElement.style.setProperty("--kopfhoehe", document.querySelector(".app-kopf").offsetHeight + "px"));
window.addEventListener("afterprint", () => ($("#druck").innerHTML = ""));

render();
ordnerLaden();
</script>
